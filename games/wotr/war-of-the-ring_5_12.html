<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>War of the Ring</title>
<style>:root{
  --ink:#0e1118; --map:#151a24; --edge:#2a3346;
  --leather:#1c1712; --leather2:#26201738;
  --parch:#e3d5ae; --parch-dim:#a99c78;
  --fp:#7ea6c9; --fp-deep:#3d5a75;
  --sh:#c14a35; --sh-deep:#6e2a1e;
  --gold:#c9a24b; --gold-dim:#8a7136;
  --danger:#e05a3a;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sheet-full:52dvh; --sheet-peek:20px;
  --sheet-h:52dvh;   /* live measured height of the sheet; kept in sync by JS */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--parch);font-family:var(--sans)}
#app{height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---- top bar ---- */
#topbar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:linear-gradient(180deg,#14100b,#1c1712);
  border-bottom:1px solid #3a2f1e;z-index:20;flex:0 0 auto}
.game-title{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.16em;color:var(--gold)}
.game-title span{font-style:italic;font-weight:400;letter-spacing:.02em;color:var(--parch-dim);text-transform:none;font-size:12px}
.turn-label{font-size:10.5px;color:var(--parch-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.tb-right{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tb-btn{background:#26201a;border:1px solid #463a26;color:var(--parch);
  font-family:var(--sans);font-size:11px;padding:6px 8px;border-radius:6px;cursor:pointer}
.tb-btn:active{background:#332a1f}
.tb-btn:focus-visible{outline:2px solid var(--gold)}
.tb-btn:disabled{opacity:.3;pointer-events:none}
@keyframes regionFlash{
  0%{stroke:var(--gold);stroke-width:3.4;fill-opacity:1;filter:drop-shadow(0 0 9px rgba(201,162,75,.9))}
  100%{stroke:#39424f;stroke-width:1;filter:none}}
.rg.changed .cell{animation:regionFlash 1.5s ease-out 2 both;animation-delay:var(--flash-delay,0ms)}

/* ---- map ---- */
#mapwrap{flex:1 1 auto;position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 70% 60%, #1a2130 0%, var(--map) 55%, #0d1017 100%)}
#map{width:100%;height:100%;touch-action:none;display:block}
/* ---- territory ---- */
.rg .cell{stroke:#39424f;stroke-width:1;cursor:pointer;transition:fill .35s,fill-opacity .35s}
.rg[data-side="none"] .cell{fill:#1e2530;fill-opacity:.72}
.rg[data-side="fp"]   .cell{fill:#22344a;fill-opacity:.88}
.rg[data-side="sh"]   .cell{fill:#3a1c15;fill-opacity:.88}
.rg.contested .cell{stroke:var(--gold);stroke-width:1.6;stroke-dasharray:5 3}
.rg.siege .cell{stroke:var(--danger);stroke-width:2;stroke-dasharray:4 3}
.rg.sel .cell{stroke:var(--gold);stroke-width:2.6;filter:drop-shadow(0 0 6px rgba(201,162,75,.75))}
.rg.target .cell{stroke:#7fe08f;stroke-width:2.6;fill-opacity:1!important;
  filter:drop-shadow(0 0 7px rgba(127,224,143,.7))}

/* ---- terrain texture, drawn over the fills ---- */
#gTerrain{pointer-events:none}
.peak{fill:#3b4152;stroke:#525a70;stroke-width:.8;stroke-linejoin:round;opacity:.85}
.snow{fill:#767e93;opacity:.45}
.wood{fill:#1d3324;opacity:.6}
.tree{fill:#2f5638;opacity:.95}
.riverbed{fill:none;stroke:#33566f;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.riverlit{fill:none;stroke:#5b8dae;stroke-linecap:round;stroke-linejoin:round;opacity:.6}

/* ---- coastline ---- */
#gSea{pointer-events:none}
.land{fill:#232a35;stroke:#46566b;stroke-width:2.2;stroke-linejoin:round;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}

/* ---- borders: a wall is ground with no road across it ---- */
#gBorders{pointer-events:none}
.wall{stroke:#4a5265;stroke-width:3;stroke-linecap:round;opacity:.6}
.wallpeaks .peak{fill:#454d5f;stroke:#69738f;opacity:.85}
.wallpeaks .snow{display:none}
.road{stroke:#6b6247;stroke-width:2.2;stroke-dasharray:6 4;stroke-linecap:round;opacity:.75}

/* ---- 2.6: settlements by silhouette, with their victory value on the icon ----
   Four gold circles at radii 7/5.5/4.5/4 were not a readable distinction, and
   the number the player actually needs — what the place is worth — was nowhere
   on the map at all. Keep, dome, shield and house are told apart at a glance,
   and the pips above each one count the victory points it carries. */
#gMarks{pointer-events:none}
.settle{fill:var(--gold);stroke:#100c06;stroke-width:.9;stroke-linejoin:round;opacity:.95}
.settle.s-t{fill:#a08644;opacity:.85}
.settle.s-f{fill:#b09154;opacity:.9}
.settlering{fill:none;stroke:var(--gold);stroke-width:1.3;opacity:.6}
.svp{fill:var(--gold);stroke:#100c06;stroke-width:.55;stroke-linejoin:round;opacity:.95;
  transition:fill .35s}
.mk[data-hold="fp"] .svp{fill:#a8cbe8}
.mk[data-hold="sh"] .svp{fill:#e8907a}
#map[data-zoom="far"] .svp{opacity:.8}
.rg text.rname,.mk text.rname{font-family:var(--serif);fill:#9aa3b5;font-size:10.5px;pointer-events:none;
  text-anchor:middle;paint-order:stroke;stroke:#0e1118;stroke-width:2.6;stroke-linejoin:round;
  transition:opacity .25s,y .3s cubic-bezier(.4,0,.2,1)}
#gTokens{pointer-events:none}
.rg.sel circle.base{stroke:var(--gold);stroke-width:3;filter:drop-shadow(0 0 6px rgba(201,162,75,.8))}
.fsmark{pointer-events:none;transition:transform .55s cubic-bezier(.4,0,.2,1)}

/* ---- 2.2: the besieged garrison stands inside its walls ---- */
.keep{pointer-events:none;transition:opacity .3s}
.keepwall{stroke-width:1.6;stroke-linejoin:round;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.keepwall[data-side="fp"]{fill:#16283c;fill-opacity:.97;stroke:#7ea6c9}
.keepwall[data-side="sh"]{fill:#35150c;fill-opacity:.97;stroke:#c14a35}
.keeplabel{font-family:var(--sans);font-weight:700;font-size:5px;letter-spacing:.16em;
  text-anchor:middle;fill:var(--danger);transition:opacity .25s}
#map[data-zoom="far"] .keeplabel{opacity:0}

/* ---- map tokens ---- */
.slot{pointer-events:none}
.chip .natbar{stroke:none}
.chip text{font-family:var(--sans);font-weight:700;font-size:9px;text-anchor:middle;dominant-baseline:central}
.chip rect{stroke-width:1}
.chip.fp rect{fill:#1b2c40;stroke:#5f88ad}
.chip.fp text{fill:#d6e8f7}
.chip.fp use{fill:#a8cbe8}
.chip.sh rect{fill:#3a180f;stroke:#a2543f}
.chip.sh text{fill:#f6d6cb}
.chip.sh use{fill:#e8a893}
.chip.lead.fp rect{fill:#2b3f57;stroke:#87b4d8}
.chip.lead.sh rect{fill:#4d2216;stroke:#c2705a}
.fig circle{stroke-width:1.2}
.fig.fp circle{fill:#22374d;stroke:#7ea6c9}
.fig.fp use{fill:#e3ecf5}
.fig.sh circle{fill:#43190f;stroke:#c14a35}
.fig.sh use{fill:#f7ded6}
.fig text.figlabel{font-family:var(--sans);font-weight:700;font-size:5.5px;text-anchor:middle;
  letter-spacing:.04em;transition:opacity .25s}
.fig.fp text.figlabel{fill:#b9d3e8}
.fig.sh text.figlabel{fill:#eab4a4}

/* zoom-aware detail: names vanish when the whole map is in view,
   figure name-labels only appear once tokens are big enough to read */
#map[data-zoom="far"] .rname{opacity:0}
#map[data-zoom="far"] .tree,#map[data-zoom="far"] .snow{opacity:0}
#map[data-zoom="far"] .wallpeaks{opacity:0}
#map[data-zoom="far"] .figlabel{opacity:0}
#map[data-zoom="mid"] .rname{opacity:.9}
#map[data-zoom="mid"] .figlabel{opacity:0}
#map[data-zoom="near"] .rname{opacity:1}
#map[data-zoom="near"] .figlabel{opacity:1}

/* motion: chips pop in, losses drift away */
@keyframes tokPop{from{opacity:0;transform:scale(.55)}60%{transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
@keyframes tokGhost{from{opacity:.85;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-9px) scale(.7)}}
@keyframes fsPulse{0%,100%{opacity:1}50%{opacity:.35}}
.tok-new{animation:tokPop .34s cubic-bezier(.34,1.4,.64,1) both;transform-box:fill-box;transform-origin:center}
.tok-ghost{animation:tokGhost .5s ease-out both;transform-box:fill-box;transform-origin:center;pointer-events:none}
.fsmark.revealed circle.eye{animation:fsPulse 1.6s ease-in-out infinite}
@keyframes pipPop{from{opacity:0;transform:scale(.5) rotate(-12deg)}70%{transform:scale(1.15) rotate(3deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.pip.hit{animation:pipPop .3s cubic-bezier(.34,1.4,.64,1) both}
/* ---- 2.4/2.5: the game's clocks, drawn as gauges instead of typed as text ---- */
#vpBadge,#huntBadge{position:absolute;font-family:var(--sans);font-size:11px;
  background:rgba(20,16,11,.9);border:1px solid #3a2f1e;border-radius:9px;padding:6px 8px;line-height:1.4}
#vpBadge{top:10px;left:10px}
#huntBadge{top:10px;right:10px}
.eye{color:var(--sh);font-weight:700}
.fpv{color:var(--fp);font-weight:700}.shv{color:var(--sh);font-weight:700}

.gauge{display:flex;align-items:center;gap:5px;margin:2.5px 0;white-space:nowrap}
.gauge .gl{width:42px;flex:0 0 auto;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--parch-dim)}
.gauge .gv{font-size:9.5px;color:var(--parch-dim);min-width:26px}
.gauge.hot .gv{color:var(--danger);font-weight:700}
.pips{display:flex;gap:1.5px}
.pips .p{width:6px;height:10px;border-radius:1.5px;background:#221c13;
  border:1px solid #40361f;transition:background .3s,border-color .3s,box-shadow .3s}
.pips .p.on.fp{background:var(--fp);border-color:#b6d3ea}
.pips .p.on.sh{background:var(--sh);border-color:#e08a72}
.pips .p.on.corr{background:linear-gradient(180deg,#e0745a,#7d2313);border-color:#e0745a}
.pips .p.on.mord{background:linear-gradient(180deg,#e0c070,#8a7136);border-color:#e0c070}
.pips .p.win{box-shadow:0 0 6px rgba(224,90,58,.9)}
.gauge.crit .pips .p.on.corr{animation:corrPulse 1.5s ease-in-out infinite}
@keyframes corrPulse{0%,100%{box-shadow:0 0 0 rgba(224,90,58,0)}50%{box-shadow:0 0 7px rgba(224,90,58,.95)}}
.pips.round .p{width:9px;height:9px;border-radius:50%}
.pips .p.eyeon{background:radial-gradient(circle at 50% 45%,#ffd9a0 0 22%,var(--sh) 23% 100%);
  border-color:#e08a72}
.pips .p.fpdie{background:linear-gradient(160deg,#2c405a,#1d2c40);border-color:#6f93b5}
.hbnote{font-size:9px;color:var(--parch-dim);margin-top:3px}
.hbnote b{color:var(--danger)}
.natkey{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.5)}

/* ---- bottom sheet ---- */
#sheet{flex:0 0 auto;background:linear-gradient(180deg,#1f1a13,#161209);
  border-top:1px solid #4a3d26;box-shadow:0 -8px 24px rgba(0,0,0,.55);
  max-height:var(--sheet-full);display:flex;flex-direction:column;z-index:30;
  transition:max-height .28s cubic-bezier(.4,0,.2,1)}
#sheet.peek{max-height:var(--sheet-peek)}
#sheet.dragging{transition:none}
#sheetHandle{height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none}
#sheetHandle::before{content:"";width:44px;height:4px;border-radius:2px;background:#5a4a2e;
  transition:background .2s,width .2s}
#sheetHandle:active{cursor:grabbing}
#sheetHandle:active::before,#sheet.peek #sheetHandle::before{background:var(--gold-dim);width:56px}
#sheetHandle:focus-visible{outline:2px solid var(--gold);border-radius:6px}
#sheetBody{overflow-y:auto;padding:8px 14px 16px;-webkit-overflow-scrolling:touch}
#sheet.peek #sheetBody{overflow:hidden}
h3.sect{font-family:var(--serif);font-size:15px;color:var(--gold);margin:8px 0 6px;font-weight:600}
p.note{font-size:12.5px;color:var(--parch-dim);line-height:1.5;margin:4px 0}
.phase-tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);background:var(--gold);border-radius:4px;padding:2px 8px;font-weight:700;margin-bottom:6px}
.phase-tag.sh{background:var(--sh)}
.phase-tag.fp{background:var(--fp)}

/* dice tray */
.dicetray{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.die{width:52px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;border:2px solid transparent;position:relative;user-select:none}
.die small{font-size:8.5px;letter-spacing:.05em;margin-top:1px;text-transform:uppercase;font-weight:700}
.die.fp{background:linear-gradient(160deg,#2c405a,#1d2c40);color:#cfe2f2;border-color:#4a6a8c}
.die.sh{background:linear-gradient(160deg,#5a2318,#3a150d);color:#f2cfc4;border-color:#8c4a3a}
.die.used{opacity:.28;pointer-events:none}
.die.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(201,162,75,.7)}
.die:focus-visible{outline:2px solid var(--gold)}

/* action buttons */
.btnrow{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.abtn{background:#2a2318;border:1px solid #55442a;color:var(--parch);
  padding:11px 12px;border-radius:9px;font-size:13.5px;text-align:left;cursor:pointer;line-height:1.35;font-family:var(--sans)}
.abtn b{color:var(--gold)}
.abtn:active{background:#38301f}
.abtn:disabled{opacity:.35;pointer-events:none}
.abtn.primary{background:var(--gold);color:#1a1408;border-color:#e0c070;font-weight:700}
.abtn.danger{border-color:var(--sh);color:#f0b8a8}
.abtn.subtle{background:transparent;border-color:#3a3122;color:var(--parch-dim)}
.abtn:focus-visible{outline:2px solid var(--gold)}
.btnrow.wrap{flex-direction:row;flex-wrap:wrap}
.btnrow.wrap .abtn{flex:1 1 40%}

/* region panel */
.rpanel .units{display:flex;gap:12px;margin:6px 0;font-size:13px}
.tagset{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 7px;font-weight:700}
.tag.fp{background:var(--fp-deep);color:#d8e8f5}.tag.sh{background:var(--sh-deep);color:#f5ded8}
.tag.n{background:#3a3122;color:var(--parch-dim)}

/* ---- 2.7: cards as frames, not paragraphs ----
   A hand of six used to be six blocks of prose to read in order. The frame puts
   the three things you scan for — whose card, which deck, what it costs you in a
   battle — into fixed positions, so the hand can be read at a glance. */
.cardlist{display:flex;flex-direction:column;gap:9px}
.gcard{background:linear-gradient(180deg,#282010,#1d1710);border:1px solid #4a3d26;
  border-left:4px solid var(--gold-dim);border-radius:9px;padding:0;overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.45)}
.gcard.sh{border-left-color:var(--sh)}
.gcard.fp{border-left-color:var(--fp)}
.ghead{display:flex;align-items:center;gap:7px;padding:8px 10px 5px}
.gseal{flex:0 0 auto;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;border:1px solid}
.gseal.fp{background:#1b2c40;border-color:#5f88ad;color:#a8cbe8}
.gseal.sh{background:#3a180f;border-color:#a2543f;color:#e8a893}
.gcard h4{font-family:var(--serif);font-size:13.5px;color:var(--parch);flex:1 1 auto;
  line-height:1.2;font-weight:600}
.gcs{flex:0 0 auto;min-width:21px;height:21px;padding:0 4px;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
  background:#3a2f1a;border:1px solid var(--gold-dim);color:var(--gold)}
.gstripe{display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:9px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;border-top:1px solid rgba(0,0,0,.35);
  border-bottom:1px solid rgba(0,0,0,.35)}
.gstripe.chr{background:#2c2439;color:#b6a6d8}
.gstripe.str{background:#2b2a18;color:#c3bd7e}
.gstripe .gsym{margin-left:auto;color:var(--gold);letter-spacing:.05em}
.gcard .gtext{font-size:11.5px;color:var(--parch-dim);line-height:1.45;padding:7px 10px 0}
.gcard p{font-size:11.5px;color:var(--parch-dim);line-height:1.45}
.gcard .meta{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#7d6f4e;
  padding:6px 10px 0}
.gcard .meta.no{color:#9a7a63;text-transform:none;letter-spacing:.02em;font-size:11px}
.gcard .cbtns{display:flex;gap:6px;padding:8px 10px 9px}
.gcard .cbtns button{flex:1;padding:7px;font-size:12px;border-radius:6px;border:1px solid #55442a;background:#332a1a;color:var(--parch);cursor:pointer}
.gcard .cbtns button.play{background:var(--gold);color:#1a1408;font-weight:700;border-color:#e0c070}
.gcard .cbtns button:disabled{opacity:.35}
/* 3.4: an unusable Combat card is shown, dimmed, with the condition it fails */
.gcard.unplayable{opacity:.55;border-left-style:dashed;background:#1a160f}
.gcard.unplayable .gcs{opacity:.5}

/* ---- 3.1: what a die can actually do, before it is committed ---- */
.die{position:relative}
.die .afford{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 3px;
  border-radius:8px;font-size:9.5px;font-weight:700;line-height:16px;text-align:center;
  background:var(--gold);color:#1a1408;border:1px solid #1a1408}
.die.dead{opacity:.45}
.die.dead .afford{background:#5a4a2e;color:#c6b78e}
.affnote{font-size:10.5px;color:var(--parch-dim);margin:-2px 0 6px;line-height:1.4}
.abtn.off{opacity:.45;pointer-events:none;border-style:dashed}
.abtn .why{display:block;font-size:10.5px;color:#9a8a68;margin-top:3px;font-style:italic}

/* ---- 3.2: where you are in a multi-step action, and a way back one step ---- */
.crumbs{display:flex;align-items:center;gap:6px;margin:5px 0 2px}
.crumbs .cstep{width:9px;height:9px;border-radius:50%;background:#2a2318;border:1px solid #4a3d26}
.crumbs .cstep.done{background:var(--gold-dim);border-color:var(--gold)}
.crumbs .cstep.now{background:var(--gold);border-color:#e0c070;box-shadow:0 0 6px rgba(201,162,75,.7)}
.crumbs .clab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--parch-dim)}

/* ---- 3.3: the odds, before you commit a card to them ---- */
.odds{margin:8px 0;border:1px solid #4a3d26;border-radius:8px;overflow:hidden;background:#1d1710}
.odds .orow{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:11.5px}
.odds .orow+.orow{border-top:1px solid #2f2718}
.odds .oside{flex:0 0 92px;font-weight:700}
.odds .oside.fp{color:var(--fp)}.odds .oside.sh{color:var(--sh)}
.odds .odetail{flex:1 1 auto;color:var(--parch-dim);line-height:1.35}
.odds .oexp{flex:0 0 auto;font-weight:700;color:var(--gold);font-size:12.5px}
.odds .onote{padding:5px 9px;font-size:10.5px;color:#9a8a68;border-top:1px solid #2f2718;font-style:italic}

/* ---- 3.5: the rules reference, in sections you can be sent straight to ---- */
.helpnav{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.helpnav button{font-size:11px;padding:5px 9px;border-radius:14px;border:1px solid #4a3d26;
  background:#26201a;color:var(--parch-dim);cursor:pointer}
.helpnav button.on{background:var(--gold);color:#1a1408;border-color:#e0c070;font-weight:700}
.helpsec{margin-top:10px}
.helpsec h3{font-family:var(--serif);color:var(--gold);font-size:15px;margin:12px 0 4px}
.helpsec p{font-size:12.5px;line-height:1.55;margin:5px 0}
#helpFind{width:100%;background:#15110a;color:var(--parch);border:1px solid #4a3d26;
  border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--sans)}
.helpmiss{font-size:12px;color:var(--parch-dim);font-style:italic;margin-top:10px}
.helplink{background:none;border:none;color:var(--gold);text-decoration:underline;cursor:pointer;
  font-size:inherit;font-family:inherit;padding:0}

/* ---- 3.6: the casualty rule in words, not jargon ---- */
.casbox{border:1px solid #4a3d26;border-radius:8px;padding:8px 9px;margin:8px 0;background:#1d1710}
.casbox .caslab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--parch-dim);
  display:flex;align-items:center;gap:6px}
.casopts{display:flex;gap:6px;margin-top:6px}
.casopt{flex:1;text-align:left;padding:7px 8px;border-radius:7px;border:1px solid #4a3d26;
  background:#26201a;color:var(--parch-dim);cursor:pointer;font-family:var(--sans);font-size:11.5px;
  line-height:1.3}
.casopt b{display:block;color:var(--parch);font-size:12px;margin-bottom:2px}
.casopt.on{border-color:var(--gold);background:#33291a;color:var(--parch)}
.casopt.on b{color:var(--gold)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,6,10,.78);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
#modal.hidden{display:none}
#modalCard{background:linear-gradient(180deg,#241e14,#17120a);border:1px solid #5a4a2e;border-radius:14px;
  max-width:420px;width:100%;max-height:82dvh;overflow-y:auto;padding:18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.7)}
#modalCard h2{font-family:var(--serif);color:var(--gold);font-size:19px;margin-bottom:8px}
#modalCard p{font-size:13px;line-height:1.55;color:var(--parch);margin:6px 0}
#modalCard p.dim{color:var(--parch-dim);font-size:12px}

/* battle readout */
.battle{font-size:13px}
.battle .vs{display:flex;justify-content:space-between;font-family:var(--serif);font-size:15px;margin:8px 0}
ul.battlenotes{margin:8px 0 4px;padding-left:18px;font-size:11.5px;color:var(--parch-dim);line-height:1.5}
ul.battlenotes li{margin:2px 0}
.rollrow{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.pip{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#2c2416;border:1px solid #4a3d26}
.pip.hit{background:var(--gold);color:#1a1408;border-color:#e0c070}
.pip.sh.hit{background:var(--sh);color:#fff}

/* log */
.logline{font-size:12px;line-height:1.5;padding:4px 0;border-bottom:1px solid #2a2318;color:var(--parch-dim)}
.logline b{color:var(--parch)}
.logline.fp b{color:var(--fp)} .logline.sh b{color:var(--sh)}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h) + 14px);z-index:70;
  transition:opacity .3s,bottom .28s cubic-bezier(.4,0,.2,1);
  background:rgba(28,22,14,.95);border:1px solid var(--gold-dim);color:var(--parch);
  padding:9px 16px;border-radius:20px;font-size:12.5px;max-width:86vw;text-align:center}
#toast.hidden{opacity:0;pointer-events:none}

/* tracks */
.track{display:flex;align-items:center;gap:4px;margin:5px 0;font-size:12px}
.track .nname{width:150px;color:var(--parch-dim)}
.tstep{width:20px;height:20px;border-radius:4px;background:#2a2318;border:1px solid #443723;display:flex;align-items:center;justify-content:center;font-size:10px}
.tstep.cur.fp{background:var(--fp-deep);border-color:var(--fp)}
.tstep.cur.sh{background:var(--sh-deep);border-color:var(--sh)}
.tstep.war{border-color:var(--danger)}
.corr{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}
.corr .cpip{width:18px;height:18px;border-radius:50%;background:#2a2318;border:1px solid #443723}
.corr .cpip.on{background:var(--sh);border-color:#e07a5f;box-shadow:0 0 6px rgba(193,74,53,.7)}

.comp{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:#241d12;
  border:1px solid #4a3d26;border-radius:8px;margin:5px 0;font-size:13px}
.comp .lvl{color:var(--gold);font-weight:700;font-size:12px}
.comp button{padding:6px 10px;font-size:11.5px;border-radius:6px;border:1px solid #55442a;background:#332a1a;color:var(--parch)}

/* ================= 4.2: THE PATH TO VICTORY, ALWAYS ON SCREEN =================
   Four conditions are live from the first die to the last, and the player was
   tracking them across two badges and two modals. They are one strip now,
   grouped by the side that wins on them, with the nearest one picked out in
   gold — so every decision is made in front of the thing it is for. */
#vpBadge{max-width:178px;padding:7px 9px}
.vptitle{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-dim);
  margin-bottom:2px;font-weight:700}
.vpgrp{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;margin:4px 0 0}
.vpgrp.fp{color:var(--fp)} .vpgrp.sh{color:var(--sh)}
.gauge.lead .gl,.gauge.lead .gv{color:var(--gold)}
.gauge .gl.wide{width:50px}
.vpnote{font-size:8.5px;color:#7d6f4e;margin-top:4px;line-height:1.35;font-style:italic}

/* ---- 4.4: what the enemy can reach before you commit ---- */
.threatcell{pointer-events:none;opacity:0;transition:opacity .3s}
.rg.threat .threatcell{opacity:1}

/* ---- map-side controls: overlays and sound, off the crowded top bar ---- */
#mapctl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:15}
#mapctl .mc{width:34px;height:34px;border-radius:9px;background:rgba(20,16,11,.9);
  border:1px solid #3a2f1e;color:var(--parch-dim);font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
#mapctl .mc.on{background:var(--gold);color:#1a1408;border-color:#e0c070}
#mapctl .mc:focus-visible{outline:2px solid var(--gold)}
#threatKey{position:absolute;left:10px;bottom:52px;z-index:15;font-size:9.5px;line-height:1.5;
  background:rgba(20,16,11,.92);border:1px solid #3a2f1e;border-radius:8px;padding:5px 8px;
  color:var(--parch-dim);max-width:190px}
#threatKey.hidden{display:none}
#threatKey b{color:var(--danger)}

/* ================= 4.1: THE ENEMY'S TURN, REPLAYED =================
   The flash told the player *where* something happened and never *what*. The
   Shadow's turn is now stepped through in the sheet, one action at a time,
   pulsing the ground it touched, with a way out at any point. */
.replay{border:1px solid #4a3d26;border-radius:9px;background:#1d1710;padding:9px 11px;margin:7px 0}
.replay .rline{font-size:12.5px;line-height:1.5;color:var(--parch);margin:2px 0}
.replay .rline b{color:var(--gold)}
.replay .rwhere{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7d6f4e;margin-top:6px}
.crumbs.rep{flex-wrap:wrap;gap:5px}
.replay.quiet .rline{color:var(--parch-dim);font-style:italic}

/* ================= 4.3: A GUIDED FIRST GAME ================= */
.coach{border:1px solid var(--gold-dim);background:linear-gradient(180deg,#2c2415,#211a0f);
  border-radius:9px;padding:9px 11px;margin:4px 0 10px}
.coach h4{font-family:var(--serif);color:var(--gold);font-size:13.5px;margin-bottom:3px;font-weight:600}
.coach p{font-size:12px;color:var(--parch-dim);line-height:1.45;margin:0}
.coach .crow{display:flex;align-items:center;gap:10px;margin-top:6px}
.coach .cskip{background:none;border:none;color:#8a7136;text-decoration:underline;
  font-size:10.5px;cursor:pointer;padding:0;font-family:var(--sans)}
.coach .cnum{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#7d6f4e}

/* ================= 4.5: THE END-OF-TURN DIGEST ================= */
.dig{margin:8px 0}
.dig .drow{display:flex;gap:9px;padding:6px 0;border-top:1px solid #2f2718;font-size:12px;line-height:1.45}
.dig .drow:first-child{border-top:none}
.dig .dlab{flex:0 0 84px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--parch-dim);padding-top:2px}
.dig .dval{flex:1 1 auto;color:var(--parch)}
.dig .dval .none{color:#7d6f4e;font-style:italic}
.dig .up{color:var(--danger);font-weight:700}
.dig .dn{color:#7fe08f;font-weight:700}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div id="sheet">

  <div id="modal" class="hidden"><div id="modalCard"></div></div>
  <div id="toast" class="hidden"></div>
</div>

ce the Hunt damage by one (to a minimum of zero). Any remaining Hunt damage must be confronted normally. You must discard this card from the table immediately if Boromir leaves the Fellowship.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0012","t":"Wizard\u2019s Staff","f":"fp","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play on the table if Gandalf the Grey is in the Fellowship. You may discard \u201cWizard\u2019s Staff\u201d to prevent the Shadow player from drawing a Hunt tile. You must discard this card from the table immediately if Gandalf the Grey leaves the Fellowship.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0013","t":"Blade of Westernesse","f":"fp","deck":"str","ct":"combat","cs":6,"x":"Play if a Hobbit is in the battle. Use one hit during the Leader re-roll to eliminate one Minion of your choice that is participating in the battle.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0014","t":"Mighty Attack","f":"fp","deck":"str","ct":"combat","cs":4,"x":"Play if a Companion is in the battle. Before rolling the dice for your Leader re-roll, forfeit the Leadership of one Companion participating in the battle to automatically change one missed die roll to a hit.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0016","t":"Servant of the Secret Fire","f":"fp","deck":"str","ct":"combat","cs":3,"x":"Play if Gandalf is in the battle. Add 1 to all dice on your Combat roll.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0019","t":"Athelas","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Roll three dice and heal one Corruption point for each die result of 5+. If Strider is the Guide, heal one Corruption point for each die result of 3+ instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0020","t":"There is Another Way","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Heal one Corruption point. Then, if Gollum is the Guide, you may also hide or move the Fellowship (following the normal movement rules).","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0021","t":"I Will Go Alone","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Play if at least one Companion is in the Fellowship. Separate one Companion or one group of Companions from the Fellowship. You may move the Companions one extra region. Then, heal one Corruption point.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0022","t":"Bilbo\u2019s Song","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Heal one Corruption point. If Gollum is the Guide, heal two Corruption points instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0023","t":"And\u00fbril","f":"fp","deck":"str","ct":"combat","cs":4,"x":"Play if Strider/Aragorn is in the battle. Before rolling the dice for your Leader re-roll, forfeit Strider\u2019s Leadership to automatically change one missed die roll to a hit, or forfeit Aragorn\u2019s Leadership to auto- matically change up to two missed die to hits.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0024","t":"Mirror of Galadriel","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Change any one unused Character Action Die result into a Will of the West Action Die result. Then, if the Fellowship is L\u00f3rien, heal one Corruption point.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0025","t":"Heroic Death","f":"fp","deck":"str","ct":"combat","cs":6,"x":"Play if a Free Peoples Leader or a Companion is in the battle. Before you remove casualties in- flicted by your opponent\u2019s Combat roll and Leader re-roll, you may eliminate a Leader to cancel one hit, or eliminate one Companion to cancel a number of hits equal to or less than the Companion\u2019s Level.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0027","t":"Challenge of the King","f":"fp","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if Strider/Aragorn is with a Free Peoples Army in Gondor or Rohan. Draw three Hunt tiles. If all three drawn tiles show Eyes, put them back in the Hunt Pool and eliminate Strider/Aragorn. Otherwise, discard permanently the drawn tiles bearing an Eye for the remainder of the game. All drawn tiles not bearing an Eye are put back in the Hunt Pool.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":" he rules for a successful Hunt, with the exception that the Free Peoples player must take all Hunt damage as Corruption.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0121","t":"Foul Thing from the Deep","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play if the Fellowship is not in a region containing a Free Peoples Settlement. Draw a Hunt tile. If the tile shows an Eye or is a Fellowship special tile, discard it without effect. Otherwise, follow the rules for a success- ful Hunt, with the exception that the Free Peoples player must reduce any Hunt damage by eliminating a random Companion (unless there are no Com- panions in the Fellowship).","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0122","t":"Cruel as Death","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Play if the total Nazg\u00fbl Leadership is 2 or more. Subtract 2 from your total Nazg\u00fbl Leadership to add 1 to all dice on your Combat roll.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0124","t":"They are Terrible","f":"sh","deck":"str","ct":"combat","cs":4,"x":"Play if the total Nazg\u00fbl Leadership is 1 or more. Subtract 1 from your total Nazg\u00fbl Leadership to add 1 to all dice on your Leader re-roll.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0125","t":"Candles of Corpses","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if the Fellowship is not in a region containing a Free Peoples Settlement. Roll three dice and add one Corrup- tion point on each result of 4+. If Gollum is the Guide, add one Corruption points on each result of \u201c6\u201d instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0126","t":"Dread and Despair","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Play if the total Nazg\u00fbl Leadership is 1 or more. Before the Combat roll, forfeit one or more points of Nazg\u00fbl Leadership. During this Combat roll, the Free Peoples player rolls one die less (to a minimum of 1) for every point you have chosen to forfeit.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0127","t":"Nazg\u00fbl Search","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if the Fellowship is on step 1 or higher on the Fellowship Track. Move any or all of the Nazg\u00fbl. Then, if at least one Nazg\u00fbl is in the region with the Fellowship, the Fel- lowship is revealed.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0128","t":"Cruel Weather","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if the Fellowship is on step 1 or higher on the Fellowship Track. Move the Ring-bearers to an adjacent region.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0129","t":"Foul Stench","f":"sh","deck":"str","ct":"strategy_event","cs":3,"x":"Play if the total Nazg\u00fbl Leadership is 1 or more. If the Nazg\u00fbl Leadership equals or exceeds the total Free Peoples Leadership, the Free Peoples Leader re-roll is cancelled.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0131","t":"The Nazg\u00fbl Strike!","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if the Fellowship is on step 1 or higher on the Fellowship Track. Move any or all of the Nazg\u00fbl. Then, if at least one Nazg\u00fbl is in the re- gion with the Ring-bearers, you may either discard one Free Peoples Charac- ter Event card from the table or roll for the Hunt (as if the Free Peoples player had moved the Fellowship).","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0132","t":"Black Breath","f":"sh","deck":"str","ct":"combat","cs":6,"x":"Play if a Nazg\u00fbl is in the battle. If your Leader re-roll scores at least one hit, you may additionally eliminate one Free Peoples Leader participating in the battle. Alternatively, you can choose to eliminate a Companion in the battle, if the number of hits equals or exceeds that Companion\u2019s Level.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0135","t":"Lure of the Ring","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if the Fellowship is revealed. Randomly select one Companion in the Fellowship by drawing a Companion counter. The Free Peoples player must choose either to add Corruption equal to the Companion\u2019s Level or to eliminate him. If Gollum is the Guide, add one Corruption point instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0137","t":"The Breaking of the Fellowship","f":"sh","deck":"chr","ct":"combat","cs":0,"x":"Play if the Fellowship is revealed. Draw a Hunt tile. If the tile shows an Eye or is a Fellowship special tile, discard it without effect. Otherwise, the Free Peoples player must separate a number of Companions equal to the number on the tile (if possible), placing them in the same region as the Ring-bearers. Ignore any \u201cReveal\u201d or \u201cStop\u201d icons on the tile. If Gollum is the Guide, add one Corruption point instead. Dread and Despair (3) Play if the total Nazg\u00fbl Leadership is 1 or more. Before the Combat roll, forfeit one or more points of Nazg\u00fbl Leadership. During this Combat roll, the Free Peoples player rolls one die less (to a minimum of 1) for every point you have chosen to forfeit.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0138","t":"Worn with Sorrow and Toil","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play on the table. When \u201cWorn with Sorrow and Toil\u201d is in play, if a Companion in the Fel- lowship is taken as a casualty you may also discard one of the Free Peoples player\u2019s Character Event cards from his hand (choosing it ran- domly) or from the table. You must discard this card from the table immediately if the Fellowship is declared in a Free Peoples City or Stronghold controlled by the Free Peoples.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0139","t":"Words of Power","f":"sh","deck":"str","ct":"strategy_event","cs":1,"x":"Play if a Nazg\u00fbl is in the battle. Choose a Companion. That Compan- ion\u2019s Leadership and special abilities are cancelled for this Combat round. 15","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0140","t":"Morgul Wound","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if the Fellowship is revealed. If the Fellowship\u2019s current Corruption is three or less, add two Corruption points; otherwise add one Corruption point.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0142","t":"Flocks of Crebain","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play on the table. Before you make a Hunt roll, you may discard \u201cFlocks of Crebain\u201d to add 1 to all dice on that Hunt roll (including re-rolls). You must discard this card from the table immediately if the Fellowship is declared in a Free Peoples City or Stronghold.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0144","t":"Balrog of Moria","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play on the table. You may discard \u201cBalrog of Moria\u201d to draw an additional Hunt tile if the Fel- lowship moves into, out of, or through Moria while being declared or revealed. If the tile shows an Eye, discard it without effect; otherwise follow the rules for a suc- cessful Hunt. Ignore any \u201cReveal\u201d icon on the drawn tile if the Fellowship has been declared in a Free Peoples City or Stronghold. Or you may discard \u201cBalrog of Moria\u201d to use its Com- bat effect as if you were playing the card from your hand.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0145","t":"Durin\u2019s Bane","f":"fp","deck":"str","ct":"combat","cs":2,"x":"Play if the defending Army is within two regions of Moria Before the Combat roll, roll an additional attack using three combat dice. Score hits on 4+ and apply the result immediately.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0146","t":"The Palant\u00edr of Orthanc","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play on the table if Saruman is in play. When \u201cThe Palant\u00edr of Orthanc\u201d is in play, every time you use an Event Ac- tion Die result to play an Event card, immediately draw another card from either one of your decks. The Free Peoples player can force \u201cThe Palant\u00edr of Orthanc\u201d to be discarded by either using a Will of the West Action Die result, or using any Action Die and one Elven Ring. You must discard this card if Saruman is eliminated.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0150","t":"The Lidless Eye","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Change up to three unused Shadow Action Dice results into \u201cEye\u201d results. Place the dice in the Hunt Box immediately.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0151","t":"Dreadful Spells","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if a Shadow Army containing a Nazg\u00fbl is adjacent to, or is in the same region as, a Free Peoples Army. Roll a number of dice equal to the number of Nazg\u00fbl in that Army (up to a maximum of 5) and score one hit for each result of 5+.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0153","t":"Devilry of Orthanc","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Play if an Isengard Army unit is in the battle and the defending Army is in a Stronghold. Add 1 to all dice on your Combat roll. 19","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0154","t":"The Ringwraiths Are Abroad","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Move any or all of the Nazg\u00fbl. Then, you may either move two Armies each containing a Nazg\u00fbl, or attack with one Army containing a Nazg\u00fbl.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0155","t":"Grond, Hammer of the","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Underworld Play if the Witch-king is in play and is with a Shadow Army besieging a Free Peoples Stronghold. Attack that Stronghold. The Siege lasts for three Combat rounds in- stead of one. During the first round, the Free Peoples player cannot use a Combat card unless a Companion is in the battle.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0157","t":"The Black Captain Commands","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play if the Witch-king is in play. You may either recruit two Nazg\u00fbl in the region containing the Witch-king, or move any or all of the Nazg\u00fbl. Then, you may move or attack with an Army containing the Witch-king.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0158","t":"Wormtongue","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play on the table if Saruman is in play. When \u201cWormtongue\u201d is in play, Ro- han cannot be activated except by a Companion\u2019s special ability, or by the Fellowship being declared in Edoras or Helm\u2019s Deep, or by an attack on Edoras or Helm\u2019s Deep. You must discard this card from the table as soon as Rohan is activated, or if Saruman is eliminated.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0162","t":"Return to Valinor","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"(A) Play if you control at least one Elven Stronghold. For each region with an Elven Stronghold which is not under siege, roll a number of dice equal to the number of Elven Army units in that region (up to a maximum of 5) and score one hit against that Army for each result of \u201c6\u201d.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0163","t":"The Fighting Uruk-hai","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if Saruman is in play, and if an Army containing an Isengard unit is besieging a Stronghold. Attack that Stronghold. The Siege lasts for three Combat rounds in- stead of one. During the first round, the Free Peoples player cannot use a Combat card unless a Companion is in the battle.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0164","t":"Denethor\u2019s Folly","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Play on the table if Minas Tirith is besieged by a Shadow Army. When you play this card, immedi- ately eliminate one Free Peoples Leader in Minas Tirith. When \u201cDenethor\u2019s Folly\u201d is in play, the Free Peoples player cannot use Combat cards for battles fought in Minas Tirith. The Free Peoples player can force \u201cDenethor\u2019s Folly\u201d to be discarded using a Will of the West Action Die result, or any Action Die if Gandalf or Aragorn is in Minas Tirith.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0166","t":"The Day Without Dawn","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if all Shadow Nations are \u201cAt War\u201d. Discard all unused Free Peoples Action Dice that show a Will of the West result.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0167","t":"Relentless Assault","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Before the Combat roll, you may inflict and apply up to two hits against your units. Add 1 to all dice on your Combat roll for each hit you inflicted.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0168","t":"Onslaught","f":"sh","deck":"str","ct":"combat","cs":7,"x":"After removing casualties from the Combat roll and Leader re-roll, you may inflict and apply up to four additional hits against your units. Roll one die for each hit you inflicted to your units and score one hit against the enemy on each result of 4+.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0169","t":"Stormcrow","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if either the Ring-bearers or a Companion is inside the borders of a Free Peoples Nation not \u20 function cardHuntDraw(s, c, opts) { // Orc Patrol / Isuldur's Bane / Foul Thing from the Deep
  const t = drawHuntTile();
  if (!t) { log(s, `<b>${c.t}</b> — the Hunt Pool is empty.`); return; }
  const fpSpecial = t.startsWith("S:") && SPECIAL_TILES[t.slice(2)].dmg <= 0;

function aiMassMove(count, maxSteps, needLead) { // shared engine for Shadow movement cards

  const armies = armiesOf("sh", needLead).filter(r => units(r, "sh") >= 2).sort((a, b) => units(b, "sh") - units(a, "sh"));
  for (const from of armies) {

/* Storage that degrades instead of throwing. localStorage is blocked in some

const STORE = (() => {

    set(k, v) { try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },

function journalStep(side) {
  if (HEADLESS || !aiJournal) return;
  const lines = S.log.slice(aiJournal.mark).map(e => e.msg);
  aiJournal.mark = S.log.length;
  const now = boardSig();
  const regions = DATA.regions.filter(r => aiJournal.sig.reg[r.id] !== now.reg[r.id]).map(r => r.id);
  if (aiJournal.sig.fs !== now.fs && !regions.includes(now.fs)) regions.push(now.fs);
  aiJournal.sig = now;
  if (lines.length || regions.length) aiJournal.steps.push({ side, lines, regions });
}
/* a battle hands the thread to a modal flow, so its lines are swept up by the
   next action to begin rather than at the moment the die was spent */
function journalFlushPending() {
  if (aiJournal && aiJournal.pending) { journalStep(aiJournal.pending); aiJournal.pending = null; }
}
function journalDrop() { aiJournal = null; }

/* ---------------- BOTTOM SHEET: peek / full ----------------
   The grab bar used to be decoration. It now drags, snaps to two positions and
   answers the keyboard; the sheet's real height is published as --sheet-h so
   the toast rides above it instead of guessing at a fixed 52dvh. */
const SHEET = (() => {
  const sheet = $("sheet"), handle = $("sheetHandle"), root = document.documentElement;
  const fullPx = () => Math.round(window.innerHeight * 0.52);
  const peekPx = () => handle.offsetHeight || 20;
  const syncH = () => {                       // before first layout the sheet measures 0 — keep the CSS default
    const h = sheet.getBoundingClientRect().height;
    if (h > 1) root.style.setProperty("--sheet-h", h + "px");
  };
  const setPeek = on => {
    sheet.classList.toggle("peek", on);
    handle.setAttribute("aria-expanded", on ? "false" : "true");
    sheet.style.maxHeight = "";
    syncH();
  };
  const toggle = () => setPeek(!sheet.classList.contains("peek"));

  if (window.ResizeObserver) new ResizeObserver(syncH).observe(sheet);
  window.addEventListener("resize", syncH);

  let drag = null;
  handle.addEventListener("pointerdown", e => {
    handle.setPointerCapture(e.pointerId);
    drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, moved: false };
    sheet.classList.add("dragging");
  });
  handle.addEventListener("pointermove", e => {
    if (!drag) return;
    const dy = drag.y - e.clientY;
    if (Math.abs(dy) > 6) drag.moved = true;
    if (!drag.moved) return;
    sheet.style.maxHeight = Math.max(peekPx(), Math.min(fullPx(), drag.h + dy)) + "px";
    syncH();
  });
  const end = () => {
    if (!drag) return;
    sheet.classList.remove("dragging");
    if (!drag.moved) toggle();
    else setPeek(sheet.getBoundingClientRect().height < (fullPx() + peekPx()) / 2);
    drag = null;
  };
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", () => { sheet.classList.remove("dragging"); sheet.style.maxHeight = ""; drag = null; syncH(); });
  handle.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });

  syncH();
  /* anything that needs the player's attention re-opens the sheet */
  return { syncH, open: () => setPeek(false), toggle };
})();

/* ---------------- MAP ---------------- */
function fitViewBox() {
  const w = $("mapwrap").clientWidth, h = $("mapwrap").clientHeight;
  const ar = w / h, mapAr = 1000 / 1050;
  if (ar > mapAr) { VB = { x: -40, y: 40, w: 1050 * ar, h: 1050 }; }
  else { VB = { x: 0, y: 40, w: 1000, h: 1000 / ar }; }
  applyVB();
}
/* G2: a coarse zoom band on the <svg> root drives all label detail from CSS.
   Only written when the band actually changes, so panning never touches the DOM. */
let zoomBand = null;
function zoomBandFor(w) { return w > 900 ? "far" : w > 520 ? "mid" : "near"; }
function applyVB() {
  svg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
  const band = zoomBandFor(VB.w);
  if (band !== zoomBand) { zoomBand = band; svg.dataset.zoom = band; }
}

/* ================= G4: TERRAIN =================
   Features are authored against region ids rather than raw coordinates, so the
   table stays readable and new features can be added a few at a time without
   the map ever looking half-finished. `via` traces a polyline or curve through
   region centres; `at` anchors a blob on one region. */
const TERRAIN = [
  // the great ranges
  { t: "ridge", via: ["mount_gundabad", "goblins_gate", "high_pass", "rivendell", "moria", "dimrill_dale"], s: 1.0 },

  { t: "ridge", via: ["druadan_forest", "minas_tirith", "lossarnach"], s: .6 },
  { t: "ridge", via: ["morannon", "minas_morgul", "gorgoroth"], s: .85 },
  { t: "ridge", via: ["dagorlad", "morannon"], s: .6 },
  { t: "ridge", via: ["gorgoroth", "nurn"], s: .6 },
  { t: "ridge", via: ["angmar", "mount_gram", "mount_gundabad"], s: .75 },
  // woods
  { t: "forest", at: "fangorn", rx: 32, ry: 26 },
  { t: "forest", at: "western_mirkwood", rx: 26, ry: 30 },
  { t: "forest", at: "narrows_of_the_forest", rx: 24, ry: 22 },
  { t: "forest", at: "eastern_mirkwood", rx: 26, ry: 26 },
  { t: "forest", at: "southern_mirkwood", rx: 26, ry: 24 },
  { t: "forest", at: "old_forest", rx: 22, ry: 18 },
  { t: "forest", at: "lorien", rx: 22, ry: 20 },
  { t: "forest", at: "woodland_realm", rx: 26, ry: 20 },
  { t: "forest", at: "druadan_forest", rx: 18, ry: 15 },
  { t: "forest", at: "trollshaws", rx: 20, ry: 17 },
  // rivers
  { t: "river", via: ["old_ford", "gladden_fields", "dimrill_dale", "lorien", "field_of_celebrant", "eastemnet", "brown_lands", "dead_marshes", "osgiliath", "pelargir"], w: 2.6 },
  { t: "river", via: ["gap_of_rohan", "fords_of_isen", "enedwaith", "minhiriath"], w: 2.0 },
  { t: "river", via: ["dale", "vale_of_celduin", "south_rhun"], w: 2.0 },
  { t: "river", via: ["rivendell", "trollshaws", "weather_hills", "bree"], w: 1.6 },
];

function terrainPoints(via) { return via.filter(id => REG[id]).map(id => [REG[id].x, REG[id].y]); }
function ridgePath(pts, s, g) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const seg = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(2, Math.round(seg / (17 * s)));
    for (let j = 0; j < n; j++) {
      const t = j / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
      const h = (9 + 4 * ((j * 7919) % 5) / 4) * s, w = h * 1.4;
      el("path", { class: "peak", d: `M${(x - w).toFixed(1)},${(y + h * .35).toFixed(1)} L${x.toFixed(1)},${(y - h).toFixed(1)} L${(x + w).toFixed(1)},${(y + h * .35).toFixed(1)} Z` }, g);
      el("path", { class: "snow", d: `M${x.toFixed(1)},${(y - h).toFixed(1)} L${(x - w * .34).toFixed(1)},${(y - h * .18).toFixed(1)} L${(x + w * .1).toFixed(1)},${(y - h * .05).toFixed(1)} Z` }, g);
    }
  }
}
function forestPatch(cx, cy, rx, ry, g) {
  el("ellipse", { class: "wood", cx, cy, rx, ry }, g);
  const n = Math.max(10, Math.round(rx * ry / 34));
  for (let i = 0; i < n; i++) {
    const a = i * 2.39996, rr = Math.sqrt(i / n);
    const x = cx + Math.cos(a) * rx * rr * .84, y = cy + Math.sin(a) * ry * rr * .84;
    const s = 3 + (i % 3) * .6;
    el("path", { class: "tree", d:
      `M${x.toFixed(1)},${(y - s).toFixed(1)} L${(x - s * .8).toFixed(1)},${(y + s * .25).toFixed(1)} L${(x + s * .8).toFixed(1)},${(y + s * .25).toFixed(1)} Z` +
      `M${x.toFixed(1)},${(y - s * 1.5).toFixed(1)} L${(x - s * .6).toFixed(1)},${(y - s * .45).toFixed(1)} L${(x + s * .6).toFixed(1)},${(y - s * .45).toFixed(1)} Z` }, g);
  }
}
function smoothPath(pts) {          // Catmull-Rom-ish curve through the points
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function drawTerrain(g) {
  TERRAIN.forEach(f => {
    if (f.t === "ridge") ridgePath(terrainPoints(f.via), f.s || 1, g);
    else if (f.t === "forest") { const r = REG[f.at]; if (r) forestPatch(r.x, r.y, f.rx, f.ry, g); }
    else if (f.t === "river") {
      const d = smoothPath(terrainPoints(f.via));
      el("path", { class: "riverbed", d, "stroke-width": (f.w || 2.2) }, g);
      el("path", { class: "riverlit", d, "stroke-width": (f.w || 2.2) * .45 }, g);
    }
  });
}

/* ================= 2.1: NATION IDENTITY =================
   Territory used to be three colours — blue, red and grey — which threw away the
   thing Middle-earth's map is actually about. Every nation now has a hue; the
   ground is painted in it, darkened toward the map so tokens still read on top,
   and blended toward the conqueror's colour when it changes hands. So Rohan is
   Rohan, and *fallen* Rohan is visibly Rohan that has fallen. */
const NATION_ART = {
  north:     { c: "#5d7fa8", label: "The North" },
  rohan:     { c: "#3f8250", label: "Rohan" },
  gondor:    { c: "#8ea8cc", label: "Gondor" },
  elves:     { c: "#46a294", label: "Elves" },
  dwarves:   { c: "#b5813c", label: "Dwarves" },
  sauron:    { c: "#932516", label: "Sauron" },
  isengard:  { c: "#6d7164", label: "Isengard" },
  southrons: { c: "#b46c22", label: "Southrons & Easterlings" },
};
const WILD_C = "#39414f", MAP_C = "#141a25";
function natColour(nat) { return (nat && NATION_ART[nat]) ? NATION_ART[nat].c : WILD_C; }
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixC(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function territoryFill(rid) {
  const r = REG[rid], st = S.reg[rid];
  const owner = r.nation ? DATA.nations[r.nation].side : null;
  const held = controller(rid);
  let col = mixC(natColour(r.nation), MAP_C, r.nation ? 0.46 : 0.62);
  if (held && owner && held !== owner)            // conquered: the conqueror's stain over the old colour
    col = mixC(col, held === "sh" ? "#7d1c10" : "#2a5480", 0.5);
  return col;
}

/* ================= 2.6: SETTLEMENTS BY SILHOUETTE =================
   Stronghold, city, fortification and town were four gold discs differing only
   in radius — a distinction nobody can make on a moving map, and one that hid
   the number that actually decides the game. Each type now has its own outline,
   and carries its victory value as pips above it (2 for a stronghold, 1 for a
   city, none for the rest). The pips take the colour of whoever holds the
   ground, so a glance across the board reads as a running score. */
const SETTLE = {
  s: { name: "Stronghold", vp: 2, pipY: -18,   // clear of the halo ring
       // a keep: square body under a crenellated parapet
       d: "M-8,7 L-8,-7 L-5,-7 L-5,-4 L-2,-4 L-2,-7 L2,-7 L2,-4 L5,-4 L5,-7 L8,-7 L8,7 Z" },

       // a house under a pitched roof
       d: "M-5,6 L-5,-1 L0,-6 L5,-1 L5,6 Z" },

function settleInfo(kind) { return SETTLE[kind] || null; }
function drawSettlement(g, r) {
  const S0 = SETTLE[r.settle]; if (!S0) return;
  const gs = el("g", { class: "settlemark", transform: `translate(${r.x},${r.y})` }, g);
  if (r.settle === "s") el("circle", { class: "settlering", cx: 0, cy: 0, r: 12 }, gs);
  el("path", { class: "settle s-" + r.settle, d: S0.d }, gs);
  el("title", {}, gs).textContent = `${r.name} — ${S0.name}${S0.vp ? ` (${S0.vp} VP)` : " (no victory value)"}`;
  // victory pips ride above the roofline, one small lozenge each
  for (let i = 0; i < S0.vp; i++) {
    const x = S0.vp === 1 ? 0 : (i === 0 ? -3.6 : 3.6), y = S0.pipY;
    el("path", { class: "svp", d: `M${x},${y - 2.6} L${x + 2.6},${y} L${x},${y + 2.6} L${x - 2.6},${y} Z` }, gs);
