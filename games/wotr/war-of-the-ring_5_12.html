const CHIP_H = 13, CHIP_GAP = 3, FIG_R = 7.5;
function chipWidth(n) { return 12 + (n >= 10 ? 10 : 6.5); }
/* Each token is two nested groups: the outer one carries the layout translate
   (a presentation attribute), the inner one carries the pop/ghost animation.
   Keeping them apart matters — a CSS `transform` animation on the same element
   would replace the translate outright and snap the token to the origin. */
function token(key, cls) {
  const node = el("g", { class: "tok", "data-key": key });
  const art = el("g", { class: "tokart " + cls }, node);
  return { node, art };
}
/* 2.1: `nat` paints a stripe down the chip, so a mixed host reads as a mixed
   host rather than one anonymous pile. A chip with no nation (the merged tail of
   a very mixed stack) simply has no stripe. */
function buildChip(side, sym, n, kind, nat) {
  const w = chipWidth(n) + (nat ? 4 : 0);
  const tag = nat || "mix";
  const { node, art } = token(`${side}:${sym}:${tag}`, `chip ${side}${kind ? " " + kind : ""}`);
  el("rect", { x: -w / 2, y: -CHIP_H / 2, width: w, height: CHIP_H, rx: 3.5 }, art);
  if (nat) el("rect", { class: "natbar", x: -w / 2 + 1.4, y: -CHIP_H / 2 + 1.6, width: 2.4,
                        height: CHIP_H - 3.2, rx: 1.2, fill: natColour(nat) }, art);
  useSym(sym, { x: -w / 2 + (nat ? 5.2 : 1.5), y: -4.6, width: 9.2, height: 9.2 }, art);
  el("text", { x: w / 2 - 4.2, y: 0.4 }, art).textContent = n;
  return { node, art, w, key: `${side}:${sym}:${tag}:${n}` };
}
/* One chip per national contingent, largest first. Beyond two nations the tail is
   merged into a single unstriped chip so a ten-stack cannot overflow its region. */
function unitChips(rid, side) {
  reconcileNat(rid, side);
  const L = natLedger(rid, side);
  const nats = natsPresent(rid, side).filter(n => (L[n].r + L[n].e) > 0);
  const out = [];
  const named = nats.slice(0, 2), rest = nats.slice(2);
  named.forEach(n => {
    if (L[n].r) out.push(buildChip(side, "g-reg", L[n].r, "", n));
    if (L[n].e) out.push(buildChip(side, "g-elite", L[n].e, "", n));
  });
  let rr = 0, ee = 0;
  rest.forEach(n => { rr += L[n].r; ee += L[n].e; });
  if (rr) out.push(buildChip(side, "g-reg", rr, "", null));
  if (ee) out.push(buildChip(side, "g-elite", ee, "", null));
  if (side === "fp" && S.reg[rid].fp.l) out.push(buildChip("fp", "g-lead", S.reg[rid].fp.l, "lead", null));
  return out;
}
function buildFig(side, id) {
  const spr = (FIG_ART[id] || { sym: "g-naz" }).sym;
  const { node, art } = token(`${side}:${id}`, `fig ${side}`);
  el("circle", { cx: 0, cy: 0, r: FIG_R }, art);
  useSym(spr, { x: -5.2, y: -5.2, width: 10.4, height: 10.4 }, art);
  el("text", { class: "figlabel", x: 0, y: FIG_R + 5.4 }, art).textContent = figTag(id);
  return { node, art, w: FIG_R * 2, key: `${side}:${id}:${figTag(id)}` };
}
function buildCountFig(side, sym, n, tag) {   // Nazgûl, Ents, engines, ships, Dunlendings — a portrait with a tally
  const { node, art } = token(`${side}:${sym}`, `fig ${side}`);
  el("circle", { cx: 0, cy: 0, r: FIG_R }, art);
  useSym(sym, { x: -5.2, y: -5.2, width: 10.4, height: 10.4 }, art);
  if (n > 1) {   // inline styles: the stylesheet's .fig circle/text rules would otherwise win
    el("circle", { cx: FIG_R - 1, cy: -FIG_R + 1, r: 4.4, style: "fill:#0e1118;stroke:none" }, art);
    el("text", {
      x: FIG_R - 1, y: -FIG_R + 1,
      style: `font-family:var(--sans);font-size:6px;font-weight:700;text-anchor:middle;` +
             `dominant-baseline:central;fill:${side === "fp" ? "#a8cbe8" : "#e8a893"}`
    }, art).textContent = n;
  }
  el("text", { class: "figlabel", x: 0, y: FIG_R + 5.4 }, art).textContent = tag;
  return { node, art, w: FIG_R * 2, key: `${side}:${sym}:${n}:${tag}` };
}

/* G3: lay a row of tokens out centred on (x,y), diffing against what is
   already there. Unchanged tokens are left completely alone (no reflow, no
   re-animation); arrivals pop in; departures are kept for one beat as ghosts
   that drift away before being removed. */
function layoutRow(slot, items, x, y) {
  const prev = new Map();
  [...slot.children].forEach(c => {
    if (!c.classList.contains("ghosted")) prev.set(c.getAttribute("data-key"), c);
  });
  const total = items.reduce((s, it) => s + it.w, 0) + Math.max(0, items.length - 1) * CHIP_GAP;
  let cx = x - total / 2;
  const keep = new Set();
  items.forEach(it => {
    const dk = it.node.getAttribute("data-key");
    keep.add(dk);
    const px = cx + it.w / 2;
    const old = prev.get(dk);
    if (old && old.getAttribute("data-sig") === it.key) {           // same token, same value: leave it be
      old.setAttribute("transform", `translate(${px},${y})`);
    } else {
      if (old) old.remove();                                        // value changed — restamp and pop
      it.node.setAttribute("transform", `translate(${px},${y})`);
      it.node.setAttribute("data-sig", it.key);
      it.art.classList.add("tok-new");
      it.art.addEventListener("animationend", () => it.art.classList.remove("tok-new"), { once: true });
      slot.appendChild(it.node);
    }
    cx += it.w + CHIP_GAP;
  });
  prev.forEach((node, k) => {                                        // gone: fade and drift away
    if (keep.has(k)) return;
    node.classList.add("ghosted");
    node.removeAttribute("data-key");
    const art = node.querySelector(".tokart");
    if (art) { art.classList.remove("tok-new"); art.classList.add("tok-ghost"); }
    setTimeout(() => node.remove(), 520);
  });
}

/* ================= 2.2: DRAWING A SIEGE AS A SIEGE =================
   A siege used to be a dashed red outline, with the garrison sitting in the same
   token row as the army besieging it — the single most misread state on the
   board. The garrison now stands inside a crenellated keep drawn on the
   settlement, and the besiegers stay outside it, which is exactly how the
   physical board shows it. */
function keepPath(cx, cy, w, h) {
  const x = cx - w / 2, y = cy - h / 2;
  let n = Math.max(3, Math.round(w / 7)); if (n % 2 === 0) n++;   // odd: starts and ends on a merlon
  const step = w / n;
  let d = `M${x.toFixed(1)},${(y + h).toFixed(1)} L${x.toFixed(1)},${y.toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const x0 = x + i * step, x1 = x0 + step, top = (i % 2 === 0) ? y : y + 4.2;
    d += ` L${x0.toFixed(1)},${top.toFixed(1)} L${x1.toFixed(1)},${top.toFixed(1)}`;
  }
  return d + ` L${(x + w).toFixed(1)},${y.toFixed(1)} L${(x + w).toFixed(1)},${(y + h).toFixed(1)} Z`;
}
function layoutKeep(tk, rid, items, side) {
  const kg = tk.querySelector(".keep");
  let slot = kg.querySelector(".keepslot");
  let wall = kg.querySelector(".keepwall");
  let label = kg.querySelector(".keeplabel");
  if (!wall) {
    wall = el("path", { class: "keepwall" }, kg);
    slot = el("g", { class: "keepslot slot" }, kg);
    label = el("text", { class: "keeplabel" }, kg);
  }
  if (!items.length) { kg.setAttribute("opacity", 0); layoutRow(slot, [], 0, 0); return; }
  kg.setAttribute("opacity", 1);
  const content = items.reduce((s, it) => s + it.w, 0) + Math.max(0, items.length - 1) * CHIP_GAP;
  const w = Math.max(30, content + 13), h = 25;
  const r = REG[rid], cx = r.x, cy = r.y - 30;
  wall.setAttribute("d", keepPath(cx, cy, w, h));
  wall.setAttribute("data-side", side);
  label.setAttribute("x", cx); label.setAttribute("y", cy + h / 2 + 7);
  label.textContent = "BESIEGED";
  layoutRow(slot, items, cx, cy + 3);
}

/* the point inside a cell that tokens and labels hang off — not the node, which
   can sit close to a border and throw a neighbour's tokens on top of it */
function anchorOf(rid) {
  const c = MAPGEO.cells[rid];
  return c ? c.a : [REG[rid].x, REG[rid].y];
}

function drawMap() {
  if (HEADLESS) return;
  svg.innerHTML = "";
  installSprites();
  /* the sea, and the coastline the cells are clipped to */
  const gSea = el("g", { id: "gSea" }, svg);
  el("path", { class: "land", d: MAPGEO.land }, gSea);
  const gCells = el("g", { id: "gCells" }, svg);
  const gTerr = el("g", { id: "gTerrain" }, svg);
  const gBord = el("g", { id: "gBorders" }, svg);
  const gMark = el("g", { id: "gMarks" }, svg);
  const gTok = el("g", { id: "gTokens" }, svg);

  /* 1. territory — the cell is the region, and it is the tap target */
  DATA.regions.forEach(r => {
    const g = el("g", { class: "rg", id: "rg_" + r.id }, gCells);
    const cell = MAPGEO.cells[r.id];
    el("path", { class: "cell", d: cell ? cell.d : "" }, g);
    // 4.4: the threat overlay is the same outline hatched, drawn over the fill and
    // hidden until the toggle asks for it — no second geometry to keep in step
    el("path", { class: "threatcell", d: cell ? cell.d : "", fill: "url(#patReach)" }, g);
    bindRegionTap(g, r.id);
  });

  /* 2. terrain, drawn over the cell fills as texture rather than as a backdrop */
  drawTerrain(gTerr);

  /* 3. borders. A wall is a boundary the graph gives no road across; a road is a
        declared adjacency whose cells do not touch. Between them the map states
        the adjacency graph outright instead of implying it with a web of lines. */
  MAPGEO.walls.forEach(([x1, y1, x2, y2]) => {
    el("line", { class: "wall", x1, y1, x2, y2 }, gBord);
    ridgePath([[x1, y1], [x2, y2]], .48, el("g", { class: "wallpeaks" }, gBord));
  });
  MAPGEO.roads.forEach(r => {
    const [x1, y1, x2, y2] = r.p;     // nearest points, so a road reads as a pass
    el("line", { class: "road", x1, y1, x2, y2 }, gBord);
  });

  /* 4. settlements and names — 2.6: silhouette by type, pips for victory value */
  DATA.regions.forEach(r => {
    const g = el("g", { class: "mk", id: "mk_" + r.id }, gMark);
    if (r.settle) drawSettlement(g, r);
    const a = anchorOf(r.id);
    el("text", { class: "rname", x: a[0], y: a[1] }, g).textContent = r.name;
  });

  /* 5. tokens, in their own layer so no neighbour's territory can cover them */
  DATA.regions.forEach(r => {
    const g = el("g", { class: "tk", id: "tk_" + r.id }, gTok);
    el("g", { class: "keep", opacity: 0 }, g);   // 2.2: besieged garrison, drawn first so it sits behind
    el("g", { class: "slot figfp" }, g);
    el("g", { class: "slot unitfp" }, g);
    el("g", { class: "slot unitsh" }, g);
    el("g", { class: "slot figsh" }, g);
  });
  el("g", { id: "gFS" }, gTok);
  lastFsLoc = null;
  refreshMap();
}

let lastFsLoc = null;
function refreshMap() {
  affordReset();   // 3.1: the board moved, so what each die can reach must be recomputed
  if (HEADLESS) return;
  const threat = threatOverlay();   // 4.4: null unless the player has asked for it
  DATA.regions.forEach(r => {
    const g = $("rg_" + r.id); if (!g) return;
    const st = S.reg[r.id];
    const tk = $("tk_" + r.id);
    const [ax, ay] = anchorOf(r.id);

    /* --- Free Peoples --- */
    const fpUnits = unitChips(r.id, "fp");          // 2.1: one chip per national contingent
    const fpFigs = st.comps.map(c => buildFig("fp", c));
    if (st.ent) fpFigs.push(buildCountFig("fp", "g-tree", st.ent, "Ent"));
    if (st.se && st.se.fp) fpFigs.push(buildCountFig("fp", "g-siege", st.se.fp, "Sge"));

    /* --- Shadow --- */
    const shUnits = unitChips(r.id, "sh");
    const shFigs = [];
    if (st.sh.l) shFigs.push(buildCountFig("sh", "g-naz", st.sh.l, "Naz"));
    if (balrogHere(r.id)) shFigs.push(buildCountFig("sh", "g-flame", 1, "Bal"));
    st.chars.forEach(c => shFigs.push(buildFig("sh", c)));
    if (st.dun) shFigs.push(buildCountFig("sh", "g-spear", st.dun, "Dun"));
    if (st.se && st.se.sh) shFigs.push(buildCountFig("sh", "g-siege", st.se.sh, "Sge"));
    if (st.ship) shFigs.push(buildCountFig("sh", "g-ship", st.ship, "Shp"));

    /* 2.2: under siege, the defender's counters go inside the walls and only the
       besieging army is left standing in the open field */
    const besieged = st.siege ? controller(r.id) : null;
    const rows = { fp: fpUnits, sh: shUnits };
    const figs = { fp: fpFigs, sh: shFigs };
    const keepItems = besieged ? rows[besieged].concat(figs[besieged]) : [];
    if (besieged) { rows[besieged] = []; figs[besieged] = []; }
    layoutKeep(tk, r.id, keepItems, besieged);

    /* rows stack outward from the cell's anchor */
    layoutRow(tk.querySelector(".figfp"), figs.fp, ax, ay - (rows.fp.length ? 25 : 12));
    layoutRow(tk.querySelector(".unitfp"), rows.fp, ax, ay - 11);
    layoutRow(tk.querySelector(".unitsh"), rows.sh, ax, ay + 11);
    layoutRow(tk.querySelector(".figsh"), figs.sh, ax, ay + (rows.sh.length ? 27 : 13));

    /* the name drops below whatever the Shadow has on the ground */
    const nameY = ay + 14 + (rows.sh.length ? 14 : 0) + (figs.sh.length ? (rows.sh.length ? 20 : 22) : 0);
    const mk = $("mk_" + r.id);
    const nameEl = mk.querySelector(".rname");
    if (+nameEl.getAttribute("y") !== nameY) nameEl.setAttribute("y", nameY);
    if (r.settle) mk.setAttribute("data-hold", controller(r.id) || "none");   // 2.6: the VP pips take the holder's colour

    /* territory colour follows who actually holds the ground, not just whose
       nation it belongs to — that is the whole point of drawing territory */
    const held = controller(r.id);
    const nat = r.nation ? DATA.nations[r.nation].side : null;
    g.setAttribute("data-side", held || nat || "none");
    g.setAttribute("data-nation", r.nation || "none");
    const cell = g.querySelector(".cell");                     // 2.1: paint the ground by nation
    if (cell) {
      const fill = territoryFill(r.id);
      if (cell.dataset.fill !== fill) { cell.style.fill = fill; cell.dataset.fill = fill; }
      cell.style.fillOpacity = r.nation ? 0.9 : 0.66;
    }
    g.classList.toggle("contested", !!(st.cap && held !== nat));
    g.classList.toggle("siege", !!st.siege);
    g.classList.toggle("target", !!(pick && pick.targets.has(r.id)));
    g.classList.toggle("sel", false);

    /* 4.4: hatch the ground the enemy could stand on, and hatch harder the ground
       it could actually fall on this turn */
    const lvl = threat ? (threat.atk.has(r.id) ? "atk" : threat.reach.has(r.id) ? "reach" : null) : null;
    g.classList.toggle("threat", !!lvl);
    const tp = g.querySelector(".threatcell");
    if (tp && lvl) {
      const fill = lvl === "atk" ? "url(#patAtk)" : "url(#patReach)";
      if (tp.getAttribute("fill") !== fill) tp.setAttribute("fill", fill);
    }
  });

  /* fellowship marker — built once, then glided to its new home */
  const gFS = $("gFS");
  const [fx, fy] = anchorOf(S.fs.loc);
  const fsAt = `translate(${fx - 22},${fy})`;
  let mark = gFS.querySelector(".fsmark");
  if (!mark) {
    mark = el("g", { class: "fsmark" }, gFS);
    el("circle", { class: "ring", cx: 0, cy: 0, r: 8, fill: "none", stroke: "#e8c96a", "stroke-width": 2.5 }, mark);
    el("circle", { class: "eye", cx: 0, cy: 0, r: 3, fill: "#e8c96a" }, mark);
    el("text", { class: "prog", x: 0, y: 17, fill: "#e8c96a", "font-size": 8, "font-weight": 700,
      "text-anchor": "middle" }, mark);
    mark.setAttribute("transform", fsAt);
  }
  if (lastFsLoc !== S.fs.loc) { mark.setAttribute("transform", fsAt); lastFsLoc = S.fs.loc; }
  mark.querySelector(".eye").setAttribute("fill", S.fs.revealed ? "#e05a3a" : "#e8c96a");
  mark.classList.toggle("revealed", !!S.fs.revealed);
  mark.querySelector(".prog").textContent = (S.fs.prog > 0 && S.fs.mordor < 0) ? "+" + S.fs.prog : "";
  refreshBadges();
}
/* 2.4: the four clocks that decide the game, drawn rather than typed.
   2.5: the Hunt Box shows the Free Peoples dice piling up beside the Eyes —
   the escalation was always in the rules (`bonus = movesThisTurn - 1`) but the
   old readout counted only Eyes, so a second Fellowship move looked free. */
function pipRow(n, total, cls) {
  let h = `<div class="pips">`;
  for (let i = 0; i < total; i++) h += `<span class="p${i < n ? " on " + cls : ""}"></span>`;
  return h + `</div>`;
}
function roundRow(n, cls, cap) {
  const shown = Math.min(n, cap || 8);
  let h = `<div class="pips round">`;
  for (let i = 0; i < shown; i++) h += `<span class="p ${cls}"></span>`;
  h += `</div>`;
  return n > shown ? h + `<span class="gv">+${n - shown}</span>` : h;
}
/* 4.2: four conditions, four bars, grouped by the side each one wins for, with
   the nearest to falling picked out. `Mordor` is drawn even before the Fellowship
   reaches the Black Gate — the road is a win condition whether or not it has been
   started, and hiding it until then hid half of the Free Peoples' plan. */
function refreshBadges() {
  if (HEADLESS) return;
  const fpv = vp("fp"), shv = vp("sh"), corr = S.fs.corr, mord = Math.max(0, S.fs.mordor);
  const clocks = [
    { k: "fp-vp", side: "fp", label: "Settle", n: fpv, of: 4, cls: "fp", note: "settlements taken" },
    { k: "fp-md", side: "fp", label: "Mordor", n: mord, of: 5, cls: "mord", note: "steps to Mount Doom" },
    { k: "sh-vp", side: "sh", label: "Settle", n: shv, of: 10, cls: "sh", note: "settlements taken" },
    { k: "sh-cr", side: "sh", label: "The Ring", n: corr, of: 12, cls: "corr", note: "corruption" },
  ];
  // whichever clock is furthest along is the one the next decision is really about
  let lead = clocks[0];
  clocks.forEach(c => { if (c.n / c.of > lead.n / lead.of) lead = c; });
  if (lead.n === 0) lead = null;
  const gauge = (label, inner, value, hot, crit, isLead) =>
    `<div class="gauge${hot ? " hot" : ""}${crit ? " crit" : ""}${isLead ? " lead" : ""}"><span class="gl wide">${label}</span>${inner}<span class="gv">${value}</span></div>`;
  const clock = c => gauge(c.label, pipRow(c.n, c.of, c.cls), 
    (c.k === "fp-md" && S.fs.mordor < 0) ? `–/5` : `${c.n}/${c.of}`,
    c.n / c.of >= 0.75, c.n / c.of >= 0.83, lead === c);
  $("vpBadge").innerHTML =
    `<div class="vptitle">Path to victory</div>` +
    `<div class="vpgrp fp">Free Peoples win on</div>` + clock(clocks[0]) + clock(clocks[1]) +
    `<div class="vpgrp sh">Shadow wins on</div>` + clock(clocks[2]) + clock(clocks[3]) +
    (lead ? `<div class="vpnote">Nearest: ${lead.n} of ${lead.of} ${lead.note}.</div>`
          : `<div class="vpnote">Nothing has yet moved. Tap for the rules.</div>`);

  // 2.5: Eyes and the Free Peoples dice already spent on the road, side by side
  const fpDice = S.fs.movesThisTurn || 0;
  const bonus = tableHas("fp", "WOTR_0055") ? 0 : fpDice;   // the next move's modifier
  $("huntBadge").innerHTML =
    gauge("Eyes", roundRow(S.hunt.box, "eyeon"), `${S.hunt.box}`, S.hunt.box >= 4) +
    gauge("Moves", roundRow(fpDice, "fpdie"), `${fpDice}`, false) +
    `<div class="hbnote">${S.fs.revealed ? "<b>Fellowship revealed</b>" : "Fellowship hidden"}` +
    (bonus > 0 ? `<br>Next move: <b>+${bonus}</b> to the Hunt roll` : "") + `</div>`;
  const ph = S.phase === "action"
    ? (isAI(S.actor) ? `${sideLabel(S.actor)} acts…` : (hotseat() ? `${sideLabel(S.actor)} to act` : "Your action"))
    : S.phase === "hunt" ? "Hunt allocation" : S.phase;
  $("turnLabel").textContent = `Turn ${S.turn} · ${ph}`;
  refreshHistoryButtons();
  sfxTick();       // 4.7: the board has been redrawn — say what changed
}
/* 4.6: an undo button that says nothing about its depth is a button you use
   once and then wonder about. It now carries how far back it can still go, and
   a redo appears beside it the moment there is something to put back. */
function refreshHistoryButtons() {
  const locked = busy || !!(S && S.over) || !!replay;
  const ub = $("btnUndo");
  if (ub) {
    const n = Math.max(0, undoStack.length - 1);
    ub.disabled = !canUndo() || locked;
    ub.innerHTML = `↶${n ? `&thinsp;${Math.min(n, 99)}` : ""}`;
    ub.title = n ? `Take back your last decision — ${n} step${n === 1 ? "" : "s"} of history kept` : "Nothing to take back yet";
  }
  const rb = $("btnRedo");
  if (rb) {
    const n = redoStack.length;
    rb.style.display = n ? "" : "none";
    rb.disabled = !n || locked;
    rb.innerHTML = `↷${n > 1 ? `&thinsp;${n}` : ""}`;
    rb.title = `Put back what you took back (${n})`;
  }
}

/* ---------------- pan / zoom / tap ----------------
   A region is only "tapped" when the pointer goes down and up on it having
   travelled less than TAP_SLOP and taken less than TAP_MS — otherwise the
   gesture was a pan and the region must not react. Nothing relies on a
   synthetic `click`, and nothing captures the pointer to the <svg> root,
   so region hits no longer depend on how a given engine retargets clicks. */
const TAP_SLOP = 8, TAP_MS = 700;
let gesture = null;   // { id, x, y, moved, t }
function bindRegionTap(g, rid) {
  g.addEventListener("pointerup", e => {
    if (!gesture || gesture.id !== e.pointerId) return;
    if (gesture.moved || performance.now() - gesture.t > TAP_MS) return;
    e.stopPropagation();
    tapRegion(rid);
  });
}
(() => {
  let ptrs = new Map(), last = null, pinch = null;
  svg.addEventListener("pointerdown", e => {
    ptrs.set(e.pointerId, e);
    if (ptrs.size === 1) {
      last = { x: e.clientX, y: e.clientY };
      gesture = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, t: performance.now() };
    } else gesture = null;   // a second finger is never a tap
  });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, e);
    if (gesture && gesture.id === e.pointerId && !gesture.moved &&
        Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y) > TAP_SLOP) gesture.moved = true;
    const arr = [...ptrs.values()];
    if (arr.length === 1 && last) {
      if (!gesture || gesture.moved) {          // don't nudge the map during a still finger
        const sc = VB.w / svg.clientWidth;
        VB.x -= (e.clientX - last.x) * sc; VB.y -= (e.clientY - last.y) * sc;
        applyVB();
      }
      last = { x: e.clientX, y: e.clientY };
    } else if (arr.length === 2) {
      const d = Math.hypot(arr[0].clientX - arr[1].clientX, arr[0].clientY - arr[1].clientY);
      if (pinch) zoomAt((arr[0].clientX + arr[1].clientX) / 2, (arr[0].clientY + arr[1].clientY) / 2, pinch / d);
      pinch = d;
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (!ptrs.size) last = null;
    /* cleared on the next frame so the region's own pointerup can read it first */
    if (gesture && gesture.id === e.pointerId) setTimeout(() => { gesture = null; }, 0);
  };
  svg.addEventListener("pointerup", up);
  svg.addEventListener("pointercancel", e => { gesture = null; up(e); });
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.12 : 0.9); }, { passive: false });
  function zoomAt(cx, cy, f) {
    const r = svg.getBoundingClientRect();
    const mx = VB.x + (cx - r.left) / r.width * VB.w, my = VB.y + (cy - r.top) / r.height * VB.h;
    VB.w = Math.min(2200, Math.max(260, VB.w * f)); VB.h = Math.min(2700, Math.max(320, VB.h * f));
    VB.x = mx - (cx - r.left) / r.width * VB.w; VB.y = my - (cy - r.top) / r.height * VB.h;
    applyVB();
  }
})();

/* ================= 3.2: BREADCRUMBS, AND A WAY BACK ONE STEP =================

  opts = opts || {};

  refreshMap();

  if (opts.step) {
    const [i, n] = opts.step;
    let dots = "";

  sheetBody.innerHTML = `<span class="phase-tag">Choose on map</span>${crumbs}<p class="note">${label}</p>
   <div class="btnrow wrap">${back}<button class="abtn subtle" onclick="cancelPick()">${opts.cancelLabel || "Cancel"}</button></div>`;
}
function cancelPick() { const oc = pick && pick.onCancel; clearPick(); if (oc) oc(); else renderSheet(); }
function pickBack() { const b = pick && pick.onBack; clearPick(); if (b) b(); else renderSheet(); }

/* ---------- P2: the alternating action driver ----------
   Both seats are treated identically: whoever is `S.actor` acts, then the
   turn passes to the other side if it still has dice. A human seat renders
   the action sheet; an AI seat is given a beat and then plays. */
let aiAsync = false;     // set when an AI action hands control to a modal flow (battle)
function stepTurn() {
  if (S.over) return renderSheet();
  settlePending();
  if (S.over || S.pendingHunt) return renderSheet();
  if (remaining("fp") === 0 && remaining("sh") === 0) {
    // 4.1: the Free Peoples hold four dice to the Shadow's seven, so the commonest
    // way for a turn to end is the enemy spending the last of them. Control never
    // came back to the player on that path, which meant the replay silently skipped
    // the most one-sided stretch of the turn. Show it, then close the turn.
    if (beginAIReplay(uiEndTurn)) return;
    return uiEndTurn();
  }
  if (remaining(S.actor) === 0) S.actor = otherSide(S.actor);
  selectedDie = null;
  if (isHuman(S.actor)) {
    busy = false;
    checkpoint();         // make this the point undo comes back to
    requestSeat(S.actor);
    // 4.1: walk the player through what the enemy just did, rather than only
    // flashing where it happened. Falls back to the flash when there is nothing
    // to tell, or when the player has turned the replay off.
    if (beginAIReplay()) return;
    flashAIChanges();
    return renderSheet();
  }
  busy = true; markAIStart(); renderSheet(); refreshBadges();
  const era = epoch;
  const go = () => {
    if (era !== epoch) return;             // an undo or a load overtook this move
    aiAsync = false;

    const who = S.actor;

    if (aiAsync) { if (aiJournal) aiJournal.pending = who; return; }   // a battle flow owns the thread now
    journalStep(who);
    busy = false; refreshMap();

    passTurn();

/* ================= 3.1: AFFORDANCES ON THE DIE, BEFORE COMMITMENT =================
   The old loop was: pick a die, pick an action, learn from a toast that there
   was no enemy within reach. Three taps to discover nothing. Every action's
   legality was already computable — `armiesOf`, `attackTargets`, `musterTargets`,
   `canAdvance` — so it is computed at render time instead. Each die carries a
   badge counting what it can actually do, dice that can do nothing are dimmed,
   and dead actions are shown disabled with the reason underneath rather than
   punishing the player for trying them.

   The results are cached for the life of one render; `affordReset()` drops the
   cache whenever the board or the dice change. */
let affordCache = null;
function affordReset() { affordCache = null; }
function anyArmyMove(side, needLead) {
  return armiesOf(side, needLead).some(r => moveTargets(r, side).length > 0 || attackTargets(r, side).length > 0);
}
function anyAttackFrom(side) {
  return armiesOf(side, false).some(r => attackTargets(r, side).length > 0);
}
function polOptions(side) {
  let opts = Object.keys(S.nations).filter(n => canAdvance(side, n));
  if (side === "fp" && tableHas("sh", "WOTR_0177")) opts = opts.filter(n => S.nations[n].active); // Threats and Promises
  return opts;
}
function musterOptions(side) {
  return musterTargets(side).filter(r => canPlaceUnit(side, r, "r") || canPlaceUnit(side, r, "e") || canPlaceUnit(side, r, "l"));
}
function roamingComps() { return mapComps().filter(x => !COMP[x.id].rb); }
function compsWithRoad() { return roamingComps().filter(x => regionsWithin(x.rid, compMove(x.id), true).length > 0); }

  return S.hands[side].filter(c => (!syms || syms.includes(cardDieSym(c))) && cardStatus(c).canPlay);
}
/* One option: {label, call, ok, why, cls}. `why` is what to tell the player when
   the action is closed to them — never a bare "you can't". */
function dieOptions(f, A) {
  const key = A + ":" + f;
  if (affordCache && affordCache[key]) return affordCache[key];
  const O = [];
  const add = (ok, why, label, call, cls) => O.push({ ok: !!ok, why: ok ? null : why, label, call, cls: cls || "" });
  const wild = f === "wow";

  if (A === "fp") {
    const fsInMordor = S.fs.mordor >= 0;
    if (f === "chr" || wild) {
      const canMoveFS = !(S.fs.revealed && !fsInMordor);
      add(canMoveFS, "the Fellowship is revealed — it must Hide before it moves again",
        `<b>Move the Fellowship</b> — advance ${fsInMordor ? "on the Mordor track" : "one step (risks the Hunt)"}.`, "actMoveFS()");
      add(S.fs.revealed, "the Fellowship is already hidden",
        `<b>Hide</b> the Fellowship (required before it can move again).`, "actHide()");
      add(S.fs.comps.length > 1 && !fsInMordor,
        fsInMordor ? "no one leaves the Fellowship once it is on the Mordor track" : "only the Ring-bearers remain — there is no one left to send",
        `<b>Separate a Companion</b> at ${REG[S.fs.loc].name}.`, "actSeparate()");
      const roam = roamingComps(), road = compsWithRoad();
      add(road.length, roam.length ? "every Companion abroad is hemmed in by Shadow armies" : "no Companion stands apart from the Fellowship",
        `<b>Move Companions on the map</b> — up to their level in regions${S.gandalfWhite ? " (Shadowfax bears the White Rider four)" : ""}.`, "actCompMove()");
      add(anyArmyMove("fp", true), armiesOf("fp", true).length ? "no led army has anywhere to march or anyone to strike" : "no army marches with a leader or Companion",
        `<b>Move / attack with a led army</b> (needs a leader or companion).`, "actArmy('lead')");
    }
    if (wild) { // C3: only the Will of the West can crown the King or recall the White Rider
      if (canCrownAragorn()) add(true, null, `<b>Crown Aragorn</b> — Strider becomes the King of Gondor (Lv 3, Leadership 2; +1 die from next turn).`, "actCrownAragorn()", "primary");
      if (canSummonGandalfWhite()) add(true, null, `<b>Gandalf the White returns</b> — place him in Fangorn or an Elven stronghold (+1 die from next turn).`, "actGandalfWhite()", "primary");
    }
  } else {

function playFromHand(i) {

      return;
    }
    playCardEffect(A, c); afterAction(); return; // includes table cards
  }
  const eff = scriptedEffect(c);
  if (eff === "politics") {
    const opts = Object.keys(S.nations).filter(n => canAdvance(A, n));
    if (!opts.length) return toast("No nation can advance.");
    playCardEffect(A, c, { nation: opts[0] }); afterAction(); return;
  }
  if (eff === "recruit") {
    const t = musterTargets(A).concat(DATA.regions.filter(r => r.nation && S.nations[r.nation].side === A && r.settle && controller(r.id) === A).map(r => r.id));
    const uniq = [...new Set(t)];

    startPick(uniq, `${c.t}: tap a settlement to muster 2 regulars.`, rid => { playCardEffect(A, c, { region: rid }); afterAction(); });

    return;
  }

}

/* ---------------- BATTLE (E2 combat-card flow) ---------------- */
/* P2: one loop drives every combination of seats. Combat cards are declared
   defender-first and revealed together; a human seat is prompted, an AI seat
   is asked for aiPickCombatCard(). Retreat belongs to the defender, pressing
   the assault to the attacker — each is offered to whoever holds that seat. */
function startBattleFlow(from, to) { newBattle(S.actor, from, to); battleLoop(); }

function battleLoop() {
  const B = S.battle;
  if (!B || B.over) return endBattle();
  // Round 0: an AI defender may withdraw a weak garrison behind its walls before blood is drawn
  if (B.round === 0 && !B.siege && isAI(B.def) && REG[B.to].settle === "s" && controller(B.to) === B.def &&
      units(B.to, B.def) > 0 && units(B.to, B.def) < units(B.from, B.att)) {
    defenderRetreatIntoSiege(); refreshMap();
    BUI.next = () => { closeModal(); endBattle(); };
    modal(`<h2>${REG[B.to].name}</h2><p>The ${sideLabel(B.def)} garrison withdraws behind the walls. The attacking army holds the field — assault the stronghold with a further Attack action (hits on 6s).</p>
     <div class="btnrow"><button class="abtn primary" onclick="BUI.next()">Continue</button></div>`);
    if (HEADLESS) return BUI.next();
    return;
  }
  chooseCombatCard(B.def, dres => {
    if (S.battle.over) return endBattle();      // Scouts and the like end the battle outright
    chooseCombatCard(B.att, ares => {
      const cards = { fpOpts: (B.def === "fp" ? dres.opts : ares.opts) || {} };
      cards[B.def] = dres.card || null;
      cards[B.att] = ares.card || null;
      battleRound(cards);
      refreshMap();
      showBattleModal(afterBattleRound);
    });
  });
}
function chooseCombatCard(side, cb) {
  if (isHuman(side)) return promptCombatCard(side, (card, opts) => cb({ card, opts: opts || {} }));
  const p = aiPickCombatCard(side);
  cb({ card: p && p.card, opts: {} });
}
function afterBattleRound() {
  const B = S.battle;
  if (B.over) { closeModal(); return endBattle(); }
  // an AI defender routs rather than be ground down
  if (isAI(B.def) && !B.noRetreat && units(B.to, B.def) * 2 < units(B.from, B.att)) {
    const outs = moveTargets(B.to, B.def, units(B.to, B.def));
    if (outs.length) { defenderRetreat(outs[0]); refreshMap(); closeModal(); return endBattle(); }
  }
  if (isAI(B.att)) {
    if (units(B.from, B.att) <= units(B.to, B.def)) {
      B.over = true; B.result = "ceased";
      log(B.att, `The ${sideLabel(B.att)} assault falters and withdraws.`);
      closeModal(); return endBattle();
    }
    closeModal(); return battleLoop();
  }
  // human attacker: if the roll modal already offered press/cease they have answered
  if (BUI.attAsked) { closeModal(); return battleLoop(); }
  askPressAttack();
}
function askPressAttack() {

/* ================= 3.3: THE ODDS, BEFORE YOU COMMIT TO THEM =================
   The prompt asked a player to spend their one good Combat card while showing
   neither side's strength. This mirrors the arithmetic battleRound() is about to
   do — dice, hit number, siege modifier, leadership re-rolls — and turns it into
   an expected number of hits. It reads state only; nothing here rolls anything. */
function battleForecast(B) {
  const settle = REG[B.to].settle;
  // battleRound increments the round before it computes, so the coming round is B.round + 1
  const coming = B.round + 1;
  let attHitOn = 5, why = null;
  if (B.siege) { attHitOn = 6; why = "Assaulting the walls: the attacker hits only on 6."; }
  else if ((settle === "c" || settle === "f") && coming === 1 && controller(B.to) === B.def) {
    attHitOn = 6;
    why = `The ${settle === "c" ? "city" : "fortification"} holds the first round: the attacker hits only on 6.`;
  }
  const hitOn = { [B.att]: attHitOn, [B.def]: 5 };
  const line = side => {
    const rid = side === "fp" ? fpBattleRegion(B) : shBattleRegion(B);
    const u = S.reg[rid][side];
    let raw = u.r + u.e;
    if (side === "sh") raw += dunCount(rid) + balrogStrength(rid);
    else raw += entStrength(rid);
    if (B.siege && side === B.att) raw += seCount(rid, side);
    const dice = Math.max(1, Math.min(5, raw));
    const lead = Math.min(5, side === "fp" ? fpLeadIn(B) : shLeadIn(B));
    const need = hitOn[side], p = (7 - need) / 6;
    const rerolls = Math.min(lead, dice * (1 - p));           // you may only re-roll dice that missed
    const exp = dice * p + rerolls * p;
    return { side, raw, dice, lead, need, exp, capped: raw > 5 };
  };
  return { att: line(B.att), def: line(B.def), note: why, attHitOn };
}
function oddsHTML(B) {
  const F = battleForecast(B);
  const row = (L, role) => `<div class="orow">
      <span class="oside ${L.side}">${sideLabel(L.side)}</span>
      <span class="odetail">${role} · <b>${L.dice}</b> combat ${L.dice === 1 ? "die" : "dice"}${L.capped ? ` (${L.raw} strong, five is the most any army rolls)` : ""},
        hitting on <b>${L.need}+</b>${L.lead ? `, with <b>${L.lead}</b> Leadership to re-roll misses` : ", with no Leadership to re-roll misses"}</span>
      <span class="oexp" title="Expected hits this round, before either Combat card">≈${L.exp.toFixed(1)}</span>
    </div>`;
  return `<div class="odds">${row(F.att, "attacking")}${row(F.def, "defending")}` +
    (F.note ? `<div class="onote">${F.note}</div>` : "") +
    `<div class="onote">Expected hits are the bare arithmetic of dice and Leadership — no card played, either side.</div></div>`;
}

/* Prompt a human seat for one combat card (or none) for the current round. */
function promptCombatCard(side, cb) {
  const B = S.battle;
  if (side === "fp" && B.noFPCard1 && B.round === 0 && battleComps(B).length === 0) return cb(null); // Grond / Uruk-hai assault
  const opts = combatOptions(side, B);              // 3.4: unplayable cards stay on show, with their reason
  const list = opts.filter(o => o.ok).map(o => o.c); // the index BUI.pickCard uses
  const cards = opts.map(o => {

function showBattleModal(next) {

  }
  html += `<p>Attacker (${R.aRoll.hits} hit${R.aRoll.hits === 1 ? "" : "s"}):</p>${pipRow(R.aRoll, R.attHitOn, R.aBonus, false, B.att === "sh")}
   <p>Defender (${R.dRoll.hits} hit${R.dRoll.hits === 1 ? "" : "s"}):</p>${pipRow(R.dRoll, R.defHitOn, R.dBonus, false, B.def === "sh")}</div>`;

    html += `<p><b>${msg}</b></p><div class="btnrow"><button class="abtn primary" onclick="BUI.next()">Continue</button></div>`;
  } else if (isHuman(B.def)) {

    html += casControlHTML(casSide, `${sideLabel(casSide)} casualties — applies from the next round`);
    const canSiege = REG[B.to].settle === "s" && controller(B.to) === B.def;
    const outs = B.noRetreat ? [] : moveTargets(B.to, B.def, units(B.to, B.def));
    html += `<div class="btnrow"><button class="abtn primary" onclick="BUI.next()">Stand and fight</button>
      ${canSiege ? `<button class="abtn" onclick="BUI.siege()">Retreat into the stronghold (siege)</button>` : ""}
      ${outs.length ? `<button class="abtn subtle" onclick="BUI.retreat()">Retreat</button>` : ""}</div>`;
    BUI.siege = () => { defenderRetreatIntoSiege(); refreshMap(); closeModal(); endBattle(); };
    BUI.retreat = () => { closeModal(); startPick(outs, "Retreat: tap a region.", to => { defenderRetreat(to); refreshMap(); endBattle(); }); };
  } else if (isHuman(B.att)) {

     `<div class="btnrow"><button class="abtn primary" onclick="BUI.next()">Press the attack</button>

  } else {
    html += `<div class="btnrow"><button class="abtn primary" onclick="BUI.next()">Continue</button></div>`;
  }
  modal(html);
  SFX.play("clash");

/* ================= 3.6: THE CASUALTY RULE, IN PLAIN LANGUAGE =================
   "Downgrade elites first" / "lose regulars first" is jargon, and it was a small
   text button appearing mid-battle, which is the worst moment to meet a rule for
   the first time. It is now a named preference with its consequence attached,
   chosen once in setup and overridable in any battle. */
const CAS_MODE = {
  downgrade: { name: "Keep the army's size", note: "Hits knock elites down to regulars before anyone dies — the host stays as big, but loses its quality." },
  regulars: { name: "Keep the army's quality", note: "Regulars fall first and your elites fight on — the host keeps its edge, but shrinks faster." },
};
function casLabel(side) { return CAS_MODE[S.casPolicy[side || "fp"]].name; }
function casControlHTML(side, label) {

      <b>${CAS_MODE[k].name}</b>${CAS_MODE[k].note}</button>`;
  return `<div class="casbox" id="casBox_${side}">
    <div class="caslab">${label || "Casualties"}
      <button class="helplink" onclick="openHelp('casualties')">what this means</button></div>
    <div class="casopts">${opt("downgrade")}${opt("regulars")}</div>
  </div>`;
}
function setCas(side, mode) {
  side = side || "fp";
  S.casPolicy[side] = mode;
  const box = $("casBox_" + side);
  if (box) box.outerHTML = casControlHTML(side, box.querySelector(".caslab").childNodes[0].textContent.trim());
}
function toggleCas(side) {   // legacy entry point: flip to the other mode

}
/* ---------------- ARTIFICIAL OPPONENTS ----------------
   P2: aiAction(side) dispatches to a per-side brain. Both read their
   difficulty knobs from D(side), so the same routine plays cautiously or
   ruthlessly without branching everywhere. */
function aiAction(side) {
  if (S.over) return;
