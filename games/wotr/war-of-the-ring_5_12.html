}
function aiChain() { if (S.over) return; aiAction(S.actor); refreshMap(); renderSheet(); }

function aiAllocateHunt() {
  const K = D("sh");
  const maxAlloc = huntAllocMax();
  let n = 1;
  if (S.fs.movesThisTurn > 0 || S.turn > 1) n = 2;
  if (S.fs.corr >= 7 || S.fs.mordor >= 0) n = 3;
  if (S.turn === 1) n = 1;
  n = Math.min(n + (K.huntPush - 1), K.huntCap);
  return Math.max(0, Math.min(n, maxAlloc));
}
function fpSettlements() { return DATA.regions.filter(r => r.settle && r.nation && S.nations[r.nation].side === "fp" && controller(r.id) === "fp"); }
function shSettlements() { return DATA.regions.filter(r => r.settle && r.nation && S.nations[r.nation].side === "sh" && controller(r.id) === "sh"); }
function bfsNext(from, goals) {
  const goalSet = new Set(goals);
  const prev = { [from]: null }; const q = [from];
  while (q.length) {
    const c = q.shift();
    if (goalSet.has(c) && c !== from) { let n = c; while (prev[n] !== from) n = prev[n]; return n; }
    for (const a of REG[c].adj) if (!(a in prev)) { prev[a] = c; q.push(a); }
  }
  return null;
}
function bfsDist(from, goals) {
  const g = new Set(goals); const dist = { [from]: 0 }; const q = [from];
  while (q.length) { const c = q.shift(); if (g.has(c)) return dist[c]; for (const a of REG[c].adj) if (!(a in dist)) { dist[a] = dist[c] + 1; q.push(a); } }
  return 99;
}
function mordorDist(rid) { return Math.min(bfsDist(rid, ["morannon"]), bfsDist(rid, ["minas_morgul"])); }

/* ================= THE SHADOW ================= */
function aiShadowAction() {
  const K = D("sh");
  const dice = S.dice.sh.filter(d => !d.used);
  if (!dice.length) return;
  const has = f => dice.find(d => d.f === f);
  const spend = d => {
    d.used = true;
    if (d.f === "chr" && tableHas("sh", "WOTR_0235")) { S.hunt.box++; log("sh", `<b>Captain of Despair</b> — the Hunt Box swells (${S.hunt.box}).`); }
  };

  // C4: a stolen Elven Ring turns a die to the Eye when the Hunt is worth pressing
  if (K.ringUse && S.rings.sh > 0 && !S.ringUsed.sh && (S.fs.mordor >= 0 || S.fs.corr >= K.ringCorr || S.fs.movesThisTurn > 0)) {
    const d = dice.find(x => x.f !== "eye");
    if (d) {
      d.used = true; d.f = "eye"; S.hunt.box++;
      S.rings.sh--; S.rings.out++; S.ringUsed.sh = true;
      log("sh", `The Shadow spends an <b>Elven Ring</b> — another Eye turns to the Hunt (${S.hunt.box} in the Hunt Box).`);
      return;
    }
  }

  // C2: the Mouth of Sauron may use a Muster die to move or attack with his army, once per turn
  if (!S.mouthActed && S.minions.mouth) {
    const musD = has("mus") || has("ma");
    const rid = charAt("mouth");
    if (musD && rid && units(rid, "sh") >= 2) {
      let best = null;
      attackTargets(rid, "sh").forEach(to => {
        const my = units(rid, "sh"), their = units(to, "fp");
        const wall = REG[to].settle === "s" ? 1.8 : REG[to].settle ? 1.3 : 1;
        if (my > their * wall * K.attackEdge && (!best || their < best.their)) best = { to, their };
      });
      if (best) {
        S.mouthActed = true; spend(musD);
        log("sh", `<b>The Mouth of Sauron</b> wields the Muster of Mordor as a whip of war.`);
        return aiBattle(rid, best.to);
      }
    }
  }

  // 1. Attack if favourable
  const atkDie = has("arm") || has("ma") || has("chr");
  if (atkDie && atWar("sh")) {
    let best = null;
    armiesOf("sh", atkDie.f === "chr").forEach(from => {
      attackTargets(from, "sh").forEach(to => {
        const my = units(from, "sh"), their = units(to, "fp");
        const wall = REG[to].settle === "s" ? 1.8 : REG[to].settle ? 1.3 : 1;
        const prize = (REG[to].settle === "s" ? 2 : REG[to].settle === "c" ? 1 : 0) * K.vpPush;
        const score = my - their * wall + prize + (to === S.fs.loc ? 0.5 : 0);
        if (my >= K.minHost && my > their * wall * K.attackEdge && (!best || score > best.score)) best = { from, to, score };
      });
    });
    if (best) { spend(atkDie); return aiBattle(best.from, best.to); }
  }
  // 1.5 (C1): a Character die sends a Nazgûl to shadow the Ring-bearers, or to stiffen the spearhead
  const chrDie = has("chr");
  if (chrDie) {
    if (S.fs.mordor < 0 && nazAt(S.fs.loc) === 0 && nazCanEnter(S.fs.loc) && !S.reg[S.fs.loc].chars.includes("witch_king")) {
      const from = Object.keys(S.reg).find(r => S.reg[r].sh.l > 1 && r !== S.fs.loc) ||
                   Object.keys(S.reg).find(r => S.reg[r].sh.l > 0 && units(r, "sh") === 0 && r !== S.fs.loc);
      if (from) { spend(chrDie); flyNazgul(from, S.fs.loc, 1); return; }
    }
    const goals = fpSettlements().map(r => r.id);
    if (goals.length) { // gather stray Nazgûl onto the largest host without a wraith
      const host = armiesOf("sh", false).filter(r => S.reg[r].sh.l === 0 && units(r, "sh") >= 4)
        .sort((a, b) => bfsDist(a, goals) - bfsDist(b, goals))[0];
      const stray = Object.keys(S.reg).find(r => S.reg[r].sh.l > 0 && units(r, "sh") === 0 && r !== S.fs.loc);
      if (host && stray && nazCanEnter(host)) { spend(chrDie); flyNazgul(stray, host, S.reg[stray].sh.l); return; }
    }
  }
  // 2. Muster: minions, politics, recruits
  const musDie = has("mus") || has("ma");
  if (musDie) {
    const m = MINIONS.find(m => minionAvailable(m.id));
    if (m) { spend(musDie); summonMinion(m.id); return; }
    const nat = ["sauron", "isengard", "southrons"].find(n => S.nations[n].step > 0);
    if (nat) { spend(musDie); advanceNation(nat); return; }
    const t = musterTargets("sh");
    if (t.length) {
      // C1: sometimes raise a fresh Nazgûl instead of troops
      const nazSpot = t.find(r => REG[r].nation === "sauron" && REG[r].settle === "s");
      if (nazSpot && S.pools.sauron.l > 0 && nazTotalOnMap() < 4 && rnd(3) === 0) {
        spend(musDie);
        recruitAt("sh", nazSpot, "l");
        log("sh", `A <b>Nazgûl</b> rises at <b>${REG[nazSpot].name}</b>.`);
        return;
      }
      const goals = fpSettlements().map(r => r.id);
      t.sort((a, b) => (bfsDist(a, goals) - bfsDist(b, goals)));
      const rid = t[0]; const pool = S.pools[REG[rid].nation];
      spend(musDie);
      if (pool.e > 0 && rnd(2) && canPlaceUnit("sh", rid, "e")) {
        recruitOne("sh", rid, "e");
        log("sh", `The Shadow musters an elite at <b>${REG[rid].name}</b>.`);
      } else {
        recruitOne("sh", rid, "r");
        const rid2 = t.find(r => r !== rid && canPlaceUnit("sh", r, "r")); // P0-1: the second regular goes to a different settlement
        if (rid2) { recruitOne("sh", rid2, "r"); log("sh", `The Shadow musters at <b>${REG[rid].name}</b> and <b>${REG[rid2].name}</b>.`); }
        else log("sh", `The Shadow musters a regular at <b>${REG[rid].name}</b>.`);
      }
      return;
    }
  }
  // 3. March toward the nearest Free Peoples settlement
  const mvDie = has("arm") || has("ma") || has("chr");
  if (mvDie) {
    const goals = fpSettlements().map(r => r.id);
    if (goals.length) {
      const armies = armiesOf("sh", mvDie.f === "chr").filter(r => units(r, "sh") >= 2);
      armies.sort((a, b) => units(b, "sh") - units(a, "sh"));
      for (const from of armies) {
        const nxt = bfsNext(from, goals);
        if (nxt && moveTargets(from, "sh", 1).includes(nxt)) {
          const u = S.reg[from].sh;
          let take = { r: u.r, e: u.e, l: u.l };
          // a cautious Shadow leaves a stronger garrison behind in its own strongholds
          const garrison = REG[from].settle === "s" && REG[from].nation && S.nations[REG[from].nation].side === "sh"
            ? K.garrison : 0;
          if (garrison && u.r + u.e > garrison) take = { r: Math.max(0, u.r - garrison), e: u.e, l: u.l };
          const rm = room(nxt, "sh");
          while (take.r + take.e > rm) { if (take.r > 0) take.r--; else if (take.e > 0) take.e--; else break; }
          if (take.r + take.e > 0) { spend(mvDie); moveArmy(from, nxt, "sh", take); return; }
        }
      }
    }
  }
  // 4. Event die: play a fully implemented card, else generic play, else draw
  const evtDie = has("evt");
  if (evtDie) {
    spend(evtDie);
    const regC = chance(K.cardChance)
      ? S.hands.sh.find(c => { const R = CARD_FX[c.id]; return R && !R.blocked && !R.ui && R.can() && (!R.aiWants || R.aiWants()); })
      : null;
    if (regC) {
      const R = CARD_FX[regC.id];
      const opts = {};
      if (R.needs === "region") opts.region = R.targets()[0];
      if (R.needs === "nation") opts.nation = R.targets()[0];
      if (R.needs === "comp") opts.comp = R.targets()[0];
      playCardEffect("sh", regC, opts);
      if (tableHas("sh", "WOTR_0146")) { drawCard("sh", rnd(2) ? "chr" : "str"); log("sh", "<b>The Palantír of Orthanc</b> — the Shadow draws a card."); } // E3
      return;
    }
    const playable = S.hands.sh.find(c => { const e = scriptedEffect(c); return e && e !== "combat" && !CARD_FX[c.id]; });
    if (playable && S.hands.sh.length > 2) {
      const eff = scriptedEffect(playable);
      if (eff === "politics") { const n = ["sauron", "isengard", "southrons"].find(n => S.nations[n].step > 0); playCardEffect("sh", playable, { nation: n }); if (!n) log("sh", "…to no effect."); }
      else if (eff === "recruit") { const t = musterTargets("sh"); playCardEffect("sh", playable, { region: t[0] }); }
      else playCardEffect("sh", playable);
    } else { drawCard("sh", rnd(2) ? "chr" : "str"); log("sh", "The Shadow draws an Event card."); }
    return;
  }
  // 5. fallback: any die → draw
  spend(dice[0]); drawCard("sh", "str"); log("sh", "The Shadow bides its time.");
}

/* ================= THE FREE PEOPLES =================
   The Free Peoples brain has four jobs: walk the Ring-bearers to Mordor
   without burning out, keep corruption survivable, rouse and defend the
   realms, and know when showing the Fellowship buys more than it costs. */
function aiFpDeclareChoice() {
  const t = declareTargets(); if (!t.length) return null;
  const fs = S.fs, K = D("fp");
  if (fs.mordor >= 0) return null;                       // already on the last road
  const gates = t.filter(r => r === "morannon" || r === "minas_morgul");
  if (gates.length && fs.corr <= K.fpGateCorr) {         // the Black Gate: take it only when the run is survivable
    gates.sort((a, b) => S.reg[a].sh.r + S.reg[a].sh.e - (S.reg[b].sh.r + S.reg[b].sh.e));
    return gates[0];
  }
  const cur = mordorDist(fs.loc);
  const havens = t.filter(r => {
    const R = REG[r];
    return (R.settle === "c" || R.settle === "s") && R.nation && S.nations[R.nation].side === "fp" && controller(r) === "fp";
  });
  if (fs.corr >= K.fpHeal && havens.length) {            // rest and heal, preferring a haven nearer Mordor
    havens.sort((a, b) => mordorDist(a) - mordorDist(b));
    return havens[0];
  }
  let best = null;                                        // otherwise only show ourselves for real ground gained
  t.forEach(r => { const gain = cur - mordorDist(r); if (gain >= K.fpDeclareGain && (!best || gain > best.gain)) best = { r, gain }; });
  return best ? best.r : null;
}
function aiFpShouldMoveFS() {
  const fs = S.fs, K = D("fp");
  if (fs.revealed && fs.mordor < 0) return false;
  const room = 12 - fs.corr;
  if (fs.mordor >= 0) return room > 1;                    // on the Mordor track every step is progress; only stop at the brink
  if (room <= 1) return false;
  // rough expected damage: dice in the Hunt Box, harder on repeat moves
  const n = Math.min(5, S.hunt.box);
  const bonus = fs.movesThisTurn;
  const pHit = Math.max(0, Math.min(1, (1 + bonus) / 6));
  const expected = n * pHit * 1.6;
  return expected < room * K.fpRisk;
}
function aiFreeAction() {
  const K = D("fp");
  let dice = S.dice.fp.filter(d => !d.used);
  if (!dice.length) return;
  const has = f => dice.find(d => d.f === f);
  const spend = d => { d.used = true; };

  // 0. an Elven Ring buys the face the Ring-bearers need
  if (K.ringUse && S.rings.fp > 0 && !S.ringUsed.fp && !has("chr") && !has("wow") &&
      !S.fs.revealed && (aiFpShouldMoveFS() || S.fs.mordor >= 0)) {
    const d = dice.find(x => x.f !== "chr");
    if (d) {
      d.f = "chr"; S.rings.fp--; S.rings.sh++; S.ringUsed.fp = true;
      log("fp", "An <b>Elven Ring</b> is spent — a die becomes <b>Character</b>. The Ring passes to the Shadow.");
    }
  }
  const wild = has("wow");
  // 1. Will of the West: the King and the White Rider
  if (wild) {
    if (canCrownAragorn()) { spend(wild); crownAragorn(); return; }
    if (canSummonGandalfWhite()) { const spots = gandalfWhiteSpots(); spend(wild); summonGandalfWhite(spots[0]); return; }
  }
  // 2. Character die: the Ring-bearers come first
  const chrDie = has("chr") || wild;
  if (chrDie) {
    if (S.fs.revealed && S.fs.mordor < 0) {
      spend(chrDie); S.fs.revealed = false; log("fp", "The Fellowship melts back into hiding."); return;
    }
    if (aiFpShouldMoveFS()) { spend(chrDie); moveFellowship(); return; }
    // set up the crowning: Strider steps aside in a great city of Gondor
    if (!S.aragorn && S.fs.comps.includes("strider") && S.fs.mordor < 0 &&
        ["minas_tirith", "pelargir", "dol_amroth"].includes(S.fs.loc) && controller(S.fs.loc) === "fp") {
      spend(chrDie); separateCompanion("strider"); return;
    }
    // a Companion abroad rides to rouse a realm
    const stray = mapComps().filter(x => !COMP[x.id].rb);
    if (stray.length) {
      for (const x of stray) {
        const dests = regionsWithin(x.rid, compMove(x.id), true).filter(to => {
          const r = REG[to];
          return (r.settle === "c" || r.settle === "s") && r.nation && S.nations[r.nation].side === "fp" &&
            controller(to) === "fp" && !S.nations[r.nation].active;
        });
        if (dests.length) {
          spend(chrDie);
          const to = dests[0];
          S.reg[x.rid].comps = S.reg[x.rid].comps.filter(y => y !== x.id);
          S.reg[to].comps.push(x.id);
          log("fp", `<b>${compName(x.id)}</b> rides to ${REG[to].name}.`);
          activateNation(REG[to].nation, `${compName(x.id)}'s counsel`, true);
          checkAragorn();
          return;
        }
      }
    }
  }
  // 3. Muster die: rouse the realms, then reinforce the threatened marches
  const musDie = has("mus") || has("ma") || wild;
  if (musDie) {
    const order = ["gondor", "rohan", "north", "elves", "dwarves"];
    const nat = order.find(n => canAdvance("fp", n) && (S.nations[n].active || S.nations[n].step > 1) &&
      !(tableHas("sh", "WOTR_0177") && !S.nations[n].active));
    if (nat && (S.nations[nat].step > 1 || rnd(3) < 2)) { spend(musDie); advanceNation(nat); return; }
    const t = musterTargets("fp");
    if (t.length) {
      const shGoals = armiesOf("sh", false);
      t.sort((a, b) => bfsDist(a, shGoals) - bfsDist(b, shGoals));
      const rid = t.find(r => canPlaceUnit("fp", r, "e")) && rnd(3) === 0 ? t.find(r => canPlaceUnit("fp", r, "e")) : t.find(r => canPlaceUnit("fp", r, "r"));
      if (rid) {
        spend(musDie);
        if (canPlaceUnit("fp", rid, "e") && rnd(3) === 0) { recruitOne("fp", rid, "e"); log("fp", `An elite company musters at <b>${REG[rid].name}</b>.`); }
        else {
          recruitOne("fp", rid, "r");
          const rid2 = t.find(r => r !== rid && canPlaceUnit("fp", r, canPlaceUnit("fp", r, "l") && rnd(2) ? "l" : "r"));
          if (rid2) { recruitOne("fp", rid2, canPlaceUnit("fp", rid2, "l") && rnd(2) ? "l" : "r"); log("fp", `The free lands muster at <b>${REG[rid].name}</b> and <b>${REG[rid2].name}</b>.`); }
          else log("fp", `The free lands muster at <b>${REG[rid].name}</b>.`);
        }
        return;
      }
    }
  }
  // 4. Army die: strike a weak besieger, else concentrate on the threatened settlements
  const armDie = has("arm") || has("ma") || wild || has("chr");
  if (armDie) {
    if (atWar("fp")) {
      let best = null;
      armiesOf("fp", armDie.f === "chr").forEach(from => {
        attackTargets(from, "fp").forEach(to => {
          const my = units(from, "fp") + leadership(from, "fp") * 0.5, their = units(to, "sh");
          const wall = REG[to].settle === "s" && controller(to) === "sh" ? 1.8 : 1;
          const relief = S.reg[to].siege ? 1.5 : 0;   // breaking a siege of our own walls is worth a risk
          const score = my - their * wall + relief;
          if (my > their * wall * K.fpAttackEdge && (!best || score > best.score)) best = { from, to, score };
        });
      });
      if (best) { spend(armDie); return aiBattle(best.from, best.to, null, "fp"); }
    }
    // fall back to concentrating: march the nearest army to the most threatened friendly settlement
    const threatened = fpSettlements().filter(r => REG[r.id].adj.some(a => units(a, "sh") > 0) || units(r.id, "sh") > 0)
      .map(r => r.id);
    const goals = threatened.length ? threatened : fpSettlements().map(r => r.id);
    if (goals.length) {
      const armies = armiesOf("fp", armDie.f === "chr").filter(r => units(r, "fp") >= 1 && !goals.includes(r));
      armies.sort((a, b) => bfsDist(a, goals) - bfsDist(b, goals));
      for (const from of armies) {
        const nxt = bfsNext(from, goals);
        if (nxt && moveTargets(from, "fp", 1).includes(nxt)) {
          const u = S.reg[from].fp;
          let take = { r: u.r, e: u.e, l: u.l };
          const rm = room(nxt, "fp");
          while (take.r + take.e > rm) { if (take.r > 0) take.r--; else if (take.e > 0) take.e--; else break; }
          if (take.r + take.e > 0) { spend(armDie); moveArmy(from, nxt, "fp", take); return; }
        }
      }
    }
  }
  // 5. Event die: heal, muster or rouse from the hand; otherwise draw
  const evtDie = has("evt") || wild;
  if (evtDie) {
    spend(evtDie);
    const scored = S.hands.fp.map(c => ({ c, s: aiFpCardScore(c) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
    if (scored.length && chance(K.cardChance)) {
      const c = scored[0].c, R = CARD_FX[c.id];
      const opts = {};
      if (R && R.needs === "region") opts.region = R.targets()[0];
      if (R && R.needs === "nation") opts.nation = R.targets()[0];
      if (R && R.needs === "comp") opts.comp = R.targets()[0];
      if (!R) { // generic scripted effect
        const eff = scriptedEffect(c);
        if (eff === "politics") opts.nation = Object.keys(S.nations).find(n => canAdvance("fp", n));
        if (eff === "recruit") opts.region = musterTargets("fp")[0];
      }
      playCardEffect("fp", c, opts);
      return;
    }
    const c = drawCard("fp", S.decks.fp_chr.length >= S.decks.fp_str.length ? "chr" : "str");
    log("fp", c ? "The free lands take counsel — an Event card is drawn." : "The deck is spent.");
    return;
  }
  // 6. fallback
  spend(dice[0]); drawCard("fp", "str"); log("fp", "The free lands hold their breath.");
}
function aiFpCardScore(c) {
  const R = CARD_FX[c.id];
  if (COMBAT_FX[c.id]) return 0;                       // saved for battle
  if (R) {
    if (R.blocked || R.ui || !R.can()) return 0;
    let s = 2;
    if (/heal/i.test(c.x || "")) s += S.fs.corr * 1.5;
    if (R.table) s += 3;
    if (c.fl && c.fl.recruitment) s += 2 + (atWar("fp") ? 1 : 0);
    if (c.fl && c.fl.political_track) s += 3;
    return s;
  }
  const eff = scriptedEffect(c);
  if (!eff || eff === "combat") return 0;
  if (eff === "heal") return 1 + S.fs.corr;
  if (eff === "hunt-") return 1 + S.hunt.box;
  if (eff === "politics") return Object.keys(S.nations).some(n => canAdvance("fp", n)) ? 3 : 0;
  if (eff === "recruit") return musterTargets("fp").length ? 3 : 0;
  return 1;
}

/* ---------------- shared battle helpers ---------------- */
function aiBattle(from, to, opts) {
  aiAsync = true;
  newBattle(S.actor, from, to, opts);
  battleLoop();
}
/* AI combat-card choice: the Balrog leaps from the table near Moria, else the best playable card. */
const COMBAT_PRIORITY = {
  sh: ["WOTR_0192", "WOTR_0173", "WOTR_0237", "WOTR_0153", "WOTR_0174", "WOTR_0126", "WOTR_0132", "WOTR_0122", "WOTR_0244", "WOTR_0113", "WOTR_0129", "WOTR_0124", "WOTR_0211", "WOTR_0167", "WOTR_0168", "WOTR_0139", "WOTR_0184", "WOTR_0176"],
  fp: ["WOTR_0033", "WOTR_0013", "WOTR_0023", "WOTR_0028", "WOTR_0085", "WOTR_0145", "WOTR_0041", "WOTR_0049", "WOTR_0051", "WOTR_0059", "WOTR_0104", "WOTR_0016", "WOTR_0005", "WOTR_0057", "WOTR_0062", "WOTR_0039", "WOTR_0070", "WOTR_0014", "WOTR_0068", "WOTR_0031", "WOTR_0226", "WOTR_0227"],
};
function aiPickCombatCard(side) {
  side = side || "sh";
  const B = S.battle;
  const K = D(side);
  if (side === "sh" && tableHas("sh", "WOTR_0144") && B.att === "sh" && bfsDist(B.to, ["moria"]) <= 2) {
    const c = S.table.sh.find(x => x.id === "WOTR_0144");
    return { card: { ...c, fromTable: true } };
  }
  const list = combatPlayable(side, B);
  if (!list.length) return null;
  const priority = COMBAT_PRIORITY[side] || [];
  const pick = priority.map(id => list.find(c => cardCanon(c.id) === id)).find(Boolean) || list[0];
  const mine = side === "fp" ? fpBattleRegion(B) : shBattleRegion(B);
  const stakes = REG[B.to].settle || units(mine, side) >= 4 || (side === "fp" && S.reg[fpBattleRegion(B)].comps.length > 0);
  if (!stakes && !chance(K.combatCards * 0.5)) return null;
  if (!chance(K.combatCards)) return null;
  return { card: pick }; // battleRound() consumes/discards it
}

/* ---------------- automatic Hunt resolution (AI Free Peoples) ---------------- */
function aiHuntStep() {
  const P = S.pendingHunt;
  if (!P) return;
  const K = D("fp");
  if (P.stage === "staff") { // Wizard's Staff: spend it only against a heavy blow
    const ctx = P.ctx; S.pendingHunt = null;
    if (S.hunt.box >= 3 || S.fs.corr >= 8) {
      tableDiscard("fp", "WOTR_0012", "— the staff is spent turning aside the Hunt");
      log("fp", "<b>Gandalf turns aside the Hunt</b> — no tile is drawn.");
      return;
    }
    drawAndResolveTile(ctx);
    return;
  }
  // spend Fellowship gear before flesh
  const gear = (id, cond, why) => {
    if (P.dmg > 0 && tableHas("fp", id) && cond) { tableDiscard("fp", id, why); P.dmg = Math.max(0, P.dmg - 1); log("fp", "The blow is blunted (−1 Hunt damage)."); }
  };
  if (P.dmg >= 2 || S.fs.corr + P.dmg >= 9) {
    gear("WOTR_0010", S.fs.comps.includes("gimli") || S.fs.comps.includes("legolas"), "— Gimli and Legolas spend themselves in the Ring-bearer's defence");
    gear("WOTR_0011", S.fs.comps.includes("boromir"), "— Boromir's horn rings out one last time");
  }
  if (S.fs.guide === "gollum" && P.dmg > 0 && !P.reveal && !P.gollumUsed && S.fs.mordor < 0 && !S.fs.revealed && S.fs.corr + P.dmg >= 8) {
    P.gollumUsed = true; P.reveal = true; P.dmg = Math.max(0, P.dmg - 1);
    log("fp", "<b>Gollum</b> leads the Ring-bearers off the hunted road — but eyes have seen them (−1 Hunt damage, the Fellowship will be revealed).");
  }
  const opts = P.only ? [P.only] : (P.corrOnly ? [] : S.fs.comps.filter(c => !COMP[c].rb));
  let pick = "corr";
  if (opts.length && P.dmg > 0) {
    const room = 12 - S.fs.corr;
    const lethal = P.dmg >= room;
    const heavy = S.fs.corr + P.dmg >= Math.round(12 * K.fpRisk);
    if (lethal || heavy) {
      const sorted = opts.slice().sort((a, b) => compLvl(a) - compLvl(b));
      pick = sorted.find(c => compLvl(c) >= P.dmg) || sorted[sorted.length - 1];
    }
  }
  resolveHuntDamage(pick);
}

/* ---------------- HUNT DAMAGE ---------------- */
function renderHuntDamage() {
  if (hotseat() && CFG.handoff && lastActor && lastActor !== "fp") { handoffFor = "fp"; return renderHandoff(); }
  const P = S.pendingHunt;
  if (P.stage === "staff") { // Wizard's Staff: veto the very first tile of this draw
    sheetBody.innerHTML = `<span class="phase-tag fp">Wizard's Staff</span>
     <p class="note">Gandalf the Grey raises his staff. You may prevent the Shadow from drawing a Hunt tile this time — discarding the Staff — or let the draw proceed.</p>
     <div class="btnrow">
      <button class="abtn primary" onclick="useWizardStaff()">Use the Staff (discard it, no tile drawn)</button>
      <button class="abtn subtle" onclick="declineWizardStaff()">Let the tile be drawn</button>
     </div>`;
    return;
  }
  const inField = S.fs.mordor < 0;
  const opts = P.only ? [P.only] : (P.corrOnly ? [] : S.fs.comps.filter(c => !COMP[c].rb));
  // mitigation from Fellowship "table" gear
  const mit = [];
  if (tableHas("fp", "WOTR_0009")) mit.push(`<button class="abtn" onclick="mitigateHunt('mithril')">Mithril Coat &amp; Sting — discard to re-draw the tile</button>`);
  if (tableHas("fp", "WOTR_0010") && (S.fs.comps.includes("gimli") || S.fs.comps.includes("legolas"))) mit.push(`<button class="abtn" onclick="mitigateHunt('axebow')">Axe &amp; Bow — discard for −1 damage</button>`);
  if (tableHas("fp", "WOTR_0011") && S.fs.comps.includes("boromir")) mit.push(`<button class="abtn" onclick="mitigateHunt('horn')">Horn of Gondor — discard for −1 damage</button>`);
  if (S.fs.guide === "gollum" && P.dmg > 0 && !P.reveal && !P.gollumUsed && S.fs.mordor < 0 && !S.fs.revealed)
    mit.push(`<button class="abtn" onclick="mitigateHunt('gollum')">Gollum leads them astray — reveal the Fellowship for −1 damage</button>`); // C5
  sheetBody.innerHTML = `<span class="phase-tag sh">The Hunt strikes</span>
   <p class="note">Hunt damage <b>${P.dmg}</b>${P.reveal && inField ? " · the Fellowship will be revealed" : ""}.${P.lure ? " The Ring calls — only the tempted Companion may answer." : opts.length ? " Take it as corruption, or let a Companion fall (reduces damage by their level)." : " The Ring-bearer must bear it."}</p>
   ${mit.length ? `<div class="btnrow">${mit.join("")}</div>` : ""}
   <div class="btnrow">
    <button class="abtn danger" onclick="resolveHuntDamage('corr');renderAfterHunt()">Take ${P.dmg} corruption</button>
    ${opts.map(c => `<button class="abtn" onclick="resolveHuntDamage('${c}');renderAfterHunt()">${P.lure ? "Let" : "Sacrifice"} ${compName(c)} ${P.lure ? "claim the Ring and leave" : `(Lv ${compLvl(c)}) → ${Math.max(0, P.dmg - compLvl(c))} corruption`}</button>`).join("")}
   </div>`;
}
function useWizardStaff() {
  const ctx = S.pendingHunt.ctx; S.pendingHunt = null;
  tableDiscard("fp", "WOTR_0012", "— the staff is spent turning aside the Hunt");
  log("fp", "<b>Gandalf turns aside the Hunt</b> — no tile is drawn.");
  renderAfterHunt();
}
function declineWizardStaff() {
  const ctx = S.pendingHunt.ctx; S.pendingHunt = null;
  drawAndResolveTile(ctx);
  refreshMap();
  if (S.pendingHunt || S.over) return renderSheet();
  renderAfterHunt();
}
function mitigateHunt(kind) {
  const P = S.pendingHunt;
  if (kind === "mithril") {
    tableDiscard("fp", "WOTR_0009", "— rent by the blow meant for the Ring-bearer");
    const tile = P.tile, ctx = P.ctx || {};
    if (tile && tile !== "e" && !tile.startsWith("S:")) { const k = S.hunt.removed.lastIndexOf(tile); if (k >= 0) S.hunt.removed.splice(k, 1); S.hunt.pool.push(tile); shuffle(S.hunt.pool); }
    S.pendingHunt = null;
    log("fp", "<b>Mithril Coat and Sting</b> turns the blow — the tile is drawn anew.");
    drawAndResolveTile(ctx);
    refreshMap();
    if (S.pendingHunt || S.over) return renderSheet();
    return renderAfterHunt();
  }
  if (kind === "gollum") { // C5: Gollum's guidance — reveal the Fellowship to blunt the Hunt
    P.gollumUsed = true; P.reveal = true;
    P.dmg = Math.max(0, P.dmg - 1);
    log("fp", "<b>Gollum</b> leads the Ring-bearers off the hunted road — but eyes have seen them (−1 Hunt damage, the Fellowship will be revealed).");
    return renderSheet();
  }
  if (kind === "axebow") tableDiscard("fp", "WOTR_0010", "— Gimli and Legolas spend themselves in the Ring-bearer's defence");
  if (kind === "horn") tableDiscard("fp", "WOTR_0011", "— Boromir's horn rings out one last time");
  P.dmg = Math.max(0, P.dmg - 1);
  log("fp", "The blow is blunted (−1 Hunt damage).");
  renderSheet();
}
/* P2: resume the flow the Hunt interrupted — the Fellowship phase still owes a
   dice roll, an action-phase interruption simply passes the turn along. */
function renderAfterHunt() {
  refreshMap();
  settlePending();
  if (S.over || S.pendingHunt) return renderSheet();
  if (S.phase === "fellowship") return startTurnRoll();
  if (S.phase === "action") return passTurn();
  return renderSheet();
}

/* ================= 1.2: BALANCE LAB =================
   A whole game, start to finish, with no DOM and no timers. Eleven difficulty
   knobs used to be set by feel; now they can be set against win-rate data.
   From the console:  SIM.run(200, { sh: "hard", fp: "normal" })              */
function simGame(seed, maxTurns) {
  newGame(seed);
  applyScenario();
  selectedDie = null; handoffFor = null; lastActor = null; busy = false; aiAsync = false;
  undoStack = []; aiBase = null; lastFsLoc = null; HL_PENDING = null;
  bumpEpoch();
  renderSheet();                       // kicks the first Fellowship phase
  let guard = 0;
  while (!S.over && guard++ < 40000) {
    if (S.turn > maxTurns) { S.over = { winner: null, how: `stalemate at turn ${maxTurns}` }; break; }
    const f = HL_PENDING;
    if (!f) { S.over = { winner: null, how: "stalled" }; break; }
    HL_PENDING = null;
    f();
  }
  if (!S.over) S.over = { winner: null, how: "stalled" };
  return { winner: S.over.winner, how: S.over.how, turns: S.turn, corr: S.fs.corr,
           mordor: S.fs.mordor, vpFp: vp("fp"), vpSh: vp("sh"), seed };
}
const SIM = {
  run(games, opts) {
    opts = opts || {};
    games = games || 100;
    const keepCfg = JSON.parse(JSON.stringify(CFG));
    const keepS = S, keepRng = rngState(), keepStarted = gameStarted, keepAuto = autosaveOn;
    const keepHeadless = HEADLESS;
    HEADLESS = true; autosaveOn = false;
    CFG.human = { fp: false, sh: false };
    if (opts.fp) CFG.diff.fp = opts.fp;
    if (opts.sh) CFG.diff.sh = opts.sh;
    if (opts.scenario) CFG.scenario = opts.scenario;
    const out = { games: 0, fp: 0, sh: 0, draw: 0, turns: 0, corr: 0, vpSh: 0, how: {}, errors: 0, seeds: { fp: [], sh: [] } };
    const t0 = (typeof performance !== "undefined" ? performance.now() : Date.now());
    for (let i = 0; i < games; i++) {
      const seed = opts.seed ? ((opts.seed + i * 2654435761) >>> 0) : newSeed();
      let r = null;
      try { r = simGame(seed, opts.maxTurns || 25); }
      catch (e) { out.errors++; if (out.errors < 4) console.warn("[SIM] game threw:", e); continue; }
      out.games++;
      out.turns += r.turns; out.corr += r.corr; out.vpSh += r.vpSh;
      out.how[r.how] = (out.how[r.how] || 0) + 1;
      if (r.winner === "fp") { out.fp++; if (out.seeds.fp.length < 5) out.seeds.fp.push(seedText(seed)); }
      else if (r.winner === "sh") { out.sh++; if (out.seeds.sh.length < 5) out.seeds.sh.push(seedText(seed)); }
      else out.draw++;
    }
    out.ms = Math.round((typeof performance !== "undefined" ? performance.now() : Date.now()) - t0);
    out.fpRate = out.games ? +(100 * out.fp / out.games).toFixed(1) : 0;
    out.shRate = out.games ? +(100 * out.sh / out.games).toFixed(1) : 0;
    out.avgTurns = out.games ? +(out.turns / out.games).toFixed(1) : 0;
    out.avgCorr = out.games ? +(out.corr / out.games).toFixed(1) : 0;
    out.avgVpSh = out.games ? +(out.vpSh / out.games).toFixed(1) : 0;
    // put the world back exactly as it was
    HEADLESS = keepHeadless; autosaveOn = keepAuto;
    CFG.human = keepCfg.human; CFG.diff = keepCfg.diff; CFG.scenario = keepCfg.scenario;
    CFG.handoff = keepCfg.handoff; CFG.opts = keepCfg.opts;
    S = keepS; setRngState(keepRng); gameStarted = keepStarted;
    HL_PENDING = null; bumpEpoch();
    console.table({ [`${opts.fp || CFG.diff.fp} FP vs ${opts.sh || CFG.diff.sh} Shadow`]: {
      games: out.games, "FP win %": out.fpRate, "Shadow win %": out.shRate,
      draws: out.draw, "avg turns": out.avgTurns, "avg corruption": out.avgCorr, ms: out.ms } });
    console.log("[SIM] endings:", out.how);
    return out;
  },
  /* the matrix a designer actually wants: every difficulty against every other */
  matrix(games) {
    const ks = Object.keys(DIFF), rows = {};
    ks.forEach(fp => ks.forEach(sh => {
      const r = SIM.run(games || 40, { fp, sh });
      rows[`FP ${fp} / SH ${sh}`] = { "FP win %": r.fpRate, "SH win %": r.shRate, draws: r.draw, "avg turns": r.avgTurns };
    }));
    console.table(rows);
    return rows;
  }
};
if (typeof window !== "undefined") { window.SIM = SIM; window.simGame = simGame; }

/* ================= 4.7: SOUND =================
   Silence is the loudest signal that a thing is a prototype. This is a small
   synthesiser rather than a bag of files: nine voices built from oscillators and
   filtered noise, so the whole feature costs a few hundred bytes and the page
   stays a single file with no dependencies.

   The context is created on the player's first gesture, because every browser
   refuses to start audio before one, and it is resumed on every later gesture in
   case the tab was backgrounded. Nothing here ever throws into the game loop. */
const SFX = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, master = null, noiseBuf = null;
  const last = {};
  function arm() {
    if (!AC) return null;
    if (!ctx) {
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.4;
        master.connect(ctx.destination);
      } catch (e) { ctx = null; return null; }
    }
    if (ctx.state === "suspended") { try { ctx.resume(); } catch (e) { /* ignore */ } }
    return ctx;
  }
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.7), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; return s;
  }
  /* one shaped oscillator: start pitch, optional glide, exponential envelope */
  function tone(o) {
    const t0 = ctx.currentTime + (o.at || 0), dur = o.dur;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    if (o.detune) osc.detune.setValueAtTime(o.detune, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.g || 0.18, t0 + (o.a || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  /* one shaped burst of noise: the percussive half of everything below */
  function burst(o) {
    const t0 = ctx.currentTime + (o.at || 0), dur = o.dur;
    const s = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = o.filter || "bandpass";
    f.frequency.setValueAtTime(o.f, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.to), t0 + dur);
    f.Q.value = o.q || 1;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.g || 0.18, t0 + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }
  const VOICE = {
    // dice tumbling out of a leather cup
    dice() {
      for (let i = 0; i < 6; i++)
        burst({ f: 1300 + Math.random() * 1700, q: 3, dur: 0.06, g: 0.13, at: i * 0.05 + Math.random() * 0.03 });
      burst({ f: 320, q: 0.8, dur: 0.16, g: 0.1, at: 0.3, filter: "lowpass" });
    },
    // a muster horn: a fifth, slow on, slow off
    muster() {
      tone({ f: 196, type: "sawtooth", dur: 0.85, a: 0.11, g: 0.07 });
      tone({ f: 294, type: "sawtooth", dur: 0.8, a: 0.14, g: 0.05, at: 0.04 });
      tone({ f: 98, type: "triangle", dur: 0.9, a: 0.1, g: 0.06 });
    },
    // steel on steel over the thud of a shield wall
    clash() {
      burst({ f: 2600, to: 5200, q: 0.6, dur: 0.2, g: 0.24, filter: "highpass" });
      burst({ f: 220, to: 70, q: 0.7, dur: 0.34, g: 0.3, filter: "lowpass" });
      tone({ f: 1760, to: 1180, type: "square", dur: 0.13, g: 0.045, at: 0.01 });
    },
    // the Ring's weight: a slow sink, nothing bright in it at all
    corrupt() {
      tone({ f: 168, to: 82, type: "sine", dur: 1.05, a: 0.09, g: 0.17 });
      tone({ f: 112, to: 55, type: "triangle", dur: 1.15, a: 0.12, g: 0.09 });
      burst({ f: 420, to: 120, q: 0.5, dur: 0.9, g: 0.035, filter: "lowpass", a: 0.2 });
    },
    // a Nazgûl motif — three falling cries, each doubled a hair out of tune
    hunt() {
      [[466, 0], [392, 0.26], [294, 0.54]].forEach(([f, at]) => {
        tone({ f, to: f * 0.94, type: "sawtooth", dur: 0.34, a: 0.05, g: 0.07, at });
        tone({ f, to: f * 0.94, type: "sawtooth", dur: 0.34, a: 0.05, g: 0.05, at: at + 0.01, detune: 22 });
      });
      burst({ f: 900, to: 300, q: 0.5, dur: 0.9, g: 0.04, filter: "bandpass", a: 0.25 });
    },
    // a settlement changes hands
    capture() {
      tone({ f: 523, type: "triangle", dur: 0.16, g: 0.13 });
      tone({ f: 784, type: "triangle", dur: 0.3, g: 0.13, at: 0.11 });
    },
    victory() {
      [392, 494, 587, 784].forEach((f, i) => tone({ f, type: "triangle", dur: 0.5, g: 0.12, at: i * 0.13 }));
    },
    defeat() {
      [392, 330, 262, 196].forEach((f, i) => tone({ f, type: "sawtooth", dur: 0.6, g: 0.08, a: 0.06, at: i * 0.17 }));
    },
  };
  return {
    arm,
    available: () => !!AC,
    play(name) {
      if (HEADLESS || !CFG.ui.sound) return;
      const v = VOICE[name]; if (!v) return;
      if (!arm()) return;
      const t = (window.performance ? performance.now() : Date.now());
      if (last[name] && t - last[name] < 200) return;    // never stack a voice on itself
      last[name] = t;
      try { v(); } catch (e) { /* an audio failure must never stop a game */ }
    },
  };
})();

/* The game changes state in a hundred places, so rather than sprinkle calls
   through the engine the sounds that describe the *board* are raised by watching
   a handful of scalars each time the board is redrawn. That catches the AI's
   actions and card effects for free, and — because the baseline is re-taken on
   load and undo — a rewind never sounds like a muster. One voice per redraw,
   most urgent first, so nothing ever plays over itself. */
let sfxSeen = null;
function unitsOnBoard() { let t = 0; for (const rid in S.reg) t += units(rid, "fp") + units(rid, "sh"); return t; }
function sfxSample() {
  return { corr: S.fs.corr, fpv: vp("fp"), shv: vp("sh"), u: unitsOnBoard(),
    hunt: !!S.pendingHunt, over: S.over ? S.over.winner : null };
}
function sfxRebase() { sfxSeen = (S && !HEADLESS) ? sfxSample() : null; }
function sfxTick() {
  if (HEADLESS || !S) return;
  const now = sfxSample(), was = sfxSeen;
  sfxSeen = now;
  if (!was || !CFG.ui.sound) return;
  if (now.over && !was.over) {
    const ours = !hotseat() && isHuman(now.over);
    return SFX.play((hotseat() || (isAI("fp") && isAI("sh")) || ours) ? "victory" : "defeat");
  }
  if (now.hunt && !was.hunt) return SFX.play("hunt");
  if (now.corr > was.corr) return SFX.play("corrupt");
  if (now.fpv !== was.fpv || now.shv !== was.shv) return SFX.play("capture");
  if (now.u > was.u) return SFX.play("muster");
}

/* ================= 4.4: THE THREAT OVERLAY =================
   War of the Ring's tension is anticipation, and the player could only get at it
   by tracing adjacency by hand — counting the enemy's remaining dice, then its
   neighbours, then its neighbours' neighbours. All of that was already computable:
   `armiesOf`, `moveTargets` and `attackTargets` are the same functions the legality
   checks use, so the overlay cannot disagree with what the enemy is actually
   allowed to do.

   Two shades, because they are two different fears: ground a host could *stand*
   on within its remaining dice, and ground it could *fall* on right now. */
function threatSide() { return hotseat() ? otherSide(S.actor) : (isHuman("fp") ? "sh" : "fp"); }
function threatOverlay() {
  if (!CFG.ui.threat || !S || S.over || S.phase === "fellowship") return null;
  const foe = threatSide();
  const marchFaces = ["arm", "ma", "chr"];
  const dice = (S.dice[foe] || []).filter(d => !d.used && marchFaces.includes(d.f)).length;
  const steps = Math.max(1, Math.min(3, dice));
  const atk = new Set(), reach = new Set();
  armiesOf(foe, false).forEach(from => {
    attackTargets(from, foe).forEach(t => atk.add(t));   // within reach of a blow this turn
    let frontier = [from];
    const seen = new Set([from]);
    for (let d = 0; d < steps; d++) {
      const next = [];
      frontier.forEach(r => moveTargets(r, foe, 1).forEach(a => {
        if (seen.has(a)) return;
        seen.add(a); reach.add(a); next.push(a);
      }));
      frontier = next;
    }
  });
  atk.forEach(r => reach.delete(r));   // the sharper warning wins the ground
  return { atk, reach, foe, steps, dice };
}
function refreshThreatKey() {
  const box = $("threatKey"); if (!box) return;
  const t = threatOverlay();
  const btn = $("btnThreat");
  if (btn) { btn.classList.toggle("on", !!CFG.ui.threat); btn.setAttribute("aria-pressed", CFG.ui.threat ? "true" : "false"); }
  if (!t) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  box.innerHTML = `<b>${sideLabel(t.foe)}</b> — ${t.dice} marching ${t.dice === 1 ? "die" : "dice"} left` +
    `<br><span style="color:#ff7a55">▧</span> can attack now · <span style="color:#e05a3a;opacity:.6">▧</span> can reach in ${t.steps}`;
}
function toggleThreat() {
  CFG.ui.threat = !CFG.ui.threat;
  savePrefs(); refreshMap(); refreshThreatKey();
  toast(CFG.ui.threat ? "Threat overlay on — the enemy's reach is hatched." : "Threat overlay off.");
}

/* ================= 4.1: REPLAYING THE ENEMY'S TURN =================
   The journal is gathered in the session layer; this is the telling of it. Each
   step holds the enemy's own log prose and the ground that moved with it, so the
   player watches the turn happen — "Isengard musters at Orthanc", then the host
   marching for the Fords — instead of reverse-engineering it from the Chronicle
   afterwards. It advances itself, it can be pushed along, and it can be walked
   out of at any point; the epoch guard means an undo mid-replay abandons it
   rather than narrating a board that has been rewound out from under it. */
let replay = null;
function beginAIReplay(done) {
  const j = aiJournal;
  if (!j) return false;
  journalFlushPending();
  const steps = j.steps.filter(s => s.lines.length);
  journalDrop();
  if (HEADLESS || !CFG.ui.replay || !steps.length) return false;
  if (handoffFor || S.over || S.pendingHunt) return false;
  aiBase = null;                       // the replay supersedes the bulk flash
  replay = { steps, i: -1, era: epoch, timer: null, done: done || null };
  replayNext();
  return true;
}
function replayNext() {
  if (!replay) return;
  clearTimeout(replay.timer);
  replay.i++;
  if (replay.i >= replay.steps.length) return replayEnd();
  const st = replay.steps[replay.i];
  pulseRegions(st.regions);
  renderReplay();
  const hold = 620 + Math.min(st.lines.length, 3) * 420;
  replay.timer = setTimeout(() => { if (replay && replay.era === epoch) replayNext(); }, hold);
}
function replayEnd() {
  if (!replay) return;
  clearTimeout(replay.timer);
  const done = replay.done;
  replay = null;
  refreshHistoryButtons();
  if (done) done(); else renderSheet();   // ...or hand on to whatever was waiting
}
function cancelReplay() { if (replay) { clearTimeout(replay.timer); replay = null; } journalDrop(); }
function renderReplay() {
  const st = replay.steps[replay.i], total = replay.steps.length;
  const dots = replay.steps.slice(0, 14).map((_, i) =>
    `<span class="cstep ${i < replay.i ? "done" : i === replay.i ? "now" : ""}"></span>`).join("");
  const where = st.regions.length
    ? `<div class="rwhere">${st.regions.slice(0, 4).map(r => REG[r].name).join(" · ")}${st.regions.length > 4 ? ` +${st.regions.length - 4} more` : ""}</div>`
    : "";
  sheetBody.innerHTML =
    `<span class="phase-tag ${st.side}">${sideLabel(st.side)}'s turn</span>` +
    `<div class="crumbs rep">${dots}<span class="clab">${replay.i + 1} of ${total}</span></div>` +
    `<div class="replay${st.regions.length ? "" : " quiet"}">${st.lines.map(l => `<div class="rline">${l}</div>`).join("")}${where}</div>` +
    `<div class="btnrow wrap">
       <button class="abtn" onclick="replayNext()">${replay.i + 1 < total ? "Next" : replay.done ? "End the turn" : "Done"} →</button>
       <button class="abtn subtle" onclick="replayEnd()">${replay.done ? "Skip to the end of the turn" : "Skip to my move"}</button>
     </div>
     <p class="note" style="font-size:10.5px">Turn this off in <b>⚙ → More options</b> if you would rather the board simply flashed.</p>`;
  SHEET.open();
  refreshHistoryButtons();
}

/* ================= 4.5: THE END-OF-TURN DIGEST =================
   A turn used to end on "— Turn 5 — new cards drawn", which is a notification,
   not an ending. The mark taken as a turn opens and the casualty tally kept by
   the removal paths are enough to say what the last four actions actually cost:
   what changed hands, what it did to the Ring, who died, and which realms moved
   toward war. That gives the game a rhythm, and — more to the point — a memory. */
function turnMark() {
  const caps = {};
  DATA.regions.forEach(r => { if (r.settle) caps[r.id] = S.reg[r.id].cap || null; });
  const nat = {};
  Object.keys(S.nations).forEach(n => nat[n] = S.nations[n].step);
  return { turn: S.turn, caps, nat, corr: S.fs.corr, mord: S.fs.mordor,
    vp: { fp: vp("fp"), sh: vp("sh") }, hands: { fp: S.hands.fp.length, sh: S.hands.sh.length } };
}
function showTurnDigest(before, spoils) {
  const took = { fp: [], sh: [] }, lostBy = { fp: [], sh: [] };
  DATA.regions.forEach(r => {
    if (!r.settle) return;
    const was = before.caps[r.id] || null, now = S.reg[r.id].cap || null;
    if (was === now) return;
    if (now) took[now].push(r.name);
    if (was) lostBy[was].push(r.name);
  });
  const marched = [];
  Object.keys(S.nations).forEach(n => {
    const to = S.nations[n].step;
    if (to === before.nat[n]) return;
    marched.push(`${S.nations[n].name} <b>${to === 0 ? "is At War" : `${to} from war`}</b>`);
  });
  const dCorr = S.fs.corr - before.corr;
  const dMord = Math.max(0, S.fs.mordor) - Math.max(0, before.mord);
  const fell = side => {
    const t = spoils && spoils[side]; if (!t) return "";
    const bits = [];
    if (t.u) bits.push(`${t.u} unit${t.u === 1 ? "" : "s"}`);
    if (t.e) bits.push(`${t.e} elite${t.e === 1 ? "" : "s"} broken`);
    if (t.l) bits.push(`${t.l} ${side === "sh" ? "Nazgûl" : "leader" + (t.l === 1 ? "" : "s")}`);
    return bits.join(", ");
  };
  const fpLost = fell("fp"), shLost = fell("sh");
  const none = t => `<span class="none">${t}</span>`;
  const row = (lab, val) => `<div class="drow"><div class="dlab">${lab}</div><div class="dval">${val}</div></div>`;
  const ground = [];
  if (took.fp.length) ground.push(`<span class="fpv">Free Peoples take</span> ${took.fp.join(", ")}`);
  if (took.sh.length) ground.push(`<span class="shv">The Shadow takes</span> ${took.sh.join(", ")}`);
  if (lostBy.fp.length && !took.sh.length) ground.push(`<span class="fpv">Free Peoples lose hold of</span> ${lostBy.fp.join(", ")}`);
  if (lostBy.sh.length && !took.fp.length) ground.push(`<span class="shv">The Shadow loses hold of</span> ${lostBy.sh.join(", ")}`);

  const ringBits = [];
  if (dCorr > 0) ringBits.push(`corruption <span class="up">+${dCorr}</span> (${S.fs.corr}/12)`);
  else if (dCorr < 0) ringBits.push(`corruption <span class="dn">${dCorr}</span> (${S.fs.corr}/12)`);
  if (dMord > 0) ringBits.push(`<span class="dn">${dMord}</span> step${dMord === 1 ? "" : "s"} into Mordor (${S.fs.mordor}/5)`);
  if (S.fs.revealed) ringBits.push(`the Fellowship stands <b>revealed</b>`);

  modal(`<h2>Turn ${before.turn} — the reckoning</h2>
    <p class="dim">Victory points now: <span class="fpv">Free Peoples ${vp("fp")}/4</span> · <span class="shv">Shadow ${vp("sh")}/10</span></p>
    <div class="dig">
      ${row("Ground", ground.length ? ground.join("<br>") : none("No settlement changed hands."))}
      ${row("The Ring", ringBits.length ? ringBits.join(" · ") : none(`Untroubled — corruption holds at ${S.fs.corr}/12.`))}
      ${row("The fallen", (fpLost || shLost)
        ? `${fpLost ? `<span class="fpv">Free Peoples</span> ${fpLost}` : ""}${fpLost && shLost ? "<br>" : ""}${shLost ? `<span class="shv">Shadow</span> ${shLost}` : ""}`
        : none("No blood was shed."))}
      ${row("The realms", marched.length ? marched.join("<br>") : none("The political track is unmoved."))}
      ${row("Turn " + S.turn, `Both sides draw a Character and a Strategy card. You hold <b>${S.hands[isHuman("fp") ? "fp" : "sh"].length}</b>.`)}
    </div>
    <div class="btnrow"><button class="abtn primary" onclick="closeModal();renderSheet()">On to turn ${S.turn}</button></div>
    <div class="btnrow"><button class="abtn subtle" onclick="digestOff()">Don't show me this again</button></div>`);
}
function digestOff() { CFG.ui.digest = false; savePrefs(); closeModal(); renderSheet(); toast("Turn digest off — turn it back on in ⚙."); }

/* ================= 4.3: A GUIDED FIRST GAME =================
   A new player used to be dropped into seat choice, three difficulties, four
   scenarios and three house-rule cyclers before they had seen the board. Setup
   now leads with one button, and the first turn is walked through: one die, one
   action, and an explanation of what just happened. Four coach marks, each one
   attached to a condition rather than to a tap, so the guide follows the player
   rather than the player following the guide — and every one of them can be
   dismissed for good. */
const TUTOR = { on: false, step: 0, acted: false };
const TUTOR_STEPS = [
  { when: () => S.phase === "fellowship", t: "The Fellowship Phase",
    b: `Each turn opens here. You may <b>declare</b> where the Ring-bearers are — that heals them in a friendly city and is the only way into Mordor — or press on in secret, which costs nothing and tells the Shadow nothing. For a first turn, stay hidden.` },
  { when: () => S.phase === "action" && S.actor === "fp" && selectedDie === null, t: "Your Action Dice",
    b: `Four dice, four things you may do this turn. The number on each die is how many actions that face can <i>actually</i> take from where you stand — a dimmed die can do nothing at all. <b>Tap one.</b>` },
  { when: () => S.phase === "action" && S.actor === "fp" && selectedDie !== null, t: "Spend it",
    b: `These are the actions that face allows. Anything greyed out tells you why it is closed rather than making you find out the hard way. <b>Muster</b> or <b>draw a card</b> is a safe opening. <b>Pick one.</b>` },
  { when: () => TUTOR.acted, t: "That is the whole loop",
    b: `Dice, actions, then the Shadow answers — and its turn is replayed for you move by move. Everything that ends the game is in the <b>Path to Victory</b> panel on the map. The rest is Middle-earth.` },
];
function tutorHTML() {
  if (!TUTOR.on || !S || S.over || !isHuman("fp") || hotseat()) return "";
  let i = TUTOR.step;
  while (i < TUTOR_STEPS.length && !TUTOR_STEPS[i].when()) i++;
  if (i >= TUTOR_STEPS.length) return "";
  TUTOR.step = i;
  const st = TUTOR_STEPS[i], lastOne = i === TUTOR_STEPS.length - 1;
  return `<div class="coach"><h4>${st.t}</h4><p>${st.b}</p>
    <div class="crow"><span class="cnum">Guide ${i + 1} of ${TUTOR_STEPS.length}</span>
    <button class="cskip" onclick="tutorEnd()">${lastOne ? "Got it — hide the guide" : "Skip the guide"}</button></div></div>`;
}
function tutorEnd() { TUTOR.on = false; CFG.ui.guided = false; savePrefs(); renderSheet(); }
function tutorStart() { TUTOR.on = true; TUTOR.step = 0; TUTOR.acted = false; }

/* ---------------- presentation preferences ----------------
   These describe how the game is shown, not what the position is, so they are
   deliberately kept out of the save: loading someone else's game should not
   turn your sound on. They persist on their own. */
const PREF_KEY = "wotr.pref.v1";
function loadPrefs() {
  try {
    const raw = STORE.get(PREF_KEY);
    if (raw) Object.assign(CFG.ui, JSON.parse(raw));
  } catch (e) { /* a corrupt preference is not worth a broken game */ }
}
function savePrefs() { try { STORE.set(PREF_KEY, JSON.stringify(CFG.ui)); } catch (e) { /* ignore */ } }
function toggleSound() {
  CFG.ui.sound = !CFG.ui.sound;
  savePrefs(); refreshSoundButton();
  if (CFG.ui.sound) { SFX.arm(); SFX.play("dice"); toast("Sound on."); } else toast("Sound off.");
}
function refreshSoundButton() {
  const b = $("btnSound"); if (!b) return;
  b.classList.toggle("on", !!CFG.ui.sound);
  b.setAttribute("aria-pressed", CFG.ui.sound ? "true" : "false");
  b.innerHTML = CFG.ui.sound ? "♪" : "♪̸";
  b.title = CFG.ui.sound ? "Sound on — tap to silence" : "Sound off — tap for dice, horns and the Hunt";
}

$("btnPolitics").onclick = () => {
  const row = n => {
    const nat = S.nations[n];
    return `<div class="track"><span class="nname"><span class="natkey" style="background:${natColour(n)}"></span>${nat.name}${nat.active ? "" : " ·p"}</span>` +

   <p class="dim">Nazgûl on the map: ${nazTotalOnMap()} · in reserve: ${S.pools.sauron.l}</p>

function helpFidelity() {
  const c = cardCoverage();
  const nm = id => { const card = DATA.cards.find(x => x.id === id); return card ? card.t.trim() : id; };
  let s = `<p><b>Card coverage:</b> all ${c.full} of ${c.total} cards in the four decks have their full rules implemented — every combat, table, die-timing, faction, siege-engine and Balrog effect, including the duplicate copies that complete each deck`;
  if (c.blocked) s += `; ${c.blocked} still await content: <i>${c.blockedIds.map(nm).join(", ")}</i>`;
  if (c.generic) s += `; ${c.generic} still use generic effects: <i>${c.genericIds.map(nm).join(", ")}</i>`;
  s += `.</p>`;
  return s + `<p><b>Fidelity notes:</b> every counter carries its nationality, so casualties return to the right reserve, "eliminate a unit of that Nation" cards resolve exactly, and The Spirit of Mordor genuinely requires a host of two nations rather than approximating one by size. Nazgûl remain the exception: a Ringwraith cast down with its host is gone for good. The full 219-card deck is loaded; the Muster die places two units in two <i>different</i> settlements and offers the Regular-plus-Leader combination; Character (C), Muster (M) and Army (A) Event cards may be played with their matching die as well as an Event die; Mûmakil requires a Southrons elite in the battle. The Ents of Fangorn, Hillmen of Dunland and Corsairs of Umbar factions, Siege Engines and the Balrog of Moria are all modelled. Map adjacency is hand-encoded but has been audited for full symmetry — a visual diff against the printed board remains a manual QA step.</p>`;
}
function helpBody(sec) { return sec.id === "fidelity" ? helpFidelity() : sec.body; }

function helpSectionsHTML(filter) {

    <h3 class="sect">Balance lab</h3>
    <div class="btnrow wrap">
      ${pill(false, "Play out 40 games", "uiBalanceLab(40)")}
      ${pill(false, "Play out 150", "uiBalanceLab(150)")}
    </div>
    <p class="note">Runs the current pairing to a finish with no board and no dice rolls to watch, and reports who won. <code>SIM.matrix(25)</code> in the browser console does every difficulty against every other.</p>
    <h3 class="sect">Save code</h3>
    <div class="btnrow wrap">
      <button class="abtn subtle" style="flex:1 1 45%;text-align:center" onclick="uiExport()"${gameStarted ? "" : " disabled"}>Copy this game out</button>
      <button class="abtn subtle" style="flex:1 1 45%;text-align:center" onclick="uiImport()">Paste a game in</button>
    </div>
    <p class="note">A save code is the whole position as text — keep a game across browsers, or attach one to a bug report.</p>
    <div class="btnrow"><button class="abtn primary" onclick="closeModal();startGame()">Begin the War</button>
    ${gameStarted ? `<button class="abtn subtle" onclick="closeModal();renderSheet()">Cancel — keep the current game</button>`
      : `<button class="abtn subtle" onclick="setupLess()">← Back to the simple start</button>`}</div>`);
}
function uiResume() { if (!resumeSaved()) { toast("That save could not be read — starting fresh."); clearSave(); openSetup(); } }
/* ---- 1.2: seeding and the balance lab, surfaced where a player can reach them ---- */
function uiSeedPrompt() {
  modal(`<h2>Seed</h2><p class="dim">A seed fixes every roll and every shuffle. Two players given the same seed, the same seats and the same difficulty will fight exactly the same war — useful for comparing openings, or for pinning a bug down.</p>
    <input id="seedIn" value="${CFG.seed ? seedText(CFG.seed) : ""}" placeholder="e.g. 3KM9X2A"
      style="width:100%;background:#15110a;color:var(--parch);border:1px solid #4a3d26;border-radius:8px;
      padding:10px;font-size:15px;font-family:monospace;letter-spacing:.14em;text-transform:uppercase">
    <div class="btnrow">
      <button class="abtn primary" onclick="uiSeedSet()">Use this seed</button>
      <button class="abtn subtle" onclick="uiSeedRandom()">Roll me a new one</button>
      <button class="abtn subtle" onclick="openSetup()">Back</button>
    </div>`);
}
function uiSeedSet() {
  const v = seedParse($("seedIn").value);
  if (!v) { toast("That is not a seed — letters and numbers only."); return; }
  CFG.seed = v; openSetup();
}
function uiSeedRandom() { const v = newSeed(); $("seedIn").value = seedText(v); }
function uiSeedClear() { CFG.seed = 0; openSetup(); }
function uiBalanceLab(n) {
  const aiSides = ["fp", "sh"].filter(s => !CFG.human[s]);
  const fpD = CFG.diff.fp, shD = CFG.diff.sh;
  modal(`<h2>Balance lab</h2><p class="dim">Playing out ${n} games of <b>${DIFF[fpD].name}</b> Free Peoples against <b>${DIFF[shD].name}</b> Shadow on <i>${SCENARIOS[CFG.scenario].name}</i>. This takes a moment.</p>`);
  setTimeout(() => {
    const r = SIM.run(n, { fp: fpD, sh: shD, maxTurns: 25 });
    const bar = (pct, cls) => `<div class="pips" style="gap:1px">${Array.from({ length: 20 }, (_, i) =>
      `<span class="p${i < Math.round(pct / 5) ? " on " + cls : ""}" style="width:5px"></span>`).join("")}</div>`;
    const endings = Object.entries(r.how).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<div class="comp"><span style="font-size:11.5px">${k}</span><span class="lvl">${v}</span></div>`).join("");
    modal(`<h2>Balance lab</h2>
      <p class="dim">${r.games} games · ${DIFF[fpD].name} Free Peoples vs ${DIFF[shD].name} Shadow · ${SCENARIOS[CFG.scenario].name} · ${(r.ms / 1000).toFixed(1)}s</p>
      <div class="gauge"><span class="gl">Free</span>${bar(r.fpRate, "fp")}<span class="gv">${r.fpRate}%</span></div>
      <div class="gauge"><span class="gl">Shadow</span>${bar(r.shRate, "sh")}<span class="gv">${r.shRate}%</span></div>
      <p class="note">Average length <b>${r.avgTurns}</b> turns · average corruption at the end <b>${r.avgCorr}</b>${r.draw ? ` · <b>${r.draw}</b> unresolved at the turn limit` : ""}${r.errors ? ` · <b>${r.errors}</b> errored` : ""}</p>
      <h3 class="sect">How they ended</h3>${endings}
      <div class="btnrow"><button class="abtn subtle" onclick="openSetup()">Back</button></div>`);
  }, 60);
}
function uiExport() {
  const code = exportCode();
  modal(`<h2>Save code</h2><p class="dim">The whole position, as text. Copy it somewhere safe.</p>
    <textarea id="saveCode" readonly style="width:100%;height:150px;background:#15110a;color:var(--parch-dim);
      border:1px solid #4a3d26;border-radius:8px;padding:8px;font-size:10px;font-family:monospace">${code}</textarea>
    <div class="btnrow"><button class="abtn primary" onclick="copySaveCode()">Copy to clipboard</button>
    <button class="abtn subtle" onclick="openSetup()">Back</button></div>`);
}
function copySaveCode() {
  const ta = $("saveCode");
  ta.select(); ta.setSelectionRange(0, 999999);
  const done = () => toast("Save code copied.");
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand("copy"); done(); } catch (e) { toast("Copy it by hand — selection is ready."); } });
  else { try { document.execCommand("copy"); done(); } catch (e) { toast("Copy it by hand — selection is ready."); } }
}
function uiImport() {
  modal(`<h2>Paste a game in</h2><p class="dim">This replaces the game in progress.</p>
    <textarea id="loadCode" placeholder="Paste a save code here" style="width:100%;height:150px;background:#15110a;color:var(--parch);
      border:1px solid #4a3d26;border-radius:8px;padding:8px;font-size:10px;font-family:monospace"></textarea>
    <div class="btnrow"><button class="abtn primary" onclick="doImport()">Load it</button>
    <button class="abtn subtle" onclick="openSetup()">Back</button></div>`);
}
function doImport() {
  const v = $("loadCode").value;
  if (!v.trim()) return toast("Nothing to load.");
  if (importCode(v)) toast(`Loaded — turn ${S.turn}.`);
  else { toast("That is not a save code this version can read."); openSetup(); }
}
function setupSeat(s) {
  CFG.human = { fp: s === "fp" || s === "hot", sh: s === "sh" || s === "hot" };
  openSetup();
}
function setupDiff(k) { CFG.diff.fp = k; CFG.diff.sh = k; openSetup(); }
function setupHandoff() { CFG.handoff = !CFG.handoff; openSetup(); }
function setupScenario(k) { CFG.scenario = k; openSetup(); }
function setupCas(k) {                     // 3.6
  CFG.cas = k;
  if (gameStarted && S) ["fp", "sh"].forEach(s => { if (CFG.human[s]) S.casPolicy[s] = k; });
  openSetup();
}
function setupOpt(key, step, max) { CFG.opts[key] = (CFG.opts[key] + step) > max ? 0 : CFG.opts[key] + step; openSetup(); }
function startGame() {
  gameStarted = true;
  newGame();
  // 4.3: the guide only makes sense from the Free Peoples seat, playing solo
  if (CFG.ui.guided && isHuman("fp") && !hotseat()) tutorStart(); else TUTOR.on = false;
  applyScenario();
  selectedDie = null; handoffFor = null; lastActor = null; busy = false; aiAsync = false;
  undoStack = []; redoStack = []; aiBase = null; lastFsLoc = null; bumpEpoch();
  cancelReplay(); sfxRebase();
  clearPick();
  fitViewBox(); drawMap(); renderSheet();
  checkpoint();
}
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });

/* ---------------- BOOT ---------------- */
newGame();
(() => { // P0-5: verify the hand-encoded map graph is internally consistent
  MAPGEO.suspect.forEach(x => console.warn(
    `Suspect adjacency: ${REG[x.a].name} — ${REG[x.b].name} are declared adjacent ` +
    `but their territories lie ${x.gap} apart. Worth checking against the board.`));
  const issues = auditAdjacency();
  if (issues.length) console.warn("Map adjacency audit — " + issues.length + " issue(s):", issues);
  else console.info(`Map adjacency audit: ${DATA.regions.length} regions, graph is fully symmetric with no dangling or isolated regions.`);
})();
loadPrefs();                     // 4.4/4.7: how the player last chose to be shown things
fitViewBox();
drawMap();
sfxRebase();
refreshSoundButton();
refreshThreatKey();
renderSheet();
window.addEventListener("resize", fitViewBox);
/* 4.4/4.7: the two map-side toggles */
$("btnThreat").onclick = () => toggleThreat();
$("btnSound").onclick = () => toggleSound();
/* Every browser refuses to start audio before a gesture, and suspends it again
   when the tab sleeps, so arm on any interaction rather than once at load. */
["pointerdown", "keydown"].forEach(ev =>
  window.addEventListener(ev, () => { if (CFG.ui.sound) SFX.arm(); }, { passive: true }));
/* a tab going away should not cost the player their game */
window.addEventListener("pagehide", autosave);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autosave(); });
/* P2: the setup screen replaces the old auto-opening help panel — it chooses
   the seats, the difficulty and the opening position before the first die.
   If a game is already in progress it leads with Resume instead. */
setTimeout(openSetup, 350);

</script>
</body>
</html>
