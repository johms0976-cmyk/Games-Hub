<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>War of the Ring</title>
<style>:root{
  --ink:#0e1118; --map:#151a24; --edge:#2a3346;
  --leather:#1c1712; --leather2:#26201738;
  --parch:#e3d5ae; --parch-dim:#a99c78;
  --fp:#7ea6c9; --fp-deep:#3d5a75;
  --sh:#c14a35; --sh-deep:#6e2a1e;
  --gold:#c9a24b; --gold-dim:#8a7136;
  --danger:#e05a3a;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--parch);font-family:var(--sans)}
#app{height:100dvh;display:flex;flex-direction:column;position:relative}

/* ---- top bar ---- */
#topbar{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:linear-gradient(180deg,#14100b,#1c1712);
  border-bottom:1px solid #3a2f1e;z-index:20;flex:0 0 auto}
.game-title{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.16em;color:var(--gold)}
.game-title span{font-style:italic;font-weight:400;letter-spacing:.02em;color:var(--parch-dim);text-transform:none;font-size:12px}
.turn-label{font-size:10.5px;color:var(--parch-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.tb-right{display:flex;gap:6px}
.tb-btn{background:#26201a;border:1px solid #463a26;color:var(--parch);
  font-family:var(--sans);font-size:11px;padding:6px 9px;border-radius:6px;cursor:pointer}
.tb-btn:active{background:#332a1f}
.tb-btn:focus-visible{outline:2px solid var(--gold)}

/* ---- map ---- */
#mapwrap{flex:1 1 auto;position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 70% 60%, #1a2130 0%, var(--map) 55%, #0d1017 100%)}
#map{width:100%;height:100%;touch-action:none;display:block}
.edge{stroke:var(--edge);stroke-width:2;opacity:.65}
.rg circle.base{stroke-width:1.5;cursor:pointer}
.rg text.rname{font-family:var(--serif);fill:#8b93a6;font-size:10.5px;pointer-events:none;text-anchor:middle}
.rg .badge{font-family:var(--sans);font-weight:700;font-size:11px;pointer-events:none;text-anchor:middle}
.rg.sel circle.base{stroke:var(--gold);stroke-width:3;filter:drop-shadow(0 0 6px rgba(201,162,75,.8))}
.rg.target circle.base{stroke:#7fe08f;stroke-width:3;filter:drop-shadow(0 0 6px rgba(127,224,143,.8))}
.fsmark{pointer-events:none}
#vpBadge,#huntBadge{position:absolute;font-family:var(--sans);font-size:11px;
  background:rgba(20,16,11,.88);border:1px solid #3a2f1e;border-radius:8px;padding:6px 10px;line-height:1.5}
#vpBadge{top:10px;left:10px}
#huntBadge{top:10px;right:10px;text-align:right}
.eye{color:var(--sh);font-weight:700}
.fpv{color:var(--fp);font-weight:700}.shv{color:var(--sh);font-weight:700}

/* ---- bottom sheet ---- */
#sheet{flex:0 0 auto;background:linear-gradient(180deg,#1f1a13,#161209);
  border-top:1px solid #46false;border-top:1px solid #4a3d26;box-shadow:0 -8px 24px rgba(0,0,0,.55);
  max-height:52dvh;display:flex;flex-direction:column;z-index:30}
#sheetHandle{width:44px;height:4px;border-radius:2px;background:#5a4a2e;margin:7px auto 2px;flex:0 0 auto}
#sheetBody{overflow-y:auto;padding:8px 14px 16px;-webkit-overflow-scrolling:touch}
h3.sect{font-family:var(--serif);font-size:15px;color:var(--gold);margin:8px 0 6px;font-weight:600}
p.note{font-size:12.5px;color:var(--parch-dim);line-height:1.5;margin:4px 0}
.phase-tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);background:var(--gold);border-radius:4px;padding:2px 8px;font-weight:700;margin-bottom:6px}
.phase-tag.sh{background:var(--sh)}
.phase-tag.fp{background:var(--fp)}

/* dice tray */
.dicetray{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.die{width:52px;height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;border:2px solid transparent;position:relative;user-select:none}
.die small{font-size:8.5px;letter-spacing:.05em;margin-top:1px;text-transform:uppercase;font-weight:700}
.die.fp{background:linear-gradient(160deg,#2c405a,#1d2c40);color:#cfe2f2;border-color:#4a6a8c}
.die.sh{background:linear-gradient(160deg,#5a2318,#3a150d);color:#f2cfc4;border-color:#8c4a3a}
.die.used{opacity:.28;pointer-events:none}
.die.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(201,162,75,.7)}
.die:focus-visible{outline:2px solid var(--gold)}

/* action buttons */
.btnrow{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.abtn{background:#2a2318;border:1px solid #55442a;color:var(--parch);
  padding:11px 12px;border-radius:9px;font-size:13.5px;text-align:left;cursor:pointer;line-height:1.35;font-family:var(--sans)}
.abtn b{color:var(--gold)}
.abtn:active{background:#38301f}
.abtn:disabled{opacity:.35;pointer-events:none}
.abtn.primary{background:var(--gold);color:#1a1408;border-color:#e0c070;font-weight:700}
.abtn.danger{border-color:var(--sh);color:#f0b8a8}
.abtn.subtle{background:transparent;border-color:#3a3122;color:var(--parch-dim)}
.abtn:focus-visible{outline:2px solid var(--gold)}
.btnrow.wrap{flex-direction:row;flex-wrap:wrap}
.btnrow.wrap .abtn{flex:1 1 40%}

/* region panel */
.rpanel .units{display:flex;gap:12px;margin:6px 0;font-size:13px}
.tagset{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 7px;font-weight:700}
.tag.fp{background:var(--fp-deep);color:#d8e8f5}.tag.sh{background:var(--sh-deep);color:#f5ded8}
.tag.n{background:#3a3122;color:var(--parch-dim)}

/* cards */
.cardlist{display:flex;flex-direction:column;gap:8px}
.gcard{background:#241d12;border:1px solid #4a3d26;border-left:4px solid var(--gold-dim);border-radius:8px;padding:9px 11px}
.gcard.sh{border-left-color:var(--sh)}
.gcard.fp{border-left-color:var(--fp)}
.gcard h4{font-family:var(--serif);font-size:13.5px;color:var(--parch);margin-bottom:3px}
.gcard p{font-size:11.5px;color:var(--parch-dim);line-height:1.45}
.gcard .meta{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#7d6f4e;margin-top:5px}
.gcard .cbtns{display:flex;gap:6px;margin-top:7px}
.gcard .cbtns button{flex:1;padding:7px;font-size:12px;border-radius:6px;border:1px solid #55442a;background:#332a1a;color:var(--parch);cursor:pointer}
.gcard .cbtns button.play{background:var(--gold);color:#1a1408;font-weight:700;border-color:#e0c070}
.gcard .cbtns button:disabled{opacity:.35}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,6,10,.78);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
#modal.hidden{display:none}
#modalCard{background:linear-gradient(180deg,#241e14,#17120a);border:1px solid #5a4a2e;border-radius:14px;
  max-width:420px;width:100%;max-height:82dvh;overflow-y:auto;padding:18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.7)}
#modalCard h2{font-family:var(--serif);color:var(--gold);font-size:19px;margin-bottom:8px}
#modalCard p{font-size:13px;line-height:1.55;color:var(--parch);margin:6px 0}
#modalCard p.dim{color:var(--parch-dim);font-size:12px}

/* battle readout */
.battle{font-size:13px}
.battle .vs{display:flex;justify-content:space-between;font-family:var(--serif);font-size:15px;margin:8px 0}
ul.battlenotes{margin:8px 0 4px;padding-left:18px;font-size:11.5px;color:var(--parch-dim);line-height:1.5}
ul.battlenotes li{margin:2px 0}
.rollrow{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.pip{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#2c2416;border:1px solid #4a3d26}
.pip.hit{background:var(--gold);color:#1a1408;border-color:#e0c070}
.pip.sh.hit{background:var(--sh);color:#fff}

/* log */
.logline{font-size:12px;line-height:1.5;padding:4px 0;border-bottom:1px solid #2a2318;color:var(--parch-dim)}
.logline b{color:var(--parch)}
.logline.fp b{color:var(--fp)} .logline.sh b{color:var(--sh)}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52dvh + 14px);z-index:70;
  background:rgba(28,22,14,.95);border:1px solid var(--gold-dim);color:var(--parch);
  padding:9px 16px;border-radius:20px;font-size:12.5px;max-width:86vw;text-align:center;transition:opacity .3s}
#toast.hidden{opacity:0;pointer-events:none}

/* tracks */
.track{display:flex;align-items:center;gap:4px;margin:5px 0;font-size:12px}
.track .nname{width:150px;color:var(--parch-dim)}
.tstep{width:20px;height:20px;border-radius:4px;background:#2a2318;border:1px solid #443723;display:flex;align-items:center;justify-content:center;font-size:10px}
.tstep.cur.fp{background:var(--fp-deep);border-color:var(--fp)}
.tstep.cur.sh{background:var(--sh-deep);border-color:var(--sh)}
.tstep.war{border-color:var(--danger)}
.corr{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}
.corr .cpip{width:18px;height:18px;border-radius:50%;background:#2a2318;border:1px solid #443723}
.corr .cpip.on{background:var(--sh);border-color:#e07a5f;box-shadow:0 0 6px rgba(193,74,53,.7)}

.comp{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:#241d12;
  border:1px solid #4a3d26;border-radius:8px;margin:5px 0;font-size:13px}
.comp .lvl{color:var(--gold);font-weight:700;font-size:12px}
.comp button{padding:6px 10px;font-size:11.5px;border-radius:6px;border:1px solid #55442a;background:#332a1a;color:var(--parch)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <div class="game-title">WAR<span> of the </span>RING</div>

    </div>
    <div class="tb-right">

      <button class="tb-btn" id="btnHand">Cards</button>
      <button class="tb-btn" id="btnLog">Log</button>
      <button class="tb-btn" id="btnHelp">?</button>
    </div>

  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="vpBadge"></div>
    <div id="huntBadge"></div>
  </div>

  <div id="sheet">
    <div id="sheetHandle"></div>
    <div id="sheetBody"></div>
  </div>

  <div id="modal" class="hidden"><div id="modalCard"></div></div>
  <div id="toast" class="hidden"></div>
</div>

ce the Hunt damage by one (to a minimum of zero). Any remaining Hunt damage must be confronted normally. You must discard this card from the table immediately if Boromir leaves the Fellowship.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0012","t":"Wizard\u2019s Staff","f":"fp","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play on the table if Gandalf the Grey is in the Fellowship. You may discard \u201cWizard\u2019s Staff\u201d to prevent the Shadow player from drawing a Hunt tile. You must discard this card from the table immediately if Gandalf the Grey leaves the Fellowship.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0013","t":"Blade of Westernesse","f":"fp","deck":"str","ct":"combat","cs":6,"x":"Play if a Hobbit is in the battle. Use one hit during the Leader re-roll to eliminate one Minion of your choice that is participating in the battle.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0014","t":"Mighty Attack","f":"fp","deck":"str","ct":"combat","cs":4,"x":"Play if a Companion is in the battle. Before rolling the dice for your Leader re-roll, forfeit the Leadership of one Companion participating in the battle to automatically change one missed die roll to a hit.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0016","t":"Servant of the Secret Fire","f":"fp","deck":"str","ct":"combat","cs":3,"x":"Play if Gandalf is in the battle. Add 1 to all dice on your Combat roll.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0019","t":"Athelas","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Roll three dice and heal one Corruption point for each die result of 5+. If Strider is the Guide, heal one Corruption point for each die result of 3+ instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0020","t":"There is Another Way","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Heal one Corruption point. Then, if Gollum is the Guide, you may also hide or move the Fellowship (following the normal movement rules).","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0021","t":"I Will Go Alone","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Play if at least one Companion is in the Fellowship. Separate one Companion or one group of Companions from the Fellowship. You may move the Companions one extra region. Then, heal one Corruption point.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0022","t":"Bilbo\u2019s Song","f":"fp","deck":"str","ct":"strategy_event","cs":0,"x":"Heal one Corruption point. If Gollum is the Guide, heal two Corruption points instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0023","t":"And\u00fbril","f":"fp","deck":"str","ct":"combat","cs":4,"x":"Play if Strider/Aragorn is in the battle. Before rolling the dice for your Leader re-roll, forfei he rules for a successful Hunt, with the exception that the Free Peoples player must take all Hunt damage as Corruption.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0121","t":"Foul Thing from the Deep","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play if the Fellowship is not in a region containing a Free Peoples Settlement. Draw a Hunt tile. If the tile shows an Eye or is a Fellowship special tile, discard it without effect. Otherwise, follow the rules for a success- ful Hunt, with the exception that the Free Peoples player must reduce any Hunt damage by eliminating a random Companion (unless there are no Com- panions in the Fellowship).","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0122","t":"Cruel as Death","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Play if the total Nazg\u00fbl Leadership is 2 or more. Subtract 2 from your total Nazg\u00fbl Leadership to add 1 to all dice on your Combat roll.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0124","t":"They are Terrible","f":"sh","deck":"str","ct":"combat","cs":4,"x":"Play if the total Nazg\u00fbl Leadership is 1 or more. Subtract 1 from your total Nazg\u00fbl Leadership to add 1 to all dice on your Leader re-roll.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0125","t":"Candles of Corpses","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if the Fellowship is not in a region containing a Free Peoples Settlement. Roll three dice and add one Corrup- tion point on each result of 4+. If Gollum is the Guide, add one Corruption points on each result of \u201c6\u201d instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0126","t":"Dread and Despair","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Play if the total Nazg\u00fbl Leadership is 1 or more. Before the Combat roll, forfeit one or more points of Nazg\u00fbl Leadership. During this Combat roll, the Free Peoples player rolls one die less (to a minimum of 1) for every point you have chosen to forfeit.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0127","t":"Nazg\u00fbl Search","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if the Fellowship is on step 1 or higher on the Fellowship Track. Move any or all of the Nazg\u00fbl. Then, if at least one Nazg\u00fbl is in the region with the Fellowship, the Fel- lowship is revealed.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0128","t":"Cruel Weather","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if the Fellowship is on step 1 or higher on the Fellowship Track. Move the Ring-bearers to an adjacent region.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0129","t":"Foul Stench","f":"sh","deck":"str","ct":"strategy_event","cs":3,"x":"Play if the total Nazg\u00fbl Leadership is 1 or more. If the Nazg\u00fbl Leadership equals or exceeds the total Free Peoples Leadership, the Free Peoples Leader re-roll is cancelled.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0131","t":"The Nazg\u00fbl Strike!","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if the Fellowship is on step 1 or higher on the Fellowship Track. Move any or all of the Nazg\u00fbl. Then, if at least one Nazg\u00fbl is in the re- gion with the Ring-bearers, you may either discard one Free Peoples Charac- ter Event card from the table or roll for the Hunt (as if the Free Peoples player had moved the Fellowship).","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0132","t":"Black Breath","f":"sh","deck":"str","ct":"combat","cs":6,"x":"Play if a Nazg\u00fbl is in the battle. If your Leader re-roll scores at least one hit, you may additionally eliminate one Free Peoples Leader participating in the battle. Alternatively, you can choose to eliminate a Companion in the battle, if the number of hits equals or exceeds that Companion\u2019s Level.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":true,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0135","t":"Lure of the Ring","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if the Fellowship is revealed. Randomly select one Companion in the Fellowship by drawing a Companion counter. The Free Peoples player must choose either to add Corruption equal to the Companion\u2019s Level or to eliminate him. If Gollum is the Guide, add one Corruption point instead.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0137","t":"The Breaking of the Fellowship","f":"sh","deck":"chr","ct":"combat","cs":0,"x":"Play if the Fellowship is revealed. Draw a Hunt tile. If the tile shows an Eye or is a Fellowship special tile, discard it without effect. Otherwise, the Free Peoples player must separate a number of Companions equal to the number on the tile (if possible), placing them in the same region as the Ring-bearers. Ignore any \u201cReveal\u201d or \u201cStop\u201d icons on the tile. If Gollum is the Guide, add one Corruption point instead. Dread and Despair (3) Play if the total Nazg\u00fbl Leadership is 1 or more. Before the Combat roll, forfeit one or more points of Nazg\u00fbl Leadership. During this Combat roll, the Free Peoples player rolls one die less (to a minimum of 1) for every point you have chosen to forfeit.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0138","t":"Worn with Sorrow and Toil","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play on the table. When \u201cWorn with Sorrow and Toil\u201d is in play, if a Companion in the Fel- lowship is taken as a casualty you may also discard one of the Free Peoples player\u2019s Character Event cards from his hand (choosing it ran- domly) or from the table. You must discard this card from the table immediately if the Fellowship is declared in a Free Peoples City or Stronghold controlled by the Free Peoples.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0139","t":"Words of Power","f":"sh","deck":"str","ct":"strategy_event","cs":1,"x":"Play if a Nazg\u00fbl is in the battle. Choose a Companion. That Compan- ion\u2019s Leadership and special abilities are cancelled for this Combat round. 15","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0140","t":"Morgul Wound","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play if the Fellowship is revealed. If the Fellowship\u2019s current Corruption is three or less, add two Corruption points; otherwise add one Corruption point.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0142","t":"Flocks of Crebain","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play on the table. Before you make a Hunt roll, you may discard \u201cFlocks of Crebain\u201d to add 1 to all dice on that Hunt roll (including re-rolls). You must discard this card from the table immediately if the Fellowship is declared in a Free Peoples City or Stronghold.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0144","t":"Balrog of Moria","f":"sh","deck":"str","ct":"strategy_event","cs":0,"x":"Play on the table. You may discard \u201cBalrog of Moria\u201d to draw an additional Hunt tile if the Fel- lowship moves into, out of, or through Moria while being declared or revealed. If the tile shows an Eye, discard it without effect; otherwise follow the rules for a suc- cessful Hunt. Ignore any \u201cReveal\u201d icon on the drawn tile if the Fellowship has been declared in a Free Peoples City or Stronghold. Or you may discard \u201cBalrog of Moria\u201d to use its Com- bat effect as if you were playing the card from your hand.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0145","t":"Durin\u2019s Bane","f":"fp","deck":"str","ct":"combat","cs":2,"x":"Play if the defending Army is within two regions of Moria Before the Combat roll, roll an additional attack using three combat dice. Score hits on 4+ and apply the result immediately.","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0146","t":"The Palant\u00edr of Orthanc","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play on the table if Saruman is in play. When \u201cThe Palant\u00edr of Orthanc\u201d is in play, every time you use an Event Ac- tion Die result to play an Event card, immediately draw another card from either one of your decks. The Free Peoples player can force \u201cThe Palant\u00edr of Orthanc\u201d to be discarded by either using a Will of the West Action Die result, or using any Action Die and one Elven Ring. You must discard this card if Saruman is eliminated.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":true}},{"id":"WOTR_0150","t":"The Lidless Eye","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Change up to three unused Shadow Action Dice results into \u201cEye\u201d results. Place the dice in the Hunt Box immediately.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":true,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0151","t":"Dreadful Spells","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"(C) Play if a Shadow Army containing a Nazg\u00fbl is adjacent to, or is in the same region as, a Free Peoples Army. Roll a number of dice equal to the number of Nazg\u00fbl in that Army (up to a maximum of 5) and score one hit for each result of 5+.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0153","t":"Devilry of Orthanc","f":"sh","deck":"str","ct":"combat","cs":3,"x":"Play if an Isengard Army unit is in the battle and the defending Army is in a Stronghold. Add 1 to all dice on your Combat roll. 19","fl":{"modifies_combat_roll":true,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0154","t":"The Ringwraiths Are Abroad","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Move any or all of the Nazg\u00fbl. Then, you may either move two Armies each containing a Nazg\u00fbl, or attack with one Army containing a Nazg\u00fbl.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":true,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0155","t":"Grond, Hammer of the","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Underworld Play if the Witch-king is in play and is with a Shadow Army besieging a Free Peoples Stronghold. Attack that Stronghold. The Siege lasts for three Combat rounds in- stead of one. During the first round, the Free Peoples player cannot use a Combat card unless a Companion is in the battle.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0157","t":"The Black Captain Commands","f":"sh","deck":"chr","ct":"character_event","cs":0,"x":"Play if the Witch-king is in play. You may either recruit two Nazg\u00fbl in the region containing the Witch-king, or move any or all of the Nazg\u00fbl. Then, you may move or attack with an Army containing the Witch-king.","fl":{"modifies_combat_roll":false,"modifies_leader_reroll":false,"affects_hunt":false,"recruitment":false,"movement":false,"political_track":false,"persistent_effect":false}},{"id":"WOTR_0158","t":"Wormtongue","f":"sh","deck":"chr","ct":"       if (idx < 0) idx = S.hands.sh.findIndex(x => !CARD_FX[x.id] && !COMBAT_FX[x.id]);

function placeUnits(side, nat, rid, r, e, l) { // respects reserves and stacking; leaders don't stack

  const rr = Math.min(r || 0, pool.r, room(rid, side)); pool.r -= rr; u.r += rr;
  const ee = Math.min(e || 0, pool.e, room(rid, side)); pool.e -= ee; u.e += ee;
  const ll = Math.min(l || 0, pool.l); pool.l -= ll; u.l += ll;

}

/* ---------- politics ---------- */

/* ---------- combat (E2: real combat-card engine) ---------- */

/* pan/zoom */
(() => {
  let ptrs = new Map(), last = null, pinch = null;
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); if (ptrs.size === 1) last = { x: e.clientX, y: e.clientY }; });
  svg.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, e);
    const arr = [...ptrs.values()];
    if (arr.length === 1 && last) {
      const sc = VB.w / svg.clientWidth;
      VB.x -= (e.clientX - last.x) * sc; VB.y -= (e.clientY - last.y) * sc;
      last = { x: e.clientX, y: e.clientY }; applyVB();
    } else if (arr.length === 2) {
      const d = Math.hypot(arr[0].clientX - arr[1].clientX, arr[0].clientY - arr[1].clientY);
      if (pinch) zoomAt((arr[0].clientX + arr[1].clientX) / 2, (arr[0].clientY + arr[1].clientY) / 2, pinch / d);
      pinch = d;
    }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) last = null; };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.12 : 0.9); }, { passive: false });
  function zoomAt(cx, cy, f) {
    const r = svg.getBoundingClientRect();
    const mx = VB.x + (cx - r.left) / r.width * VB.w, my = VB.y + (cy - r.top) / r.height * VB.h;
    VB.w = Math.min(2200, Math.max(260, VB.w * f)); VB.h = Math.min(2700, Math.max(320, VB.h * f));
    VB.x = mx - (cx - r.left) / r.width * VB.w; VB.y = my - (cy - r.top) / r.height * VB.h;
    applyVB();
  }
})();

function renderForcedDiscard() {

function forceDiscard(i) { discardCard(S.hands.fp.splice(i, 1)[0]); renderSheet(); }

function cardStatus(c) { // {label, canPlay, mode}
  const R = CARD_FX[c.id], C = COMBAT_FX[c.id];
  if (R && R.blocked) return { label: `Not yet in play — ${R.blocked}`, canPlay: false };
  if (C) return { label: `Combat card — play during a battle round (${C.note})`, canPlay: false, mode: "combat" };
  if (R && R.table) return { label: R.can() ? "Play on the table (a lasting effect)" : "Table card — conditions not yet met", canPlay: R.can(), mode: "table" };
  if (R) return { label: R.can() ? "Full card effect" : "Full card effect — conditions not met", canPlay: R.can(), mode: "registry" };
  const eff = scriptedEffect(c);
  const generic = { heal: "Heal 1 corruption", "hunt-": "Remove a Hunt die", "hunt+": "Add a Hunt die", recruit: "Muster 2 regulars", politics: "Advance a nation", move: "Free army move", combat: "Battle card — play during a battle round" }[eff];
  return { label: generic || "No scripted effect — flavour only", canPlay: !!eff && eff !== "combat", mode: "generic" };
}
function tableCardHTML(side) {
  if (!S.table[side].length) return "";

    S.table[side].map(c => `<div class="gcard ${side}"><h4>${c.t}</h4><p>${c.x.slice(0, 120)}${c.x.length > 120 ? "…" : ""}</p></div>`).join("");
}
function openHand(playable) {
  const h = S.hands.fp;

function discardFromHand(i) { discardCard(S.hands.fp.splice(i, 1)[0]); openHand(handPlayable); }
function playFromHand(i) {
  const c = S.hands.fp[i];
  closeModal();
  const R = CARD_FX[c.id];
  if (R) {
    if (R.blocked) return toast(`Not yet in play — ${R.blocked}.`);
    if (!R.can()) return toast("The card's conditions are not met.");
    if (R.ui) { // bespoke interactive flow: remove the card, then run it
      const hand = S.hands.fp; const k = hand.indexOf(c); if (k >= 0) hand.splice(k, 1);
      discardCard(c);
      R.uiFlow("fp", c, () => { tableUpkeep(); afterFPAction(); });
      return;
    }
    if (R.needs === "nation") {
      const opts = R.targets();
      modal(`<h2>${c.t}</h2><p class="dim">Choose a nation.</p>` +
        opts.map(n => `<div class="comp"><span>${NATION_NAME(n)}</span><button onclick="BUI.pickNation('${n}')">Choose</button></div>`).join("") +
        `<div class="btnrow"><button class="abtn subtle" onclick="closeModal();renderSheet()">Cancel</button></div>`);
      BUI.pickNation = n => { closeModal(); playCardEffect("fp", c, { nation: n }); afterFPAction(); };
      return;
    }
    if (R.needs === "comp") {
      const opts = R.targets();
      modal(`<h2>${c.t}</h2><p class="dim">Choose a Companion.</p>` +
        opts.map(id => `<div class="comp"><span>${COMP[id].name}</span><span class="lvl">Lv ${COMP[id].lvl}</span><button onclick="BUI.pickComp('${id}')">Choose</button></div>`).join("") +
        `<div class="btnrow"><button class="abtn subtle" onclick="closeModal();renderSheet()">Cancel</button></div>`);
      BUI.pickComp = id => { closeModal(); playCardEffect("fp", c, { comp: id }); afterFPAction(); };
      return;
    }
    if (R.needs === "region") {
      startPick(R.targets(), `${c.t}: tap a highlighted region.`, rid => { playCardEffect("fp", c, { region: rid }); afterFPAction(); });
      return;
    }
    playCardEffect("fp", c); afterFPAction(); return; // includes table cards
  }
  const eff = scriptedEffect(c);
  if (eff === "politics") {
    const opts = Object.keys(S.nations).filter(n => canAdvance("fp", n));
    if (!opts.length) return toast("No nation can advance.");
    playCardEffect("fp", c, { nation: opts[0] }); afterFPAction(); return;
  }
  if (eff === "recruit") {
    const t = musterTargets("fp").concat(DATA.regions.filter(r => r.nation && S.nations[r.nation].side === "fp" && r.settle && controller(r.id) === "fp").map(r => r.id));
    const uniq = [...new Set(t)];
    if (!uniq.length) { playCardEffect("fp", c); afterFPAction(); return; }
    startPick(uniq, `${c.t}: tap a settlement to muster 2 regulars.`, rid => { playCardEffect("fp", c, { region: rid }); afterFPAction(); });
    return;
  }
  if (eff === "move") {
    playCardEffect("fp", c);
    const src = armiesOf("fp", false);
    if (!src.length) return afterFPAction();
    startPick(src, "Free move: tap an army.", from => {
      const dst = moveTargets(from, "fp", units(from, "fp"));
      if (!dst.length) return afterFPAction();
      startPick(dst, "Tap destination.", to => { moveArmy(from, to, "fp"); afterFPAction(); });
    });
    return;
  }
  playCardEffect("fp", c); afterFPAction();
}

/* ---------------- BATTLE (E2 combat-card flow) ---------------- */
/* Combat cards are declared defender-first and revealed together. The human
   plays through promptFPCombatCard(); the AI picks via aiPickCombatCard().   */
function startBattleFlow(from, to) { newBattle("fp", from, to); battleLoopFP(); }

function battleLoopFP() {
  const B = S.battle;
  // Round 0: the AI defender may withdraw a weak garrison into its stronghold before blood is drawn
  if (B.round === 0 && !B.siege && REG[B.to].settle === "s" && controller(B.to) === "sh" &&
      units(B.to, "sh") > 0 && units(B.to, "sh") < units(B.from, "fp")) {
    defenderRetreatIntoSiege(); refreshMap();
    modal(`<h2>${REG[B.to].name}</h2><p>The Shadow garrison withdraws behind the walls. Your army holds the field — assault the stronghold with a further Attack action (hits on 6s).</p>
     <div class="btnrow"><button class="abtn primary" onclick="closeModal();afterFPAction()">Continue</button></div>`);
    return;
  }
  const shPick = aiPickCombatCard(); // defender/attacker AI commits first, hidden
  promptFPCombatCard((fpCard, fpOpts) => {
    battleRound({ fp: fpCard, sh: shPick && shPick.card, fpOpts });
    refreshMap();
    showBattleModal(() => {
      const B2 = S.battle;
      if (B2.over) { closeModal(); afterFPAction(); return; }
      if (!B2.noRetreat && units(B2.to, "sh") * 2 < units(B2.from, "fp")) { // AI defender flees if crushed
        const outs = moveTargets(B2.to, "sh", units(B2.to, "sh"));
        if (outs.length) { defenderRetreat(outs[0]); refreshMap(); closeModal(); afterFPAction(); return; }
      }
      battleLoopFP();
    }, true);
  });
}

  }).join("");

function scoutsRetreat(cb) {

   <p>Defender (${R.dRoll.hits} hit${R.dRoll.hits === 1 ? "" : "s"}):</p>${pipRow(R.dRoll, R.defHitOn, R.dBonus, false, B.def === "sh")}</div>`;

    html += `<p><b>${msg}</b></p><div class="btnrow"><button class="abtn primary" onclick="BUI.next()">Continue</button></div>`;

/* ---------------- SHADOW AI ---------------- */
function aiAllocateHunt() {
  const maxAlloc = Math.min(S.fs.comps.length, 3, shDiceCount() - 4);
  let n = 1;
  if (S.fs.movesThisTurn > 0 || S.turn > 1) n = 2;
  if (S.fs.corr >= 7 || S.fs.mordor >= 0) n = 3;
  if (S.turn === 1) n = 1;
  return Math.max(0, Math.min(n, maxAlloc));
}
function fpSettlements() { return DATA.regions.filter(r => r.settle && r.nation && S.nations[r.nation].side === "fp" && controller(r.id) === "fp"); }
function bfsNext(from, goals) {
  const goalSet = new Set(goals);
  const prev = { [from]: null }; const q = [from];
  while (q.length) {
    const c = q.shift();
    if (goalSet.has(c) && c !== from) { let n = c; while (prev[n] !== from) n = prev[n]; return n; }
    for (const a of REG[c].adj) if (!(a in prev)) { prev[a] = c; q.push(a); }
  }
  return null;
}
function aiChain() { if (S.over) return; aiAction(); refreshMap(); renderSheet(); }
function aiAction() {
  if (S.over) return;
  const dice = S.dice.sh.filter(d => !d.used);
  if (!dice.length) return;
  const has = f => dice.find(d => d.f === f);
  const spend = d => {
    d.used = true;
    if (d.f === "chr" && tableHas("sh", "WOTR_0235")) { S.hunt.box++; log("sh", `<b>Captain of Despair</b> — the Hunt Box swells (${S.hunt.box}).`); }
  };

  // C4: a stolen Elven Ring turns a die to the Eye when the Hunt is worth pressing
  if (S.rings.sh > 0 && !S.ringUsed.sh && (S.fs.mordor >= 0 || S.fs.corr >= 5 || S.fs.movesThisTurn > 0)) {
    const d = dice.find(x => x.f !== "eye");
    if (d) {
      d.used = true; d.f = "eye"; S.hunt.box++;
      S.rings.sh--; S.rings.out++; S.ringUsed.sh = true;
      log("sh", `The Shadow spends an <b>Elven Ring</b> — another Eye turns to the Hunt (${S.hunt.box} in the Hunt Box).`);
      return;
    }
  }

  // C2: the Mouth of Sauron may use a Muster die to move or attack with his army, once per turn
  if (!S.mouthActed && S.minions.mouth) {
    const musD = has("mus") || has("ma");
    const rid = charAt("mouth");
    if (musD && rid && units(rid, "sh") >= 2) {
      let best = null;
      attackTargets(rid, "sh").forEach(to => {
        const my = units(rid, "sh"), their = units(to, "fp");
        const wall = REG[to].settle === "s" ? 1.8 : REG[to].settle ? 1.3 : 1;
        if (my > their * wall && (!best || their < best.their)) best = { to, their };
      });
      if (best) {
        S.mouthActed = true; spend(musD);
        log("sh", `<b>The Mouth of Sauron</b> wields the Muster of Mordor as a whip of war.`);
        return aiBattle(rid, best.to);
      }
    }
  }

  // 1. Attack if favourable
  const atkDie = has("arm") || has("ma") || has("chr");
  if (atkDie && atWar("sh")) {
    let best = null;
    armiesOf("sh", atkDie.f === "chr").forEach(from => {
      attackTargets(from, "sh").forEach(to => {
        const my = units(from, "sh"), their = units(to, "fp");
        const wall = REG[to].settle === "s" ? 1.8 : REG[to].settle ? 1.3 : 1;
        const score = my - their * wall + (REG[to].settle === "s" ? 2 : REG[to].settle === "c" ? 1 : 0);
        if (my >= 2 && my > their * wall && (!best || score > best.score)) best = { from, to, score };
      });
    });
    if (best) { spend(atkDie); return aiBattle(best.from, best.to); }
  }
  // 1.5 (C1): a Character die sends a Nazgûl to shadow the Ring-bearers, or to stiffen the spearhead
  const chrDie = has("chr");
  if (chrDie) {
    if (S.fs.mordor < 0 && nazAt(S.fs.loc) === 0 && nazCanEnter(S.fs.loc) && !S.reg[S.fs.loc].chars.includes("witch_king")) {
      const from = Object.keys(S.reg).find(r => S.reg[r].sh.l > 1 && r !== S.fs.loc) ||
                   Object.keys(S.reg).find(r => S.reg[r].sh.l > 0 && units(r, "sh") === 0 && r !== S.fs.loc);
      if (from) { spend(chrDie); flyNazgul(from, S.fs.loc, 1); return; }
    }
    const goals = fpSettlements().map(r => r.id);
    if (goals.length) { // gather stray Nazgûl onto the largest host without a wraith
      const host = armiesOf("sh", false).filter(r => S.reg[r].sh.l === 0 && units(r, "sh") >= 4)
        .sort((a, b) => bfsDist(a, goals) - bfsDist(b, goals))[0];
      const stray = Object.keys(S.reg).find(r => S.reg[r].sh.l > 0 && units(r, "sh") === 0 && r !== S.fs.loc);
      if (host && stray && nazCanEnter(host)) { spend(chrDie); flyNazgul(stray, host, S.reg[stray].sh.l); return; }
    }
  }
  // 2. Muster: minions, politics, recruits
  const musDie = has("mus") || has("ma");
  if (musDie) {
    const m = MINIONS.find(m => minionAvailable(m.id));
    if (m) { spend(musDie); summonMinion(m.id); return; }
    const nat = ["sauron", "isengard", "southrons"].find(n => S.nations[n].step > 0);
    if (nat) { spend(musDie); advanceNation(nat); return; }
    const t = musterTargets("sh");
    if (t.length) {
      // C1: sometimes raise a fresh Nazgûl instead of troops
      const nazSpot = t.find(r => REG[r].nation === "sauron" && REG[r].settle === "s");
      if (nazSpot && S.pools.sauron.l > 0 && nazTotalOnMap() < 4 && rnd(3) === 0) {
        spend(musDie);
        recruitAt("sh", nazSpot, "l");
        log("sh", `A <b>Nazgûl</b> rises at <b>${REG[nazSpot].name}</b>.`);
        return;
      }
      const goals = fpSettlements().map(r => r.id);
      t.sort((a, b) => (bfsDist(a, goals) - bfsDist(b, goals)));
      const rid = t[0]; const pool = S.pools[REG[rid].nation];
      spend(musDie);
      recruitAt("sh", rid, pool.e > 0 && rnd(2) ? "e" : "rr");
      log("sh", `The Shadow musters at <b>${REG[rid].name}</b>.`);
      return;
    }
  }
  // 3. March toward nearest FP settlement
  const mvDie = has("arm") || has("ma") || has("chr");
  if (mvDie) {
    const goals = fpSettlements().map(r => r.id);
    if (goals.length) {
      const armies = armiesOf("sh", mvDie.f === "chr").filter(r => units(r, "sh") >= 2);
      armies.sort((a, b) => units(b, "sh") - units(a, "sh"));
      for (const from of armies) {
        const nxt = bfsNext(from, goals);
        if (nxt && moveTargets(from, "sh", 1).includes(nxt)) {
          const u = S.reg[from].sh;
          let take = { r: u.r, e: u.e, l: u.l };
          if (REG[from].settle === "s" && REG[from].nation && S.nations[REG[from].nation].side === "sh" && u.r + u.e > 1)
            take = { r: Math.max(0, u.r - 1), e: u.e, l: u.l };
          const rm = room(nxt, "sh");
          while (take.r + take.e > rm) { if (take.r > 0) take.r--; else if (take.e > 0) take.e--; else break; }
          if (take.r + take.e > 0) { spend(mvDie); moveArmy(from, nxt, "sh", take); return; }
        }
      }
    }
  }
  // 4. Event die: play a fully implemented card, else generic play, else draw
  const evtDie = has("evt");
  if (evtDie) {
    spend(evtDie);
    const regC = S.hands.sh.find(c => { const R = CARD_FX[c.id]; return R && !R.blocked && R.can() && (!R.aiWants || R.aiWants()); });
    if (regC) {
      const R = CARD_FX[regC.id];
      const opts = {};
      if (R.needs === "region") opts.region = R.targets()[0];
      if (R.needs === "nation") opts.nation = R.targets()[0];
      if (R.needs === "comp") opts.comp = R.targets()[0];
      playCardEffect("sh", regC, opts);
      if (tableHas("sh", "WOTR_0146")) { drawCard("sh", rnd(2) ? "chr" : "str"); log("sh", "<b>The Palantír of Orthanc</b> — the Shadow draws a card."); } // E3
      return;
    }
    const playable = S.hands.sh.find(c => { const e = scriptedEffect(c); return e && e !== "combat" && !CARD_FX[c.id]; });
    if (playable && S.hands.sh.length > 2) {
      const eff = scriptedEffect(playable);
      if (eff === "politics") { const n = ["sauron", "isengard", "southrons"].find(n => S.nations[n].step > 0); playCardEffect("sh", playable, { nation: n }); if (!n) log("sh", "…to no effect."); }
      else if (eff === "recruit") { const t = musterTargets("sh"); playCardEffect("sh", playable, { region: t[0] }); }
      else playCardEffect("sh", playable);
    } else { drawCard("sh", rnd(2) ? "chr" : "str"); log("sh", "The Shadow draws an Event card."); }
    return;
  }
  // 5. fallback: any die → draw
  spend(dice[0]); drawCard("sh", "str"); log("sh", "The Shadow bides its time.");
}
function bfsDist(from, goals) {
  const g = new Set(goals); const dist = { [from]: 0 }; const q = [from];
  while (q.length) { const c = q.shift(); if (g.has(c)) return dist[c]; for (const a of REG[c].adj) if (!(a in dist)) { dist[a] = dist[c] + 1; q.push(a); } }
  return 99;
}
function aiBattle(from, to, opts) { newBattle("sh", from, to, opts); aiBattleRound(); }
function aiBattleRound() {
  // The Free Peoples defend: they declare their combat card first (defender-first),
  // then the Shadow AI reveals its own.
  const B = S.battle;
  promptFPCombatCard((fpCard, fpOpts) => {
    const shPick = aiPickCombatCard();
    battleRound({ fp: fpCard, sh: shPick && shPick.card, fpOpts });
    refreshMap();
    showBattleModal(() => {
      const B2 = S.battle;
      if (B2.over) { closeModal(); aiAfterBattle(); return; }
      if (units(B2.from, "sh") <= units(B2.to, "fp")) { B2.over = true; B2.result = "ceased"; log("sh", "The Shadow assault falters and withdraws."); closeModal(); aiAfterBattle(); return; }
      aiBattleRound();
    }, false);
  });
}
/* AI combat-card choice: the Balrog leaps from the table near Moria, else the best playable card. */
function aiPickCombatCard() {
  const B = S.battle;
  if (tableHas("sh", "WOTR_0144") && B.att === "sh" && bfsDist(B.to, ["moria"]) <= 2) {
    const c = S.table.sh.find(x => x.id === "WOTR_0144");
    return { card: { ...c, fromTable: true } };
  }
  const list = combatPlayable("sh", B);
  if (!list.length) return null;
  const priority = ["WOTR_0192", "WOTR_0173", "WOTR_0153", "WOTR_0174", "WOTR_0126", "WOTR_0132", "WOTR_0122", "WOTR_0113", "WOTR_0129", "WOTR_0124", "WOTR_0211", "WOTR_0167", "WOTR_0168", "WOTR_0139", "WOTR_0184", "WOTR_0176"];
  const pick = priority.map(id => list.find(c => c.id === id)).find(Boolean) || list[0];
  const worthIt = REG[B.to].settle || units(shBattleRegion(B), "sh") >= 4 || rnd(2) === 0;
  if (!worthIt) return null;
  return { card: pick }; // battleRound() consumes/discards it
}
function aiAfterBattle() { checkAragorn(); checkGandalfWhite(); winCheck(); busy = false; refreshMap(); renderSheet(); }

/* ---------------- HUNT DAMAGE ---------------- */
function renderHuntDamage() {
  const P = S.pendingHunt;
  if (P.stage === "staff") { // Wizard's Staff: veto the very first tile of this draw
    sheetBody.innerHTML = `<span class="phase-tag fp">Wizard's Staff</span>
     <p class="note">Gandalf the Grey raises his staff. You may prevent the Shadow from drawing a Hunt tile this time — discarding the Staff — or let the draw proceed.</p>
     <div class="btnrow">
      <button class="abtn primary" onclick="useWizardStaff()">Use the Staff (discard it, no tile drawn)</button>
      <button class="abtn subtle" onclick="declineWizardStaff()">Let the tile be drawn</button>
     </div>`;
    return;
  }
  const inField = S.fs.mordor < 0;
  const opts = P.only ? [P.only] : (P.corrOnly ? [] : S.fs.comps.filter(c => !COMP[c].rb));
  // mitigation from Fellowship "table" gear
  const mit = [];
  if (tableHas("fp", "WOTR_0009")) mit.push(`<button class="abtn" onclick="mitigateHunt('mithril')">Mithril Coat &amp; Sting — discard to re-draw the tile</button>`);
  if (tableHas("fp", "WOTR_0010") && (S.fs.comps.includes("gimli") || S.fs.comps.includes("legolas"))) mit.push(`<button class="abtn" onclick="mitigateHunt('axebow')">Axe &amp; Bow — discard for −1 damage</button>`);
  if (tableHas("fp", "WOTR_0011") && S.fs.comps.includes("boromir")) mit.push(`<button class="abtn" onclick="mitigateHunt('horn')">Horn of Gondor — discard for −1 damage</button>`);
  if (S.fs.guide === "gollum" && P.dmg > 0 && !P.reveal && !P.gollumUsed && S.fs.mordor < 0 && !S.fs.revealed)
    mit.push(`<button class="abtn" onclick="mitigateHunt('gollum')">Gollum leads them astray — reveal the Fellowship for −1 damage</button>`); // C5
  sheetBody.innerHTML = `<span class="phase-tag sh">The Hunt strikes</span>
   <p class="note">Hunt damage <b>${P.dmg}</b>${P.reveal && inField ? " · the Fellowship will be revealed" : ""}.${P.lure ? " The Ring calls — only the tempted Companion may answer." : opts.length ? " Take it as corruption, or let a Companion fall (reduces damage by their level)." : " The Ring-bearer must bear it."}</p>
   ${mit.length ? `<div class="btnrow">${mit.join("")}</div>` : ""}
   <div class="btnrow">
    <button class="abtn danger" onclick="resolveHuntDamage('corr');renderAfterHunt()">Take ${P.dmg} corruption</button>
    ${opts.map(c => `<button class="abtn" onclick="resolveHuntDamage('${c}');renderAfterHunt()">${P.lure ? "Let" : "Sacrifice"} ${compName(c)} ${P.lure ? "claim the Ring and leave" : `(Lv ${compLvl(c)}) → ${Math.max(0, P.dmg - compLvl(c))} corruption`}</button>`).join("")}
   </div>`;
}
function useWizardStaff() {
  const ctx = S.pendingHunt.ctx; S.pendingHunt = null;
  tableDiscard("fp", "WOTR_0012", "— the staff is spent turning aside the Hunt");
  log("fp", "<b>Gandalf turns aside the Hunt</b> — no tile is drawn.");
  renderAfterHunt();
}
function declineWizardStaff() {
  const ctx = S.pendingHunt.ctx; S.pendingHunt = null;
  drawAndResolveTile(ctx);
  refreshMap();
  if (S.pendingHunt || S.over) return renderSheet();
  renderAfterHunt();
}
function mitigateHunt(kind) {
  const P = S.pendingHunt;
  if (kind === "mithril") {
    tableDiscard("fp", "WOTR_0009", "— rent by the blow meant for the Ring-bearer");
    const tile = P.tile, ctx = P.ctx || {};
    if (tile && tile !== "e" && !tile.startsWith("S:")) { const k = S.hunt.removed.lastIndexOf(tile); if (k >= 0) S.hunt.removed.splice(k, 1); S.hunt.pool.push(tile); shuffle(S.hunt.pool); }
    S.pendingHunt = null;
    log("fp", "<b>Mithril Coat and Sting</b> turns the blow — the tile is drawn anew.");
    drawAndResolveTile(ctx);
    refreshMap();
    if (S.pendingHunt || S.over) return renderSheet();
    return renderAfterHunt();
  }
  if (kind === "gollum") { // C5: Gollum's guidance — reveal the Fellowship to blunt the Hunt
    P.gollumUsed = true; P.reveal = true;
    P.dmg = Math.max(0, P.dmg - 1);
    log("fp", "<b>Gollum</b> leads the Ring-bearers off the hunted road — but eyes have seen them (−1 Hunt damage, the Fellowship will be revealed).");
    return renderSheet();
  }
  if (kind === "axebow") tableDiscard("fp", "WOTR_0010", "— Gimli and Legolas spend themselves in the Ring-bearer's defence");
  if (kind === "horn") tableDiscard("fp", "WOTR_0011", "— Boromir's horn rings out one last time");
  P.dmg = Math.max(0, P.dmg - 1);
  log("fp", "The blow is blunted (−1 Hunt damage).");
  renderSheet();
}
function renderAfterHunt() { refreshMap(); if (S.over) return renderSheet(); busy = true; renderSheet(); setTimeout(() => { aiAction(); busy = false; refreshMap(); renderSheet(); }, 550); }

/* ---------------- PANELS ---------------- */
$("btnFellowship").onclick = () => {
  const fs = S.fs;
  modal(`<h2>The Ring-bearers</h2>
   <p class="dim">Last known: <b>${REG[fs.loc].name}</b> · progress ${fs.prog} · ${fs.revealed ? "REVEALED" : "hidden"}${fs.mordor >= 0 ? ` · Mordor track ${fs.mordor}/5` : ""}</p>
   <p>Corruption</p><div class="corr">${Array.from({ length: 12 }, (_, i) => `<span class="cpip ${i < fs.corr ? "on" : ""}"></span>`).join("")}</div>
   <p>Fellowship (guide: <b>${compName(fs.guide)}</b>${fs.guide === "gollum" ? " — treacherous, but he knows the ways" : ""})</p>
   ${fs.comps.map(c => `<div class="comp"><span>${compName(c)}${COMP[c].rb ? " ☉" : ""}</span><span class="lvl">Lv ${compLvl(c)}</span></div>`).join("")}
   <p class="dim" style="margin-top:6px">Elven Rings — Free Peoples <b>${S.rings.fp}</b> · Shadow <b>${S.rings.sh}</b> · spent <b>${S.rings.out}</b></p>
   ${mapComps().length ? `<p style="margin-top:6px">Abroad in Middle-earth</p>` + mapComps().map(x => `<div class="comp"><span>${compName(x.id)}</span><span class="lvl">${REG[x.rid].name}</span></div>`).join("") : ""}
   <div class="btnrow"><button class="abtn subtle" onclick="closeModal()">Close</button></div>`);
};
$("btnPolitics").onclick = () => {
  const row = n => {
    const nat = S.nations[n];
    return `<div class="track"><span class="nname">${nat.name}${nat.active ? "" : " ·p"}</span>` +
      [3, 2, 1, 0].map(s => `<span class="tstep ${s === 0 ? "war" : ""} ${nat.step === s ? "cur " + nat.side : ""}">${s === 0 ? "⚔" : s}</span>`).join("") + `</div>`;
  };
  modal(`<h2>Political Track</h2><p class="dim">Nations march toward War. Passive Free Peoples nations (·p) must be activated — by attack or the Ring-bearer's arrival — before they can take the final step.</p>` +
    Object.keys(S.nations).map(row).join("") +
    `<p class="dim" style="margin-top:8px">Shadow minions: ${MINIONS.map(m => `${m.name} ${S.minions[m.id] ? `✓ (${REG[charAt(m.id)] ? REG[charAt(m.id)].name : "?"})` : S.minionsDead[m.id] ? "✝ slain" : "—"}`).join(" · ")}</p>
   <p class="dim">Nazgûl on the map: ${nazTotalOnMap()} · in reserve: ${S.pools.sauron.l}</p>
   <div class="btnrow"><button class="abtn subtle" onclick="closeModal()">Close</button></div>`);
};
$("btnHand").onclick = () => openHand(false);
$("btnLog").onclick = () => {
  modal(`<h2>Chronicle</h2>` + S.log.slice(-60).reverse().map(l => `<div class="logline ${l.side}"><b>T${l.turn}</b> ${l.msg}</div>`).join("") +
    `<div class="btnrow"><button class="abtn subtle" onclick="closeModal()">Close</button></div>`);
};
$("btnHelp").onclick = () => {
  modal(`<h2>How to play</h2>
  <p><b>You are the Free Peoples.</b> Win by sneaking the Fellowship to Mordor (declare it at Morannon or Minas Morgul, then survive 5 steps of the Mordor track before corruption hits 12) — or capture 4 VP of Shadow cities/strongholds.</p>
  <p><b>The Shadow wins</b> at 12 corruption or 10 VP of your cities (1 VP) and strongholds (2 VP).</p>
  <p><b>Each turn:</b> optionally declare the Fellowship, then spend Action Dice alternately with the AI. Tap a die, pick an action, tap glowing regions on the map. ★ marks leaders/companions with your armies; dashed rings are sieges.</p>
  <p><b>The Hunt:</b> Eye dice go to the Hunt Box. Each Fellowship move risks a Hunt roll (6s hit, easier with repeat moves). The Shadow re-rolls one failed die each for an army, a Nazgûl, or a stronghold at the Ring-bearers' last known position. Damage becomes corruption unless a Companion falls. A revealed Fellowship must Hide before it can move again.</p>
  <p><b>Mordor:</b> every step on the track draws a Hunt tile — Eye tiles deal damage equal to the Hunt Box, tiles with a reveal icon halt the Ring-bearers for that action, and lingering a whole turn without moving costs 1 corruption. Entering Mordor returns the drawn Eye tiles to the Hunt Pool.</p>
  <p><b>Politics:</b> nations must reach ⚔ At War to attack and muster. Passive nations activate when attacked or visited by the Ring-bearer.</p>
  <p><b>Casualties:</b> use the toggle shown in battle to choose whether hits downgrade your elites first (preserves army size) or remove regulars first.</p>
  <p><b>Combat cards:</b> each round of a battle, both sides may commit one Combat card. The defender chooses first and the cards are revealed together — they can add dice bonuses, forfeit leadership for an edge, launch pre-combat strikes, cancel the enemy's card, or let a hero die to save the ranks. Cards you can't use in the current battle are greyed out in your hand.</p>
  <p><b>Table cards:</b> some Event cards stay in play "on the table" (protective gear, Wormtongue, the Balrog, and so on) and keep working until their conditions lapse. You can review both sides' table cards from the Hand panel.</p>
  <p><b>Nazgûl &amp; Minions:</b> the Shadow's leaders are the Ringwraiths (♦ on the map). They fly, add leadership, are never combat casualties, and fall only with a destroyed army — or to the Eagles. New Nazgûl muster at Sauron strongholds. Saruman, the Witch-king and the Mouth of Sauron enter as figures with their own abilities; each grants the Shadow a die, lost again if the figure is slain.</p>
  <p><b>Will of the West:</b> a ✦ die may act as any other — and it alone can crown Aragorn (Strider in Minas Tirith, Pelargir or Dol Amroth) or return Gandalf the White (the Grey fallen and a Minion abroad; place him in Fangorn or an Elven stronghold). Each grants an extra die from the next turn.</p>
  <p><b>Elven Rings:</b> you hold three. Once per turn, spend one to change an unused die to another result (never Will of the West); the spent Ring passes to the Shadow, who may burn it for an extra Eye. <i>Three Rings for the Elven-King</i> can win them back.</p>
  <p><b>Gollum:</b> if the Ring-bearers travel with no Companions, Gollum becomes the Guide — healing cards work better, and he can lead the Fellowship off a hunted road (reveal it to reduce Hunt damage by one).</p>
  ${(() => { const c = cardCoverage(); return `<p class="dim"><b>Card coverage:</b> ${c.full} of ${c.total} cards have their full rules implemented (including the combat and table systems); ${c.blocked} await expansion content (factions, siege engines, the Balrog) and are marked in hand; ${c.generic} minor cards still use generic effects.</p>`; })()}
  <p class="dim"><b>Simplifications:</b> some nation-specific unit requirements are judged by elite presence, Nazgûl killed in battle do not return to the reserve, and a few card timings are streamlined. Map adjacency is hand-encoded — expect minor differences from the printed board.</p>
  <div class="btnrow"><button class="abtn subtle" onclick="closeModal()">Close</button></div>`);
};
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });

newGame();
fitViewBox();
drawMap();
renderSheet();
