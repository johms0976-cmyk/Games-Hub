<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw, Partner!</title>
<style>
:root {
  --bg: #f6efe2; --felt: #2f5d46; --felt-2: #275039; --ink: #2b211a; --muted: #6f6253;
  --card: #fffdf8; --red: #b8322a; --black: #1e1b18; --gold: #c8962e; --accent: #8a2d22;
  --ok: #2f7a3e; --bad: #a33a2c; --line: #d8cbb4; --shadow: 0 2px 6px rgba(0,0,0,.18);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
.gingham {
  background-color: #b8322a;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.45) 50%, transparent 50%),
    linear-gradient(rgba(255,255,255,.45) 50%, transparent 50%);
  background-size: 16px 16px;
}
.app { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- title and run screens ---------- */
#screen { padding: 0 16px 32px; }
/* the title scene (bakery/title.py, title_px.py; art/title/scene.js): the train holds still in the middle of its
   trestle while the trestle, the plains and the buffalo scroll left at their own speeds (nearer, faster), so it
   rolls along. Every layer is a strip that tiles sideways; one art pixel is --s css px. Without the art it is
   just the banded sky and the ground. */
/* The title is the scene, full screen (the user, 2026-10-27): the train on its trestle sits on the bottom edge, the
   sky above it, and the words float in the sky: the logo, Start Game, Continue; Options on the grass. The words
   are wood type drawn as pixels (title_px.py WOOD), shown once the art is on; until then their own text, in a
   serif. layoutTitle() places them by where the train actually is, so they clear it on any screen. */
#title { position: fixed; inset: 0; overflow: hidden; z-index: 1; }
.hero { --s: 2; position: absolute; inset: 0; overflow: hidden;
  background: linear-gradient(#8cc4e0 0 25%, #a8d2e4 25% 45%, #cfe0d8 45% 60%, #f0dcb8 60% 62%, #d8bc70 62% 100%); }
html.art .hero { background: linear-gradient(#7cbadb 0 22%, #8cc4e0 22% 44%, #a8d2e4 44% 64%, #cfe0d8 64% 80%, #f0dcb8 80% 100%); }
.titlemenu .wood { position: absolute; left: 50%; transform: translate(-50%, -50%); margin: 0; padding: 0; border: 0; background: none; z-index: 5;
  cursor: pointer; font: 800 30px/1.1 Georgia, serif; letter-spacing: .06em; color: #fbf0d0; text-transform: uppercase;
  text-shadow: 0 0 0 #3a1a12, 2px 2px 0 #3a1a12, -1px -1px 0 #3a1a12, 1px -1px 0 #3a1a12, -1px 1px 0 #3a1a12, 3px 4px 0 rgba(42,22,18,.5); }
.titlemenu .logo { cursor: default; font-size: 36px; color: #f3d070; white-space: nowrap; }
.titlemenu .more { font-size: 20px; }
.titlemenu .wood img { display: none; image-rendering: pixelated; }
html.art .titlemenu .wood.drawn img { display: block; }
html.art .titlemenu .wood.drawn > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.titlemenu .go { padding: 10px 14px; animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translate(-50%, calc(-50% - 6px)); } }
.titlemenu .go:active, .titlemenu .more:active { filter: brightness(1.15); }
.titlemenu .more { padding: 8px 12px; }
.titlemenu .wood:focus-visible { outline: 3px solid #fff6d2; outline-offset: 4px; border-radius: 6px; }
/* The payout, counted out line by line (2026-10-30): in every fight's stars pop-up, and on the sheriff's desk after
   a Showdown. Each line comes in after the one before; a tap shows them all at once. */
.payout { list-style: none; margin: 8px 0; padding: 0; font-size: 15px; }
.payout li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed #d8c8a8; animation: payin .35s ease-out both; animation-delay: calc(var(--i) * .3s); }
.payout li b { white-space: nowrap; color: #6b4a10; }
.payout li.minus b { color: var(--bad); }
.payout li.hp b { color: #2e7a3a; }
.payout li .st { color: #c99a2a; }
.payout li.tot { border-bottom: 0; border-top: 2px solid #8a6412; margin-top: 2px; font-weight: 800; }
.payout.done li { animation: none; }
@keyframes payin { from { opacity: 0; transform: translateX(-10px); } }
@media (prefers-reduced-motion: reduce) { .payout li { animation: none; } }
/* The Showdown's payday (2026-10-30, the user's): the boss's wanted poster on the saloon wall, your gloved hand
   crosses it out in red crayon and stamps it with a red sheriff's star reading PAID, then it slides onto the
   sheriff's desk and the bounty is counted out in his ledger. Art in art/paid (bakery/paid.py); Skip always lands on
   the reward pick, never past it. */
#paid { position: fixed; inset: 0; z-index: 70; overflow: hidden; background: #3a2416; }
#paid[hidden] { display: none; }
#paid .pwall { position: absolute; inset: 0; image-rendering: pixelated; background-repeat: repeat; background-position: 50% 30%; transition: opacity .7s; }
#paid .pdesk { position: absolute; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .7s; }
#paid .pdesk img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#paid.desk .pwall { opacity: 0; } #paid.desk .pdesk { opacity: 1; }
/* the boss's wanted poster: the act's job when it starts (#bounty), crossed out on payday (#paid) */
.wposter { position: relative; width: min(270px, 74vw); padding: 12px 14px 16px; text-align: center;
  background: #f1dfb6; color: #3a1a12; border: 2px solid #8a5a2c; box-shadow: 0 6px 0 rgba(20,10,6,.35), inset 0 0 30px rgba(140,90,40,.35); }
.wposter .nail { position: absolute; left: 50%; top: 5px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #5a5a60; box-shadow: inset -1px -1px 0 #2a2a30; }
.wposter .w { display: block; margin-top: 6px; font: 900 44px/1 Georgia, serif; letter-spacing: .08em; }
.wposter .d { display: block; font: 800 13px/1.4 Georgia, serif; letter-spacing: .3em; }
.wposter img { display: block; width: 100%; margin: 8px 0; image-rendering: pixelated; border: 2px solid #8a5a2c; }
.wposter .n { display: block; font: 800 22px/1.15 Georgia, serif; }
.wposter .rw { display: block; margin-top: 6px; font: 800 15px/1.3 Georgia, serif; letter-spacing: .1em; }
#paid .pposter { position: absolute; left: 50%; top: 14%; transform-origin: 50% 0; transition: transform .9s cubic-bezier(.4, 0, .2, 1); z-index: 2; }
/* The job (the user's, 2026-10-30): once the map's opening pan has come down from the Showdown to where you start,
   the boss's poster unrolls from its rod, the one you will cross out on payday: the reason you rode in. On "Let's
   ride" it folds away onto the map's own wanted board. Once an act (L.sawPoster); never in ?fast. */
#bounty { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px;
  background: rgba(24,14,8,.72); transition: background .5s; }
#bounty[hidden] { display: none; }
#bounty .why { margin: 0; font: 800 13px/1.3 Georgia, serif; letter-spacing: .28em; color: #f3d070; text-align: center; text-transform: uppercase; }
#bounty .scroll { position: relative; padding-top: 10px; }
#bounty .scroll::before { content: ''; position: absolute; left: -10px; right: -10px; top: 0; height: 14px; z-index: 2; border-radius: 7px;
  background: linear-gradient(#a0703e, #6e4424); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
#bounty .wposter { animation: unroll 1.5s cubic-bezier(.35, 0, .2, 1) .25s both; }
#bounty .rod { position: absolute; left: -12px; right: -12px; height: 18px; z-index: 3; border-radius: 9px; background: linear-gradient(#e8d4a6, #c8a870 45%, #8a6a40);
  box-shadow: 0 3px 0 rgba(0,0,0,.3); animation: rolldown 1.5s cubic-bezier(.35, 0, .2, 1) .25s both; }
@keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes rolldown { from { top: 8px; } 92% { opacity: 1; } to { top: calc(100% - 9px); opacity: 0; } }
#bounty .nanline { max-width: 320px; background: #fffaf0; color: #3a2a20; border-radius: 10px; padding: 10px 14px; box-shadow: 0 2px 0 rgba(58,42,32,.3); font-size: 15px;
  opacity: 0; animation: fadein .5s 1.8s forwards; }
#bounty .btn { opacity: 0; animation: fadein .4s 2s forwards; }
@keyframes fadein { to { opacity: 1; } }
#bounty.away { background: rgba(24,14,8,0); pointer-events: none; }
#bounty.away .scroll { transition: transform .7s cubic-bezier(.5, 0, .7, .4), opacity .7s; }
#bounty.away .nanline, #bounty.away .btn, #bounty.away .why { opacity: 0; animation: none; transition: opacity .2s; }
@media (prefers-reduced-motion: reduce) { #bounty .wposter, #bounty .rod, #bounty .nanline, #bounty .btn { animation: none; opacity: 1; } #bounty .rod { display: none; } }
#paid .pposter.hang { animation: hang 1s ease-out; }
@keyframes hang { 0% { transform: translate(-50%, -120%) rotate(-6deg); } 55% { transform: translate(-50%, 0) rotate(3deg); } 75% { transform: translate(-50%, 0) rotate(-1.5deg); } 100% { transform: translate(-50%, 0); } }
#paid .pposter.shake { animation: thump .35s; }
@keyframes thump { 20% { translate: 0 4px; } 45% { translate: -3px 0; } 70% { translate: 2px 0; } }
#paid .px { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#paid .px path { fill: none; stroke: #c0201a; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
#paid .px path.go { opacity: .92; }
#paid .pstamp { position: absolute; left: 50%; top: 56%; width: 84%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1.2); opacity: 0; pointer-events: none;
  filter: drop-shadow(0 0 1px rgba(90,10,6,.5)); }
#paid .pstamp.on { opacity: .94; transform: translate(-50%, -50%) rotate(-14deg) scale(1); transition: transform .12s ease-out, opacity .08s; }
#paid .pglove { position: absolute; left: 0; top: 0; image-rendering: pixelated; z-index: 4; pointer-events: none; display: none; }
#paid .ledger { position: absolute; z-index: 3; font: italic 600 13px/1.25 Georgia, serif; color: #3a2a20; }
#paid .ledger h3 { margin: 0 0 4px; font: 800 14px/1.2 Georgia, serif; letter-spacing: .12em; text-align: center; }
#paid .ledger .payout { font-size: inherit; margin: 0; }
#paid .ledger .payout li { border-bottom-color: rgba(74,58,58,.35); padding: 2px 0; }
#paid .coin { position: absolute; z-index: 5; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #e8b840; box-shadow: inset -2px -2px 0 #b8862a, 0 0 0 1px #6b4a10; pointer-events: none; }
#paid .pbtns { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 10px; z-index: 6; }
#paid .pbtns [data-act="paidcollect"] { display: none; }
#paid.counted .pbtns [data-act="paidcollect"] { display: inline-block; }
#actcard .train2 { position: absolute; left: 0; bottom: 18%; image-rendering: pixelated; animation: wheels .56s steps(4) infinite, trainby 5s linear forwards; }
@keyframes trainby { from { transform: translateX(-110%); } to { transform: translateX(110vw); } }
@media (prefers-reduced-motion: reduce) { #paid .pposter, #paid .pposter.hang { animation: none; } #actcard .train2 { display: none; } }
/* Game over (the user's, 2026-10-30): a freshly covered grave on Boot Hill at dusk. The sky is painted here, the
   buttes and the graveyard are art (art/grave, bakery/grave.py); the camera pushes in on the fresh grave, the buzzard
   watches, a tumbleweed rolls by, then the epitaph comes up. Skip, or the epitaph's button, goes to the run's ending
   behind it. Without the art: the sky, a plain mound and the words. */
#grave { position: fixed; inset: 0; z-index: 70; overflow: hidden; background: linear-gradient(#2e1f4a 0%, #6a3a6a 32%, #c8604a 58%, #f0a050 74%, #f6c070 82%, #edab6a 82.1%); }
#grave[hidden] { display: none; }
#grave .gsun { position: absolute; left: 66%; top: 55%; width: 90px; height: 90px; margin: -45px; border-radius: 50%; background: radial-gradient(#fff3c8 0 40%, #ffd27a 41% 60%, rgba(255,190,100,0) 72%); }
#grave .grig { position: absolute; left: 0; right: 0; bottom: 0; transform-origin: 50% 70%; transition: transform 7s cubic-bezier(.3, 0, .2, 1); }
#grave.push .grig { transform: scale(var(--push, 1.8)); }
#grave .gfar { position: absolute; left: 0; right: 0; image-rendering: pixelated; background-repeat: repeat-x; background-position: 50% 0; }
#grave .gground { position: absolute; left: 0; right: 0; bottom: 0; background: #edab6a; }
#grave .gplate { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); image-rendering: pixelated; }
#grave .gplate img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#grave .gplain { position: absolute; left: 50%; bottom: 18%; width: 160px; height: 46px; margin-left: -80px; border-radius: 50% 50% 8px 8px; background: #6a4228; }
html.art #grave .gplain { display: none; }
#grave .rip { position: absolute; transform: translate(-50%, -50%); font: 800 calc(var(--gk) * 2.4px)/1 Georgia, serif; color: #2a1610; letter-spacing: .02em; opacity: 0; transition: opacity 1.2s 3s; white-space: nowrap; }
#grave.push .rip { opacity: .85; }
#grave .tumble { position: absolute; left: -60px; image-rendering: pixelated; background-size: 200% 100%; animation: tframes .5s steps(2) infinite, troll 6s 1.2s linear forwards; }
@keyframes tframes { to { background-position-x: -200%; } }
@keyframes troll { 0% { transform: translate(0, 0); } 25% { transform: translate(28vw, -10px); } 50% { transform: translate(56vw, 0); } 75% { transform: translate(84vw, -8px); } 100% { transform: translate(calc(100vw + 120px), 0); } }
#grave .gcard { position: absolute; left: 50%; top: 9%; transform: translate(-50%, 10px); width: min(360px, calc(100% - 32px)); padding: 16px 18px 14px; text-align: center;
  background: #f4e3bf; color: #2a1b16; border: 3px solid #5a3a22; border-radius: 6px; box-shadow: 0 6px 0 rgba(30,14,10,.45); opacity: 0; transition: opacity .9s, transform .9s; }
#grave.said .gcard { opacity: 1; transform: translate(-50%, 0); }
#grave .gcard small { display: block; font: 800 12px/1 Georgia, serif; letter-spacing: .3em; color: #7a1d17; }
#grave .gcard b { display: block; margin: 6px 0 2px; font: 800 24px/1.15 Georgia, serif; }
#grave .gcard p { margin: 6px 0 10px; font-size: 15px; line-height: 1.35; }
#grave .gskip { position: absolute; right: 12px; bottom: 12px; }
@media (prefers-reduced-motion: reduce) { #grave .grig { transition: none; } #grave .tumble { display: none; } #grave .gcard { transition: none; } }
/* the main menu (2026-10-30): Start opens it in the sky over the train; the words are wood type like Start's */
.titlemenu .item { display: none; }
#title.menu .titlemenu .item { display: block; }
#title.menu .titlemenu .go { display: none; }
.titlemenu .item:disabled { opacity: .55; cursor: default; }
.titlemenu .item small { display: block; font: 700 12px/1.2 Georgia, serif; letter-spacing: .04em; text-transform: none; color: #fbf0d0; }
html.art .titlemenu .item.drawn small { position: static; width: auto; height: auto; clip: auto; overflow: visible; margin-top: 2px; text-shadow: 1px 1px 0 #3a1a12; }
.titlemenu .back { font-size: 16px; }
/* choosing a partner and the Standard 500 opponents: cards on a board */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
.rider { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 10px 8px; min-height: 120px; border: 2px solid #8a5a2c;
  border-radius: 8px; background: #f4e3bf; color: #2a1b16; font: inherit; cursor: pointer; }
.rider b { font: 700 16px/1.2 Georgia, serif; } .rider i { font-size: 12px; color: #6b4a10; } .rider span { font-size: 13px; line-height: 1.3; }
.rider .face { width: 54px; height: 64px; }
.rider .face img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
.rider:disabled { cursor: default; filter: grayscale(1); opacity: .55; }
.rider .lock { font-size: 12px; font-weight: 700; color: #7a1d17; }
.titleopts { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); z-index: 10; margin: 0; }
@media (prefers-reduced-motion: reduce) { .titlemenu .go { animation: none; } }
.hero .lyr, .hero .train, .hero .puff { position: absolute; display: none; image-rendering: pixelated; pointer-events: none; }
html.art .hero .lyr, html.art .hero .train, html.art .hero .puff { display: block; }
.hero .lyr { left: 0; right: 0; background-repeat: repeat-x; animation: hscroll var(--dur) linear infinite; }
@keyframes hscroll { from { background-position-x: 0; } to { background-position-x: calc(-1 * var(--tw)); } }
.hero .train { animation: wheels .56s steps(4) infinite; }
@keyframes wheels { from { background-position-x: 0; } to { background-position-x: calc(-4 * var(--fw)); } }
.hero .puff { opacity: 0; animation: puff 2.8s ease-out infinite; transform-origin: 50% 50%; }
@keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 8% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-34px * var(--s)), calc(-30px * var(--s))) scale(2.2); } }
@media (prefers-reduced-motion: reduce) { .hero .lyr, .hero .train, .hero .puff { animation: none; } .hero .puff:not(:first-of-type) { display: none; } }

/* The opening (storyboard frames 2-5, 2026-10-27): Start blows the whistle and the title's words drop away (2);
   the hero fills the screen and its rig tilts down past the plains to the trail, where the stagecoach rolls in
   (3); the camera pulls up at the town sign while the coach rolls on into town (the user's, 2026-10-29: it used
   to stop at the sign), and closes in on the sign as the coach passes it, so the coach drives out of the frame
   during the zoom (the user's, later 2026-10-29); the WELCOME plank falls away to
   show DANGER! DO NOT ENTER, then the coach's dust wipes the screen (4); the act card (5); then the card pick (6).
   Paced at 60% of the first cut (the user's, 2026-10-27: too fast to read the sign). The sign is planted in the
   ground, so it moves at the trail's speed; the camera brakes the ground to a stop, and the coach, still at the
   trail's speed, drives on and speeds off the right edge (signRun).
   A tap, a key or Skip ends it at once; reduced motion is a plain fade to the act card; Continue is a short dust
   wipe. The stage under the hero (.below) is clipped until the tilt. */
.hero .rig { position: absolute; left: 0; right: 0; top: 0; transition: transform 2.6s cubic-bezier(.55, 0, .35, 1); }
.hero .below { position: absolute; left: 0; right: 0; display: none; }
html.art .hero .below { display: block; }
.hero .meadow { position: absolute; inset: 0; image-rendering: pixelated; animation: hscroll var(--dur) linear infinite; }
.hero .stagecoach { position: absolute; image-rendering: pixelated; animation: wheels .83s steps(4) infinite; transform: translateX(-120vw);
  transition: transform 2.5s cubic-bezier(.2, .7, .3, 1); }
.hero .townsign { position: absolute; left: 100%; image-rendering: pixelated; }
.hero .signcover { position: absolute; image-rendering: pixelated; }
body.signdrop .hero .signcover { animation: plankfall 1.5s cubic-bezier(.4, 0, .6, 1) forwards; }
/* it hangs on its left nail: the right end drops, it swings, the nail gives and it falls out of the frame */
@keyframes plankfall { 0% { transform: none; } 12% { transform: rotate(9deg); } 24% { transform: rotate(5deg); }
  48% { transform: rotate(72deg); } 60% { transform: rotate(58deg); } 70% { transform: rotate(66deg); opacity: 1; }
  100% { transform: translateY(420%) rotate(120deg); opacity: 0; } }
body.tilt .hero .stagecoach { transform: none; }
#title > :not(.hero) { transition: transform .6s ease-in, opacity .5s ease-in; }
body.opening #title > :not(.hero) { transform: translateY(60px); opacity: 0; pointer-events: none; }
body.tilt .hero { position: fixed; left: 0; right: 0; top: 0; margin: 0; z-index: 60; transition: height .45s ease-out; }
body.signzoom .hero { transform-origin: 0 0; transition: transform 1s cubic-bezier(.45, 0, .3, 1); }
#dustwipe, #actcard { position: fixed; inset: 0; z-index: 70; pointer-events: none; opacity: 0; }
#dustwipe { z-index: 75; background: #ead6ae; transition: opacity .45s; overflow: hidden; }
#dustwipe .dp { position: absolute; image-rendering: pixelated; animation: dustgrow 1s ease-out forwards; }
@keyframes dustgrow { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-50%, -50%) scale(5); opacity: 1; } }
#dustwipe.on { opacity: 1; background-color: transparent; }
#dustwipe.full { background-color: #ead6ae; }
#actcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
  background: #f2ddb0 center bottom / cover no-repeat; image-rendering: pixelated; transition: opacity .5s; }
#actcard.on { opacity: 1; pointer-events: auto; }
#actcard .board { background: #7a3b2a; border: 4px solid #4a2626; box-shadow: 0 0 0 3px #a8603a, 0 8px 0 rgba(58,42,32,.35); padding: 14px 28px 16px;
  text-align: center; color: #fbf3e2; font-family: Georgia, serif; transform: rotate(-1.5deg); animation: boardin .55s cubic-bezier(.3, 1.5, .5, 1); }
#actcard .board small { display: block; letter-spacing: .3em; font-size: 14px; color: #f3d070; }
#actcard .board b { display: block; font-size: 34px; letter-spacing: .08em; font-weight: 800; }
#actcard .board span { display: block; font-size: 14px; color: #f3e3c0; margin-top: 4px; }
@keyframes boardin { from { transform: translateY(-80px) rotate(-8deg); opacity: 0; } }
#actcard .nanline { background: #fffaf0; color: #3a2a20; border-radius: 10px; padding: 10px 14px; max-width: 320px; box-shadow: 0 2px 0 rgba(58,42,32,.3);
  font-size: 15px; animation: boardin .55s .35s both; }
#skipOpening { position: fixed; top: 10px; right: 10px; z-index: 80; display: none; }
body.opening #skipOpening { display: block; }
/* frame 6: the act-start pick is cards dealt onto green baize */
.panel.baize { overflow: hidden; background: #2f6a44; border: 6px solid #6e4a2c; color: #f6efe2; box-shadow: inset 0 0 0 2px #24543a, var(--shadow); }
.panel.baize h2 { color: #f3d070; } .panel.baize p { color: #e8efe2; }

/* Act I's map is Dustwater (btp-town.js): one long Main Street that scrolls. Back to front: the baked plate
   (art only), the footpaths, the buildings and townsfolk (art only, nearer ones in front), and the stop
   markers on top. The markers are the buttons, ringed in their kind's colour (the legend's swatches), so the
   route reads and plays the same with no art at all. */
.k-dance { --k: #9a6a3a; } .k-elite { --k: #b8483a; } .k-event { --k: #4f8a94; } .k-store { --k: #5d8a4e; }
.k-camp { --k: #4f6a9a; } .k-raffle { --k: #d4a940; } .k-boss { --k: #7a3b2a; } .k-bank { --k: #8d8577; } .k-water { --k: #3f7fae; }

.mapbox .nd .pips { position: absolute; bottom: -4px; right: -6px; margin: 0; }
.mapbox .nd.dead .pips { display: none; }
/* the wanted posters under the map */
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 4px; }
.poster { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: start; text-align: left; padding: 7px 8px 8px; min-width: 0;
  background: #f4e3bf; border: 2px solid #8a5a2c; border-top: 5px solid var(--k); border-radius: 3px; color: #2a1b16; font: inherit; cursor: pointer;
  box-shadow: 0 2px 0 rgba(0,0,0,.18); }

.poster .pbody { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.poster .w { font: 800 12px/1 Georgia, serif; letter-spacing: .14em; color: #7a1d17; }
.poster b { font: 700 14px/1.2 Georgia, serif; }

.poster ul { margin: 2px 0 0; padding: 0; list-style: none; font-size: 12px; line-height: 1.3; }
.poster li { color: #8a2a1e; }
.poster li b { font-family: inherit; font-size: 12px; line-height: 1.3; color: #8a2a1e; }
.poster .bty { margin-top: 2px; font-size: 12px; font-weight: 700; color: #6b4a10; }
.mapbox.dust { background: #e3c48e; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px #c9a46a; }
.mapbox.dust .road { position: absolute; top: 0; bottom: 0; background: #d2a874; }
.mapbox.dust .plate, .mapbox.dust .spr, .mapbox.dust .amb { position: absolute; display: none; image-rendering: pixelated; pointer-events: none; }
.mapbox.dust .plate { left: 0; top: 0; width: 100%; height: 100%; }
html.art .mapbox.dust .plate, html.art .mapbox.dust .spr, html.art .mapbox.dust .amb { display: block; }

.mapbox.dust svg { z-index: 1; }
.mapbox.dust .fp { fill: none; stroke: #6e4a2c; stroke-width: 2; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .6; vector-effect: non-scaling-stroke; }
.mapbox.dust .fp.can { stroke: #fff6d2; stroke-width: 3; stroke-dasharray: 2 6; opacity: 1; animation: march .9s linear infinite; }
.mapbox.dust .fp.walked { stroke: #4a2c1c; stroke-width: 2.5; stroke-dasharray: 3 4; opacity: .9; }
@keyframes march { to { stroke-dashoffset: -8; } }
.mapbox.dust .nd { width: 26px; height: 26px; border: 3px solid var(--k); background: #fbf3e2; color: #3a2a20; z-index: 2000;
  box-shadow: 0 0 0 1px #3a2a20, 0 2px 0 1px rgba(58,42,32,.45); }
.mapbox.dust .nd::after { content: ""; position: absolute; inset: -8px; }
.mapbox.dust .nd svg { width: 15px; height: 15px; }

.mapbox.dust .nd.can { border-color: var(--k); box-shadow: 0 0 0 1px #3a2a20, 0 0 0 4px #fff6d2, 0 0 0 6px var(--gold); animation: mkpulse 1.4s ease-in-out infinite; }
@keyframes mkpulse { 50% { box-shadow: 0 0 0 1px #3a2a20, 0 0 0 4px #fff6d2, 0 0 0 11px rgba(200,150,46,.2); } }
.mapbox.dust .nd.done { background: #e6d4b4; color: #8a6a48; }
.mapbox.dust .nd.here { background: var(--accent); color: #fff; }
.mapbox.dust .nd.dead { opacity: .4; }
.mapbox.dust .nd .sign { display: none; }
.mapbox.dust .nd.boss .sign { display: block; position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 4px;
  font: 800 11px/1 Georgia, serif; letter-spacing: .08em; color: #fbf3e2; background: #7a3b2a; padding: 3px 5px; border-radius: 2px; }
html.art .mapbox.dust.hasplate .nd.boss .sign { display: none; }
.mapbox.dust .stage { position: absolute; transform: translate(-50%, -50%); font-size: 12px; color: #5a3b28; white-space: nowrap; z-index: 1; }
html.art .mapbox.dust.hasplate .stage { display: none; }
/* Act II's map is the Westbound Express (btp-train.js, 2026-10-29): Dustwater's box and markers, the paths drawn
   as rails (ties, then the two rails) in the plate's own units, so they scale with it. The ways on glow gold. */
.mapbox.train .rl path { fill: none; }
.mapbox.train .rl .tie { stroke: #6a4a30; stroke-width: 12; stroke-dasharray: 1.6 2.2; opacity: .9; }
.mapbox.train .rl .rail { stroke: #4a4a50; stroke-width: 1.1; }
.mapbox.train .rl.walked .rail { stroke: #e3d6b4; }
.mapbox.train .rl.can .rail { stroke: #ffd65a; stroke-width: 1.7; animation: railglow 1.1s ease-in-out infinite; }
@keyframes railglow { 50% { stroke: #fff6d2; } }
.mapbox.train .amb.puff { animation-duration: .7s; }
/* Under way (2026-10-29): the ground streams down past the carriages in three strips (desert, red rock, canyon;
   each a tile that repeats, its .roll one tile taller than the strip and slid down by a tile, over and over), the
   rails' ties stream with it (each tie path timed so its ties fall as fast as the ground: trainBox), and the
   carriages rock on their wheels and drift a little ahead and behind, as trains on side-by-side tracks would.
   --ap is one art pixel. The strips fade into each other where they overlap. */
.mapbox.train { container-type: inline-size; --ap: calc(100cqw / 180); }
.mapbox.train .band { position: absolute; left: 0; width: 100%; overflow: hidden; display: none; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%); }
html.art .mapbox.train .band { display: block; }
.mapbox.train .band .roll { position: absolute; left: 0; top: 0; width: 100%; background-repeat: repeat-y; image-rendering: pixelated;
  animation: groundroll var(--period) linear infinite; }
@keyframes groundroll { from { transform: translateY(calc(-1 * var(--tile))); } to { transform: translateY(0); } }
.mapbox.train .rl .tie { animation: ties 1s linear infinite; }
@keyframes ties { to { stroke-dashoffset: 3.8; } }
.mapbox.train .spr.car { animation: rock var(--rock, .7s) steps(1) var(--late, 0s) infinite, drift var(--drift, 11s) ease-in-out var(--late, 0s) infinite alternate; }
@keyframes rock { 50% { transform: translateY(calc(var(--ap) * -1)); } }
@keyframes drift { from { translate: 0 calc(var(--ap) * -1.5); } to { translate: 0 calc(var(--ap) * 1.5); } }
/* for show only: now and then a crossover is laid ahead of a carriage up the line and streams down with the ground,
   and the carriage runs over it onto the empty track beside it (trainShuffle, btp-train.js crossover). The S fades
   in and out at the edges of its stretch (its mask); its ties ride on it, so they do not stream as well. */
.mapbox.train .rl.xover .tie { animation: none; }
@media (prefers-reduced-motion: reduce) { .mapbox.train .rl.can .rail, .mapbox.train .band .roll, .mapbox.train .rl .tie, .mapbox.train .spr.car { animation: none; } }
/* the ambient loops: two frames side by side in one picture, flipped; a tumbleweed also rolls across its street */
.mapbox.dust .amb { background-size: 200% 100%; background-repeat: no-repeat; animation: flip2 .5s steps(1) infinite; }
@keyframes flip2 { 0%, 49.9% { background-position: 0 0; } 50%, 100% { background-position: 100% 0; } }
.mapbox.dust .amb.roll { animation: flip2 .32s steps(1) infinite, roll var(--dur) linear var(--delay) infinite; }
@keyframes roll { from { left: var(--from); } to { left: var(--to); } }
.mapbox.dust .amb.peck { animation-duration: 1.3s; } .mapbox.dust .amb.wag { animation-duration: .6s; } .mapbox.dust .amb.wave { animation-duration: .45s; }
@media (prefers-reduced-motion: reduce) { .mapbox.dust .fp.can, .mapbox.dust .nd.can, .mapbox.dust .amb { animation: none; } }
.wanted .mug { display: none; }
html.art .wanted.hasart { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; text-align: left; }
html.art .wanted .mug { display: block; grid-row: span 4; height: 80px; width: auto; image-rendering: pixelated; border: 2px solid #8a5a2c; }
html.art .wanted.hasart .w { grid-column: 2; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--k); box-shadow: 0 0 0 1px #3a2a20; }
/* the act's boss, on a wanted poster above the map */
.wanted { margin: 6px auto 2px; max-width: 400px; padding: 8px 12px 9px; background: #f4e3bf; border: 2px solid #8a5a2c; border-radius: 3px;
  box-shadow: 3px 3px 0 rgba(90,59,40,.22); text-align: center; }
.wanted .w { display: block; font: 800 18px/1.1 Georgia, serif; letter-spacing: .14em; color: #7a1d17; }

/* ---------- table ---------- */
#game { display: flex; flex-direction: column; min-height: 100vh; }
.top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top .name { font-family: Georgia, serif; font-weight: 700; color: var(--accent); margin-right: auto; }
.pill { border-radius: 999px; padding: 3px 10px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.pill.neg b { color: var(--bad); }
/* health and gold: the two numbers a run is played for, big enough to read at a glance */
.stats { display: flex; gap: 8px; align-items: stretch; flex: 1 1 auto; min-width: 0; }
.stat { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 4px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.stat .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); line-height: 1.1; }
.stat .val { font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.hp { flex: 1 1 auto; }
.stat.hp .val { color: var(--ok); }
.stat.hp.low .val { color: #b7791f; }
.stat.hp.danger { border-color: var(--bad); background: #fbeae6; }
.stat.hp.danger .val { color: var(--bad); }
.stat.hp .hpm { display: block; height: 5px; border-radius: 3px; background: #e7dcc8; margin-top: 3px; overflow: hidden; }
.stat.hp .hpm i { display: block; height: 100%; background: var(--ok); }
.stat.hp.low .hpm i { background: #d69e2e; }
.stat.hp.danger .hpm i { background: var(--bad); }
.stat.hp small { font-size: 11px; color: var(--muted); line-height: 1.2; }
.stat.gold .val { color: #8a6412; }
.stat .delta { position: absolute; right: 6px; top: 2px; font-size: 13px; font-weight: 800; animation: deltafade 2.6s ease-out forwards; }
.stat .delta.up { color: var(--ok); } .stat .delta.down { color: var(--bad); }
@keyframes deltafade { 0% { opacity: 0; transform: translateY(4px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
.lvlpill { font-size: 13px; color: var(--muted); white-space: nowrap; }
/* what the objective is worth: the stars you'd get if the level ended now, and what they pay */
.objective .pay { width: 100%; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; font-size: 13px; padding: 2px 8px; margin-top: 0; border-radius: 8px; background: #fff; border: 1px dashed var(--line); text-align: left; color: var(--ink); }
.objective .pay .st { color: var(--gold); letter-spacing: 1px; font-size: 16px; }

.paytable { width: 100%; border-collapse: collapse; margin: 6px 0; }
.paytable td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }

/* cards: hold one down for what it does */
.card { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.cardinfo > .card { display: flex; margin: 0 auto 8px; }
.cardinfo .tags span { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; margin: 0 4px 4px 0; }
.cardinfo .tags .buff { background: #fff3cf; color: #8a6412; } .cardinfo .tags .buff.legendary { background: #efe4ff; color: #4a2a6e; } .cardinfo .tags .hex { background: #fbeae6; color: var(--bad); } .cardinfo .tags .plain { background: var(--bg); color: var(--muted); }
.cardinfo ul { padding-left: 18px; } .cardinfo li { margin: 6px 0; }
.iconbtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 14px; min-height: 40px; }
.iconbtn[data-act="takeback"] { min-height: 40px; margin-left: 6px; border-color: var(--accent); color: var(--accent); }
.objective { display: flex; align-items: center; gap: 4px 10px; padding: 5px 12px; background: #fffaf0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

/* the gang you are fighting: name, abilities, what is left of its health */

/* a gang's abilities and its hit are buttons: tap for what they mean (the user's, 2026-10-30) */

.felt { flex: none; background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-2) 100%); color: #fff; position: relative; overflow: hidden; }
.seat { text-align: center; font-size: 14px; }
.seat .who { font-weight: 700; }
.seat .backs { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
.seat .backs i { width: 14px; height: 20px; border-radius: 3px; border: 1px solid rgba(255,255,255,.6); }
.seat .tag { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 13px; }
.seat.turn .who { color: #ffe08a; }
.nan { display: flex; align-items: center; justify-content: center; gap: 8px; }
.face { width: 38px; height: 38px; border-radius: 50%; background: #f1d3b3; border: 2px solid #fff; position: relative; flex: none; }
.face::before { content: ""; position: absolute; left: 4px; right: 4px; top: -3px; height: 14px; border-radius: 12px 12px 4px 4px; background: #d9d9d9; }
.face::after { content: ""; position: absolute; left: 11px; top: 17px; width: 4px; height: 4px; border-radius: 50%; background: #3a2a20; box-shadow: 10px 0 0 #3a2a20; }
.face.cheer { animation: bob .5s ease 2; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.bubble { background: #fff; color: var(--ink); border-radius: 10px; padding: 3px 9px; font-size: 13px; max-width: 170px; text-align: left; }
/* The card table, look B (the user's pick, 2026-10-28): across the table at eye level. The stage (wall, the
   gang's figures, Nan, the table's rim and baize, the gang's nameplate) is built once a fight and kept, so the
   gang's flinch and gloat play out; the seats' plaques, bids and the trick are a layer over it, redrawn every
   render. Art pixels are --k screen pixels (2-4, by width); the stage is 200 x 112 art px, centred, the gang at
   x ±(22..62) from the middle with their chests behind the rim (EDGE, 76). Without the art (html.art unset) the
   felt is the plain green it always was and the same plaques and trick sit on it. Art: bakery/saloon_px.py. */
.felt { --k: 3; --ax: calc(var(--k) * 1px); --lift: 5; }
.stage, .dyn { position: absolute; inset: 0; }
/* --drop: where the scale is small the nameplate would cover the gang's faces, so everything under it moves down */
.stage .wall, .stage .tbl, .stage .fig, .stage .nanfig { translate: 0 var(--drop, 0px); }
.dyn { top: var(--drop, 0px); }
.stage .wall, .stage .tbl { position: absolute; left: 50%; top: calc(-1 * var(--lift) * var(--ax)); width: calc(200 * var(--ax)); height: calc(112 * var(--ax)); transform: translateX(-50%);
  background: center / 100% 100% no-repeat; image-rendering: pixelated; display: none; }
.stage .tbl { z-index: 2; }
html.art .felt.dressed { background: #2b6748; }
html.art .felt.dressed .wall, html.art .felt.dressed .tbl, html.art .felt.dressed .fig { display: block; }
.stage .fig { position: absolute; display: none; top: calc((24 - var(--lift)) * var(--ax)); width: calc(40 * var(--ax)); height: calc(56 * var(--ax)); z-index: 1; }
.stage .fig img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.stage .fig.w { left: calc(50% - 62 * var(--ax)); } .stage .fig.w img { transform: scaleX(-1); }
.stage .fig.e { left: calc(50% + 22 * var(--ax)); }
.stage .fig.turn img { filter: drop-shadow(0 0 2px #ffe08a) drop-shadow(0 0 1px #ffe08a); }
.stage .fig.hit { animation: flinch .55s; } .stage .fig.hit img { filter: brightness(1.45) saturate(.6) sepia(.35); }
@keyframes flinch { 15% { transform: translate(-5px, 2px) rotate(-2deg); } 35% { transform: translate(5px, -1px) rotate(2deg); } 55% { transform: translate(-3px, 0); } 75% { transform: translate(2px, 0); } }
.stage .fig.gloat { animation: gloat .45s 2; }
/* a card's shot (Hollow Point and the rest) lands on the trick: the gang is knocked back and flashes red */
.stage .fig.shot { animation: shot .7s; } .stage .fig.shot img { animation: shotflash .7s; }
@keyframes shot { 8% { transform: translate(7px, -3px) rotate(5deg); } 22% { transform: translate(-4px, 1px) rotate(-3deg); } 40% { transform: translate(3px, 0) rotate(1deg); } 60% { transform: translate(-1px, 0); } }
@keyframes shotflash { 0%, 30% { filter: brightness(1.6) sepia(1) saturate(5) hue-rotate(-40deg); } 100% { filter: none; } }
.stage .plate.shake { animation: plateshake .45s; }
@keyframes plateshake { 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
.pop.shot { color: #ffe08a; font-size: 22px; }
.pop.shot small { display: block; font-size: 12px; -webkit-text-stroke: 0; color: #fff3d0; }
/* who bid what, at the table after the auction (the user's, 2026-10-30): the winner's bid in gold, the rest faded */
.dyn .seat .tag.won { background: #f3d070; border-color: #6b4a10; }
.dyn .seat .tag.lost { background: #e8e0d0; color: #6a5a48; border-color: #8a7a68; font-weight: 700; }
.bidwon { position: absolute; left: 50%; top: calc(var(--edge) * var(--ax) + 12px); transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 8px;
  background: rgba(28,20,14,.86); color: #fff3d0; font-size: 15px; text-align: center; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.3); animation: bidwon .5s ease-out; }
.bidwon b { color: #f3d070; } .bidwon small { display: block; font-size: 12px; color: #e8d3a8; }
@keyframes bidwon { from { transform: translate(-50%, 8px); opacity: 0; } }
.bidlog { display: flex; flex-wrap: wrap; gap: 4px; }
.bidlog .bl { padding: 1px 7px; border-radius: 999px; background: #efe6d6; color: #5a4a38; font-size: 13px; }
.bidlog .bl.hi { background: #f3d070; color: #2a1b16; font-weight: 800; }
.bidlog .bl.ps { opacity: .7; }
.raisehead { color: #6b4a10; }
/* the enhancement pick: the chosen enhancement and card, and why a card can't take it */
.choice.on { border-color: #8a6412; box-shadow: inset 0 0 0 2px var(--gold); background: #fff8e2; }
.pickrow { align-items: flex-start; }
.pickc { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.pickc small { font-size: 11px; color: var(--muted); min-height: 14px; }
.card.picked { transform: translateY(-8px); outline: 3px solid var(--gold); outline-offset: 1px; }
@keyframes gloat { 50% { transform: translateY(-6px); } }
.stage .nanfig { position: absolute; z-index: 1; left: calc(50% - 18.5 * var(--ax)); top: calc((38 - var(--lift)) * var(--ax)); width: calc(37 * var(--ax)); height: calc(44 * var(--ax)); }
.felt:not(.dressed) .stage .nanfig, html:not(.art) .stage .nanfig { top: calc(22 * var(--ax)); }
.nansvg { width: 100%; height: 100%; display: block; overflow: visible; }
.nansvg .breathe { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; }
@keyframes breathe { 50% { transform: translateY(1.2px) scaleY(.985); } }
.nansvg .lids { animation: blink 4.6s infinite; transform-origin: 50% 50%; transform-box: fill-box; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
.stage .nanfig.cheer { animation: gloat .45s 2; }
/* the gang's nameplate: one health bar for the pair */
.stage .foe { position: absolute; z-index: 4; left: 8px; right: 8px; top: 5px; width: auto; color: #f6e7c4; background: #6e4630; border: 3px solid #2a1b16;
  box-shadow: inset 0 0 0 2px #9a6e48; border-radius: 4px; padding: 1px 8px 4px; max-width: 520px; margin: 0 auto; line-height: 1.25; }
.stage .foe .fn b { color: #fff3d0; font-family: Georgia, serif; font-size: 16px; }
.stage .foe .fhp { color: #fff3d0; } .stage .foe .fhit { color: #e8d3a8; }
.stage .foe .foebar { background: rgba(0,0,0,.35); position: relative; }
.stage .foe .foebar i { position: absolute; left: 0; top: 0; bottom: 0; z-index: 1; }
.stage .foe .foebar s { position: absolute; left: 0; top: 0; bottom: 0; background: #f3d070; text-decoration: none; transition: width 1.2s .5s ease-out; }
.stage .foe .ox { color: #f3d070; font-size: 12px; }
.pop { position: absolute; z-index: 9; font-weight: 900; font-size: 26px; color: #fff; -webkit-text-stroke: 1px #2a1b16; text-shadow: 0 2px 0 #2a1b16; pointer-events: none;
  animation: pop 1.2s ease-out forwards; transform: translateX(-50%); }
.pop.bad { color: #ffb3a6; }
@keyframes pop { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -36px; } }
@media (prefers-reduced-motion: reduce) { .stage .fig, .stage .nanfig, .nansvg .breathe, .nansvg .lids, .pop { animation: none !important; } }
/* the seats over the stage: a bid bubble over each head, a plaque on the rim (name, cards left, a Tell) */
.dyn { z-index: 3; }
.dyn .seat { position: absolute; top: 0; width: 0; }
.dyn .seat.west { left: calc(50% - 42 * var(--ax)); } .dyn .seat.east { left: calc(50% + 42 * var(--ax)); } .dyn .seat.north { left: 50%; }
.dyn .plaque { position: absolute; top: calc(var(--edge) * var(--ax) - 24px); transform: translateX(-50%); left: 0; display: flex; align-items: center; gap: 4px; background: rgba(28,20,14,.72);
  border-radius: 999px; padding: 1px 8px 1px 6px; font-size: 13px; white-space: nowrap; }
.dyn .seat .who { font-weight: 700; }
.dyn .seat .backs { margin-top: 0; }
.dyn .seat .backs i { width: 9px; height: 13px; border-radius: 2px; }
.dyn .seat .tag { position: absolute; bottom: 4px; left: 0; transform: translateX(-50%); margin: 0; background: #fff; color: var(--ink); border: 2px solid #2a1b16; font-weight: 800; white-space: nowrap; }
.dyn .bidbox { position: absolute; top: calc((18 - var(--lift)) * var(--ax)); height: 0; }
.dyn .seat.north .bidbox { top: calc((34 - var(--lift)) * var(--ax)); }
.dyn .seat.turn .plaque { background: #8a6412; color: #fff3d0; }
.dyn .lips { position: absolute; z-index: 1; top: calc(var(--edge) * var(--ax) + 2px); left: 50%; transform: translateX(-50%); }
.dyn .nanbubble { position: absolute; left: calc(50% + 20 * var(--ax)); top: calc((30 - var(--lift)) * var(--ax)); z-index: 5; max-width: 150px; }
.trickzone { position: absolute; left: 0; right: 0; top: calc(var(--edge) * var(--ax) + 6px); bottom: 0; }
.trickzone .slot { position: absolute; transform: translateX(-50%); }
.trickzone .s1 { left: calc(50% - 80px); top: 4px; } .trickzone .s3 { left: calc(50% + 80px); top: 4px; }
.trickzone .s2 { left: calc(50% - 25px); top: 0; } .trickzone .s0 { left: calc(50% + 25px); top: 10px; }
.trickzone .slot.win .card { outline: 3px solid #ffe08a; outline-offset: 1px; }
.felt.strip .stage > :not(.plate) { display: none !important; }
.felt.strip .dyn .seat.west { left: 18%; } .felt.strip .dyn .seat.east { left: 82%; }
.felt.strip .dyn .plaque { top: 50px; }
.felt.strip .dyn .plaque .tag, .dyn .plaque .tag { position: static; transform: none; border-width: 1px; padding: 0 6px; margin-left: 2px; }
.dyn .plaque .tag { font-size: 12px; line-height: 16px; }
.tally { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .9; }
.coach { display: flex; gap: 10px; align-items: flex-start; background: #fff8e6; border-top: 1px solid var(--gold); padding: 8px 12px; font-size: 15px; }
.coach .face { width: 32px; height: 32px; }
.coach .face::after { left: 9px; top: 14px; box-shadow: 8px 0 0 #3a2a20; }
.coach p { margin: 0; flex: 1; }
.coach button { border: 1px solid var(--gold); background: #fff; border-radius: 8px; padding: 4px 10px; min-height: 40px; flex: none; }
#screen .coach { border: 1px solid var(--gold); border-radius: 10px; margin-top: 12px; }

.bidgrid.tall { gap: 3px; }
.bidgrid.tall button { min-height: 32px; padding: 1px 2px; }
.bidgrid.tall button .v { font-size: 11px; }
.seat .backs b { font-size: 12px; margin-left: 3px; align-self: center; }
.feltcoach { position: absolute; z-index: 8; left: 8px; right: 8px; bottom: 8px; border: 1px solid var(--gold); border-radius: 10px; color: var(--ink); font-size: 14px; }

/* ---------- cards ----------
   Every face is drawn here: the pixel rank and suit (SVG, built in cardHTML), pip layouts on the number cards,
   a big suit on the courts, gold and red badges for buffs and hexes. The art (bakery/ -> art/) is only a
   picture laid over the courts and the Joker once html.art is set, which happens after a picture has
   actually loaded: so a missing file, ?noart, or a test without images all show these drawn faces. */
.card { --rp: 2; --sp: 1.5; --pp: 1; --bp: 3; --ip: 1; width: 64px; height: 90px; border-radius: 7px; background: var(--card);
  border: 2px solid #2a1b16; box-shadow: inset 0 0 0 1px #fffaf0, 0 2px 0 rgba(0,0,0,.22); color: var(--black); position: relative;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; flex: none; overflow: hidden;
  isolation: isolate; }   /* its art, index and badges stack inside the card, never over the felt's text */
.card svg.px { display: block; shape-rendering: crispEdges; width: calc(var(--gw) * var(--p, 1) * 1px); height: calc(var(--gh) * var(--p, 1) * 1px); }
.card .ix { position: absolute; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px;
  background: var(--card); border-radius: 0 0 4px 0; line-height: 0; }
.card .ix.r { top: 1px; left: 1px; }
.card .ix2 { bottom: 1px; right: 1px; transform: rotate(180deg); }
.card .ix .rk { display: flex; align-items: flex-start; gap: 1px; }
.card .ix .g { --p: var(--rp); } .card .ix .u { --p: var(--sp); }
.card .ix.jk { gap: 1px; } .card .ix.jk svg { --p: calc(var(--sp) * .75); }
.card .ix .up { font-size: 10px; line-height: 1; color: var(--gold); font-weight: 800; }
.card .s { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; }
.card .s svg { --p: var(--bp); }
.card .s .pp { position: absolute; transform: translate(-50%, -50%); line-height: 0; }
.card .s .pp svg { --p: var(--pp); }
.card .s .pp.inv { transform: translate(-50%, -50%) rotate(180deg); }
.card .art { display: none; position: absolute; inset: 1px; z-index: 1; border-radius: 4px; background: center / cover no-repeat; image-rendering: pixelated; }
html.art .card .art { display: block; }
.card .eb, .card .hb { position: absolute; z-index: 3; padding: 2px; border-radius: 3px; line-height: 0; box-shadow: 0 0 0 1px #2a1b16; }
.card .eb { left: 2px; bottom: 2px; background: var(--gold); } .card .hb { right: 2px; top: 2px; background: var(--bad); }
/* a card's enhancement badges in a row at its foot; a Legendary card (two enhancements, 2026-10-29) has a foil
   frame: violet and gold, with a sheen that sweeps across it */
.card .ebs { position: absolute; left: 2px; bottom: 2px; z-index: 3; display: flex; gap: 2px; }
.card .ebs .eb { position: static; }
.card.legendary .ebs .eb { background: #e8c45a; box-shadow: 0 0 0 1px #4a2a6e; }
.card.legendary { border-color: #4a2a6e; box-shadow: inset 0 0 0 2px #e8c45a, inset 0 0 0 4px #9a6ad0, 0 0 0 1px #c9a8f0, 0 2px 0 rgba(0,0,0,.22); }
.card.legendary::after { content: ''; position: absolute; inset: 0; z-index: 2; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255,244,214,.5) 46%, rgba(200,160,255,.35) 54%, transparent 65%) 0 0 / 260% 100% no-repeat;
  animation: foil 3.2s linear infinite; }
@keyframes foil { from { background-position: 130% 0; } to { background-position: -130% 0; } }
@media (prefers-reduced-motion: reduce) { .card.legendary::after { animation: none; background-position: 50% 0; } }
.card .eb svg, .card .hb svg { --p: var(--ip); }
.card .crack { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; }
.card .hx, .card .flag.en { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.card .flag { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; font-size: 11px; font-weight: 700; line-height: 1.25; color: #fff8e6;
  background: rgba(42,27,22,.85); text-align: center; }
.card.locked .flag { background: var(--bad); }
.card.trump { background: #fff1c4; }
.card.enh { border-color: #8a6412; box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 3px #fff3cf, 0 2px 0 rgba(0,0,0,.22); }
.card.hexed::after { content: ""; position: absolute; inset: 3px; z-index: 3; border: 2px dashed var(--bad); border-radius: 4px; pointer-events: none; }
.card.locked { background: repeating-linear-gradient(45deg, #fffdf8, #fffdf8 6px, #eee5d4 6px, #eee5d4 12px); }
.seat .lips { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
.seat .lips .card { --rp: 1; --sp: .8; width: 36px; height: 50px; border-width: 1px; }
.seat .lips .card .s, .seat .lips .card .ix2, .seat .lips .card .ebs, .seat .lips .card .hb, .seat .lips .card .flag, .seat .lips .card .art { display: none; }
.chip.hexchip { background: #fbe3df; color: var(--bad); }
.card.small { --rp: 1.5; --sp: 1.2; --pp: .9; --bp: 2.5; --ip: .9; width: 52px; height: 74px; }
.card.big { --rp: 2.5; --sp: 2; --pp: 1.4; --bp: 4; --ip: 1.4; width: 84px; height: 118px; }
.card.no { opacity: .4; }
.hand .card.ok { transform: translateY(-6px); border-color: var(--gold); }
/* the card backs in the seats: the baked back once the art is on, the CSS gingham otherwise */
html.art .backs i.gingham { background: var(--back) center / cover; }
.hand { display: flex; justify-content: center; gap: 8px; padding: 12px 8px 8px; background: #efe5d2; flex-wrap: wrap; min-height: 116px; align-items: flex-end; }
.status { text-align: center; padding: 8px 12px; font-weight: 600; background: #fff; border-top: 1px solid var(--line); min-height: 40px; }
.status button { margin-left: 8px; }

/* ---------- bidding ---------- */
.bidpanel { background: #fff; border-top: 1px solid var(--line); padding: 8px 12px; }
.bidgrid { display: grid; gap: 6px; margin: 6px 0; }
.bidgrid .h { font-size: 13px; color: var(--muted); text-align: center; align-self: end; }
.bidgrid .rl { font-weight: 700; align-self: center; }
.bidgrid button { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 4px 2px; min-height: 42px; }
.bidgrid button .v { display: block; font-size: 12px; color: var(--muted); }
.bidgrid button.red { color: var(--red); }
.bidgrid button:disabled { opacity: .3; cursor: default; }
.bidlog { font-size: 14px; color: var(--muted); margin-top: 6px; }
.nod { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #fff8e6; border: 1px solid var(--gold); font-size: 13px; }

/* ---------- overlays ---------- */
.veil { position: fixed; inset: 0; background: rgba(30,20,10,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { background: var(--card); border-radius: 14px; max-width: 440px; width: 100%; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-height: 90vh; overflow: auto; }
.sheet h2 { margin: 0 0 8px; font-family: Georgia, serif; color: var(--accent); }
.sheet .lines { margin: 8px 0; padding-left: 18px; }
.sheet .lines li { margin: 4px 0; }
.big { font-size: 22px; font-weight: 700; }
.stars { font-size: 40px; color: var(--gold); letter-spacing: 4px; }
.stars .off { color: #d8cbb4; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0; }
.kv > span:nth-child(odd) { color: var(--muted); }
.end .actline { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.end .actline b { width: 100%; font-size: 15px; }
.good { color: var(--ok); font-weight: 700; } .badc { color: var(--bad); font-weight: 700; }

details.log { background: #fff; border-top: 1px solid var(--line); padding: 6px 12px 10px; font-size: 14px; }
details.log summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
details.log ol { margin: 4px 0 0; padding-left: 0; list-style: none; max-height: 220px; overflow: auto; }
details.log li { padding: 3px 0; border-bottom: 1px dashed #eee; }
details.log li.won { color: var(--ok); } details.log li.lost { color: var(--bad); }
details.log li.intent, details.log li.contract { font-weight: 600; }

@media (max-width: 420px) {
  .card { width: 58px; height: 82px; }
  .card.small { --rp: 1.5; --sp: 1; --pp: .8; --bp: 2; --ip: .8; width: 46px; height: 66px; }
  .card.big { --rp: 2.5; --sp: 2; --pp: 1.3; --bp: 3.5; --ip: 1.3; width: 74px; height: 104px; }
  .meter { width: 60px; }
  .top .name { display: none; }
  .hand.many { gap: 0; }
  .hand.many .card + .card { margin-left: -10px; }
  .hand.lots .card + .card { margin-left: -28px; }
  .hand.lots.spread { gap: 6px 4px; }
  .hand.lots.spread .card + .card { margin-left: 0; }
  .stat { padding: 3px 8px; } .stat .val { font-size: 20px; }
  .lvlpill { width: 100%; order: 5; }
}
</style>

<body>
<div class="app">

<section id="title">
  <div class="hero" id="hero" aria-hidden="true"></div>
  <div class="titlemenu">
    <h1 class="wood logo" data-word="logo"><span>Draw, Partner!</span></h1>
    <button class="wood go" data-act="start" data-word="start"><span>Start</span></button>
    <button class="wood more item" data-act="newstory" data-word="newstory"><span>New Story</span></button>
    <button class="wood more item" data-act="continue" id="continueBtn" data-word="continue"><span>Continue Current Story</span></button>
    <button class="wood more item" data-act="daily" data-word="daily"><span>Daily Challenge</span><small>coming soon</small></button>

<script src="art/grave/scene.js?v=11"></script>
<script src="art/paid/scene.js?v=11"></script>
<script>
(function () {
  'use strict';
  const E = window.BtpEngine, R = window.BtpRun, AI = window.BtpAI;
  const KEY = 'btp-run-v3', TIPS_DONE = 'btp-tips-done', PREFS = 'btp-prefs';
  /* Pace (the menu): every wait the page makes, in one table. `undo` is how long the computer holds back after
     a move you can take back. ?fast (the tests) makes every wait 0. */
  const PACE = {
    relaxed: { bid: 1000, play: 1100, undo: 2000, readBase: 1500, readPer: 36, readMax: 4500 },
    brisk:   { bid: 650,  play: 750,  undo: 1300, readBase: 1100, readPer: 28, readMax: 3400 },
    quick:   { bid: 300,  play: 350,  undo: 800,  readBase: 600,  readPer: 14, readMax: 1800 }
  };
  const PACE_NAME = { relaxed: 'Relaxed', brisk: 'Brisk', quick: 'Quick' };
  /* Settings kept in this browser: the pace, and whether a finished trick waits for your tap (the default: you
     are the whole table, so nobody else is reading) or clears itself after its reading time. */
  function loadPrefs() {
    const d = { pace: 'brisk', tricks: 'tap' };
    try { return Object.assign(d, JSON.parse(localStorage.getItem(PREFS) || '{}')); } catch (e) { return d; }
  }
  const FAST = /[?&]fast\b/.test(location.search);
  /* The card art (bakery/ -> art/). Never load-bearing: html.art is set only once a picture has really
     loaded, so ?noart, a missing folder, or jsdom (which loads no images) all keep the drawn faces.
     BUMP ART_VER after a re-bake: the file names never change, so a browser keeps the old pictures. */
  const ART_VER = 14, NOART = /[?&]noart\b/.test(location.search);
  const artURL = f => 'art/' + f + '?v=' + ART_VER;
  if (!NOART && typeof Image !== 'undefined') {
    const probe = new Image();
    probe.onload = () => { document.documentElement.style.setProperty('--back', 'url(' + artURL('back.webp') + ')'); document.documentElement.classList.add('art'); };
    probe.src = artURL('back.webp');
  }
  const $ = id => document.getElementById(id);
  const P = { L: null, timer: null, guardUntil: 0, sheet: null, shown: null, undo: [], stuck: null, prefs: loadPrefs() };
  function setPref(k, v) { P.prefs[k] = v; try { localStorage.setItem(PREFS, JSON.stringify(P.prefs)); } catch (e) {} }
  const wait = k => FAST ? 0 : (PACE[P.prefs.pace] || PACE.brisk)[k];
  window.BtpPage = P;

  /* ---------------- storage ---------------- */
  /* A story saves under KEY, a game of Standard 500 under STD_KEY, so neither overwrites the other. The profile
     remembers which Showdown gangs you have beaten in any story: they become Standard 500 opponents. */
  const STD_KEY = 'btp-std-v1', PROFILE = 'btp-profile';
  function save() { try { if (P.L) { localStorage.setItem(P.L.mode === 'standard' ? STD_KEY : KEY, JSON.stringify(P.L)); noteBeaten(P.L); } } catch (e) {} }
  function loadStd() { try { const s = localStorage.getItem(STD_KEY); const L = s ? JSON.parse(s) : null; return L && L.mode === 'standard' && L.phase !== 'stdover' ? L : null; } catch (e) { return null; } }
  function clearStd() { try { localStorage.removeItem(STD_KEY); } catch (e) {} }
  function profile() { try { return JSON.parse(localStorage.getItem(PROFILE)) || { beaten: [] }; } catch (e) { return { beaten: [] }; } }
  function noteBeaten(L) {
    if (L.mode === 'standard') return;
    const won = (L.record || []).filter(r => r.kind === 'boss' && r.won).map(r => r.id), pr = profile();
    const add = won.filter(id => !pr.beaten.includes(id));
    if (add.length) { pr.beaten = pr.beaten.concat(add); try { localStorage.setItem(PROFILE, JSON.stringify(pr)); } catch (e) {} }
  }
  function loadSaved() { try { const s = localStorage.getItem(KEY); const L = s ? JSON.parse(s) : null; return L && L.v === 3 ? L : null; } catch (e) { return null; } }
  function clearSaved() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function tipsDone() { try { return localStorage.getItem(TIPS_DONE) === '1'; } catch (e) { return false; } }
  function markTipsDone() { try { localStorage.setItem(TIPS_DONE, '1'); } catch (e) {} }

  /* ---------------- bits of markup ---------------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = n => n < 0 ? '−' + Math.abs(n) : String(n);
  const SHORT = { 4: '4', 5: '5', 6: '6', 7: '7', 8: '8', 9: '9', 10: '10', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
  /* Pixel glyphs: rows of '#', drawn as one SVG path of unit squares (crisp at any whole or half scale). */
  const G = {
    4: ['...#.', '..##.', '.#.#.', '#..#.', '#####', '...#.', '...#.'], 5: ['#####', '#....', '####.', '....#', '....#', '#...#', '.###.'],
    6: ['..##.', '.#...', '#....', '####.', '#...#', '#...#', '.###.'], 7: ['#####', '....#', '...#.', '..#..', '.#...', '.#...', '.#...'],
    8: ['.###.', '#...#', '#...#', '.###.', '#...#', '#...#', '.###.'], 9: ['.###.', '#...#', '#...#', '.####', '....#', '...#.', '.##..'],
    10: ['#..##.', '#.#..#', '#.#..#', '#.#..#', '#.#..#', '#.#..#', '#..##.'],
    J: ['..###', '...#.', '...#.', '...#.', '...#.', '#..#.', '.##..'], Q: ['.###.', '#...#', '#...#', '#...#', '#.#.#', '#..#.', '.##.#'],
    K: ['#...#', '#..#.', '#.#..', '##...', '#.#..', '#..#.', '#...#'], A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'], E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'],
    H: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'], D: ['..#..', '.###.', '.###.', '#####', '.###.', '.###.', '..#..'],
    S: ['...#...', '..###..', '.#####.', '#######', '#######', '.#.#.#.', '...#...', '..###..'],
    C: ['..###..', '.#####.', '..###..', '##.#.##', '#######', '##.#.##', '...#...', '..###..'],
    star: ['...#...', '...#...', '#######', '.#####.', '..###..', '.##.##.', '##...##'],
    // enhancements: one small icon each, on a gold badge
    e_growing: ['...#.##', '..#.###', '.##..#.', '#.#.#..', '.###...', '..#....', '..#....'],
    e_sworn: ['.......', '#..#..#', '##.#.##', '#######', '#######', '.#####.', '.......'],
    e_giant: ['#.....#', '#.....#', '.#...#.', '..###..', '...#...', '...#...', '..###..'],
    e_magnet: ['##...##', '##...##', '##...##', '##...##', '.#...#.', '.#####.', '..###..'],
    e_gilded: ['..###..', '.#...#.', '#..#..#', '#.###.#', '#..#..#', '.#...#.', '..###..'],
    e_outcast: ['..###.#', '.#...#.', '#...#.#', '#..#..#', '#.#...#', '.#...#.', '#.###..'],
    e_reverse: ['.#...#.', '###..#.', '.#...#.', '.#...#.', '.#...#.', '.#..###', '.#...#.'],
    e_sanctuary: ['#######', '#.....#', '#..#..#', '#.###.#', '.#.#.#.', '..#.#..', '...#...'],
    e_herald: ['.....##', '...####', '#####.#', '#.#...#', '#####.#', '...####', '.....##'],
    e_twoface: ['..###..', '.#.####', '#..####', '#..####', '#..####', '.#.####', '..###..'],
    e_glass: ['#######', '#.....#', '.#...#.', '..###..', '...#...', '...#...', '.#####.'],
    e_double: ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
    e_triple: ['####.', '....#', '....#', '.###.', '....#', '....#', '####.'],
    e_hollow: ['...#...', '..###..', '..#.#..', '.#####.', '.#####.', '.#####.', '.#####.'],
    e_plate: ['##...##', '#######', '#.###.#', '#######', '#.###.#', '#######', '.#####.'],
    e_ricochet: ['#......', '.#.....', '..#...#', '...#.#.', '....#..', '.......', '.......'],
    e_bullseye: ['.#####.', '#.....#', '#.###.#', '#.#.#.#', '#.###.#', '#.....#', '.#####.'],
    e_highnoon: ['#..#..#', '.#...#.', '..###..', '#.###.#', '..###..', '.#...#.', '#..#..#'],
    e_spurs: ['...#...', '.#.#.#.', '..###..', '###.###', '..###..', '.#.#.#.', '...#...'],
    e_steady: ['...#...', '.##.##.', '.#...#.', '###.###', '.#...#.', '.##.##.', '...#...'],
    e_hole: ['.###.', '#...#', '#.#.#', '#####', '#...#', '#...#', '#...#'],
    e_lastdraw: ['#######', '.#...#.', '..#.#..', '...#...', '..#.#..', '.#.#.#.', '#######'],
    e_desperado: ['.#####.', '#######', '#..#..#', '#######', '.##.##.', '.#####.', '.#.#.#.'],
    e_knuckles: ['.......', '#.#.#.#', '#######', '#######', '.#####.', '..###..', '..###..'],
    e_poster: ['#######', '#.....#', '#.#.#.#', '#.#.#.#', '#..#..#', '#.....#', '#######'],
    e_keg: ['.....#.', '....#..', '.####..', '#.##.#.', '######.', '#.##.#.', '.####..'],
    e_deadman: ['.##.##.', '#..#..#', '#..#..#', '.##.##.', '#..#..#', '#..#..#', '.##.##.'],
    e_horseshoe: ['..###..', '.#...#.', '#.....#', '#.....#', '#.....#', '#.....#', '##...##'],
    // hexes: on a red badge
    h_loose: ['.......', '..###..', '.#...#.', '#..#..#', '.#...#.', '..###..', '.......'],
    h_potato: ['...#...', '..##...', '..###..', '.##.#..', '.#..##.', '.#..#..', '..##...'],
    h_itchy: ['...##..', '..##...', '.##....', '######.', '....##.', '...##..', '..##...'],
    h_stepped: ['...#...', '...#...', '...#...', '#..#..#', '.#.#.#.', '..###..', '...#...'],
    h_twoleft: ['##..##.', '##..##.', '##..##.', '.#...#.', '##..##.', '##..##.', '.......']
  };
  const GP = {};
  function px(name, col, cls) {
    const rows = G[name];
    if (!rows) return '';
    if (!GP[name]) { let d = ''; rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; }); GP[name] = d; }
    const w = rows[0].length, hh = rows.length;
    return '<svg class="px' + (cls ? ' ' + cls : '') + '" viewBox="0 0 ' + w + ' ' + hh + '" style="--gw:' + w + ';--gh:' + hh + '" aria-hidden="true"><path fill="' + col + '" d="' + GP[name] + '"/></svg>';
  }
  const INK = { H: '#b8322a', D: '#b8322a', S: '#2a1b16', C: '#2a1b16' }, JOKER_INK = '#7a4bb0';
  // where the pips sit, in % of the card: L/C/R columns by row; the lower half is drawn upside down
  const PIPX = { L: 37, C: 50, R: 63 };
  const PIPS = {
    4: 'L22 R22 L78 R78', 5: 'L22 R22 C50 L78 R78', 6: 'L22 R22 L50 R50 L78 R78', 7: 'L22 R22 C36 L50 R50 L78 R78',
    8: 'L22 R22 C36 L50 R50 C64 L78 R78', 9: 'L22 R22 L41 R41 C50 L59 R59 L78 R78', 10: 'L22 R22 C32 L41 R41 L59 R59 C68 L78 R78'
  };
  function pipsHTML(rank, su, col) {
    return PIPS[rank].split(' ').map(p => { const y = +p.slice(1); return '<i class="pp' + (y > 50 ? ' inv' : '') + '" style="left:' + PIPX[p[0]] + '%;top:' + y + '%">' + px(su, col) + '</i>'; }).join('');
  }
  // Glass: a sheen, then a crack per win, so you can see how close it is to shattering
  const CRACKS = ['M6 4L14 16', 'M22 0L19 9L24 15L18 26M6 4L14 16', 'M22 0L19 9L24 15L18 26M40 40L31 44L33 50L25 56M6 4L14 16'];
  const crackHTML = wins => '<svg class="crack" viewBox="0 0 40 56" preserveAspectRatio="none" aria-hidden="true"><path d="' + CRACKS[Math.min(wins, 2)] +
    '" fill="none" stroke="#e8f6ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
  const artHTML = key => '<i class="art" style="background-image:url(' + artURL('cards/' + key + '.webp') + ')"></i>';
  /* A card face. `seat` (0 or 2) shows your team's enhancements; o.data makes it
     tappable with that action. Buffs and hexes are badges over any face; their names stay in the markup
     (screen readers, the hold-for-details sheet) while informational flags (yours, left bower, locked...)
     keep their ribbon. */
  function cardHTML(c, o) {
    o = o || {};
    const L = P.L, h = L && L.h, trump = h && L.phase === 'hand' ? h.trump : null;
    const k = (o.seat === 0 || o.seat === 2 || o.owned) && L ? { c, m: L.mods[c] || null, tie: false } : E.plainK(c);
    const ens = E.enhsOf(k.m), enh = ens[0], legend = ens.length > 1, hx = L && L.hexes ? L.hexes[c] : null;
    const cls = ['card', o.small ? 'small' : '', o.big ? 'big' : '', c !== 'JK' && E.RED[E.suitOf(c)] ? 'red' : '', c === 'JK' ? 'joker' : '',
      trump && E.kIsTrump(k, trump) ? 'trump' : '', enh ? 'enh' : '', legend ? 'legendary' : '', hx ? 'hexed' : '', o.locked ? 'locked' : '', o.cls || ''].filter(Boolean).join(' ');
    const attr = (o.data ? ' data-' + o.data + '="' + c + '"' : ' tabindex="-1"') + ' data-c="' + c + '"';
    const flag = o.flag || (enh ? (legend ? 'Legendary: ' : '') + ens.map(x => R.ENH[x].name).join(' and ') : c.includes('~') ? 'Forged' : '');
    const enName = !o.flag && !!enh;
    const layers = (hx ? '<span class="hx">' + esc(R.HEXES[hx].short) + '</span><i class="hb">' + px('h_' + hx, '#fff3cf') + '</i>' : '') +
      (enh ? '<span class="ebs">' + ens.map(x => '<i class="eb">' + px('e_' + x, '#2a1b16') + '</i>').join('') + '</span>' : '') +
      (ens.includes('glass') ? crackHTML((k.m && k.m.wins) || 0) : '') +
      (flag ? '<span class="flag' + (enName ? ' en' : '') + '">' + esc(flag) + '</span>' : '');
    if (c === 'JK') return '<button class="' + cls + '"' + attr + (o.dis ? ' disabled' : '') + ' aria-label="Joker">' + artHTML('JK') +
      '<span class="ix r jk">' + [...'JOKER'].map(ch => px(ch, JOKER_INK)).join('') + '</span><span class="s">' + px('star', JOKER_INK) + '</span>' + layers + '</button>';
    const su = E.suitOf(c), rk = E.rankOf(c), col = INK[su];
    const up = k.m && k.m.up ? E.grown(c, k.m.up) : 0;
    const ix = '<span class="rk">' + px(up ? SHORT[up] : rk, col, 'g') + (up ? '<b class="up">↑</b>' : '') + '</span>' + px(su, col, 'u');
    const court = rk === 'J' || rk === 'Q' || rk === 'K';
    const face = court || rk === 'A' || !PIPS[rk] ? px(su, col) : pipsHTML(rk, su, col);
    return '<button class="' + cls + '"' + attr + (o.dis ? ' disabled' : '') + ' aria-label="' + esc(E.label(c) + (up ? ', grown to ' + E.VNAME[up] : '') + (flag ? ', ' + flag : '') + (hx ? ', hexed: ' + R.HEXES[hx].name : '')) + '">' +
      (court ? artHTML(rk + su) : '') + '<span class="ix r">' + ix + '</span><span class="s">' + face + '</span>' + (flag ? '' : '<span class="ix ix2" aria-hidden="true">' + ix + '</span>') + layers + '</button>';
  }
  const rerollLabel = L => R.rerollPrice(L) ? 'Reroll (' + R.rerollPrice(L) + 'g)' : 'Reroll (free)';
  const bidHTML = b => b.s === 'MIS' ? 'Misère' : b.s === 'OMIS' ? 'Open misère' : b.t + (b.s === 'NT' ? 'NT' : '<span style="color:' + (E.RED[b.s] ? 'var(--red)' : 'inherit') + '">' + E.SYM[b.s] + '</span>');
  const bidPlain = b => b.s === 'MIS' ? 'Misère' : b.s === 'OMIS' ? 'Open misère' : b.t + (b.s === 'NT' ? 'NT' : E.SYM[b.s]);
  const denom = s => s === 'NT' ? 'no trumps' : E.NAME[s];
  function stars(n) { let s = ''; for (let i = 1; i <= 3; i++) s += i <= n ? '★' : '<span class="off">★</span>'; return s; }
  function coachHTML(tip) { return tip ? '<div class="face"></div><p>' + esc(tip.text) + '</p><button data-tip="' + tip.id + '">Got it</button>' : ''; }
  function mineHTML() {
    const L = P.L;
    return '<div class="mine">' + L.owned.map(c => cardHTML(c, { owned: true, small: true })).join('') + '</div>' +
      '<div class="chips">' + L.buffs.map(b => '<span class="chip" title="' + esc(R.BUFFS[b].text) + '">' + esc(R.BUFFS[b].name) + '</span>').join('') + '</div>' +
      (R.hexed(L).length ? '<div class="chips">' + R.hexed(L).map(c => '<span class="chip hexchip" title="' + esc(R.HEXES[L.hexes[c]].text) + '">' + esc(E.label(c) + ': ' + R.HEXES[L.hexes[c]].name + (L.owned.includes(c) ? ' (yours)' : '')) + '</span>').join('') + '</div>' : '');
  }

  /* ---------------- which view ---------------- */
  function render() {
    const L = P.L;
    if (!L) return;
    const table = L.phase === 'hand' || L.phase === 'summary' || L.phase === 'over';
    $('title').hidden = true;
    $('game').hidden = !table;
    $('screen').hidden = table;
    if (table) renderTable(); else renderScreen();
    renderSheet();
  }

  /* ---------------- run screens ---------------- */
  /* Health (the fight redesign, 2026-10-27): 500 at the start and the most it can be; the gangs' points chip it
     away and nothing heals it during a fight; at 0 the run ends. Amber below 200, red below 100. */
  const hpClass = h => h < 100 ? ' danger' : h < 200 ? ' low' : '';
  function hpInner(L, delta) {
    const pct = Math.max(0, Math.min(100, 100 * L.health / R.maxHealth(L)));
    return '<span class="lab">Health</span><span class="val">' + L.health + '</span><span class="hpm" aria-hidden="true"><i style="width:' + pct + '%"></i></span>' +
      '<small>' + (L.health < 100 ? 'Danger: the run ends at 0' : 'of ' + R.maxHealth(L) + '; the run ends at 0') + '</small>' +
      (delta ? '<span class="delta ' + (delta > 0 ? 'up' : 'down') + '">' + (delta > 0 ? '+' : '−') + Math.abs(delta) + '</span>' : '');
  }
  function goldInner(L, delta) {
    return '<span class="lab">Gold</span><span class="val">' + L.gold + '</span>' + (delta ? '<span class="delta ' + (delta > 0 ? 'up' : 'down') + '">' + (delta > 0 ? '+' : '−') + Math.abs(delta) + '</span>' : '');
  }
  function bar() {
    const L = P.L;
    if (L.mode === 'standard') return '<div class="screenbar"><span class="name">Standard 500 · against ' + esc(L.std.name.replace(/^The /, 'the ')) + '</span>' +

  // the act-start pick's reminder of what you already own (Nan's A\u2665 on a first act)

  function enhSel(L, key) {
    key = L.level + '|' + key;
    if (!P.enhSel || P.enhSel.key !== key) P.enhSel = { key, enh: null, card: null, why: '' };

  /* Your cards to put it on: every card you own, raised when picked, faded with the reason when it can't take the

  function pickCardsHTML(L, sel) {
    const why = c => c === 'JK' ? 'No enhancements' : sel.enh ? (R.cantTake(L, c, sel.enh) ? (R.legendary(L, c) ? 'Legendary: full' : 'Can’t share') : '') : '';
    return '<h3>On which of your cards?</h3><div class="cardrow pickrow">' + L.owned.map(c => {
      const w = why(c);
      return '<span class="pickc">' + cardHTML(c, { data: 'pickcard', owned: true, big: true, cls: (sel.card === c ? 'picked' : '') + (w ? ' no' : '') }) +
        '<small>' + esc(w || (sel.card === c ? 'Chosen' : ' ')) + '</small></span>';
    }).join('') + '</div>' + (sel.why ? '<p class="sub badc" role="status">' + esc(sel.why) + '</p>' : '');
  }
  function ownedRow(L) { return L.owned.length ? '<div class="yours">Already yours: ' + L.owned.map(c => cardHTML(c, { small: true, owned: true })).join('') + '</div>' : ''; }
  /* The act-start pan: from the top of the map (the Showdown) down to the first choices, eased, over a couple of
     seconds; any touch, wheel or key hands the scroll back at once. Skipped when it all fits, in ?fast, and
     under reduced motion. */
  function panMap(done) {
    let called = false;
    const fin = () => { if (!called && done) { called = true; done(); } };
    const box = document.querySelector('.mapbox'), first = [...document.querySelectorAll('.mapbox .nd.can')];
    if (!box || !box.getBoundingClientRect || !first.length) return fin();
    const r = box.getBoundingClientRect();
    if (!r.height || r.height < innerHeight * 0.8) return fin();
    const low = Math.max(...first.map(n => n.getBoundingClientRect().bottom)) + scrollY;
    const from = Math.max(0, r.top + scrollY - 70), to = Math.max(from, low - innerHeight + 90);
    let reduce = false;
    try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* old browser */ }
    if (FAST || reduce || typeof requestAnimationFrame === 'undefined') { try { window.scrollTo(0, to); } catch (e) { /* no layout */ } return fin(); }
    let stop = false, t0 = 0;
    const quit = () => { stop = true; ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(e => removeEventListener(e, quit)); setTimeout(fin, 250); };
    ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(e => addEventListener(e, quit, { passive: true }));
    window.scrollTo(0, from);
    const poster = document.querySelector('.wanted');
    if (poster) poster.classList.add('drop');
    const HOLD = 700, RUN = 2600, ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const step = now => {
      if (stop) return;
      t0 = t0 || now;
      const t = Math.min(1, Math.max(0, (now - t0 - HOLD) / RUN));
      window.scrollTo(0, from + (to - from) * ease(t));
      if (t < 1) requestAnimationFrame(step); else quit();
    };
    requestAnimationFrame(step);
  }
  /* The act's map: seven floors and the Hoedown, after Gwent's The Path. Paths are an SVG behind; the stops
     are buttons over it, placed in the same coordinates (a viewBox W × H, in percent). */
  const ICON = {
    dance: '<path d="M3.6 8.4 9.4 6.8l2.8 10.7-5.8 1.6z"/><path d="M11 4.5h7.5v13H11z"/><path d="M14.75 8.2l1.7 2.55-1.7 2.55-1.7-2.55z"/>',
