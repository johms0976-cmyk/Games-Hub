<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a1b16">
<link rel="icon" type="image/png" sizes="192x192" href="art/icon/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #f6efe2; --felt: #2f5d46; --felt-2: #275039; --ink: #2b211a; --muted: #6f6253;
  --card: #fffdf8; --red: #b8322a; --black: #1e1b18; --gold: #c8962e; --accent: #8a2d22;
  --ok: #2f7a3e; --bad: #a33a2c; --line: #d8cbb4; --shadow: 0 2px 6px rgba(0,0,0,.18);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
.gingham {
  background-color: #b8322a;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.45) 50%, transparent 50%),
    linear-gradient(rgba(255,255,255,.45) 50%, transparent 50%);
  background-size: 16px 16px;
}
.app { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- title and run screens ---------- */
#screen { padding: 0 16px 32px; }
/* The run screens and the table each stack in a layer of their own, under the sheets (.veil, z 10) and the full-screen
   scenes: the map's buildings (up to z 600), its markers (2000) and the sticky bar (2050) once showed through the Menu
   and made it unusable (the user's, 2026-11-04). Their own pop-ups (the map's 2500+) still stack over them. */
#screen, #game { position: relative; z-index: 1; }
/* the title scene (bakery/title.py, title_px.py; art/title/scene.js): the train holds still in the middle of its
   trestle while the trestle, the plains and the buffalo scroll left at their own speeds (nearer, faster), so it
   rolls along. Every layer is a strip that tiles sideways; one art pixel is --s css px. Without the art it is
   just the banded sky and the ground. */
/* The title is the scene, full screen (the user, 2026-10-27): the train on its trestle sits on the bottom edge, the
   sky above it, and the words float in the sky: the logo, Start Game, Continue; Options on the grass. The words
   are wood type drawn as pixels (title_px.py WOOD), shown once the art is on; until then their own text, in a
   serif. layoutTitle() places them by where the train actually is, so they clear it on any screen. */
#title { position: fixed; inset: 0; overflow: hidden; z-index: 1; }
.hero { --s: 2; position: absolute; inset: 0; overflow: hidden;
  background: linear-gradient(#8cc4e0 0 25%, #a8d2e4 25% 45%, #cfe0d8 45% 60%, #f0dcb8 60% 62%, #d8bc70 62% 100%); }
html.art .hero { background: linear-gradient(#7cbadb 0 22%, #8cc4e0 22% 44%, #a8d2e4 44% 64%, #cfe0d8 64% 80%, #f0dcb8 80% 100%); }
.titlemenu .wood { position: absolute; left: 50%; transform: translate(-50%, -50%); margin: 0; padding: 0; border: 0; background: none; z-index: 5;
  cursor: pointer; font: 800 30px/1.1 Georgia, serif; letter-spacing: .06em; color: #fbf0d0; text-transform: uppercase;
  text-shadow: 0 0 0 #3a1a12, 2px 2px 0 #3a1a12, -1px -1px 0 #3a1a12, 1px -1px 0 #3a1a12, -1px 1px 0 #3a1a12, 3px 4px 0 rgba(42,22,18,.5); }
.titlemenu .logo { cursor: default; font-size: 36px; color: #f3d070; white-space: nowrap; width: max-content; }
/* the card logos (2026-11-04): a tap flicks between them, the sign turning over like a card */
.titlemenu .logo.cards { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.titlemenu .logo.flip { animation: logoflip .32s ease-in-out; }
@keyframes logoflip { 50% { transform: translate(-50%, -50%) scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .titlemenu .logo.flip { animation: none; } }
.titlemenu .more { font-size: 20px; }
.titlemenu .wood img { display: none; image-rendering: pixelated; }
html.art .titlemenu .wood.drawn img { display: block; }
html.art .titlemenu .wood.drawn > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.titlemenu .go { padding: 10px 14px; animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translate(-50%, calc(-50% - 6px)); } }
.titlemenu .go:active, .titlemenu .more:active { filter: brightness(1.15); }
.titlemenu .more { padding: 8px 12px; }
.titlemenu .wood:focus-visible { outline: 3px solid #fff6d2; outline-offset: 4px; border-radius: 6px; }
/* The payout, counted out line by line (2026-10-30): in every fight's stars pop-up, and on the sheriff's desk after
   a Showdown. Each line comes in after the one before; a tap shows them all at once. */
.payout { list-style: none; margin: 8px 0; padding: 0; font-size: 15px; }
.payout li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed #d8c8a8; animation: payin .35s ease-out both; animation-delay: calc(var(--i) * .3s); }
.payout li b { white-space: nowrap; color: #6b4a10; }
.payout li.minus b { color: var(--bad); }
.payout li.hp b { color: #2e7a3a; }
.payout li .st { color: #c99a2a; }
.payout li.tot { border-bottom: 0; border-top: 2px solid #8a6412; margin-top: 2px; font-weight: 800; }
.payout.done li { animation: none; }
@keyframes payin { from { opacity: 0; transform: translateX(-10px); } }
@media (prefers-reduced-motion: reduce) { .payout li { animation: none; } }
/* The Showdown's payday (2026-10-30, the user's): the boss's wanted poster on the saloon wall, your gloved hand
   crosses it out in red crayon and stamps it with a red sheriff's star reading PAID, then it slides onto the
   sheriff's desk and the bounty is counted out in his ledger. Art in art/paid (bakery/paid.py); Skip always lands on
   the reward pick, never past it. */
#paid { position: fixed; inset: 0; z-index: 70; overflow: hidden; background: #3a2416; }
#paid[hidden] { display: none; }
#paid .pwall { position: absolute; inset: 0; image-rendering: pixelated; background-repeat: repeat; background-position: 50% 30%; transition: opacity .7s; }
#paid .pdesk { position: absolute; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .7s; }
#paid .pdesk img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#paid.desk .pwall { opacity: 0; } #paid.desk .pdesk { opacity: 1; }
#paid .pdesk.thud, #paid .pposter.thud { animation: deskthud .26s ease-out; }
@keyframes deskthud { 35% { translate: 0 4px; } }
/* the boss's wanted poster: the act's job when it starts (#bounty), crossed out on payday (#paid) */
.wposter { position: relative; width: min(270px, 74vw); padding: 12px 14px 16px; text-align: center;
  background: #f1dfb6; color: #3a1a12; border: 2px solid #8a5a2c; box-shadow: 0 6px 0 rgba(20,10,6,.35), inset 0 0 30px rgba(140,90,40,.35); }
.wposter .nail { position: absolute; left: 50%; top: 5px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #5a5a60; box-shadow: inset -1px -1px 0 #2a2a30; }
.wposter .w { display: block; margin-top: 6px; font: 900 44px/1 Georgia, serif; letter-spacing: .08em; }
.wposter .d { display: block; font: 800 13px/1.4 Georgia, serif; letter-spacing: .3em; }
.wposter img { display: block; width: 100%; margin: 8px 0; image-rendering: pixelated; border: 2px solid #8a5a2c; }
.wposter .n { display: block; font: 800 22px/1.15 Georgia, serif; }
.wposter .rw { display: block; margin-top: 6px; font: 800 15px/1.3 Georgia, serif; letter-spacing: .1em; }
.wposter .loot { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; font: 800 14px/1.15 Georgia, serif; letter-spacing: .06em; text-align: left; }
.wposter .loot img { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
.wposter .loot small { display: block; font-size: 10px; letter-spacing: .14em; opacity: .75; }
.payout .pitem { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; margin-right: 4px; }
#paid .pposter { position: absolute; left: 50%; top: 14%; transform-origin: 50% 0; transition: transform .9s cubic-bezier(.4, 0, .2, 1); z-index: 2; }
/* The job (the user's, 2026-10-30): once the map's opening pan has come down from the Showdown to where you start,
   the boss's poster unrolls from its rod, the one you will cross out on payday: the reason you rode in. On "Let's
   ride" it folds away onto the map's own wanted board. Once an act (L.sawPoster); never in ?fast. */
#bounty { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; padding: 16px; overflow-y: auto;
  background: rgba(24,14,8,.72); transition: background .5s; }
#bounty[hidden] { display: none; }
/* a short phone with the Sheriff's say as well (2026-11-04): the poster sized to the height, everything a notch tighter */
@media (max-height: 760px) { #bounty { gap: 9px; padding: 12px 16px; } #bounty .wposter { width: min(270px, 74vw, 28vh); padding: 8px 10px 10px; }
  #bounty .wposter .w { font-size: 30px; } #bounty .wposter .d { font-size: 10px; } #bounty .wposter .n { font-size: 17px; } #bounty .wposter .rw { font-size: 12px; margin-top: 3px; }
  #bounty .wposter .loot { font-size: 12px; } #bounty .wposter .loot img { width: 30px; height: 30px; } #bounty .wposter img { margin: 5px 0; }
  #bounty .nanline { font-size: 14px; padding: 8px 12px; max-width: 340px; } #bounty .why.long { font-size: 14px; } }
#bounty .why { margin: 0; font: 800 13px/1.3 Georgia, serif; letter-spacing: .28em; color: #f3d070; text-align: center; text-transform: uppercase; }
#bounty .scroll { position: relative; padding-top: 10px; }
#bounty .why.long { max-width: 320px; font: italic 600 15px/1.35 Georgia, serif; letter-spacing: 0; text-transform: none; color: #f6e6c0; }
#bounty .scroll::before { content: ''; position: absolute; left: -10px; right: -10px; top: 0; height: 14px; z-index: 2; border-radius: 7px;
  background: linear-gradient(#a0703e, #6e4424); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
#bounty .wposter { animation: unroll 1.5s cubic-bezier(.35, 0, .2, 1) .25s both; }
#bounty .rod { position: absolute; left: -12px; right: -12px; height: 18px; z-index: 3; border-radius: 9px; background: linear-gradient(#e8d4a6, #c8a870 45%, #8a6a40);
  box-shadow: 0 3px 0 rgba(0,0,0,.3); animation: rolldown 1.5s cubic-bezier(.35, 0, .2, 1) .25s both; }
@keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes rolldown { from { top: 8px; } 92% { opacity: 1; } to { top: calc(100% - 9px); opacity: 0; } }
#bounty .nanline { max-width: 320px; background: #fffaf0; color: #3a2a20; border-radius: 10px; padding: 10px 14px; box-shadow: 0 2px 0 rgba(58,42,32,.3); font-size: 15px;
  opacity: 0; animation: fadein .5s 1.8s forwards; }
#bounty .btn { opacity: 0; animation: fadein .4s 2s forwards; }
@keyframes fadein { to { opacity: 1; } }
#bounty.away { background: rgba(24,14,8,0); pointer-events: none; }
#bounty.away .scroll { transition: transform .7s cubic-bezier(.5, 0, .7, .4), opacity .7s; }
#bounty.away .nanline, #bounty.away .btn, #bounty.away .why { opacity: 0; animation: none; transition: opacity .2s; }
@media (prefers-reduced-motion: reduce) { #bounty .wposter, #bounty .rod, #bounty .nanline, #bounty .btn { animation: none; opacity: 1; } #bounty .rod { display: none; } }
#paid .pposter.hang { animation: hang 1s ease-out; }
@keyframes hang { 0% { transform: translate(-50%, -120%) rotate(-6deg); } 55% { transform: translate(-50%, 0) rotate(3deg); } 75% { transform: translate(-50%, 0) rotate(-1.5deg); } 100% { transform: translate(-50%, 0); } }
#paid .pposter.shake { animation: thump .35s; }
@keyframes thump { 20% { translate: 0 4px; } 45% { translate: -3px 0; } 70% { translate: 2px 0; } }
#paid .px { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#paid .px path { fill: none; stroke: #c0201a; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
#paid .px path.go { opacity: .92; }
#paid .pstamp { position: absolute; left: 50%; top: 56%; width: 84%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1.2); opacity: 0; pointer-events: none;
  filter: drop-shadow(0 0 1px rgba(90,10,6,.5)); }
#paid .pstamp.on { opacity: .94; transform: translate(-50%, -50%) rotate(-14deg) scale(1); transition: transform .12s ease-out, opacity .08s; }
#paid .pglove { position: absolute; left: 0; top: 0; image-rendering: pixelated; z-index: 4; pointer-events: none; display: none; }
#paid .ledger { position: absolute; z-index: 3; font: italic 600 13px/1.25 Georgia, serif; color: #3a2a20; }
#paid .ledger h3 { margin: 0 0 4px; font: 800 14px/1.2 Georgia, serif; letter-spacing: .12em; text-align: center; }
#paid .ledger .payout { font-size: inherit; margin: 0; }
#paid .ledger .payout li { border-bottom-color: rgba(74,58,58,.35); padding: 2px 0; }
#paid .coin { position: absolute; z-index: 5; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #e8b840; box-shadow: inset -2px -2px 0 #b8862a, 0 0 0 1px #6b4a10; pointer-events: none; }
#paid .pbtns { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 10px; z-index: 6; }
#paid .pbtns [data-act="paidcollect"] { display: none; }
#paid.counted .pbtns [data-act="paidcollect"] { display: inline-block; }
#actcard .train2 { position: absolute; left: 0; bottom: 18%; image-rendering: pixelated; animation: wheels .56s steps(4) infinite, trainby 5s linear forwards; }
@keyframes trainby { from { transform: translateX(-110%); } to { transform: translateX(110vw); } }
@media (prefers-reduced-motion: reduce) { #paid .pposter, #paid .pposter.hang { animation: none; } #actcard .train2 { display: none; } }
/* Game over (the user's, 2026-10-30): a freshly covered grave on Boot Hill at dusk. The sky is painted here, the
   buttes and the graveyard are art (art/grave, bakery/grave.py); the camera pushes in on the fresh grave, the buzzard
   watches, a tumbleweed rolls by, then the epitaph comes up. Skip, or the epitaph's button, goes to the run's ending
   behind it. Without the art: the sky, a plain mound and the words. */
#grave { position: fixed; inset: 0; z-index: 70; overflow: hidden; background: linear-gradient(#2e1f4a 0%, #6a3a6a 32%, #c8604a 58%, #f0a050 74%, #f6c070 82%, #edab6a 82.1%); }
#grave[hidden] { display: none; }
/* Wanted levels and the Daily Challenge (2026-11-02) */
.wantedpick { margin-top: 12px; }
.wantedpick h3 { margin: 0 0 6px; }
.wantedpick .wl { display: flex; flex-wrap: wrap; gap: 6px; }
.wantedpick .wl button { min-width: 40px; min-height: 40px; border: 2px solid #4a2626; border-radius: 6px; background: #f3e3c0; color: #4a2626; font: 700 16px/1 'Pixelify Sans', Georgia, serif; cursor: pointer; }
.wantedpick .wl button.sel { background: #7a3b2a; color: #fbf3dc; box-shadow: 0 0 0 2px #e8b83a; }
.wantedpick summary { cursor: pointer; font-size: 14px; margin-top: 4px; }
.wantedpick ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.3; }
.runtag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #7a3b2a; color: #fbf3dc; font: 600 12px/1.5 Bitter, Georgia, serif; vertical-align: middle; }
.daily .kv { margin-top: 8px; }
/* the Getaway (2026-11-02): the chase between stretches, one screen; the finale after it (#actcard.finale) */
#screen.one > .cscene { flex: 1 1 auto; }
.cscene { position: relative; margin: 0 -10px; overflow: hidden; border-bottom: 3px solid #1e140f; }
.cscene.mine { background: repeating-linear-gradient(90deg, transparent 0 70px, #4a3020 70px 80px, transparent 80px 140px) 0 0 / 140px 72% no-repeat repeat-x,
  linear-gradient(#4a3020 0 7%, transparent 7%), linear-gradient(#140e0a, #2e2018 55%, #3e2c20); }
.cscene.mine::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 78% 58%, rgba(246,211,106,.28), transparent 32%); }
.cscene.ghost { background: radial-gradient(ellipse at 30% 76%, rgba(170,150,210,.35), transparent 45%), radial-gradient(ellipse at 80% 70%, rgba(150,255,140,.18), transparent 35%),
  linear-gradient(#0e0a18, #241a38 60%, #33264a); }
.cscene.ghost::before { content: ''; position: absolute; left: 0; right: 0; bottom: 30%; height: 26px; background:
  radial-gradient(ellipse at 10% 100%, #1a1424 0 40%, transparent 41%) 0 0 / 90px 26px repeat-x; opacity: .9; }
/* what streams past: the mine's timber sets (posts and a cap beam), the ghost ride's tombstones and dead fence */
.cscene .cframes { position: absolute; left: 0; width: 100%; top: 18%; }
.cscene.mine .cframes { background: linear-gradient(#6a4a30, #5a3a24) 0 0 / 100% 14px no-repeat,
  repeating-linear-gradient(90deg, transparent 0 110px, #6a4a30 110px 122px, #4a3020 122px 126px, transparent 126px 180px); border-top: 3px solid #2a1a10; }
.cscene.ghost .cframes { top: auto; height: 44px; background: radial-gradient(ellipse 13px 18px at 30px 100%, #3e3456 96%, transparent 100%) 0 100% / 150px 44px repeat-x,
  repeating-linear-gradient(90deg, transparent 0 60px, #2e2640 60px 64px, transparent 64px 75px) 0 100% / 100% 30px no-repeat; }
.cscene.moving .cframes { animation: cframes 1.2s linear infinite; }
@keyframes cframes { to { background-position-x: 0, -180px; } }
.cscene.ghost.moving .cframes { animation-name: cghost; }
@keyframes cghost { to { background-position-x: -150px, -75px; } }
@media (prefers-reduced-motion: reduce) { .cscene.moving .cframes { animation: none; } }
.cscene .crail { position: absolute; left: 0; width: 100%; height: 8px; background: repeating-linear-gradient(90deg, #2a1d16 0 8px, transparent 8px 22px); border-top: 3px solid #6a6060; }
.cscene.moving .crail { animation: cties .25s linear infinite; }
@keyframes cties { to { background-position-x: -22px; } }
.cscene .cground { position: absolute; left: 0; right: 0; bottom: 0; background: #2a1e18; }
.cscene.mine { background-position: 0 100%, 0 0, 0 0; background-size: 140px 78%, auto, auto; }
.cscene.ghost .cground { background: #1e1828; }
.cscene img.cv { position: absolute; image-rendering: pixelated; transition: left .9s cubic-bezier(.3, .9, .4, 1); }
.cscene.moving img.cv { animation: drock .5s steps(1) infinite; }
.cscene img.cv.you { animation-delay: -.25s; }
.cscene .cgap { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #fbf3dc; color: #2a1b16; border: 2px solid #2a1b16; border-radius: 999px; padding: 2px 12px; font: 600 14px/1.3 Bitter, Georgia, serif; white-space: nowrap; }
.cscene .cmarks { position: absolute; left: 12px; right: 12px; top: 44px; display: flex; justify-content: center; gap: 6px; }
.cscene .cmarks i { width: 18px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
.cscene .cmarks i.on { background: #f0c23c; }
.cscene .cmarks i.won { background: #7ac86a; } .cscene .cmarks i.lost { background: #c8382a; }
@media (prefers-reduced-motion: reduce) { .cscene.moving .crail, .cscene.moving img.cv { animation: none; } .cscene img.cv { transition: none; } }
#actcard.finale .fposter { position: absolute; left: 50%; width: 112px; margin-left: -56px; z-index: 1; padding: 8px 8px 10px; background: #f3e3c0; border: 3px solid #4a2626; box-shadow: 0 6px 0 rgba(0,0,0,.35);
  text-align: center; color: #4a2626; font: 700 18px/1 'Pixelify Sans', Georgia, serif; transform: rotate(-3deg); }
#actcard.finale .fposter img { display: block; width: 100%; image-rendering: pixelated; margin: 6px 0 4px; }
#actcard.finale .fposter b { display: block; font: 600 13px/1.2 Bitter, Georgia, serif; }
#actcard.finale .fstamp { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%) rotate(-16deg) scale(2.4); opacity: 0; border: 4px solid; border-radius: 6px; padding: 3px 10px;
  font: 700 26px/1 'Pixelify Sans', Georgia, serif; white-space: nowrap; background: rgba(243,227,192,.75); }
#actcard.finale .fstamp.caught { color: #b8322a; } #actcard.finale .fstamp.away { color: #5a5048; }
#actcard.finale.said .fstamp { animation: fstamp .35s cubic-bezier(.3, 1.8, .6, 1) .5s forwards; }
@keyframes fstamp { to { transform: translate(-50%, -50%) rotate(-16deg) scale(1); opacity: 1; } }
#actcard.finale .unlock { display: flex; gap: 10px; align-items: center; max-width: 360px; background: #f3e3c0; color: #3a2a20; border: 3px solid #7a3b2a; border-radius: 12px; padding: 8px 12px; }
#actcard.finale .unlock .face { width: 44px; height: 52px; flex: none; }
#actcard.finale .unlock p { margin: 0; font-size: 14px; line-height: 1.3; }
@media (prefers-reduced-motion: reduce) { #actcard.finale.said .fstamp { animation: none; opacity: 1; transform: translate(-50%, -50%) rotate(-16deg); } }
/* the Fair's prize contests (2026-11-01): the door is a one-screen stop, the attraction at dusk on top */
#screen.one .oscene.fairs { background: linear-gradient(#2e2a48, #4a4858 62%, #6a5a48 62.5%, #56524a); }
#screen.one .oscene.fairs img.prop { top: auto; }
#screen.one .oscene.fairs .bunt { position: absolute; left: 0; top: 4px; width: 100%; height: 22px; }
#screen.one > .oscene.fairs.withart { flex: 1 1 auto; }

/* Act II's map is the Westbound Express (btp-train.js, 2026-10-29): Dustwater's box and markers, the paths drawn
   as rails (ties, then the two rails) in the plate's own units, so they scale with it. The ways on glow gold. */
.mapbox.train .rl path { fill: none; }
/* the engineer's train goes over into the ravine; the two trains draw level from behind (2026-10-30) */
.mapbox.train .spr.fallen { animation: ravine 1.6s cubic-bezier(.5, 0, .9, .5) forwards !important; }
.mapbox.train .rl.fallen { animation: fadeout 1.2s forwards; }
@keyframes ravine { 30% { transform: translateX(4%) rotate(4deg); } 100% { transform: translate(14%, 6%) rotate(22deg); opacity: 0; filter: grayscale(1); } }
@keyframes fadeout { to { opacity: 0; } }
.mapbox.train .spr.arrive { animation: drawlevel 1.8s cubic-bezier(.2, .7, .3, 1) both !important; }
@keyframes drawlevel { from { transform: translateY(40%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mapbox.train .spr.fallen { animation: none !important; opacity: 0; } .mapbox.train .spr.arrive { animation: none !important; } }
.mapbox.train .rl .tie { stroke: #6a4a30; stroke-width: 12; stroke-dasharray: 1.6 2.2; opacity: .9; }
.mapbox.train .rl .rail { stroke: #4a4a50; stroke-width: 1.1; }
.mapbox.train .rl.walked .rail { stroke: #e3d6b4; }
.mapbox.train .rl.can .rail { stroke: #ffd65a; stroke-width: 1.7; animation: railglow 1.1s ease-in-out infinite; }
@keyframes railglow { 50% { stroke: #fff6d2; } }
.mapbox.train .amb.puff { animation-duration: .7s; }
/* Under way (2026-10-29): the ground streams down past the carriages in three strips (desert, red rock, canyon;
   each a tile that repeats, its .roll one tile taller than the strip and slid down by a tile, over and over), the
   rails' ties stream with it (each tie path timed so its ties fall as fast as the ground: trainBox), and the
   carriages rock on their wheels and drift a little ahead and behind, as trains on side-by-side tracks would.
   --ap is one art pixel. The strips fade into each other where they overlap. */
.mapbox.train { container-type: inline-size; --ap: calc(100cqw / 180); }
.mapbox.train .band { position: absolute; left: 0; width: 100%; overflow: hidden; display: none; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade), #000 calc(100% - var(--fade)), transparent 100%); }
html.art .mapbox.train .band { display: block; }
.mapbox.train .band .roll { position: absolute; left: 0; top: 0; width: 100%; background-repeat: repeat-y; image-rendering: pixelated;
  animation: groundroll var(--period) linear infinite; }
@keyframes groundroll { from { transform: translateY(calc(-1 * var(--tile))); } to { transform: translateY(0); } }
.mapbox.train .rl .tie { animation: ties 1s linear infinite; }
@keyframes ties { to { stroke-dashoffset: 3.8; } }
.mapbox.train .spr.car { animation: rock var(--rock, .7s) steps(1) var(--late, 0s) infinite, drift var(--drift, 11s) ease-in-out var(--late, 0s) infinite alternate; }
@keyframes rock { 50% { transform: translateY(calc(var(--ap) * -1)); } }
@keyframes drift { from { translate: 0 calc(var(--ap) * -1.5); } to { translate: 0 calc(var(--ap) * 1.5); } }
/* for show only: now and then a crossover is laid ahead of a carriage up the line and streams down with the ground,
   and the carriage runs over it onto the empty track beside it (trainShuffle, btp-train.js crossover). The S fades
   in and out at the edges of its stretch (its mask); its ties ride on it, so they do not stream as well. */
.mapbox.train .rl.xover .tie { animation: none; }
@media (prefers-reduced-motion: reduce) { .mapbox.train .rl.can .rail, .mapbox.train .band .roll, .mapbox.train .rl .tie, .mapbox.train .spr.car { animation: none; } }
/* the ambient loops: two frames side by side in one picture, flipped; a tumbleweed also rolls across its street */
.mapbox.dust .amb { background-size: 200% 100%; background-repeat: no-repeat; animation: flip2 .5s steps(1) infinite; }
@keyframes flip2 { 0%, 49.9% { background-position: 0 0; } 50%, 100% { background-position: 100% 0; } }
.mapbox.dust .amb.roll { animation: flip2 .32s steps(1) infinite, roll var(--dur) linear var(--delay) infinite; }
@keyframes roll { from { left: var(--from); } to { left: var(--to); } }
.mapbox.dust .amb.peck { animation-duration: 1.3s; } .mapbox.dust .amb.wag { animation-duration: .6s; } .mapbox.dust .amb.wave { animation-duration: .45s; }
@media (prefers-reduced-motion: reduce) { .mapbox.dust .fp.can, .mapbox.dust .nd.can, .mapbox.dust .amb { animation: none; } }

/* The card table, look B (the user's pick, 2026-10-28): across the table at eye level. The stage (wall, the
   gang's figures, Nan, the table's rim and baize, the gang's nameplate) is built once a fight and kept, so the
   gang's flinch and gloat play out; the seats' plaques, bids and the trick are a layer over it, redrawn every
   render. Art pixels are --k screen pixels (2-4, by width); the stage is 200 x 112 art px, centred, the gang at
   x ±(22..62) from the middle with their chests behind the rim (EDGE, 76). Without the art (html.art unset) the
   felt is the plain green it always was and the same plaques and trick sit on it. Art: bakery/saloon_px.py. */
.felt { --k: 3; --ax: calc(var(--k) * 1px); --lift: 5; }
.stage, .dyn { position: absolute; inset: 0; }
/* --drop: where the scale is small the nameplate would cover the gang's faces, so everything under it moves down */
.stage .wall, .stage .tbl, .stage .fig, .stage .nanfig { translate: 0 var(--drop, 0px); }
.dyn { top: var(--drop, 0px); }
.stage .wall, .stage .tbl { position: absolute; left: 50%; top: calc(-1 * var(--lift) * var(--ax)); width: calc(200 * var(--ax)); height: calc(112 * var(--ax)); transform: translateX(-50%);
  background: center / 100% 100% no-repeat; image-rendering: pixelated; display: none; }
.stage .tbl { z-index: 2; }
html.art .felt.dressed { background: #2b6748; }
html.art .felt.dressed .wall, html.art .felt.dressed .tbl, html.art .felt.dressed .fig { display: block; }
.stage .fig { position: absolute; display: none; top: calc((24 - var(--lift)) * var(--ax)); width: calc(40 * var(--ax)); height: calc(56 * var(--ax)); z-index: 1; }
.stage .fig img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.stage .fig.w { left: calc(50% - 62 * var(--ax)); } .stage .fig.w img { transform: scaleX(-1); }
.stage .fig.e { left: calc(50% + 22 * var(--ax)); }
.stage .fig.turn img { filter: drop-shadow(0 0 2px #ffe08a) drop-shadow(0 0 1px #ffe08a); }
.stage .fig.hit { animation: flinch .55s; } .stage .fig.hit img { filter: brightness(1.45) saturate(.6) sepia(.35); }
@keyframes flinch { 15% { transform: translate(-5px, 2px) rotate(-2deg); } 35% { transform: translate(5px, -1px) rotate(2deg); } 55% { transform: translate(-3px, 0); } 75% { transform: translate(2px, 0); } }
.stage .fig.gloat { animation: gloat .45s 2; }
/* a card's shot (Hollow Point and the rest) lands on the trick: the gang is knocked back and flashes red */
.stage .fig.shot { animation: shot .7s; } .stage .fig.shot img { animation: shotflash .7s; }
@keyframes shot { 8% { transform: translate(7px, -3px) rotate(5deg); } 22% { transform: translate(-4px, 1px) rotate(-3deg); } 40% { transform: translate(3px, 0) rotate(1deg); } 60% { transform: translate(-1px, 0); } }
@keyframes shotflash { 0%, 30% { filter: brightness(1.6) sepia(1) saturate(5) hue-rotate(-40deg); } 100% { filter: none; } }
.stage .plate.shake { animation: plateshake .45s; }
@keyframes plateshake { 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
.pop.shot { color: #ffe08a; font-size: 22px; }
.pop.shot small { display: block; font-size: 12px; -webkit-text-stroke: 0; color: #fff3d0; }
/* who bid what, at the table after the auction (the user's, 2026-10-30): the winner's bid in gold, the rest faded */
.dyn .seat .tag.won { background: #f3d070; border-color: #6b4a10; }
.dyn .seat .tag.lead { position: relative; background: #f3d070; border-color: #6b4a10; box-shadow: 0 0 0 2px rgba(243,208,112,.45), 0 0 10px rgba(243,208,112,.8); }
.dyn .seat .tag.lead i { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 1px; padding: 0 4px; font: 800 9px/12px Bitter, Georgia, serif; font-style: normal;
  letter-spacing: .08em; background: #6b4a10; color: #fff3d0; }
/* the bid to beat, at the head of the bid panel: a chip with the bid, and who holds it */
.standing { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin-bottom: 4px; background: #2e2216; color: #fbeed0; border: 2px solid rgba(243,208,112,.55); }
.standing .bchip { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: #f6efe0; border: 3px solid #2a2a2e; color: #1e1410; font: 800 14px/1 Bitter, Georgia, serif; }
html.art .standing .bchip { border: 0; border-radius: 0; background: url(art/ui/chip_S.png) center / 100% 100% no-repeat; image-rendering: pixelated; }
html.art .standing .bchip.s-C { background-image: url(art/ui/chip_C.png); } html.art .standing .bchip.s-D { background-image: url(art/ui/chip_D.png); }
html.art .standing .bchip.s-H { background-image: url(art/ui/chip_H.png); } html.art .standing .bchip.s-T { background-image: url(art/ui/chip_T.png); }
.standing .bchip.none, html.art .standing .bchip.none { background: none; border: 2px dashed rgba(243,208,112,.6); color: #f3d070; font-size: 11px; }
.standing .who2 { font-size: 16px; line-height: 1.25; } .standing .who2 b { color: #f3d070; } .standing .who2 small { display: block; font-size: 13px; color: #e8d8b0; }
.standing.you { border-color: #8fd09a; } .standing.you .who2 b { color: #a8e8b0; }
.dyn .seat .tag.lost { background: #e8e0d0; color: #6a5a48; border-color: #8a7a68; font-weight: 700; }
.bidwon { position: absolute; left: 50%; top: calc(var(--edge) * var(--ax) + 12px); transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 8px;
  background: rgba(28,20,14,.86); color: #fff3d0; font-size: 15px; text-align: center; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.3); animation: bidwon .5s ease-out; }

/* Dustwater's rooms (bakery/rooms.py, rooms_px.py; art/rooms/scene.js, 2026-10-30): the General Store with its
   storekeeper behind the counter, and the hotel room at night. Shown only with the art (html.art), in Act I. */
.room { display: none; position: relative; overflow: hidden; height: calc(100 * var(--ax)); margin: 0 0 10px; border: 3px solid #3a2018; border-radius: 6px; background: #3a2418; --ax: calc(var(--rk, 2) * 1px); }
html.art .room { display: block; }
.room > i { position: absolute; left: 50%; top: 0; width: calc(200 * var(--ax)); height: calc(100 * var(--ax)); transform: translateX(-50%); background-size: 100% 100%; image-rendering: pixelated; pointer-events: none; }

.room .flame { position: absolute; z-index: 2; width: calc(40 * var(--ax)); height: calc(40 * var(--ax)); margin: calc(-20 * var(--ax)) 0 0 calc(-20 * var(--ax)); border-radius: 50%; background: radial-gradient(circle, rgba(255, 210, 130, .32), rgba(255, 210, 130, 0) 68%); animation: flicker 2.6s ease-in-out infinite; pointer-events: none; }
@keyframes flicker { 0%, 100% { opacity: .9; } 30% { opacity: .65; } 55% { opacity: 1; } 80% { opacity: .75; } }
.room.asleep::after { content: ''; position: absolute; inset: 0; z-index: 4; animation: lampDown 1.6s forwards; }
@keyframes lampDown { from { background: rgba(10, 14, 40, 0); } to { background: rgba(10, 14, 40, .66); } }

.room .zzz { position: absolute; z-index: 5; display: none; color: #fbf3dc; font: 700 18px/1 'Pixelify Sans', Bitter, serif; text-shadow: 0 2px 0 #1c2448; pointer-events: none; }

.btn.mini { min-height: 36px; padding: 4px 10px; font: 700 13px/1.2 Bitter, Georgia, serif; margin: 4px 4px 0 0; }   /* the pixel C reads as an O this small */

  box-shadow: inset 0 0 0 2px #9a6e48; border-radius: 4px; padding: 1px 8px 4px; max-width: 520px; margin: 0 auto; line-height: 1.25; }

/* ==================================================================================================================
   The western UI (2026-10-30, style B of bakery/spike/ui, the user's pick): pixel-art frames and buttons, readable
   type. Fonts ship with the game (fonts/, SIL OFL): Bitter for text and every number, Pixelify Sans for headings and
   buttons. The frames are 12 x 12 tiles cut 4/4/4 (bakery/ui_frames.py -> art/ui), drawn at 3 screen px an art px
   (2 on the small buttons); they apply only once the art has loaded (html.art), so without it the page keeps its
   plain look. The table's strips fold into the saloon (foldIntoSaloon): the bonus or the rule is a line on the gang's
   nameplate, the bid a ribbon under it, each side's tricks notches against what its bid needs. */
@font-face { font-family: Bitter; src: url(fonts/Bitter.ttf) format('truetype'); font-weight: 100 900; font-display: swap; }
/* the pixel face never draws a digit (its 2 reads as an 8: a player saw "High bid: 8♥" for 2♥), so every number,
   even inside a pixel word, falls through to Bitter */
@font-face { font-family: "Pixelify Sans"; src: url(fonts/PixelifySans.ttf) format('truetype'); font-weight: 400 700; font-display: swap; unicode-range: U+0000-002F, U+003A-10FFFF; }
body { font-family: Bitter, Georgia, serif; }
/* the pixel face only where it is big enough to read (at 12px its C looks like an O) */
h2, h3, .btn, .iconbtn, .status, .bidpanel > div > b, .choice b { font-family: "Pixelify Sans", Bitter, monospace; }
h2, h3 { font-weight: 600; letter-spacing: .02em; }
.btn, .iconbtn { font-weight: 600; }

/* the folded table (always, with or without the art) */
.objective, #contract:not(.keep), .felt .tally { display: none !important; }
.fold { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.stage .foe .fbonus { pointer-events: auto; display: flex; align-items: baseline; gap: 6px; width: 100%; margin: 3px 0 0; padding: 2px 0 0; border: 0; border-top: 1px dashed rgba(243,208,112,.45);
  background: none; color: #f3e6cc; font: 12px/1.2 Bitter, Georgia, serif; text-align: left; }
.stage .foe .fbonus small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #f3d070; }
.stage .foe .fbonus b { font-size: 12px; }
.stage .foe .fbonus span { margin-left: auto; }
.stage .foe .fbonus .st { font-style: normal; color: #f3d070; } .stage .foe .fbonus .st .off { color: rgba(243,208,112,.35); }
.stage .foe .fbonus.rule { display: block; }
/* a taller invisible hit area for the bonus line (a finger is 40px) */
.stage .foe .fbonus { position: relative; }
.stage .foe .fbonus::before { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -14px; }
.stage .foe .ribbon { position: absolute; left: 50%; top: calc(100% + 1px); transform: translateX(-50%); white-space: nowrap; padding: 3px 12px; font-size: 13px; color: #fbeed0; z-index: 5;
  background: #a8261e; box-shadow: 0 3px 0 #3a0e0a, inset 0 2px 0 #d8483a; }
.stage .foe .ribbon:not(.theirs) { background: #2e5a3e; box-shadow: 0 3px 0 #10241a, inset 0 2px 0 #4e8a5e; }
.stage .foe .ribbon em { font-style: normal; font-weight: 800; color: #ffc0b0; }
.fold .tallies { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; gap: 14px; white-space: nowrap; font-size: 12px; font-weight: 700; color: #fbeed0;
  padding: 2px 10px; background: rgba(20,12,6,.7); }
.fold .tallies i { display: inline-block; width: 7px; height: 12px; margin-left: 2px; vertical-align: -2px; border: 1px solid rgba(251,238,208,.35); }
.fold .tallies i.need { border-color: #f3d070; } .fold .tallies i.on { background: #f3d070; border-color: #f3d070; }
.felt.compact .stage .foe .fbonus, .felt.strip .stage .foe .fbonus { display: none; }

/* the materials, once the art is on */
html.art body { background: #24160c; }
html.art .app { background: transparent; }
html.art h2, html.art h3 { color: #6a1d14; }
html.art .top, html.art .screenbar { background: #3a2212; border: 0; border-bottom: 6px solid #1a0e06; color: #fbeed0; padding: 8px 10px; }

html.art .btn, html.art .iconbtn { border: 12px solid transparent; border-image: url(art/ui/wood.png) 4 fill / 12px stretch; border-radius: 0; background: none; color: #fbeed0; padding: 0 6px;

  box-shadow: 0 6px 0 rgba(10,5,2,.45); color: #2a1a0c; padding: 6px 8px; image-rendering: pixelated; }

/* the reward reveal: a card back over each offer turns away as the offer flips up, then a glow as it lands */
.choice { position: relative; }
.choice.rv { animation: rvflip .6s var(--d, 0s) both; }
.choice.rv .cb { position: absolute; inset: -12px; z-index: 3; background: #5a1a14 url(art/back.webp) center / auto 88% no-repeat; image-rendering: pixelated;
  border: 3px solid #2a1b16; border-radius: 8px; animation: rvback .6s var(--d, 0s) both; pointer-events: none; }
.choice.rv::after { content: ""; position: absolute; inset: -12px; pointer-events: none; animation: rvglow 1.3s calc(var(--d, 0s) + .5s) both; }
.choice.silver.rv::after { animation-name: rvsilver; animation-duration: 1.8s; }
@keyframes rvflip { 0% { transform: perspective(700px) rotateY(180deg) scale(.95); } 65% { transform: perspective(700px) rotateY(-10deg) scale(1.03); } 100% { transform: none; } }
@keyframes rvback { 0%, 42% { opacity: 1; } 43%, 100% { opacity: 0; } }
@keyframes rvglow { 0% { box-shadow: 0 0 0 0 rgba(243, 208, 112, 0); } 30% { box-shadow: 0 0 18px 5px rgba(243, 208, 112, .7); } 100% { box-shadow: 0 0 0 0 rgba(243, 208, 112, 0); } }
@keyframes rvsilver { 0% { box-shadow: 0 0 0 0 rgba(214, 230, 246, 0); } 25% { box-shadow: 0 0 30px 10px rgba(226, 238, 250, .95); } 60% { box-shadow: 0 0 14px 4px rgba(214, 230, 246, .6); } 100% { box-shadow: 0 0 8px 2px rgba(214, 230, 246, .45); } }
/* silver-mounted (the rare offer; "gilded" until 2026-11-04, the user's: it read as the Gilded enhancement, and its
   gold read as chosen): polished silver, a shine running across it, a tag and its bonus. Chosen is still brass. */
.choice.silver { background: linear-gradient(135deg, #f6f8fa, #c6ced8 45%, #f2f5f8 55%, #a4aebb); border-color: #5c6674; overflow: visible; }
html.art .choice.silver { border-image: url(art/ui/silver.png) 4 fill / 12px stretch; box-shadow: 0 0 10px 2px rgba(214, 230, 246, .6); }
.choice.silver.on { border-color: #8a6412; box-shadow: inset 0 0 0 2px var(--gold), 0 0 10px 2px rgba(255, 214, 90, .6); }
html.art .choice.silver.on { border-image: url(art/ui/brass.png) 4 fill / 12px stretch; box-shadow: 0 0 0 3px #f3d070, 0 0 12px 3px rgba(255, 214, 90, .7); }
.choice.silver::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 240, .75) 48%, transparent 60%) -150% 0 / 60% 100% no-repeat; animation: gshine 2.6s 1.2s ease-in-out infinite; }
@keyframes gshine { 0% { background-position: -150% 0; } 60%, 100% { background-position: 250% 0; } }
.choice .gtag { position: absolute; top: -18px; right: 6px; z-index: 2; font: 800 10px/14px Bitter, Georgia, serif; font-style: normal; letter-spacing: .14em; padding: 1px 7px;
  background: #46505e; color: #f2f6fa; box-shadow: 2px 2px 0 rgba(42, 27, 22, .5); }
.choice .gline { display: block; color: #3e4856; font-weight: 700; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .choice.rv, .choice.rv .cb, .choice.rv::after, .choice.silver::before { animation: none; } .choice.rv .cb { display: none; } }
html.art .choice .price { background: #e8b840; color: #2a1a0c; border-radius: 0; box-shadow: 2px 2px 0 #5a3a10; padding: 0 6px; font-weight: 800; }
html.art .stage .foe { border: 12px solid transparent; border-image: url(art/ui/sign.png) 4 fill / 12px stretch; border-radius: 0; background: none; padding: 0 2px; box-shadow: none; image-rendering: pixelated; }
html.art .stage .foe .foebar { border-radius: 0; }
html.art .felt.compact .stage .foe, html.art .felt.strip .stage .foe { border-width: 6px; border-image-width: 6px; }

/* The bar stays at the top as the screen scrolls (2026-11-04, the user's: "on the map, the health, gold, rules and
   menu bar should be a sticky header"), edge to edge, over the map's markers (z 2000) and under its pop-ups (2500+)
   and the sheets (the screen is its own layer under them). With the art, the act's name scrolls away on its own row
   and the stats and buttons stay: top is minus that row (8 padding + 22 line + 8 gap, less 4 to keep a margin). */
.screenbar { position: sticky; top: 0; z-index: 2050; background: var(--bg); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }

/* the health box says "of 500; the run ends at 0" only when it matters (danger), so the bar fits a phone */
.stat.hp:not(.danger) small { display: none; }
html.art .felt { box-shadow: inset 0 -6px 0 #3a2212; }

html.art .hand, html.art .bidpanel { background: #2a5a3c repeating-conic-gradient(rgba(0,0,0,.06) 0 25%, transparent 0 50%) 0 0 / 6px 6px; border-top: 12px solid #6e4424; box-shadow: inset 0 3px 0 #9a6438; color: #fbeed0; }

  color: #1e1410; font-weight: 800; font-size: 14px; line-height: 1; }
html.art .bidgrid button[data-bid$="C"] { background-image: url(art/ui/chip_C.png); } html.art .bidgrid button[data-bid$="D"] { background-image: url(art/ui/chip_D.png); }
html.art .bidgrid button[data-bid$="H"] { background-image: url(art/ui/chip_H.png); } html.art .bidgrid button[data-bid$="T"] { background-image: url(art/ui/chip_T.png); }

<script>
(function () {
  'use strict';
  const E = window.BtpEngine, R = window.BtpRun, AI = window.BtpAI;
  const KEY = 'btp-run-v3', TIPS_DONE = 'btp-tips-done', PREFS = 'btp-prefs';
  /* Pace (the menu): every wait the page makes, in one table. `undo` is how long the computer holds back after
     a move you can take back. ?fast (the tests) makes every wait 0. */
  const PACE = {
    relaxed: { bid: 1000, play: 1100, undo: 2000, readBase: 1500, readPer: 36, readMax: 4500 },
    brisk:   { bid: 650,  play: 750,  undo: 1300, readBase: 1100, readPer: 28, readMax: 3400 },
    quick:   { bid: 300,  play: 350,  undo: 800,  readBase: 600,  readPer: 14, readMax: 1800 }
  };
  const PACE_NAME = { relaxed: 'Relaxed', brisk: 'Brisk', quick: 'Quick' };
  /* Settings kept in this browser: the pace, and whether a finished trick waits for your tap (the default: you
     are the whole table, so nobody else is reading) or clears itself after its reading time. */
  function loadPrefs() {
    const d = { pace: 'brisk', tricks: 'tap' };
    try { return Object.assign(d, JSON.parse(localStorage.getItem(PREFS) || '{}')); } catch (e) { return d; }
  }
  const FAST = /[?&]fast\b/.test(location.search);
  /* ?demo=play|bid|store|sheet freezes the page on one moment (screenshots; the UI spike used it with its ?ui
     styles). The game never sets it. */
  const DEMO = (location.search.match(/[?&]demo=(\w+)/) || [])[1] || '';
  /* The card art (bakery/ -> art/). Never load-bearing: html.art is set only once a picture has really
     loaded, so ?noart, a missing folder, or jsdom (which loads no images) all keep the drawn faces.
     BUMP ART_VER after a re-bake: the file names never change, so a browser keeps the old pictures. */
  const ART_VER = 40, NOART = /[?&]noart\b/.test(location.search);
  const artURL = f => 'art/' + f + '?v=' + ART_VER;
  if (!NOART && typeof Image !== 'undefined') {
    const probe = new Image();
    probe.onload = () => { document.documentElement.style.setProperty('--back', 'url(' + artURL('back.webp') + ')'); document.documentElement.classList.add('art'); };
    probe.src = artURL('back.webp');
  }
  const $ = id => document.getElementById(id);
  const P = { L: null, timer: null, guardUntil: 0, sheet: null, shown: null, undo: [], stuck: null, prefs: loadPrefs() };
  /* The Hot Hand's A/B test (2026-11-03): each browser is put in a group the first time it's asked (profile.ab.hot,
     on or off, half and half). The menu's switch (prefs.hot) overrides it. A new story takes whichever holds; the
     Daily never has it (everyone plays the same Daily). */
  function hotSetting() {
    if (P.prefs.hot === 'on' || P.prefs.hot === 'off') return P.prefs.hot;
    if (FAST) return 'off';      // the tests turn it on themselves
    const pr = profile();
    if (!pr.ab || !pr.ab.hot) { pr.ab = Object.assign({}, pr.ab, { hot: Math.random() < 0.5 ? 'on' : 'off', since: new Date().toISOString().slice(0, 10) }); try { localStorage.setItem(PROFILE, JSON.stringify(pr)); } catch (e) {} }
    return pr.ab.hot;
  }
  function setPref(k, v) { P.prefs[k] = v; try { localStorage.setItem(PREFS, JSON.stringify(P.prefs)); } catch (e) {} }
  const wait = k => FAST ? 0 : (PACE[P.prefs.pace] || PACE.brisk)[k];
  window.BtpPage = P;

  /* ---------------- storage ---------------- */
  /* A story saves under KEY, a game of Standard 500 under STD_KEY, so neither overwrites the other. The profile
     remembers which Showdown gangs you have beaten in any story: they become Standard 500 opponents. */
  const STD_KEY = 'btp-std-v1', PROFILE = 'btp-profile';
  function save() { try { if (P.L) { localStorage.setItem(P.L.mode === 'standard' ? STD_KEY : P.L.daily ? DAILY_KEY : KEY, JSON.stringify(P.L)); noteBeaten(P.L); } } catch (e) {} }
  function loadStd() { try { const s = localStorage.getItem(STD_KEY); const L = s ? JSON.parse(s) : null; return L && L.mode === 'standard' && L.phase !== 'stdover' ? L : null; } catch (e) { return null; } }
  function clearStd() { try { localStorage.removeItem(STD_KEY); } catch (e) {} }
  function profile() { try { return JSON.parse(localStorage.getItem(PROFILE)) || { beaten: [] }; } catch (e) { return { beaten: [] }; } }
  /* The ride clock (2026-10-30, the review's #2: time a real run): seconds of play by act, counted while the page is

  }
  function ownedRow(L) { return L.owned.length ? '<div class="yours">Already yours: ' + L.owned.map(c => cardHTML(c, { small: true, owned: true })).join('') + '</div>' : ''; }
  /* The act-start pan: from the top of the map (the Showdown) down to the first choices, eased, over a couple of
     seconds; any touch, wheel or key hands the scroll back at once. Skipped when it all fits, in ?fast, and
     under reduced motion. */
  function panMap(done) {
    let called = false;
    const fin = () => { if (!called && done) { called = true; done(); } };
    const box = document.querySelector('.mapbox');
    let first = [...document.querySelectorAll('.mapbox .nd.can')];
    if (!first.length) first = [...document.querySelectorAll('.mapbox .nd[data-n^="0:"]')];      // before the run starts
    if (!box || !box.getBoundingClientRect || !first.length) return fin();
    const r = box.getBoundingClientRect();
    if (!r.height || r.height < innerHeight * 0.8) return fin();
    const low = Math.max(...first.map(n => n.getBoundingClientRect().bottom)) + scrollY;
    const from = Math.max(0, r.top + scrollY - 70), to = Math.max(from, low - innerHeight + 90);
    let reduce = false;
    try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* old browser */ }

    ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(e => addEventListener(e, quit, { passive: true }));

  // how far the table runs past the bottom of the screen (the last thing on it, not the page's own minimum height)

    '<li><b>Deck:</b> Act I is hearts and diamonds 9 to Ace plus the Joker, 3 cards each. Act II adds spades and clubs: 6 cards each. Act III is the whole 500 pack (red 4s and black 5s up): 10 cards each. The kitty takes the rest (1, 1, then 3).</li>' +

  function menuHTML() {

  function hotMenuHTML() {

        '</td><td>' + (ours ? Math.round(100 * (ours - made) / ours) + '%' : '\u2013') + '</td><td>' + (on && n ? (r.reduce((a, x) => a + x.best, 0) / n).toFixed(1) : '\u2013') + '</td></tr>'; };

  /* Install to home screen (2026-11-03): played from the home screen the game is full screen, with no browser bars.

  const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };

  } catch (e) { /* no install support: the game plays the same */ }
  // the Hot Hand's group, settled as the page opens (a story started later saves the profile it read first)

  /* The reward reveal (2026-11-03, the user's: "rewards come face down and flip with a rarity glow; rare gilded

  function revealOf(L, s) {

    const gilt = x => s.gilded === x;

  // a menu choice whose value has a default (the pref may be unset)

  /* What a card does: its buff (enhancement or polish), its hex, whether it is yours, and what it is this hand. */
  function cardInfoHTML(c) {
    const L = P.L, h = L.phase === 'hand' ? L.h : null, tr = h ? h.trump : null;
    const m = L.mods[c] || {}, hx = (L.hexes || {})[c], owned = L.owned.includes(c), tags = [], lines = [];

  function showCardInfo(c) { if (P.L && c) openSheet('info', cardInfoHTML(c)); }

  /* ---------------- the loop: AI seats and holds, paced for reading ---------------- */
  function readMs(text) { const t = PACE[P.prefs.pace] || PACE.brisk; return FAST ? 0 : Math.min(t.readMax, t.readBase + t.readPer * text.length); }
  /* One computer move. A refused move never spins: the run takes the first legal move instead and says so; if

  function aiMove(L) {
    const res = R.aiStep(L);
    P.undo = [];

    const fb = R.aiFallback(L);
    if (!fb || !fb.ok) P.stuck = (fb && fb.why) || 'no legal move';
  }
  function step() {
    clearTimeout(P.timer);
    P.timer = null;
    const L = P.L;
    if (!L) return;
    if (L.tips && L.levelsDone >= 3 && L.phase !== 'hand') markTipsDone();
    if (L.phase === 'victory' || L.phase === 'runover') { markTipsDone(); noteRide(L); }
    noteWall(L);
    if (L.phase !== 'hand') P.undo = [];
    render();
    save();
    // paused while a sheet is open, while the page is hidden (visibilitychange resumes it) or if a move was refused twice
    if (P.sheet || document.hidden || P.stuck || DEMO || standoffDue(L) || P.ceremony || kitStep(L) === 'closed') return;
    const w = R.whoseMove(L);
    // your only legal card plays itself (2026-10-30, the review's #2: shorter runs); a setting in the menu
    if (w === 'you' && L.h.phase === 'play' && oneCard() === 'auto') {
      const legal = E.legalPlays(L, 0);
      if (legal.length === 1) {
        const c = legal[0];

        return;
      }
    }

    else if (w === 'hold' && L.h.phase === 'trick' && P.prefs.tricks === 'auto') P.timer = setTimeout(() => { R.act(L, 'ack'); step(); }, readMs(L.h.last.reason) + (decided(L) && !FAST ? 1100 : 0));

  /* Your moves in a hand can be taken back until the computer's next move: a snapshot of the whole run (it is

  const UNDOABLE = { bid: 1, discard: 1, play: 1, swing: 1 };
  function moveName(L, kind, arg) {
    if (kind === 'bid') return arg ? 'your ' + bidPlain(arg) + ' bid' : L.h.raise ? 'keeping your bid' : 'your pass';
    if (kind === 'discard') return 'putting back the ' + E.label(arg);
    if (kind === 'swing') return L.h.pass === 'grand' ? 'passing the ' + E.label(arg) : arg ? 'swapping the ' + E.label(arg) : 'keeping your hand';
    return 'your ' + E.label(arg);
  }

    const L0 = P.L, undoable = L0.phase === 'hand' && UNDOABLE[kind];

  /* ---------------- input ---------------- */
  /* Hold a card down (or right-click it) to see what it does. The click that follows a hold is swallowed, so the

  const HOLD_MS = 450;

    if (d.release) { move('release', d.release); return; }
    if (d.cleanse) { move('cleanse', d.cleanse); return; }
    if (d.pickenh) { const s = P.enhSel; s.enh = d.pickenh; s.why = ''; if (s.card && R.cantTake(L, s.card, s.enh)) s.card = null; render(); return; }

      if (why) { s.why = why.charAt(0).toUpperCase() + why.slice(1) + '.'; s.card = null; } else { s.card = s.card === d.pickcard ? null : d.pickcard; s.why = ''; }

    switch (d.act) {

  /* ---------------- the Daily Challenge (2026-11-02) ---------------- */
  /* One ride a day: today's date seeds the run, everyone rides your horse with the day's twist (one of the Wanted

  const DAILY_KEY = 'btp-daily-v1';

  function newRun() {

  /* Choosing a partner (2026-11-03, the user's: "the character selection is a bit weird"): one partner large in

  /* The bond, the unlock bars and the Wanted Wall (2026-11-03, the user's list: "the reasons to come back"). */

  const BOND_PERK = ['rides with you', 'their own greeting', 'a sheriff\u2019s star on their portrait', 'another greeting', 'their second trick: start each story with ' + R.BOND.gold + ' gold'];

  // how close you've come to an unlock (profile.best), as a bar

    return '<div class="ubar"><span class="meter"><i style="width:' + pct + '%"></i></span><small>' + (label || (f ? 'Your best: ' + pct + '% of the way' : 'Not tried yet')) + '</small></div>';

  // the Wanted Wall's catalogue: every gang and duelling pair by act, then the act's Showdown; the secret one once met
  function wallList() {

      (R.DUELISTS[a] || []).forEach(g => out.push({ act: a, kind: 'elite', name: g[0], look: [g[1], g[2]] }));

  // the end of a story: the bond, what's still locked and how close you came, the Wall

  /* Standard 500: the Euchre-ka! Regulars always; each Showdown gang once you have beaten it in a story. */

        const t = target.getBoundingClientRect(), c2 = card.getBoundingClientRect();
        pl.classList.remove('on');
        card.classList.add('fly');
        card.style.transform = 'translate(' + (t.left + t.width / 2 - c2.left - c2.width / 2) + 'px,' + (t.top + t.height / 2 - c2.top - c2.height / 2) + 'px) scale(' + Math.max(0.08, t.width / c2.width) + ')';
        card.style.opacity = 0;
        CERE.timers.push(setTimeout(() => { pulseEl(target); next(); }, 500));
      };
      c.onclick = () => { if (card.classList.contains('stamped')) fly(); };
      CERE.timers.push(setTimeout(fly, rm ? 4000 : 3600));
    };
    next();
  }
  // where a power lives on the table: its chip, the Showdown's rule, or the nameplate
  const pwTarget = p => document.querySelector('#felt .foe .ftag[data-k="' + p.k + '"]') || (p.k === 'boss' && document.querySelector('#felt .notice.rule')) || document.querySelector('#felt .stage .foe');
  // (after the hand is drawn: the felt's cues run before it)
  // a line said over a folded table: a bubble just under it, on the right, gone after a few seconds or a tap
  function floatUnder(el, html) {
    if (FAST) return;
    setTimeout(() => {
      const r = el.getBoundingClientRect(), d = document.createElement('div');
      if (!r.height) return;
      d.className = 'bubble jokersay pfloat'; d.innerHTML = html;
      d.style.left = Math.max(8, innerWidth - 256) + 'px'; d.style.top = Math.round(r.bottom + 4) + 'px';
      document.body.appendChild(d);
      const gone = () => d.remove();
      d.onclick = gone; setTimeout(gone, 4500);
    }, 60);
  }
  function jokerSays(text) {
    setTimeout(() => {
      const card = document.querySelector('#hand [data-c="JK"]') || document.querySelector('#hand');
      if (!card) return;
      const r = card.getBoundingClientRect(), d = document.createElement('div');
      d.className = 'bubble jokersay'; d.innerHTML = '<b>The Joker:</b> \u201c' + esc(text) + '\u201d';
      d.style.left = Math.max(8, Math.min(innerWidth - 248, r.left + r.width / 2 - 120)) + 'px';
      document.body.appendChild(d);
      d.style.top = Math.max(8, r.top - d.offsetHeight - 6) + 'px';
      const gone = () => d.remove();
      d.onclick = gone; setTimeout(gone, 4500);
    }, 60);
  }
  function pulseEl(el) { if (!el) return; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  function pwPop(p, el, text) {
    if (FAST || !el) return;
    const r = el.getBoundingClientRect(), d = document.createElement('div');
    d.className = 'pwpop ' + p.cls; d.textContent = text || p.name;
    d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top - 4) + 'px';
    document.body.appendChild(d); setTimeout(() => d.remove(), 1500);
  }
  function pwCoin(from, to) {
    if (FAST || reduceMotion() || !from || !to || !document.body.animate) return;
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect(), c = document.createElement('i'), dx = b.left + b.width / 2 - a.left - a.width / 2, dy = b.top + b.height / 2 - a.top - a.height / 2;
    c.className = 'pwcoin'; c.style.left = (a.left + a.width / 2 - 9) + 'px'; c.style.top = (a.top + a.height / 2 - 9) + 'px'; document.body.appendChild(c);
    c.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(' + dx / 2 + 'px,' + (dy / 2 - 60) + 'px)', offset: 0.5 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.7)' }], { duration: 650, easing: 'ease-in-out' }).onfinish = () => c.remove();
  }
  /* A power firing, once per moment (P.cues): its chip and intent pulse, its name pops, and for a few the thing it
     touches shows it (a coin off your gold, your card's rank, the table going round the other way). */
  function powerCues(L, felt) {
    if (FAST || L.phase === 'over' || P.ceremony || standoffDue(L)) return;
    const ps = powersOf(L), h = L.h;
    if (!ps.length || !h) return;
    const has = k => ps.find(p => p.k === k || p.id === k);
    P.cues = P.cues || {};
    const once = key => { if (P.cues[key]) return false; P.cues[key] = 1; return true; };
    const fire = (p, text, delay) => setTimeout(() => {
      const chip = pwTarget(p), it = felt.querySelector('.stage .intent[data-pw="' + p.k + '"]');
      pulseEl(chip); pulseEl(it); pwPop(p, it || chip, text);
    }, delay || 0);
    const base = L.level + '-' + L.handNo;
    // at the deal: the powers that change what you're dealt or how you bid
    if (L.phase === 'hand' && h.phase === 'bid' && once('deal' + base)) {
      let d = 0;
      ['sleeve', 'marked', 'lucky', 'locked', 'ticking', 'nokitty', 'facekitty'].forEach(k => { const p = has(k); if (p && (k !== 'lucky' || h.stacked)) { fire(p, null, 300 + d); d += 700; } });
      if (h.stacked && !has('lucky')) { /* the floor's stacked deck has its own chip */ }
    }
    if (L.phase === 'hand' && h.phase === 'bid' && h.turn === 2 && has('gag') && once('gag' + base)) fire(has('gag'), PN() + ' is gagged');
    // the Joker speaks his dare from your hand, a few seconds, once (its short form stays in the bid panel)
    if (L.phase === 'hand' && h.phase === 'bid' && L.dare && !L.dare.done && L.dare.hand === L.handNo && once('dare' + base + L.dare.id)) jokerSays(L.dare.text);
    // a Showdown's last stand: its own card, once a fight, at the deal it starts (kept on the run, so a reload doesn't replay it)
    if (L.phase === 'hand' && h.phase === 'bid' && L.stand && has('stand') && L.standShown !== L.level) { L.standShown = L.level; playCeremony(L, step, [has('stand')]); return; }
    // a Duel's new rule every deal, and the Showdown the Stranger borrows from
    if (L.phase === 'hand' && h.phase === 'bid' && L.handNo > 1 && L.kind === 'elite' && has('rule') && once('nrule' + base)) fire(has('rule'), 'New rule: ' + has('rule').name, 200);
    if (L.phase === 'hand' && h.phase === 'bid' && L.borrow && has('boss') && once('borrow' + base)) fire(has('boss'), R.poss(R.BOSS[L.borrow].short) + ' rule', 200);
    if (L.phase === 'hand' && h.phase === 'swing' && has('grand') && once('grand' + base)) fire(has('grand'));
    // your card on the table: Rusty Guns plays it a rank lower
    if (L.phase === 'hand' && (h.phase === 'play' || h.phase === 'trick') && h.trick[0] && has('rusty') && once('rust' + base + '-' + h.trickNo)) {
      const c = h.trick[0];
      if (c !== 'JK' && E.rankOf(c) !== 'J') fire(has('rusty'), 'Rusty Guns: ' + E.label(c) + ' \u22121');
    }
    // a finished trick
    if (L.phase === 'hand' && h.phase === 'trick' && h.last && once('trick' + base + '-' + h.trickNo)) {
      const theirs = E.team(h.last.winner) === 1, first = h.trickNo === 1;
      if (theirs && has('shakedown')) { fire(has('shakedown'), 'Shakedown \u22125g'); pwCoin($('goldstat'), felt.querySelector('.stage .fig.' + (h.last.winner === 1 ? 'w' : 'e'))); }
      if (theirs && has('snakebite')) fire(has('snakebite'), 'Snakebite \u22125', 250);
      if (!theirs && has('armour') && h.contract && E.team(h.contractor) === 1) fire(has('armour'), 'Thick Hide: no hit');
      if (first) ['sand', 'bushwhack', 'dealerleads', 'promenade', 'reverse'].forEach((k, j) => { const p = has(k); if (p) fire(p, null, 200 + 500 * j); });
      if (has('corner')) {
        fire(has('corner'), first ? null : 'Widdershins', 0);
        if (first && !reduceMotion()) { const r = document.createElement('div'); r.className = 'pwring'; r.innerHTML = '<svg viewBox="0 0 260 160" width="100%" height="100%"><ellipse cx="130" cy="80" rx="118" ry="64" fill="none" stroke="#ffe9b0" stroke-width="5" stroke-dasharray="22 14"/><path d="M248 80 l-12 -16 l-6 18 z M12 80 l12 16 l6 -18 z" fill="#ffe9b0"/></svg>'; felt.appendChild(r); setTimeout(() => r.remove(), 1700); }
      }
      if (has('allemande') && h.last.cards && h.last.cards.some(x => x && E.rankOf(x) === 'J')) fire(has('allemande'));
    }
    // the hand's end: what bled you
    if (L.phase === 'summary' && h.result && once('sum' + base)) {
      if (has('gutshot')) fire(has('gutshot'), 'Gut Shot \u221210');
      if (has('deadeye') && h.result.dmg > 0) fire(has('deadeye'), 'Dead Eye \u00d71.5', 300);
    }
  }
  /* Game over: the grave, then the run's ending (already drawn behind it). Once a run; never in ?fast. */
  const GRAVE = { timers: [] };
  function playGrave(L) {
    const key = L.rs + ':' + L.level + ':' + L.handNo;
    if (FAST || P.graveFor === key) return;
    P.graveFor = key;
    const g = $('grave'), S = window.GRAVE_SCENE, art = document.documentElement.classList.contains('art') && S;
    const W = S ? S.W : 240, H = S ? S.H : 112;
    // art pixels to the screen: a phone held upright shows about the middle 125 (the fresh grave and its neighbours)
    const k = Math.max(2, Math.min(Math.floor(innerWidth / 125), Math.floor(innerHeight * 0.62 / H))) || 2;
    const rig = g.querySelector('.grig'), plate = g.querySelector('.gplate'), far = g.querySelector('.gfar');
    rig.style.height = (H * k) + 'px';
    g.style.setProperty('--gk', k);
    plate.style.width = W * k + 'px'; plate.style.height = H * k + 'px';
    // the ground under the plate's horizon runs on to the screen's edges; the buttes sit on the horizon
    const horizon = S ? 26 : 30;
    g.querySelector('.gground').style.height = ((H - horizon) * k) + 'px';
    plate.innerHTML = art ? '<img src="' + artURL('grave/plate.webp') + '" alt="">' : '';
    if (art && S.mesas) { far.style.height = S.mesas.h * k + 'px'; far.style.bottom = ((H - horizon) * k - 2) + 'px'; far.style.backgroundImage = 'url(' + artURL('grave/' + S.mesas.img + '.webp') + ')'; far.style.backgroundSize = S.mesas.w * k + 'px ' + S.mesas.h * k + 'px'; }
    else far.style.backgroundImage = 'none';
    // push in on the fresh grave
    const gx = S ? S.grave[0] / W : 0.5, gy = S ? S.grave[1] / H : 0.7;
    rig.style.transformOrigin = 'calc(50% + ' + ((gx - 0.5) * W * k).toFixed(0) + 'px) ' + (gy * 100).toFixed(1) + '%';
    g.style.setProperty('--push', innerWidth < 500 ? 1.7 : 2.2);
    g.querySelectorAll('.tumble').forEach(t => t.remove());
    if (art) { const t = document.createElement('div'); t.className = 'tumble'; t.style.width = 12 * k + 'px'; t.style.height = 10 * k + 'px'; t.style.bottom = (H * 0.18 * k) + 'px';
      t.style.backgroundImage = 'url(' + artURL('dustwater/tumble.webp') + ')'; g.appendChild(t); }
    const who = L.lostTo ? (R.BOSS[L.lostTo] ? R.BOSS[L.lostTo].name : L.lostTo) : 'a stray bullet';
    const where = L.kind === 'boss' && R.PLACE[L.act] ? R.PLACE[L.act].boss : E.ACTS[L.act].name;
    g.querySelector('.gcard').innerHTML = '<small>HERE LIES</small><b>A Bounty Hunter</b><p>Shot down by ' + esc(who.replace(/^The /, 'the ')) + ' at ' + esc(where.replace(/^The /, 'the ')) + ', Act ' + R.ROMAN[L.act] + '.<br>' + (L.partner === 'horse' ? PN() + ' stands by, her hat held in her teeth.' : PN() + ' says a few kind words.') + '</p>' +
      '<button class="btn" data-act="skipgrave">See how the ride went</button>';
    g.classList.remove('push', 'said');
    g.hidden = false;
    GRAVE.timers.forEach(clearTimeout);
    GRAVE.timers = [setTimeout(() => g.classList.add('push'), 300), setTimeout(() => g.classList.add('said'), reduceMotion() ? 600 : 4200)];
  }
  function endGrave(quiet) {
    GRAVE.timers.forEach(clearTimeout); GRAVE.timers = [];
    const g = $('grave');
    if (!g || g.hidden) return;
    g.hidden = true;
    g.classList.remove('push', 'said');
    if (!quiet) try { window.scrollTo(0, 0); } catch (e) { /* no layout */ }
  }
  // Continue: a short dust wipe into the run (none under reduced motion or ?fast)
  function dustInto(done) {
    if (FAST || reduceMotion() || !document.documentElement.classList.contains('art') || !window.TITLE_SCENE) { done(); return; }
    dust(true);
    setTimeout(() => { done(); undust(); }, 800);
  }
  // the table's stage is scaled to the page's width: a new width rescales it
  addEventListener('resize', () => { clearTimeout(P.stageT); P.stageT = setTimeout(() => { if (P.L && !$('game').hidden && P.L.h) renderFelt(); }, 120); });
  // any tap or key during the opening skips it
  ['pointerdown', 'keydown'].forEach(e => addEventListener(e, ev => { if (OPEN.done && !(ev.target.closest && ev.target.closest('#skipOpening'))) endOpening(); }, true));
  $('objPick').innerHTML += Object.entries(R.OBJECTIVES).filter(([k, o]) => !o.bank).map(([k, o]) => '<option value="' + k + '">' + esc(o.name) + ': ' + esc(o.text) + '</option>').join('');
  Object.assign(P, { render, step, move, title, newRun, save, loadSaved, takeBack, PACE, showCardInfo });
  if (DEMO) demo(DEMO); else title();
})();
</script>
