  function moveName(L, kind, arg) {
    if (kind === 'bid') return arg ? 'your ' + bidPlain(arg) + ' bid' : 'your pass';
    if (kind === 'discard') return 'putting back the ' + E.label(arg);
    if (kind === 'swing') return L.h.pass === 'grand' ? 'passing the ' + E.label(arg) : arg ? 'swapping the ' + E.label(arg) : 'keeping your hand';
    return 'your ' + E.label(arg);
  }
  function move(kind, arg) {
    const L0 = P.L, undoable = L0.phase === 'hand' && UNDOABLE[kind];
    const snap = undoable ? JSON.stringify(L0) : null, name = undoable ? moveName(L0, kind, arg) : '';
    const res = R.act(P.L, kind, arg);
    if (res && !res.ok) { P.L.note = res.why; if (P.L.phase === 'hand') $('status').textContent = res.why; else render(); return; }
    if (undoable) P.undo.push({ snap, name });
    step();
  }
  function takeBack() {
    const u = P.undo.pop();
    if (!u) return;
    P.L = JSON.parse(u.snap);   // exactly as it was, note line and all
    step();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearTimeout(P.timer); P.timer = null; }
    else if (P.L && $('title').hidden) step();
  });

  /* ---------------- input ---------------- */
  /* Hold a card down (or right-click it) to see what it does. The click that follows a hold is swallowed, so the
     card isn't played as well. */
  const HOLD_MS = 450;
  let holdT = null, holdAt = null;
  const cancelHold = () => { clearTimeout(holdT); holdT = null; };
  document.addEventListener('pointerdown', ev => {
    const card = ev.target.closest && ev.target.closest('.card[data-c]');
    if (!card || card.closest('#sheet')) return;
    holdAt = [ev.clientX, ev.clientY];
    cancelHold();
    holdT = setTimeout(() => { holdT = null; P.held = Date.now(); showCardInfo(card.dataset.c); }, HOLD_MS);
  });
  document.addEventListener('pointerup', cancelHold);
  document.addEventListener('pointercancel', cancelHold);
  document.addEventListener('pointermove', ev => { if (holdT && holdAt && Math.hypot(ev.clientX - holdAt[0], ev.clientY - holdAt[1]) > 10) cancelHold(); });
  document.addEventListener('contextmenu', ev => { const card = ev.target.closest && ev.target.closest('.card[data-c]'); if (card && !card.closest('#sheet')) { ev.preventDefault(); showCardInfo(card.dataset.c); } });
  document.addEventListener('click', ev => {
    if (P.held && Date.now() - P.held < 1500) { P.held = 0; ev.preventDefault(); return; }
    // a card that can't be played or picked (your cards panel, a hand while it isn't your turn): a tap explains it
    const plain = ev.target.closest('.card[data-c]');
    if (plain && !plain.closest('#sheet') && !plain.closest('[data-act],[data-card],[data-bid],[data-take],[data-go],[data-choose],[data-claim],[data-enhance],[data-option],[data-camp],[data-bank],[data-buy],[data-polish],[data-forge],[data-remove],[data-release],[data-cleanse],[data-tip]')) { showCardInfo(plain.dataset.c); return; }
    const t = ev.target.closest('[data-act],[data-card],[data-bid],[data-take],[data-go],[data-choose],[data-claim],[data-enhance],[data-option],[data-camp],[data-bank],[data-buy],[data-polish],[data-forge],[data-remove],[data-release],[data-cleanse],[data-tip]');
    if (!t || t.disabled) return;
    if (t.closest('#sheet') && Date.now() < P.guardUntil) return;
    const L = P.L, d = t.dataset;
    if (d.tip) { move('tip', d.tip); return; }
    if (d.card) { move(L.h.phase === 'kitty' ? 'discard' : L.h.phase === 'swing' ? 'swing' : 'play', d.card); return; }
    if (d.bid) { const m = d.bid.match(/^(\d+)(.+)$/); move('bid', { t: +m[1], s: m[2] }); return; }
    if (d.take) { move('take', d.take); return; }
    if (d.go) { move('go', d.go); return; }
    if (d.choose) { move('choose', d.choose); return; }
    if (d.claim) { move('choose', { claim: d.claim }); return; }
    if (d.enhance) { move('enhance', d.enhance); return; }
    if (d.option) { move('option', +d.option); return; }
    if (d.camp) { move('camp', d.camp); return; }
    if (d.bank) { move('bank', d.bank); return; }
    if (d.buy) { move('buy', d.buy === 'release' ? 'release' : +d.buy); return; }
    if (d.polish) { move('polish', d.polish); return; }
    if (d.forge) { move('forge', d.forge); return; }
    if (d.remove) { move('remove', d.remove); return; }
    if (d.release) { move('release', d.release); return; }
    if (d.cleanse) { move('cleanse', d.cleanse); return; }
    switch (d.act) {
      case 'start': newRun(); break;
      case 'skipopening': endOpening(); break;
      case 'options': { const o = $('titleOptions'); o.hidden = !o.hidden; document.querySelector('.titlemenu .opts').setAttribute('aria-expanded', String(!o.hidden)); break; }
      case 'continue': { const s = loadSaved(); if (s) dustInto(() => { P.L = s; show(); }); break; }
      case 'rules': openSheet('rules'); break;
      case 'menu': openSheet('menu'); break;
      case 'pref': setPref(d.k, d.v); openSheet('menu'); break;
      case 'takeback': takeBack(); break;
      case 'levelinfo': openSheet('info', levelInfoHTML(L)); break;
      case 'closesheet': P.sheet = null; P.shown = null; $('veil').hidden = true; if (P.L && $('title').hidden) step(); break;
      case 'quit': P.sheet = null; clearTimeout(P.timer); $('veil').hidden = true; title(); break;
      case 'pass': move('bid', null); break;
      case 'keephand': move('swing', null); break;
      case 'ackintent': move('ack'); break;
      case 'tapfelt': if (L && L.phase === 'hand' && L.h.phase === 'trick') move('ack'); break;
      case 'next': move('next'); break;
      case 'collect': move('collect'); break;
      case 'skipreward': move('choose', { skip: true }); break;
      case 'reroll': move('reroll'); break;
      case 'leave': move('leave'); break;
      case 'leavebank': move('bank', 'leave'); break;
      case 'newrun': clearSaved(); title(); break;
    }
  });

  function newRun() {
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    const L = R.newRun({ seed, objective: $('objPick').value || undefined, tips: $('tipsPick').checked });
    playOpening(L, () => { P.L = L; show(); });
  }
  function show() { $('title').hidden = true; P.sheet = null; P.shown = null; P.undo = []; P.stuck = null; step(); }
  function title() {
    clearTimeout(P.timer);
    $('game').hidden = true; $('screen').hidden = true; $('title').hidden = false; $('veil').hidden = true;
    buildHero();                                   // the screen may have changed size since the title was last up
    layoutTitle();
    const s = loadSaved();
    $('continueBtn').hidden = !(s && s.phase !== 'runover' && s.phase !== 'victory');
    $('tipsPick').checked = !tipsDone();
  }
  /* The title scene, from art/title/scene.js (never load-bearing: without it, or the art, the hero is a banded sky). */
  function buildHero() {
    const S = window.TITLE_SCENE, hero = $('hero');
    if (!S || !hero) return;
    // three art pixels to a css pixel on a phone held upright, two when the screen is too narrow or too short
    const s = HERO.s = innerWidth >= 360 && innerHeight >= 600 ? (innerWidth >= 1100 && innerHeight >= 900 ? 4 : 3) : 2;
    const u = v => (v * s) + 'px', url = n => 'url(' + artURL('title/' + n + '.webp') + ')';
    hero.style.setProperty('--s', s);
    const lyr = l => '<div class="lyr" style="top:' + u(l.y) + ';height:' + u(l.h) + ';background-image:' + url(l.img) + ';background-size:' + u(l.w) + ' ' + u(l.h) +
      ';--tw:' + u(l.w) + ';--dur:' + (l.w / l.speed).toFixed(2) + 's"></div>';
    const T = S.train, tl = 'calc(50% - ' + u(T.w / 2) + ')';
    const puffs = Array.from({ length: 7 }, (_, i) => { const p = S.puffs[i % S.puffs.length];
      return '<div class="puff" style="left:calc(50% + ' + u(T.stack[0] - T.w / 2 - p.w / 2) + ');top:' + u(T.y + T.stack[1] - p.h / 2) + ';width:' + u(p.w) + ';height:' + u(p.h) +
        ';background:' + url(p.img) + ' 0 0 / 100% 100%;animation-delay:' + (i * 0.4).toFixed(1) + 's"></div>'; }).join('');
    const I = S.intro, below = I ? '<div class="below" style="top:' + u(S.H) + ';height:' + u(BELOW) + '">' +
      '<div class="meadow" style="background:' + url(I.meadow.img) + ' 0 0 / ' + u(I.meadow.w) + ' ' + u(I.meadow.h) + ' repeat;--tw:' + u(I.meadow.w) + ';--dur:' + (I.meadow.w / STAGE_SPEED).toFixed(2) + 's"></div>' +
      lyr({ img: I.trail.img, w: I.trail.w, h: I.trail.h, y: TRAIL_Y, speed: STAGE_SPEED }) +
      '<div class="stagecoach" style="left:calc(50% - ' + u(I.stage.w / 2) + ');top:' + u(TRAIL_Y + 18 - 24) + ';width:' + u(I.stage.w) + ';height:' + u(I.stage.h) +
      ';background-image:' + url(I.stage.img) + ';background-size:' + u(I.stage.w * I.stage.frames) + ' ' + u(I.stage.h) + ';--fw:' + u(I.stage.w) + '"></div>' +
      '<div class="townsign" style="top:' + u(TRAIL_Y + 14) + ';width:' + u(I.sign.w * SIGN_K) + ';height:' + u(I.sign.h * SIGN_K) + ';background:' + url(I.sign.img) + ' 0 0 / 100% 100%">' +
      (I.sign.panel && I.signcover ? signCover(I.sign, url(I.signcover.img)) : '') + '</div></div>' : '';
    HERO.top = innerHeight - S.H * s;                   // the scene's top edge: it sits on the bottom of the screen
    HERO.trainTop = HERO.top + T.y * s;
    hero.innerHTML = '<div class="rig" style="top:' + HERO.top + 'px">' + S.layers.filter(l => !l.front).map(lyr).join('') +
      '<div class="train" style="left:' + tl + ';top:' + u(T.y) + ';width:' + u(T.w) + ';height:' + u(T.h) + ';background-image:' + url(T.img) +
      ';background-size:' + u(T.w * T.frames) + ' ' + u(T.h) + ';--fw:' + u(T.w) + '"></div>' + puffs +
      S.layers.filter(l => l.front).map(lyr).join('') + below + '</div>';
  }
  /* The WELCOME plank over the sign's painted panel, placed in the sign's own pixels; it hangs on the nail two
     pixels in from its top left, so that is where it turns. */
  function signCover(sign, bg) {
    const [x, y, w, h] = sign.panel, pc = (v, of) => (100 * v / of).toFixed(3) + '%';
    return '<div class="signcover" style="left:' + pc(x, sign.w) + ';top:' + pc(y, sign.h) + ';width:' + pc(w, sign.w) + ';height:' + pc(h, sign.h) +
      ';transform-origin:' + pc(2.5, w) + ' ' + pc(2.5, h) + ';background:' + bg + ' 0 0 / 100% 100%"></div>';
  }
  // the stage under the title scene, in art pixels: the trail runs across it TRAIL_Y down; the stage scrolls at
  // STAGE_SPEED art pixels a second (60% of the first cut's 52) and the sign is drawn SIGN_K times its art size
  const BELOW = 560, TRAIL_Y = 280, HERO = { s: 2, top: 0, trainTop: 0 }, STAGE_SPEED = 31, SIGN_K = 1.2;
  /* The title's words: pictures once the art is on, placed in the sky by where the train is: the logo a fifth of
     the way down to it, Start Game about two thirds, Continue under Start, Options on the grass at the bottom. */
  function layoutTitle() {
    const S = window.TITLE_SCENE, art = document.documentElement.classList.contains('art');
    const s = HERO.s, sky = S ? Math.max(120, HERO.trainTop - 12) : innerHeight * 0.6;
    const place = (sel, y) => { const el = document.querySelector(sel); if (el) el.style.top = Math.round(y) + 'px'; };
    place('.titlemenu .logo', sky * 0.22);
    place('.titlemenu .go', sky * 0.6);
    place('#continueBtn', sky * 0.6 + 58);
    place('.titlemenu .opts', innerHeight - 34);
    document.querySelectorAll('.titlemenu .wood').forEach(el => {
      const t = S && S.type && S.type[el.dataset.word];
      if (!t || !art) return;
      const k = el.classList.contains('more') ? Math.max(2, s - 1) : s;
      let img = el.querySelector('img');
      if (!img) { img = document.createElement('img'); img.alt = ''; el.appendChild(img); }
      img.src = artURL('title/' + t.img + '.webp');
      img.width = t.w * k; img.height = t.h * k;
      el.classList.add('drawn');
    });
  }
  buildHero();
  layoutTitle();
  // html.art arrives when the probe picture loads: draw the words then; a new screen size rebuilds the scene
  new MutationObserver(layoutTitle).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  let resizeT = 0;
  addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!$('title').hidden && !OPEN.done) { buildHero(); layoutTitle(); } }, 150); });

  /* The opening: storyboard frames 2-5 (see the CSS above), then `done` deals the act's cards (frame 6). */
  const OPEN = { timers: [], done: null, raf: 0 };
  function reduceMotion() { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }
  function heroAnims(rate) { try { document.getAnimations().forEach(a => { const t = a.effect && a.effect.target; if (t && t.closest && t.closest('#hero')) a.updatePlaybackRate(rate); }); } catch (e) { /* no Web Animations */ } }
  function at(ms, fn) { OPEN.timers.push(setTimeout(fn, ms)); }
  function actCard(L, tips) {
    const card = $('actcard');
    card.style.backgroundImage = 'url(' + artURL('dustwater/plate.webp') + ')';
    card.innerHTML = '<div class="board"><small>ACT I</small><b>DUSTWATER</b><span>A boomtown since the gold strike</span></div>' +
      (tips ? '<div class="nanline"><b>Nan:</b> Here we are, dear. Every chair in this town has a card game, and every one of them wants our money.</div>' : '');
    card.classList.add('on');
  }
  function dust(full) {
    const w = $('dustwipe'), I = window.TITLE_SCENE && window.TITLE_SCENE.intro;
    if (!I) return;
    w.innerHTML = Array.from({ length: 16 }, (_, i) => { const p = I.dust[i % I.dust.length], x = 8 + (i * 37) % 86, y = 18 + (i * 53) % 70;
      return '<div class="dp" style="left:' + x + '%;top:' + y + '%;width:' + p.w * 2 + 'px;height:' + p.h * 2 + 'px;background:url(' + artURL('title/' + p.img + '.webp') + ') 0 0 / 100% 100%;animation-delay:' + (i * 0.04).toFixed(2) + 's"></div>'; }).join('');
    w.classList.add('on');
    if (full) setTimeout(() => w.classList.add('full'), 650);
  }
  function undust() { const w = $('dustwipe'); w.classList.remove('on', 'full'); setTimeout(() => { if (!w.classList.contains('on')) w.innerHTML = ''; }, 500); }
  function endOpening() {
    OPEN.timers.forEach(clearTimeout);
    OPEN.timers = [];
    const done = OPEN.done;
    OPEN.done = null;
    cancelAnimationFrame(OPEN.raf);
    document.body.classList.remove('opening', 'tilt', 'signzoom', 'signdrop');
    const hero = $('hero'), sign = hero.querySelector('.townsign');
    hero.style.height = ''; hero.style.transform = '';
    if (sign) sign.style.left = '';
    const rig = hero.querySelector('.rig');
    if (rig) { rig.style.transition = 'none'; rig.style.transform = ''; void rig.offsetHeight; rig.style.transition = ''; }
    heroAnims(1);
    if (done) done();
    undust();
    setTimeout(() => $('actcard').classList.remove('on'), 60);
  }
  function playOpening(L, done) {
    const art = document.documentElement.classList.contains('art'), S = window.TITLE_SCENE;
    if (FAST || !art || !S || !S.intro) { done(); return; }
    OPEN.done = done;
    try { window.scrollTo(0, 0); } catch (e) { /* no layout */ }
    if (reduceMotion()) { document.body.classList.add('opening'); actCard(L, L.tips); at(1600, endOpening); return; }
    // 2: the whistle (the smoke comes thick and fast), the words drop away, the train picks up speed
    document.body.classList.add('opening');
    heroAnims(2.2);
    // 3: the hero fills the screen and tilts down to the trail; the stagecoach rolls in
    at(1600, () => {
      const hero = $('hero'), rig = hero.querySelector('.rig');
      hero.style.height = innerHeight + 'px';
      document.body.classList.add('tilt');
      heroAnims(1);
      const trail = HERO.top + (S.H + TRAIL_Y + 18) * HERO.s;
      void rig.offsetHeight;                    // let the full-screen height land before the tilt starts
      rig.style.transform = 'translateY(' + Math.round(innerHeight * 0.58 - trail) + 'px)';
    });
    // 4: the town sign comes along the trail and the coach pulls up at it; the camera closes in, the WELCOME
    // plank falls away (DANGER! DO NOT ENTER), and the coach's dust wipes the screen
    at(1600, () => signRun(performance.now() + 5000));
    at(6800, signZoom);
    at(7900, () => document.body.classList.add('signdrop'));
    at(10300, () => dust(true));
    // 5: the act card comes up under the dust, and the dust clears off it
    at(11200, () => { actCard(L, L.tips); undust(); });
    at(11200 + (L.tips ? 2600 : 1400), endOpening);
  }
  /* The sign is planted by the trail, so it moves at the stage's speed; the coach brakes to a stop over the last
     BRAKE ms with the sign beside it, and the ground, the wheels and the trot slow with it. `stopAt` is when it
     stands still; until it is due the sign waits off the right edge. */
  const BRAKE = 1200;
  function signRun(stopAt) {
    const sign = $('hero').querySelector('.townsign');
    if (!sign) return;
    const v = STAGE_SPEED * HERO.s / 1000, W = innerWidth, sw = sign.offsetWidth || 0;
    const stopLeft = OPEN.signStop = Math.round(W * 0.62 - sw / 2);
    let rate = 1;
    const tick = () => {
      const tau = stopAt - performance.now();
      // distance still to go: half a braking distance while braking (it falls with the square of the time left)
      const left = tau <= 0 ? 0 : tau < BRAKE ? v * tau * tau / (2 * BRAKE) : v * BRAKE / 2 + v * (tau - BRAKE);
      sign.style.left = Math.min(W + 10, stopLeft + left) + 'px';
      const r = tau <= 0 ? 0 : Math.min(1, tau / BRAKE);
      if (r !== rate) heroAnims(rate = r);
      if (tau > 0) OPEN.raf = requestAnimationFrame(tick);
    };
    OPEN.raf = requestAnimationFrame(tick);
  }
  /* Close in on the sign: scale the whole full-screen hero about its top left so the sign sits in the middle,
     as big as the screen allows (never more than 3 times). */
  function signZoom() {
    const hero = $('hero'), sign = hero.querySelector('.townsign');
    if (!sign) return;
    // the coach has stopped by now; make sure of it even where animation frames were held back
    cancelAnimationFrame(OPEN.raf);
    if (OPEN.signStop != null) sign.style.left = OPEN.signStop + 'px';
    heroAnims(0);
    const r = sign.getBoundingClientRect();
    if (!r.width) return;
    const k = Math.min(3, innerWidth * 0.9 / r.width, innerHeight * 0.55 / r.height);
    const tx = innerWidth / 2 - k * (r.left + r.width / 2), ty = innerHeight * 0.45 - k * (r.top + r.height / 2);
    document.body.classList.add('signzoom');
    hero.style.transform = 'translate(' + Math.round(tx) + 'px,' + Math.round(ty) + 'px) scale(' + k.toFixed(3) + ')';
  }
  // Continue: a short dust wipe into the run (none under reduced motion or ?fast)
  function dustInto(done) {
    if (FAST || reduceMotion() || !document.documentElement.classList.contains('art') || !window.TITLE_SCENE) { done(); return; }
    dust(true);
    setTimeout(() => { done(); undust(); }, 800);
  }
  // the table's stage is scaled to the page's width: a new width rescales it
  addEventListener('resize', () => { clearTimeout(P.stageT); P.stageT = setTimeout(() => { if (P.L && !$('game').hidden && P.L.h) renderFelt(); }, 120); });
  // any tap or key during the opening skips it
  ['pointerdown', 'keydown'].forEach(e => addEventListener(e, ev => { if (OPEN.done && !(ev.target.closest && ev.target.closest('#skipOpening'))) endOpening(); }, true));
  $('objPick').innerHTML += Object.entries(R.OBJECTIVES).filter(([k, o]) => !o.bank).map(([k, o]) => '<option value="' + k + '">' + esc(o.name) + ': ' + esc(o.text) + '</option>').join('');
  Object.assign(P, { render, step, move, title, newRun, save, loadSaved, takeBack, PACE, showCardInfo });
  title();
})();
</script>
</body>
</html>
