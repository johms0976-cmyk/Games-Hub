<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gwent — The Path</title>
<style>
:root{
  --bg:#120c07; --panel:#241a10; --panel2:#1a130b; --line:#4a3820; --ink:#f4ecd8; --dim:#bfae8c;
  --gold:#e0b456; --good:#6fcf7f; --bad:#ff6a6a; --foe:#c8343a;
  --th:clamp(38px,5.5vh,96px);           /* a unit on a row: height */
  --hw:clamp(54px,9.6vw,112px);          /* a card in hand: width */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden],.hide{display:none !important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#2a1d10 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);
  font:16px/1.4 Georgia,"Times New Roman",serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;font-weight:800}
.wrap{max-width:1040px;margin:0 auto;padding:12px 16px 120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);border:0;color:#1b140c;font-weight:800;font-size:17px;border-radius:14px;padding:13px 20px;min-height:48px}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:15px}
.btn.warn{background:#6a2a14;color:#ffd9b0}
.btn.wide{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.dim{color:var(--dim)}
.gold{color:var(--gold)}
.why{color:#ffab9a;font-size:13px}
.delta{font-family:system-ui,sans-serif;font-size:13px;font-weight:800;white-space:nowrap}
.delta .me{color:var(--good)} .delta .them{color:#ff9a8a} .delta .zero{color:var(--dim)}
.rar{display:inline-block;font:700 10px/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:5px;border:1px solid}
.rar.common{color:#cfc2a4;border-color:#6a5a40}
.rar.uncommon{color:#8fd0ff;border-color:#3a6a90}
.rar.rare{color:#f1c75b;border-color:#a07a2a}
.rar.legendary{color:#ff9a5a;border-color:#b0502a;background:rgba(176,80,42,.15)}
.rar.cursed{color:#d9a0ff;border-color:#7a3aa0;background:rgba(122,58,160,.18)}
.up-tag.down{background:#7a1a22;color:#ffd0d4;border-color:#ff6a7a}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--ink);min-height:48px}
.chk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font:900 14px/1 system-ui,sans-serif;color:#1b140c;margin-top:1px}
.chk.on{border-color:#c06060;background:rgba(192,96,96,.12)}
.chk.on .box{background:#e07a6a;border-color:#e07a6a}
.chk b{display:block}
.chk small{color:var(--dim);font-size:13px}
.chk .w{margin-left:auto;font:800 13px/1 system-ui,sans-serif;color:#ffb0a8;white-space:nowrap}
.phase{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid #7a3aa0;background:rgba(122,58,160,.14);font-size:14px}
.phase b{color:#d9a0ff}
.pl .phasechip{border-color:#7a3aa0;color:#d9a0ff}
.pl .phasechip.live{background:rgba(122,58,160,.3);color:#f0d8ff}
.hunt{color:#9fd4ff}
/* The Long Road: the potion belt, the prep before a battle, a merchant's sale */
#top .belt{display:flex;gap:3px}
#top .belt button{width:30px;height:30px;border-radius:9px;background:#1e2a22;border:1px solid #3a6a50;padding:3px;display:flex}
#top .belt button.empty{background:transparent;border-style:dashed;border-color:#3a4a40;cursor:default}
#top .belt svg{width:100%;height:100%}
#top .beltn{display:none}
#top .beltn svg{width:18px;height:18px}
@media (max-width:640px){ #top .belt{display:none} #top .beltn{display:flex} }
.chk .pot{width:34px;height:34px;flex:none}
.chk.drink small{display:block;margin-top:2px}
.chk.drink.on{border-color:#4aa070;background:rgba(74,160,112,.14)}
.chk.drink.on .box{background:#6fcf9f;border-color:#6fcf9f}
.offer .it.pot .ic{width:64px;height:64px;border-radius:18px;background:#1e2a22;border:2px solid #3a6a50;padding:10px}
.offer .it .sale{font:800 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#1b140c;background:#6fcf7f;border-radius:6px;padding:3px 6px}
.mapsvg.long{max-height:none}
.floorline{text-align:center;font:13px system-ui,sans-serif;color:var(--dim);margin:-4px 0 6px}
.len{border-left:6px solid #6a5030}
.len.on{border-left-color:var(--gold)}
.up-tag{position:absolute;right:4%;top:3%;z-index:4;background:#1d6a2c;color:#d8ffe0;font:800 11px/1 system-ui,sans-serif;padding:3px 5px;border-radius:6px;border:1px solid #6fdc84}
.slot{position:relative;display:inline-block}
/* Where a face is sized by its container, the wrapper must take the width. */
.offer .it .slot,.deckgrid .dc .slot{display:block;width:100%}
.offer .it .slot{max-width:170px}
.opt .wnd{width:58px;flex:none}
.opt .wnd .slot{display:block;width:100%}
.opt .wnd .gc{width:100%;font-size:9px}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#120c07 70%,rgba(18,12,7,0));padding:8px 16px 10px}
#top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#top .crest{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid #000;box-shadow:0 0 0 1px var(--gold) inset}
#top .who{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .who small{display:block;font-weight:400;color:var(--dim);font-size:12px}
#top .stat{display:flex;align-items:center;gap:5px;font:800 15px/1 system-ui,sans-serif}
#top .stat svg{width:20px;height:20px}
#top .lives{display:flex;gap:2px}
#top .lives svg{width:19px;height:19px}
#top .grow{flex:1}
#top .tb{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:700 13px/1.1 system-ui,sans-serif;display:flex;align-items:center;gap:6px;min-height:36px}
#top .trk{display:flex;gap:4px;flex-wrap:wrap}
#top .trk button{width:30px;height:30px;border-radius:50%;background:#2a1f12;border:1px solid #7a5a2a;padding:4px;display:flex}
#top .trk svg{width:100%;height:100%}
#top .trkn{display:none}
/* A crowded bar (Act III, four lives, a challenge, the potion belt) wraps rather than pushing Menu off a phone. */
@media (max-width:640px){ #top{padding:6px 10px 8px} #top .in{flex-wrap:wrap;gap:6px 8px} #top .who,#top .where{display:none} #top .trk{display:none} #top .trkn{display:flex} #top .tb{padding:5px 8px} #top .lives svg{width:17px;height:17px} }

/* ---------- title and choosing ---------- */
.title-hero{text-align:center;padding:6vh 0 3vh}
.title-hero h1{font-size:clamp(40px,8vw,76px);letter-spacing:.04em;color:var(--gold);text-shadow:0 4px 24px rgba(224,180,86,.25)}
.title-hero h1 small{display:block;font-size:.38em;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}
.title-hero p{max-width:560px;margin:14px auto 0;color:var(--dim)}
.menu{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:48px}
.choice b{font-size:17px}
.choice small{color:var(--dim);font-size:13px}
.choice.on{border-color:var(--gold);background:rgba(224,180,86,.12)}
.choice.fac{border-left:6px solid var(--fc)}
.ldrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.ldr{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;color:var(--ink)}
.ldr .gc{width:58px;font-size:8.5px;flex:none}
.ldr b{display:block}
.ldr small{color:var(--dim);font-size:12.5px}
.ldr.on{border-color:var(--gold);background:rgba(224,180,86,.12)}
.sect{margin:22px 0 6px;font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
input.nm{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;width:100%;max-width:360px}
.best{max-width:520px;margin:26px auto 0;font-size:14px}
.best li{color:var(--dim);margin:3px 0}
.best b{color:var(--ink)}

/* ---------- the map ---------- */
.mapwrap{position:relative;max-width:520px;margin:0 auto}
.mapsvg{width:100%;height:auto;display:block;max-height:max(440px,calc(100vh - 150px))}
.mapsvg .edge{stroke:#5a4630;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.mapsvg .edge.walked{stroke:var(--gold);stroke-dasharray:none;stroke-width:3.5}
.mapsvg .nd circle.bgc{fill:#2a1f12;stroke:#6a5030;stroke-width:2}
.mapsvg .nd.done circle.bgc{fill:#3a2c18;stroke:var(--gold)}
.mapsvg .nd.can{cursor:pointer}
.mapsvg .nd.can circle.bgc{stroke:var(--gold);stroke-width:3;fill:#3a2a12}
.mapsvg .nd.can .ring{fill:none;stroke:var(--gold);stroke-width:2;animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.mapsvg .nd.dead{opacity:.45}
.mapsvg .nd.here circle.bgc{fill:var(--gold)}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font:13px system-ui,sans-serif;color:var(--dim);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:18px;height:18px}
.bossline{text-align:center;margin:4px 0 8px;font-size:14px;color:var(--dim)}
.bossline b{color:var(--ink)}

/* ---------- screens between battles ---------- */
.scr{max-width:820px;margin:0 auto}
.scr h2{font-size:clamp(24px,4.4vw,34px);color:var(--gold)}
.scr .lede{color:var(--dim);margin:6px 0 12px}
.offer{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,40vw),1fr));gap:14px;margin:12px 0}
.offer .it{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);text-align:center}
.offer .it.on{border-color:var(--gold);background:rgba(224,180,86,.14)}
.offer .it .gc{width:100%;max-width:170px;font-size:clamp(12px,2.4vw,19px)}
.offer .it .tx{font-size:12.5px;color:var(--dim);line-height:1.3}
.offer .it.sold{opacity:.35}
.offer .price{font:800 15px/1 system-ui,sans-serif;color:var(--gold);display:flex;align-items:center;gap:4px}
.offer .price svg{width:16px;height:16px}
.offer .it.trk .ic{width:64px;height:64px;border-radius:50%;background:#2a1f12;border:2px solid #a07a2a;padding:10px}
.result{margin:12px 0;padding:12px 14px;border-radius:12px;background:rgba(224,180,86,.1);border:1px solid rgba(224,180,86,.5)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;min-height:52px}
.opt:disabled{opacity:.45}
.opt .lab{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .lab small{color:var(--dim);font-size:13px;line-height:1.3}
.opt .val{flex:none}
.opt .ic{width:34px;height:34px;flex:none}
.foebox{display:flex;gap:14px;align-items:center;margin:10px 0}
.foebox .gc{width:96px;font-size:13px;flex:none}
.foebox .tx{flex:1;min-width:0}
.foebox .tx b{font-size:20px}
.foebox .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:700 12px/1 system-ui,sans-serif;padding:5px 8px;border-radius:999px;background:#2e2316;border:1px solid #5a4630;color:var(--ink)}
.chip.red{border-color:#8a3030;color:#ffb0a8}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,12,7,0),var(--bg) 30%)}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn{flex:1}

/* ---------- the deck and card lists ---------- */
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;margin-top:10px}
.deckgrid .dc{position:relative;background:none;border:0;padding:0;color:inherit;text-align:center}
.deckgrid .dc .gc{width:100%;font-size:12px}
.deckgrid .dc small{display:block;font-size:11px;color:var(--dim);margin-top:3px;font-family:system-ui,sans-serif}
.deckgrid .dc:disabled{opacity:.3}
.deckgrid .dc.on .gc{outline:3px solid var(--gold);outline-offset:2px}
.dstats{display:flex;flex-wrap:wrap;gap:6px 16px;font:13px system-ui,sans-serif;color:var(--dim)}
.dstats b{color:var(--ink)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(8,5,2,.88);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,4vh) 16px;overflow-y:auto}
#modal .box{width:100%;max-width:720px;background:var(--panel);border:1px solid var(--gold);border-radius:18px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#modal .box h3{font-size:22px;color:var(--gold)}
#modal .foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
#modal .foot .btn{flex:1}
.rc-h{font-weight:900;font-size:26px;color:var(--gold);line-height:1.15}
.rc-sub{font-size:15px;margin-top:3px}
.rc-sc{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.rc-p{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:14px;flex-wrap:wrap}
.rc-p.won{border-color:var(--gold)}
.rc-p i{width:11px;height:11px;border-radius:50%;flex:none}
.rc-role{font-size:10px;color:var(--dim);text-transform:uppercase}
.rc-t{flex-basis:100%;color:var(--dim);font-size:12.5px}
.rc-d{font-size:12px;color:var(--gold);font-weight:800;margin-left:auto}
.rc-d.big{font-size:24px}
.rc-sec{margin-top:10px}
.rc-sec h4{margin:0 0 3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rc-sec ul{margin:0;padding-left:1.1em;font-size:14px}
#zoom{position:fixed;inset:0;z-index:70;background:rgba(8,5,2,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
#zoom .gc{width:min(64vw,300px);font-size:22px}
#zoom .ztx{max-width:440px;font-size:15px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;background:#2a1610;border:1px solid var(--bad);color:#ffd9de;border-radius:12px;padding:10px 14px;font-size:14px;max-width:min(92vw,520px)}

/* ---------- the battle ---------- */
#bt{display:grid;gap:6px;max-width:1400px;margin:0 auto;padding:6px 10px calc(10px + env(safe-area-inset-bottom));
  grid-template-columns:minmax(0,1fr);grid-template-areas:"foe" "frows" "mid" "yrows" "you" "hand" "acts"}
#bt .foe{grid-area:foe} #bt .frows{grid-area:frows} #bt .mid{grid-area:mid} #bt .yrows{grid-area:yrows}
#bt .you{grid-area:you} #bt .hnd{grid-area:hand} #bt .acts{grid-area:acts} #bt .logp{display:none;grid-area:logp}
@media (min-width:1000px){
  #bt{grid-template-columns:230px minmax(0,1fr) 250px;grid-template-areas:"foe frows logp" "mid mid logp" "you yrows logp" "hand hand acts";align-items:stretch;padding:6px 16px 10px;gap:6px 8px}
  #bt .logp{display:flex}
  #bt .mid{grid-template-columns:auto 1fr auto}
  #bt .you,#bt .foe{flex-direction:column;align-items:stretch}
  :root{--th:clamp(52px,8.2vh,104px);--hw:clamp(70px,6.4vw,118px)}
}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nmr ldb" "facts ldb";align-items:center;gap:3px 8px;background:rgba(26,19,11,.86);border:1px solid var(--line);border-radius:12px;padding:5px 8px;font-family:system-ui,sans-serif;min-width:0}
.pl .nmr{grid-area:nmr} .pl .facts{grid-area:facts} .pl .ldb{grid-area:ldb}
.pl.act{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pl .nmr{display:flex;align-items:center;gap:8px;min-width:0}
.pl .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Georgia,serif}
.pl .nm small{display:block;font-weight:400;color:var(--dim);font-size:11.5px;font-family:system-ui,sans-serif}
.pl .facts{display:flex;align-items:center;gap:4px 9px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.pl .facts b{color:var(--ink)}
.pl .tot{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:900 20px/1 system-ui,sans-serif;background:radial-gradient(circle at 40% 35%,#fffaf0,#d6c8a8);color:#1b140c;border:3px solid #b98b3a}
.pl .tot.lead{border-color:var(--good);box-shadow:0 0 12px rgba(111,207,127,.5)}
.pl .passed{font:800 11px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#1b140c;background:var(--dim);padding:4px 6px;border-radius:5px}
.pl .think{font-size:12px;color:var(--gold);font-style:italic}
.pl .ldb{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px 8px 3px 3px;font-size:12px;color:var(--ink);text-align:left;min-height:44px;max-width:150px;line-height:1.15}
.pl .ldb .gc{width:26px;font-size:4px}
.pl .ldb.ok{border-color:var(--gold)}
.pl .ldb.used{opacity:.5}
.pl .pile{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:12px;color:var(--dim);min-height:30px}
@media (min-width:1000px){ .pl{display:flex;flex-direction:column;align-items:stretch;padding:8px 10px;gap:6px} .pl .facts{gap:6px 10px} .pl .tot{width:50px;height:50px;font-size:22px} .pl .ldb{max-width:none} }
.rows{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{position:relative;display:grid;grid-template-columns:44px calc(var(--th)*.66) minmax(0,1fr);gap:6px;align-items:center;background:rgba(36,26,14,.74);border:1px solid var(--line);border-radius:10px;padding:3px 6px;min-height:calc(var(--th) + 8px)}
.row .rt{display:flex;flex-direction:column;align-items:center;gap:1px}
.row .rt b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#d6c8a8);color:#1b140c;font:900 15px/1 system-ui,sans-serif;border:2px solid #b98b3a}
.row .rt .gi{width:16px;height:16px;opacity:.75}
@media (max-width:999px){ .row{grid-template-columns:30px calc(var(--th)*.62) minmax(0,1fr);gap:5px;padding:2px 5px;min-height:calc(var(--th) + 4px)} .row .rt b{width:28px;height:28px;font-size:13px} .row .rt .gi{width:11px;height:11px} #bt{gap:5px} }
.row .hs{height:calc(var(--th)*.86);aspect-ratio:674/1048;border:1px dashed rgba(224,180,86,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 9px/1.1 system-ui,sans-serif;color:var(--gold);text-align:center;overflow:hidden}
.row .hs .gc{width:100%;font-size:7px}
.row .cards{display:flex;align-items:center;min-width:0;height:100%;overflow:hidden}
.row .cards .u{flex:none;background:none;border:0;padding:0;position:relative;transition:transform .15s}
.row .cards .u .gc{height:var(--th);width:calc(var(--th)*674/1048);font-size:calc(var(--th)*.17)}
.row .cards .u.fresh{animation:land .55s ease-out}
.row .cards .u.burning .gc{animation:burn .5s ease-in-out infinite alternate;outline:3px solid #ff7a2a}
.row .cards .u.tgt .gc{outline:3px solid var(--gold);outline-offset:1px;cursor:pointer}
.row.wx0{background:linear-gradient(90deg,rgba(120,170,220,.36),rgba(36,26,14,.74) 70%)}
.row.wx1{background:linear-gradient(90deg,rgba(170,170,170,.4),rgba(36,26,14,.74) 70%)}
.row.wx2{background:linear-gradient(90deg,rgba(60,90,160,.45),rgba(36,26,14,.74) 70%)}
.row.can{border-color:var(--gold);box-shadow:0 0 0 2px rgba(224,180,86,.6) inset,0 0 14px rgba(224,180,86,.35);cursor:pointer}
.row .empty{color:#6d5c40;font-size:12px;font-style:italic;font-family:system-ui,sans-serif}
.row .wxtag.minus{color:#ffc0b8}
.row .wxtag.plus{color:#c8f0a8}
.row .wxtag{position:absolute;right:6px;bottom:3px;pointer-events:none;font:11px system-ui,sans-serif;color:#dfeaff;display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:5px}
.row .rdelta{position:absolute;right:6px;top:3px;pointer-events:none;background:rgba(10,7,4,.85);border-radius:6px;padding:2px 6px}
@keyframes land{from{transform:translateY(-16px) scale(1.15);opacity:.2}to{transform:none;opacity:1}}
@keyframes burn{from{filter:brightness(1)}to{filter:brightness(1.7) saturate(1.6) hue-rotate(-12deg)}}
.mid{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-family:system-ui,sans-serif;min-width:0}
.mid .wx{display:flex;align-items:center;gap:4px;min-height:40px;background:rgba(20,14,8,.8);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12px;color:var(--dim)}
.mid .wx .gc{width:26px;font-size:4px}
.mid .now{font-size:13px;color:var(--ink);background:rgba(20,14,8,.8);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0;overflow:hidden;line-height:1.3}
.mid .now .ln{display:block}
@media (max-width:999px){ .mid .now .ln:not(:last-child){display:none} .mid .now{padding:4px 9px;font-size:12.5px} .mid .wx{min-height:34px} }
.mid .now small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}
.mid .rnd{font:800 12px/1.1 system-ui,sans-serif;color:var(--dim);text-align:center;letter-spacing:.08em;text-transform:uppercase}
.hnd{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:10px 2px 4px;scrollbar-width:thin;min-width:0}
.hnd .hc{flex:none;background:none;border:0;padding:0;position:relative;transition:transform .15s}
.hnd .hc .gc{width:var(--hw);font-size:calc(var(--hw)*.15)}
.hnd .hc.sel{transform:translateY(-8px)}
.hnd .hc.sel .gc{outline:3px solid var(--gold);outline-offset:2px}
.hnd .hc.no .gc{opacity:.45}
.hnd .hc.hold .gc{opacity:.85}
.hnd .empty{color:var(--dim);font-size:14px;align-self:center;padding:0 10px}
.acts{display:flex;gap:8px;align-items:stretch}
.acts .btn{flex:1;min-height:50px;padding:10px 12px;font-size:16px}
@media (min-width:1000px){ .acts{flex-direction:column;justify-content:center} .acts .btn{flex:none} }
.logp{contain:size;flex-direction:column;background:rgba(20,14,8,.8);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;min-height:0;overflow:hidden}
.logp h4{margin:0 0 4px;font:800 11px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.logp .ll{overflow-y:auto;display:flex;flex-direction:column;gap:4px;color:var(--dim);flex:1;min-height:0;max-height:70vh}
.logp .ll div.new{color:var(--ink)}
/* the selected card */
/* Never over the hand: a control must not appear where the finger just was (touch ghost clicks). */
#sheet{position:fixed;left:0;right:0;top:58px;z-index:40;padding:0 10px;pointer-events:none}
#sheet .in{pointer-events:auto;box-shadow:0 14px 40px rgba(0,0,0,.75)}
@media (min-width:1000px){ #sheet{left:auto;right:16px;width:270px;top:66px;padding:0} #sheet .in{flex-direction:column;align-items:stretch} #sheet .in > .slot{align-self:center} #sheet .in > .slot .gc,#sheet .in > .gc{width:150px} }
#sheet .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:12px;
  max-height:calc(100dvh - 76px);overflow-y:auto;overscroll-behavior:contain}  /* a Decoy on a crowded board lists every unit: scroll (fitSheet keeps it above the hand) */
#sheet .in > .gc,#sheet .in > .slot .gc{width:min(26vw,140px);font-size:clamp(11px,2.2vw,19px);flex:none}
#sheet .st{flex:1;min-width:0}
#sheet .st b{display:block;font-size:17px;color:var(--gold)}
#sheet .st .tx{font-size:13.5px;color:var(--dim);margin:3px 0 6px}
#sheet .plays{display:flex;flex-direction:column;gap:6px}
#sheet .plays .opt{padding:9px 12px;min-height:46px}
#spot{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:35;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;animation:spIn .35s ease-out}
#spot .gc{width:min(34vw,190px);font-size:clamp(14px,3vw,26px);box-shadow:0 18px 50px rgba(0,0,0,.85)}
#spot .sw{background:rgba(10,7,4,.92);border:1px solid var(--gold);border-radius:10px;padding:5px 12px;font-size:15px;text-align:center;max-width:80vw}
@keyframes spIn{from{opacity:0;transform:translate(-50%,10px) scale(.92)}to{opacity:1;transform:translateX(-50%)}}
.picklist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.picklist .hc{background:none;border:0;padding:0;position:relative;text-align:center}
.picklist .hc .gc{width:clamp(70px,16vw,120px);font-size:clamp(10px,2.3vw,17px)}
.picklist .hc small{display:block;font:11px system-ui,sans-serif;color:var(--dim);max-width:clamp(70px,16vw,120px);margin-top:3px}
.picklist .hc.on .gc{outline:3px solid var(--gold);outline-offset:2px}
.picklist .hc:disabled{opacity:.35}
.ends{text-align:center;padding:4vh 0 2vh}
.ends h1{font-size:clamp(36px,7vw,64px);color:var(--gold)}
.ends.lost h1{color:#ff8a7a}
.how{max-width:720px;margin:0 auto}
.how h3{color:var(--gold);margin-top:16px}
.how p,.how li{color:var(--ink);font-size:15px}
.how li{margin:4px 0}
</style>
</head>

/* A potion: the flask in its own colour; the two bombs are round. */

function potIcon(id) {

function deltaHtml(d) {
  if (!d) return '';

  const a = f(d.me, d.me >= 0 ? 'me' : 'them', 'you'), b = f(d.them, d.them <= 0 ? 'me' : 'them', 'them');

}
/* A card face with its honing shown. */

}

const poss = n => n + (/s$/i.test(n) ? '’' : '’s');
/* What a card does; a plain unit gets its strength and row. */
function cardText(id) {

/* ================================================================

   ================================================================ */
function paint() {
  const app = $('app');

  if (S.view === 'title') app.innerHTML = titleHtml();
  else if (S.view === 'how') app.innerHTML = howHtml();
  else if (S.view === 'new') app.innerHTML = newHtml();
  else {
    const s = S.run.screen;
    const fn = { act: actHtml, map: mapHtml, battle: battleHtml, reward: rewardHtml, lost: lostHtml, shop: shopHtml, camp: campHtml, event: eventHtml, treasure: treasureHtml, over: overHtml }[s.k];
    app.innerHTML = fn ? fn() : '<div class="wrap">?</div>';

      setTimeout(() => { const here = document.querySelector('.nd.can'); if (!here) return; const r = here.getBoundingClientRect(); if (r.bottom > innerHeight - 20 || r.top < 60) window.scrollTo(0, Math.max(0, r.top + scrollY - innerHeight * 0.55)); }, 0);

}

/* ---------------- the map ---------------- */
function mapHtml() {
  const run = S.run;
  const can = R.reachable(run);
  const SH = R.shapeOf(run), FL = SH.floors, gapX = run.long ? 58 : 65, W = 80 + (SH.cols - 1) * gapX, step = 80, H = 90 + FL * step + 40;
  const jit = (id, k) => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return ((h >> k) % 13) - 6; };
  const xy = n => n.id === 'boss' ? [W / 2, 46] : [40 + n.c * gapX + jit(n.id, 2), H - 50 - n.f * step + jit(n.id, 5)];
  const walked = new Set();
  for (let i = 1; i < run.path.length; i++) walked.add(run.path[i - 1] + '>' + run.path[i]);
  let edges = '', nodes = '';
  const all = [];
  run.map.floors.forEach(row => row.forEach(n => all.push(n)));
  for (const n of all) for (const id of n.next) {
    const m = R.node(run, id);
    const [x1, y1] = xy(n), [x2, y2] = xy(m);
    edges += '<path class="edge' + (walked.has(n.id + '>' + id) ? ' walked' : '') + '" d="M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + '"/>';
  }
  const here = run.pos;
  const floorNow = here ? (here === 'boss' ? FL : R.node(run, here).f) : -1;
  for (const n of all.concat([{ id: 'boss', kind: 'boss', f: FL }])) {
    const [x, y] = xy(n);
    const isCan = can.indexOf(n.id) >= 0;
    const done = run.path.indexOf(n.id) >= 0;
    const dead = !isCan && !done && n.f <= floorNow;
    const r = n.id === 'boss' ? 30 : 19;
    const s = n.id === 'boss' ? 36 : 24;
    nodes += '<g class="nd' + (isCan ? ' can' : '') + (done ? ' done' : '') + (dead ? ' dead' : '') + (n.id === here ? ' here' : '') + '"' + (isCan ? ' data-act="go" data-id="' + n.id + '" role="button" tabindex="0" aria-label="' + esc(KIND[n.kind]) + '"' : '') + '>' +
      (isCan ? '<circle class="ring" cx="' + x + '" cy="' + y + '" r="' + (r + 6) + '"/>' : '') +
      '<circle class="bgc" cx="' + x + '" cy="' + y + '" r="' + r + '"/>' +
      '<svg x="' + (x - s / 2) + '" y="' + (y - s / 2) + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24">' + IC[n.kind] + '</svg></g>';
  }
  const boss = R.enemyOf(run, run.map.boss);
  return '<div class="wrap"><div class="bossline">Act ' + ROMAN[run.act] + ' — ' + esc(R.ACTS[run.act - 1].name) + ' · the boss: <b>' + esc(boss.name) + '</b></div>' +
    '<div class="legend">' + ['battle', 'elite', 'event', 'shop', 'camp', 'treasure'].map(k => '<span>' + svg(k) + esc(KIND[k]) + '</span>').join('') + '</div>' +
    (run.long ? '<div class="floorline">Floor ' + (floorNow + 2 > FL + 1 ? FL + 1 : Math.max(1, floorNow + 2)) + ' of ' + (FL + 1) + ' next</div>' : '') +
    '<div class="mapwrap"><svg class="mapsvg' + (run.long ? ' long' : '') + '" viewBox="0 0 ' + W + ' ' + H + '">' + edges + nodes + '</svg></div>' +
    (run.act === 3 ? '<p class="hunt sans" style="text-align:center;font-size:14px">The Wild Hunt: ' + (run.hunt || 0) + ' of ' + R.huntOf(run) + '. Each floor +1; a stop (merchant, campfire, encounter, treasure) +1 more.</p>' : '') +
    '<p class="dim" style="text-align:center;font-size:14px">' + (can.length ? 'Choose where to go next — a glowing circle.' : '') + '</p></div>';
}
const KIND = { battle: 'Battle', elite: 'Contract', event: 'Encounter', shop: 'Merchant', camp: 'Campfire', treasure: 'Treasure', boss: 'Boss' };

/* ---------------- after a battle ---------------- */
function foeBox(e, extra, mods) {
  const chips = [];
  const m = mods || e.mods || {};
  if (m.hand) chips.push('+' + m.hand + ' card' + (m.hand > 1 ? 's' : ''));
  if (m.keep) chips.push('keeps a unit');
  if (m.redraws) chips.push('+1 redraw');
  if (m.spyDraw) chips.push('spies draw 3');
  if (m.roundDraw) chips.push('draws each round');
  const F = D.faction(e.fac);
  return '<div class="foebox">' + A.card(e.leader, 'tile') + '<div class="tx"><b>' + esc(e.name) + '</b><div class="dim" style="font-size:14px">' + esc(e.text) + '</div>' +
    '<div class="chips"><span class="chip">' + esc(F.name) + '</span><span class="chip">' + esc(D.nameOf(e.leader)) + '</span>' + chips.map(c => '<span class="chip red">' + esc(c) + '</span>').join('') + (extra || '') + '</div></div></div>' + phaseLine(e);
}

  return out;
}

/* ---------------- the deck, and picking from it ---------------- */
function sortDeck(list) {
  return list.slice().sort((a, b) => {
    const ca = D.card(a.id), cb = D.card(b.id);
    if (ca.kind !== cb.kind) return ca.kind === 'unit' ? -1 : 1;
    return (cb.str + (b.up || 0)) - (ca.str + (a.up || 0)) || ca.name.localeCompare(cb.name);
  });
}
function deckGrid(list, act, can, on) {
  return '<div class="deckgrid">' + sortDeck(list).map(c => {
    const ok = !can || can(c);
    return '<button class="dc' + (on === c.rid ? ' on' : '') + '" data-act="' + (act || 'zoomu') + '" data-id="' + (act ? c.rid : c.id) + '"' + (act ? '' : ' data-up="' + (c.up || 0) + '"') + (ok ? '' : ' disabled') + '>' + face(c, 'tile') + '<small>' + esc(D.card(c.id).name) + '</small></button>';
  }).join('') + '</div>';
}
function deckStats(list) {
  const st = D.deckStats(list.map(c => c.id));
  const up = list.reduce((t, c) => t + (c.up || 0), 0);
  return '<div class="dstats"><span>Cards <b>' + list.length + '</b></span><span>Units <b>' + st.units + '</b></span><span>Specials <b>' + st.specials + '</b></span><span>Heroes <b>' + st.heroes + '</b></span><span>Unit strength <b>' + (st.str + up) + '</b></span></div>';
}

/* ================================================================
   The battle
   ================================================================ */
const YOU = 'you', FOE = 'foe';
function startBattle() {
  const st = R.battleSetup(S.run);
  S.setup = st;
  S.g = E.create({ players: st.players, seed: st.seed, show: true });
  S.marks = [];
  const moves = S.run.screen.moves || [];
  for (let i = 0; i < moves.length; i++) applyMove(moves[i], i);
  S.seenLog = S.g.log.length;
  S.uids = new Set(allUids());
  S.fresh = new Set();
  S.sel = null; S.multi = []; S.ended = false; S.passArm = false;
}
function allUids() { const out = []; S.g.board.sides.forEach(sd => sd.rows.forEach(r => r.units.forEach(u => out.push(u.uid)))); return out; }
/* Apply one recorded answer. Before each of your own turns, note what an
   undo would have to put back. */
function applyMove(m, idx) {
  const g = S.g;
  if (m.rel) return { ok: g.release() };
  let mark = null;
  if (m.s === YOU) {
    const pr = g.prompts.find(p => p.seat === YOU && p.n === m.a.n);
    if (pr && pr.t === 'turn') mark = { at: idx, round: g.round, drawN: g.drawN, rngN: g.rngN };
  }
  const r = g.act(m.s, clone(m.a));
  if (r.ok && mark) S.marks.push(mark);
  return r;
}
/* Apply an answer and, if the engine takes it, keep it. */
function record(m) {
  const r = applyMove(m, S.run.screen.moves.length);
  if (!r.ok) return r;
  S.run.screen.moves.push(m);
  save();
  return r;
}
/* Your answer from the page. */
function act(a) {
  if (!S.g || S.g.hold) return;
  const pr = S.g.prompts.find(p => p.seat === YOU);
  if (!pr) return;
  a = Object.assign({ n: pr.n }, a);
  const r = record({ s: YOU, a });
  if (!r.ok) { toast(r.why); return; }
  Snd.play(a.t === 'pass' ? 'thump' : 'flip');
  S.sel = null; S.multi = []; S.passArm = false;
  afterMove();
}
function replayTo(n) {
  const moves = S.run.screen.moves.slice(0, n);
  S.run.screen.moves = moves;
  const st = S.setup;
  S.g = E.create({ players: st.players, seed: st.seed, show: true });
  S.marks = [];
  for (let i = 0; i < moves.length; i++) applyMove(moves[i], i);
}
function canUndo() {
  const g = S.g;
  if (!g || g.phase !== 'play' || !S.marks.length) return null;
  const m = S.marks[S.marks.length - 1];
  if (m.round !== g.round || m.drawN !== g.drawN || m.rngN !== g.rngN) return null;
  return m;
}
function undo() {
  const m = canUndo();
  if (!m) return;
  clearTimeout(S.timer); S.pending = 0;
  replayTo(m.at);
  save();
  S.seenLog = S.g.log.length; S.uids = new Set(allUids()); S.fresh = new Set();
  S.sel = null; S.modal = null;
  paint();
  tick();
}
function afterMove() {
  const g = S.g;
  /* What came on to the board, and what the house just did. */
  const now = allUids();
  S.fresh = new Set(now.filter(u => !S.uids.has(u)));
  S.uids = new Set(now);
  const fresh = g.log.slice(S.seenLog);
  S.seenLog = g.log.length;
  const fp = fresh.filter(e => e.by === FOE && (e.t === 'play' || e.t === 'leader')).pop();
  if (fp) spotlight(fp);
  if (fresh.some(e => e.t === 'roundEnd')) {
    const last = fresh.filter(e => e.t === 'roundEnd').pop();
    Snd.play(last.winner === YOU ? 'chime' : last.winner ? 'sting' : 'tick');
  }
  paint();
  tick();
}
function spotlight(e) {
  const el = $('spot');
  const id = e.t === 'leader' ? e.leader : e.card;
  const what = e.t === 'leader' ? S.g.seat(FOE).name + ' uses the leader' : S.g.seat(FOE).name + ' plays';
  el.innerHTML = A.card({ id, k: 0 }, 'big') + '<div class="sw">' + esc(what) + '</div>';
  el.classList.remove('hide');
  Snd.play('thump', { delay: 0.05 });
  clearTimeout(S.spotTimer);
  S.spotTimer = setTimeout(() => el.classList.add('hide'), T.spot);
}
/* What happens next without you: the house's answers, Scorch lets go, the end. */
function tick() {
  clearTimeout(S.timer);
  const g = S.g;
  if (!g || S.run.screen.k !== 'battle') return;
  if (g.phase === 'over') { if (!S.ended) { S.ended = true; endModal(); } return; }
  if (g.hold) {
    if (g.hold.k === 'scorch') {
      S.timer = setTimeout(() => { record({ rel: true }); Snd.play('hit'); afterMove(); }, T.scorch);
      return;
    }
    holdModal();
    return;
  }
  const pr = g.prompts.find(p => p.seat === FOE);
  if (!pr) return;
  S.timer = setTimeout(houseMove, pr.t === 'turn' ? T.house : T.housePick);
}
function houseMove() {
  const g = S.g;
  if (!g || g.hold || g.phase === 'over') return;
  const pr = g.prompts.find(p => p.seat === FOE);
  if (!pr) return;
  const me = g.seatView(FOE);
  const view = me.prompts.find(x => x.n === pr.n);
  let r = record({ s: FOE, a: B.answer(g.publicView(), me, clone(view)) });
  if (!r.ok) r = record({ s: FOE, a: B.fallback(g.publicView(), me, clone(view)) });
  if (!r.ok) return;
  afterMove();
}
const clone = o => JSON.parse(JSON.stringify(o));

/* The round cards hold the table until you tap Continue. */
function holdModal() {
  const g = S.g, h = g.hold, pub = g.publicView();
  const html = (h.k === 'roundStart' ? W.roundStartHtml(pub, h) : h.k === 'phase' ? phaseHtml(h) : W.roundEndHtml(pub, h)) + '<div class="foot"><button class="btn" data-act="release">Continue</button></div>';
  if (h.k === 'phase') Snd.play('gong');
  S.modal = { k: 'b', html, hold: h.n };
  paintModal();
}
/* A boss's second phase strikes: what it did, shown before play goes on. */
function phaseHtml(h) {
  const P = R.PHASES[h.what];
  const g = S.g;
  const who = g.seat(h.by).name;
  let more = '';
  if (h.what === 'crones') more = '<p>Taken from your hand:</p><div class="picklist">' + h.ids.map(id => '<span class="hc">' + face({ id }, 'tile') + '</span>').join('') + '</div><p class="dim">A Cow takes ' + (h.ids.length > 1 ? 'each one’s' : 'its') + ' place. The card is in your discard pile.</p>';
  else if (h.what === 'ambush') more = '<p>Walking on from her deck:</p><div class="picklist">' + h.ids.map(id => '<span class="hc">' + face({ id }, 'tile') + '</span>').join('') + '</div>';
  else if (h.what === 'edict') more = '<p><b>Your ' + esc(D.ROW_NAME[h.row]) + ' row</b> — your strongest last round — fights at −' + h.n + ' this round. Heroes are untouched; nothing drops below 1.</p>';
  else if (h.what === 'whiteFrost') more = '<p>' + esc(h.rows.map(r => D.ROW_NAME[r]).join(' and ')) + ' frozen for the rest of the battle. Clear Weather will not lift it.</p>';
  else if (h.what === 'rage') more = '<p>His ' + esc(h.rows.map(r => D.ROW_NAME[r]).join(' and ')) + ' row' + (h.rows.length > 1 ? 's are' : ' is') + ' doubled this round.</p>';
  else if (h.what === 'levy') more = '<p>' + h.n + ' Poor Fucking Infantry stand in his Close Combat row — a Tight Bond, so each fights at ' + h.n + '.</p>';
  return '<div class="rc-h" style="color:#d9a0ff">' + esc(P.name) + '</div><div class="rc-sub">' + esc(who) + (h.lvl > 1 ? ' — and it is worse now' : ' — you took a round, and this is the price') + '</div>' +
    '<p>' + esc(P.lvl[h.lvl - 1]) + '</p>' + more;
}
function endModal() {
  const g = S.g, res = g.result;
  const won = res.winner === YOU;
  const e = S.setup.foe;
  Snd.play(won ? 'fanfare' : 'sting');
  const rounds = res.rounds.map((r, i) => '<li>Round ' + (i + 1) + ': ' + (r.winner === YOU ? '<b class="gold">yours</b>' : r.winner ? 'theirs' : 'a draw') + ', ' + r.totals[0] + ' to ' + r.totals[1] + '</li>').join('');
  S.modal = { k: 'b', html: '<div class="rc-h">' + (won ? 'You beat ' + esc(e.name) : res.how === 'draw' ? 'A draw — and a draw is not a win' : esc(e.name) + ' wins') + '</div>' +
    '<div class="rc-sec"><ul>' + rounds + '</ul></div><div class="foot"><button class="btn" data-act="bdone">Continue</button></div>' };

/* ---------------- painting the battle ---------------- */
function myPrompt() { return S.g ? S.g.prompts.find(p => p.seat === YOU) || null : null; }
/* The Long Road: before the deal, drink a potion or keep it. */
function prepHtml() {
  const run = S.run, s = run.screen, e = R.enemyOf(run, s.foe);
  const P = S.drink || [];
  const foeMods = R.battleSetup(run).players[1].mods;

/* How the round ends if you pass now with these totals: 1 yours, 0 a draw,
   −1 theirs. A drawn round goes to whoever alone has Nilfgaard or a
   tie-winning trinket (the Ducal Seal), as gw-engine endRound decides it. */
function roundIfPass(pub, can) {
  if (can.mine !== can.theirs) return can.mine > can.theirs ? 1 : -1;
  const tieTo = p => p.fac === 'ng' || !!(p.mods && p.mods.tieWin);
  const me = tieTo(pub.players[0]), them = tieTo(pub.players[1]);
  return me && !them ? 1 : them && !me ? -1 : 0;
}
function battleHtml() {

  const g = S.g, pub = g.publicView(), sv = g.seatView(YOU);

  const can = sv.can;
  const sel = can && S.sel ? can.hand.find(h => h.uid === S.sel) : null;

  });

    const row = pub.board.sides[s].rows[r];

        (tgt[u.uid] != null ? ' data-act="playk" data-k="' + tgt[u.uid] + '"' : k != null ? '' : ' data-act="zoomu" data-id="' + u.id + '" data-up="' + (u.up || 0) + '"') + '>' +
        A.card({ id: u.id, k: u.k }, 'tile', { v: u.v }) + (k != null && tgt[u.uid] == null ? '</span>' : '</button>')).join('') : '<span class="empty">' + D.ROW_SHORT[r] + '</span>') + '</div>' +
      ((wx || minus || plus) ? '<span class="wxtag' + (minus && !wx ? ' minus' : plus && !wx ? ' plus' : '') + '">' + (wx ? A.icon(['frost', 'fog', 'rain'][r], 12) + (locked ? ' White Frost' : ' weather') : '') + (wx && (minus || plus) ? ' · ' : '') +
        [minus ? '−' + minus : '', plus ? '+' + plus : ''].filter(Boolean).join(' ') + (minus || plus ? ' to every unit' : '') + '</span>' : '') +
      (pl ? '<span class="rdelta">' + deltaHtml(pl.delta) + '</span>' : '') + '</div>';

      (p.mods && p.mods.phase && R.PHASES[p.mods.phase] ? '<button class="pile phasechip' + (p.mods.phaseN ? ' live' : '') + '" data-act="phaseinfo">' + esc(R.PHASES[p.mods.phase].name) + (p.mods.phaseN ? '' : ' — when you take a round') + '</button>' : '') +
      (i === 0 && (S.run.screen.drunk || []).length ? '<button class="pile" data-act="drunk" style="border-color:#3a6a50;color:#a8f0c8">' + S.run.screen.drunk.map(id => esc(R.POTION[id].name)).join(' · ') + '</button>' : '') +
      (p.mods && (p.mods.weak || p.mods.noLeader) ? '<span class="pile" style="border-color:#8a3030;color:#ffb0a8">' + [p.mods.weak ? 'Weakened' : '', p.mods.noLeader ? 'Leaderless' : ''].filter(Boolean).join(' · ') + '</span>' : '') +

  const frozen = (pub.board.locks || []).map((l, r) => l ? D.ROW_SHORT[r] : null).filter(Boolean);
  const weather = (frozen.length ? '<span style="color:#bfe0ff">White Frost: ' + frozen.join(' + ') + '</span>' : '') + (pub.board.weather.length ? pub.board.weather.map(w => A.card({ id: w.id, k: w.k }, 'tile')).join('') : frozen.length ? '' : '<span>Clear skies</span>');
  let hand = '';
  if (pr && pr.what === 'redraw') hand = '<span class="empty">Redrawing…</span>';
  else hand = sv.hand.length ? sv.hand.map(c => {
    const h = can && can.hand.find(x => x.uid === c.uid);
    const no = myTurn && h && !h.ok;

  }).join('') : '<span class="empty">No cards left in hand.</span>';
  const u = canUndo();

  if (myTurn) {
    const out = roundIfPass(pub, can);
    const losing = out <= 0;

    acts = '<button class="btn' + (losing && can.hand.length && can.oppPassed ? ' warn' : '') + '" data-act="pass">' + (S.passArm ? 'Tap again to pass' : passLab) + '</button>';
  } else acts = '<button class="btn ghost" disabled>' + (g.phase === 'over' ? 'The battle is over' : pr ? 'Answer the question' : esc(poss(g.seat(FOE).name)) + ' move') + '</button>';
  if (u) acts += '<button class="btn ghost" data-act="undo">Take back</button>';
  return '<div id="bt">' +
    '<div class="foe">' + strip(foePub, 1) + '</div>' +

    '<div class="rows yrows">' + [0, 1, 2].map(r => rowHtml(0, r)).join('') + '</div>' +
    '<div class="you">' + strip(mePub, 0) + '</div>' +
    '<div class="hnd">' + hand + '</div>' +
    '<div class="acts">' + acts + '</div>' +
    '<div class="logp"><h4>The battle so far</h4><div class="ll">' + lines.slice().reverse().map((l, k) => '<div' + (k < 2 ? ' class="new"' : '') + '>' + W.html(l, pub) + '</div>').join('') + '</div></div>' +
    '</div>';
}
function afterBattlePaint() {
  if (S.run.screen.prep) return;
  /* Units fan out when a row is crowded. */
  document.querySelectorAll('.row .cards').forEach(el => {
    const kids = el.querySelectorAll('.u');
    if (kids.length < 2) return;
    const w = kids[0].getBoundingClientRect().width;
    const avail = el.clientWidth;
    const gap = 3;
    const need = kids.length * w + (kids.length - 1) * gap;
    const m = need > avail && avail > 0 ? (avail - w) / (kids.length - 1) - w : gap;
    kids.forEach((k, i) => { k.style.marginLeft = i ? m + 'px' : '0'; });
  });
  /* The sheet for a selected card, or a question that is not a turn. */
  const g = S.g;
  const pr = myPrompt();
  const sh = $('sheet');
  if (!g || g.hold || g.phase === 'over' || S.modal) { sh.classList.add('hide'); return; }
  if (pr && pr.t !== 'turn') { questionModal(pr); return; }
  const sv = g.seatView(YOU);
  const sel = sv.can && S.sel ? sv.can.hand.find(h => h.uid === S.sel) : null;
  if (S.sel === 'leader' && sv.can && sv.can.leader) {
    const L = D.LEADER[sv.can.leader.id], lr = sv.can.leader;
    sh.innerHTML = '<div class="in">' + A.card(L.id, 'big') + '<div class="st"><b>' + esc(L.name + ' — ' + L.title) + '</b><div class="tx">' + esc(L.text) + '</div>' +
      (lr.ok ? '<div class="plays"><button class="opt" data-act="useleader"><span class="lab"><b>Use it now</b><small>' + (lr.delta ? '' : 'Once a battle.') + '</small></span><span class="val">' + deltaHtml(lr.delta) + '</span></button></div>' : '<div class="why">' + esc(lr.why) + '</div>') +
      '<div style="margin-top:8px"><button class="btn ghost" data-act="unsel">Back</button></div></div></div>';
    sh.classList.remove('hide');
    fitSheet(sh);
    return;
  }
  if (!sel) { sh.classList.add('hide'); return; }
  const d = D.card(sel.card);
  const c = sv.hand.find(x => x.uid === sel.uid);
  let plays = '';
  if (sel.ok) plays = '<div class="plays">' + sel.plays.map((pl, k) => '<button class="opt" data-act="playk" data-k="' + k + '"><span class="lab"><b>' + esc(pl.label) + '</b>' +
    (pl.victims && pl.victims.length ? '<small>Burns: ' + esc(pl.victims.map(v => D.card(v.id).name + (v.s === 0 ? ' (yours)' : ' (theirs)')).join(', ')) + '</small>' : '') + '</span><span class="val">' + deltaHtml(pl.delta) + '</span></button>').join('') + '</div>';
  else plays = '<div class="why">' + esc(sel.why) + '</div>';
  sh.innerHTML = '<div class="in">' + face(c, 'big') + '<div class="st"><b>' + esc(D.nameOf(sel.card)) + '</b><div class="tx">' + esc(cardText(sel.card)) + '</div>' +
    (sel.ok && d.kind === 'unit' && sel.plays.length > 1 ? '<div class="dim sans" style="font-size:12px;margin-bottom:4px">Tap a glowing row, or:</div>' : '') + plays +
    '<div style="margin-top:8px"><button class="btn ghost" data-act="unsel">Back to your hand</button></div></div></div>';
  sh.classList.remove('hide');
  fitSheet(sh);
}
/* The sheet scrolls rather than run off the screen, and ends above the hand
   when it sits over it (phones): a long Decoy list must not reach the cards
   the finger just left (touch ghost clicks). */
function fitSheet(sh) {
  const inner = sh.querySelector('.in');
  if (!inner) return;
  const top = inner.getBoundingClientRect().top;
  const hnd = document.querySelector('#bt .hnd');
  const r = hnd && hnd.getBoundingClientRect();
  const sr = sh.getBoundingClientRect();
  const over = r && r.height && r.left < sr.right && r.right > sr.left && r.top > top;
  const bottom = Math.min(window.innerHeight, over ? r.top : window.innerHeight) - 10;
  inner.style.maxHeight = Math.max(180, Math.round(bottom - top)) + 'px';
}
/* A question inside a battle: the redraw, a medic's pick, a leader's choice. */

    }
    h += '<div class="foot">' + (pr.skip ? '<button class="btn ghost" data-act="qskip">' + esc(pr.skip) + '</button>' : '') +
      (multi ? '<button class="btn" data-act="qmulti"' + (S.multi.length >= pr.min && S.multi.length <= pr.max ? '' : ' disabled') + '>Confirm (' + S.multi.length + ' of ' + pr.max + ')</button>' : '') + '</div>';
  }
  S.modal = { k: 'b', html: h, q: pr.n };
  paintModal();
}

/* ================================================================
   Taps
   ================================================================ */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) return;
  Snd.unlock();
  const a = t.dataset.act, id = t.dataset.id, i = t.dataset.i != null ? +t.dataset.i : null;
  const run = S.run;
  const done = r => { if (r && !r.ok) toast(r.why); save(); paint(); };
  /* Just after Fight, the redraw opens under the finger: let a ghost click land on nothing. */
  if (S.quietUntil && Date.now() < S.quietUntil) return;
  switch (a) {
    /* title and setup */
    case 'continue': S.run = savedRun(); S.view = 'run'; S.g = null; S.mapScrolled = false; paint(); if (S.run.screen.k === 'battle') tick(); return;
    case 'new': S.view = 'new'; S.modal = null; S.setupPick = { diff: S.setupPick.diff || 'witcher', long: !!S.setupPick.long, fac: null, leader: null }; paint(); window.scrollTo(0, 0); return;
    case 'how': S.view = 'how'; S.modal = null; paint(); window.scrollTo(0, 0); return;
    case 'title': clearTimeout(S.timer); S.view = 'title'; S.modal = null; S.g = null; paint(); return;
    case 'pdiff': S.setupPick.name = $('nm').value; S.setupPick.diff = id; paint(); return;
    case 'plen': S.setupPick.name = $('nm').value; S.setupPick.long = id === 'long'; paint(); return;
    case 'pfac': S.setupPick.name = $('nm').value; S.setupPick.fac = id; S.setupPick.leader = D.HOUSE_LEADER[id]; paint(); return;
    case 'pldr': S.setupPick.name = $('nm').value; S.setupPick.leader = id; paint(); return;
    case 'pch': { S.setupPick.name = $('nm').value; const ch = S.setupPick.ch = (S.setupPick.ch || []).slice(); const k = ch.indexOf(id); if (k >= 0) ch.splice(k, 1); else ch.push(id); paint(); return; }
    case 'chinfo': S.modal = { k: 'b', html: '<h3>Your challenges</h3><div class="opts">' + (run.ch || []).map(cid => '<div class="opt" style="cursor:default"><span class="lab"><b>' + esc(R.CHALLENGE[cid].name) + '</b><small>' + esc(R.CHALLENGE[cid].text) + '</small></span><span class="val sans" style="color:#ffb0a8">+' + Math.round(R.CHALLENGE[cid].w * 100) + '%</span></div>').join('') + '</div><p class="dim">Score ×' + R.multiplier(run).toFixed(2) + '</p><div class="foot"><button class="btn" data-act="mclose">Close</button></div>' }; paintModal(); return;
    case 'phaseinfo': { const e = S.setup.foe, P = R.PHASES[e.mods.phase]; S.modal = { k: 'b', html: '<h3>' + esc(P.name) + '</h3><p>' + esc(P.when) + '</p><ul><li>' + esc(P.lvl[0]) + '</li><li>After a second lost round: ' + esc(P.lvl[1]) + '</li></ul><div class="foot"><button class="btn" data-act="mclose">Close</button></div>' }; paintModal(); return; }
    case 'loss': { const r = R.takeLoss(run, id); if (r.ok) Snd.play(id === 'wound' ? 'hit' : 'sting'); if (run.over) banked(run); done(r); return; }
    case 'begin': {
      let name = ($('nm').value || '').trim().slice(0, 16) || 'The Wanderer';
      /* The log reads "<name> plays …": "You plays" would not do. */
      if (/^(you|me|i|myself)$/i.test(name)) name = 'The Wanderer';
      store(NAME, name);
      const P = S.setupPick;
      S.run = R.newRun({ fac: P.fac, leader: P.leader, diff: P.diff, long: !!P.long, name, challenges: (P.ch || []).slice(), seed: Q.get('seed') != null ? +Q.get('seed') : undefined, now: new Date().toISOString().slice(0, 10) });
      S.view = 'run'; S.g = null; S.mapScrolled = false; save(); paint(); window.scrollTo(0, 0); return;
    }
    /* anywhere */
    case 'deck': S.modal = { k: 'deck' }; paintModal(); return;
    case 'potions': S.modal = { k: 'potions' }; paintModal(); return;
    case 'pour': { const m = S.modal; if (m.sure !== i) { m.sure = i; paintModal(); return; } const r = R.pour(run, i); S.modal = { k: 'potions' }; done(r); return; }
    case 'drunk': S.modal = { k: 'b', html: '<h3>Potions in this battle</h3><div class="opts">' + run.screen.drunk.map(pid => '<div class="opt" style="cursor:default"><span class="ic">' + potIcon(pid) + '</span><span class="lab">' + potHtml(pid) + '</span></div>').join('') + '</div><div class="foot"><button class="btn" data-act="mclose">Close</button></div>' }; paintModal(); return;
    case 'drink': { const P = S.drink = (S.drink || []).slice(); const k = P.indexOf(i); if (k >= 0) P.splice(k, 1); else P.push(i); paint(); return; }
    case 'fight': { const r = R.fight(run, S.drink || []); S.drink = []; S.g = null; if (r.ok) { Snd.play(r.drunk.length ? 'chime' : 'whoosh'); S.quietUntil = Date.now() + 450; } done(r); window.scrollTo(0, 0); tick(); return; }
    case 'pswap': { const r = R.takePotion(run, t.dataset.i === '' ? null : +t.dataset.i); if (r.ok && t.dataset.i !== '') Snd.play('chime'); done(r); return; }
    case 'trinket': S.modal = { k: 'trinkets' }; paintModal(); return;
    case 'menu': S.modal = { k: 'menu' }; paintModal(); return;
    case 'mclose': S.modal = null; paint(); return;
    case 'abandon':
      if (!S.modal.sure) { S.modal.sure = true; paintModal(); return; }
      clearTimeout(S.timer);
      run.over = { won: false, by: 'abandonment', act: run.act }; run.screen = { k: 'over', won: false };
      banked(run); S.modal = null; S.g = null; store(KEY, null); paint(); return;
    case 'zoom': zoom({ id }); return;
    case 'zoomu': zoom({ id, up: +t.dataset.up || 0 }); return;
    /* the map and the screens */
    case 'go': { const r = R.go(run, id); if (r.ok && run.screen.k === 'battle') { S.g = null; Snd.play('whoosh'); } else if (r.ok) Snd.play('step'); done(r); window.scrollTo(0, 0); if (run.screen.k === 'battle') tick(); return; }
    case 'leave': {
      const r = R.leave(run);
      if (r.ok) { S.pick = null; S.mapScrolled = false; S.g = null; if (run.over) banked(run); }
      done(r); window.scrollTo(0, 0);
      if (run.screen.k === 'battle') tick();
      return;
    }
    case 'rpick': S.pick = i; paint(); return;
    case 'rtake': { const r = R.takeCard(run, S.pick); S.pick = null; if (r.ok) Snd.play('flip'); done(r); return; }
    case 'rskip': S.pick = null; done(R.takeCard(run, null)); return;
    case 'rleader': done(R.takeLeader(run, id || null)); return;
    case 'buy': { const r = R.buy(run, i); if (r.ok) Snd.play('coin'); done(r); return; }
    case 'sremove': openPicker({ title: 'Remove which card?', sub: R.removePrice(run) + ' crowns.', go: 'Remove it', then: rid => R.shopRemove(run, rid) }); return;
    case 'rest': { const r = R.camp(run, 'rest'); if (r.ok) Snd.play('chime'); done(r); return; }
    case 'hone': openPicker({ title: 'Hone which unit?', sub: '+' + (R.has(run, 'whetstone') ? 3 : R.HONE) + ' strength, for the rest of the run.', go: 'Hone it', can: c => D.card(c.id).kind === 'unit' && (c.up || 0) < R.HONE_MAX, then: rid => R.camp(run, 'hone', rid) }); return;
    case 'cull': openPicker({ title: 'Burn which card?', sub: 'It leaves your deck for good.', go: 'Burn it', then: rid => R.camp(run, 'cull', rid) }); return;
    case 'evopt': {
      const ev = R.EVENT[run.screen.ev], o = ev.options[i];
      if (o.pick) {
        const can = o.pick === 'hone' ? (c => D.card(c.id).kind === 'unit' && (c.up || 0) < R.HONE_MAX) : null;
        openPicker({ title: o.label, sub: subOf(o), go: 'Choose', can, then: rid => R.choose(run, i, rid) });
        return;
      }
      const r = R.choose(run, i);
      if (r.ok && r.fight) { S.g = null; done(r); tick(); return; }
      if (run.over) banked(run);
      done(r); return;
    }
    case 'mpick': S.modal.on = id; paintModal(); return;
    case 'mpickgo': {
      const m = S.modal;
      const r = m.then(m.on);
      S.modal = null;
      if (r && r.ok && run.over) banked(run);
      done(r); return;
    }
    /* the battle */
    case 'sel': {
      const pr = myPrompt();
      if (!pr || pr.t !== 'turn' || S.g.hold) { zoom(S.g.seatView(YOU).hand.find(c => c.uid === id)); return; }
      S.sel = S.sel === id ? null : id; S.passArm = false; paint(); return;
    }
    case 'unsel': S.sel = null; paint(); return;
    case 'leader': { const pr = myPrompt(); if (!pr || pr.t !== 'turn') { zoom({ id }); return; } S.sel = S.sel === 'leader' ? null : 'leader'; paint(); return; }
    case 'useleader': act({ t: 'leader' }); return;
    case 'playk': {
      const sv = S.g.seatView(YOU);
      const h = sv.can && sv.can.hand.find(x => x.uid === S.sel);
      const pl = h && h.plays[+t.dataset.k];
      if (!pl) return;
      ev.stopPropagation();
      act({ t: 'play', uid: h.uid, row: pl.row, target: pl.target || null });
      return;
    }
    case 'pass': {
      const sv = S.g.seatView(YOU), c = sv.can;
      const risky = c && c.hand.length && (c.oppPassed ? roundIfPass(S.g.publicView(), c) <= 0 : c.mine < c.theirs && S.g.round > 0);
      if (risky && !S.passArm) { S.passArm = true; paint(); return; }
      act({ t: 'pass' }); return;
    }
    case 'undo': undo(); return;
    case 'release': {
      const g = S.g;
      if (!g.hold || g.hold.n !== S.modal.hold) { S.modal = null; paint(); return; }
      S.modal = null;
      record({ rel: true });
      afterMove(); return;
    }
    case 'qpick': {
      const pr = myPrompt();
      if (!pr) return;
      if (pr.multi) { const k = S.multi.indexOf(id); if (k >= 0) S.multi.splice(k, 1); else if (S.multi.length < pr.max) S.multi.push(id); questionModal(pr); return; }
      S.modal = null; act({ t: 'pick', id }); return;
    }
    case 'qskip': S.modal = null; act({ t: 'skip' }); return;
    case 'qmulti': S.modal = null; act({ t: 'pick', ids: S.multi.slice() }); return;
    case 'mydeck': {
      /* Copies alike are counted together; a honed copy stands on its own. */
      const list = [];
      for (const c of S.g.seatView(YOU).deckCards) { const same = list.find(x => x.id === c.id && (x.up || 0) === (c.up || 0)); if (same) same.n++; else list.push({ id: c.id, up: c.up || 0, n: 1 }); }
      S.modal = { k: 'pile', title: 'Left in your deck (in no order)', list }; paintModal(); return;
    }
    case 'pile': {
      const p = S.g.publicView().players[i];
      S.modal = { k: 'pile', title: (i === 0 ? 'Your' : poss(p.name)) + ' discard pile', list: p.disc.slice().reverse() }; paintModal(); return;
    }
    case 'bdone': {
      const res = S.g.result;
      S.modal = null; S.g = null; S.sel = null;
      const r = R.battleDone(run, { won: res.winner === YOU, draw: res.how === 'draw', rounds: res.rounds.map(x => ({ winner: x.winner })) });
      if (run.over) banked(run);
      if (run.screen.k === 'reward') Snd.play('coin');
      done(r); window.scrollTo(0, 0); return;
    }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (e.key === 'Escape') {
    if (!$('zoom').classList.contains('hide')) { $('zoom').classList.add('hide'); return; }
    if (S.sel) { S.sel = null; paint(); }
  }
});
$('zoom').addEventListener('click', () => $('zoom').classList.add('hide'));
function zoom(c) {
  if (!c) return;
  const z = $('zoom');
  z.innerHTML = face(c, 'big') + '<div class="ztx"><b>' + esc(D.nameOf(c.id)) + '</b>' + (c.up ? ' <span class="gold">(honed +' + c.up + ')</span>' : '') + '<br>' + esc(cardText(c.id)) + '</div><div class="dim sans" style="font-size:13px">Tap to close</div>';
  z.classList.remove('hide');
}
/* The end of a run goes into the hall of fame. */
function banked(run) {
  if (run.banked) return;
  run.banked = true;
  const list = bests();
  list.push({ score: R.score(run), fac: run.fac, diff: run.diff, won: !!(run.over && run.over.won), act: run.act, name: run.name, ch: (run.ch || []).slice(), long: !!run.long, date: new Date().toISOString().slice(0, 10) });
  list.sort((a, b) => b.score - a.score);
  store(BEST, JSON.stringify(list.slice(0, 10)));
  store(KEY, null);
}
window.addEventListener('resize', () => { if (S.run && S.run.screen.k === 'battle' && S.view === 'run') afterBattlePaint(); });

/* ================================================================
   Start
   ================================================================ */
document.head.insertAdjacentHTML('beforeend', A.styles());
if (!Q.has('noart')) A.probe();
Snd.armUnlock();
window.GwentPath = { S, R, paint, tick, act, startBattle, houseMove, T };
paint();
</script>
