<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Nations — Solo</title>
<meta name="theme-color" content="#13100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#13100c; --panel:#211b14; --panel2:#18130e; --line:#3b3125; --ink:#f3ecdc; --dim:#b2a58c;
  --gold:#e8b94a; --good:#62c47e; --bad:#e5544d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden],.hide{display:none !important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 12px calc(86px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:10px 0 6px;position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
#brand{font:700 17px/1 "Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.16em;color:var(--gold)}
#chip{font-size:12px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#chip b{color:var(--ink)}
#menuBtn{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:6px 10px;font-size:14px}
#tabs{display:flex;gap:4px;width:100%;margin-top:4px}
#tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 2px;font-size:13px;font-weight:700;position:relative}
#tabs button.on{background:var(--gold);border-color:var(--gold);color:#1a140a}
#tabs button .pip{position:absolute;top:-4px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(8,6,4,.82);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#sheet .card{width:100%;max-width:520px;max-height:86vh;overflow:auto}
#sheet li{margin:4px 0;font-size:13px;color:var(--dim)}
#sheet h3{margin:12px 0 4px;font-size:13px;color:var(--gold)}
.loglist{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--dim)}
.loglist .lr{padding:6px 0;border-top:1px solid var(--line)}
.loglist .lr:first-child{border-top:0;color:var(--ink)}
.loglist .lrh{color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding-top:10px}
.think{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.think i{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:blink 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.nfull{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.nfull:first-child{border-top:0;padding-top:0;margin-top:0}
table.fin{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.fin th,table.fin td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--line)}
table.fin th{color:var(--dim);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
table.fin .nm{text-align:left}
table.fin tr.win td{color:var(--gold);font-weight:800}
table.fin tr.me td.nm{text-decoration:underline;text-decoration-color:var(--gold)}
#name{display:flex;gap:8px;margin-top:8px}

#dot{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:none}
#who{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{margin:16px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
h2 small{letter-spacing:0;text-transform:none;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.card.mine{border-color:var(--gold)}
.title{font-weight:800;font-size:19px;color:var(--gold)}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
button{font:inherit}
.btn{display:block;width:100%;background:var(--gold);border:0;color:#1a140a;font-weight:800;font-size:17px;border-radius:14px;padding:14px;margin-top:10px}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:15px}
.btn.small{font-size:14px;padding:10px;margin-top:6px}
.btn.armed{background:var(--bad);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.menu button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:64px}
.menu button b{font-size:15px}
.menu button small{color:var(--dim);font-size:12px;line-height:1.25}
.menu button:disabled{opacity:.38}
.menu button.wide{grid-column:span 2}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:15px}
.opt:disabled{opacity:.4}
.opt.on{border-color:var(--gold);background:rgba(232,185,74,.13)}
.opt .lab{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.opt .lab small{color:var(--dim);font-size:12px;line-height:1.25}
.opt .val{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--gold);flex:none}
.res{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.res span{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:18px}
.res span.warn{background:rgba(229,84,77,.2);border-radius:6px;padding:0 4px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--dim);align-items:center}
.stat span{display:inline-flex;align-items:center;gap:3px}
.stat b{color:var(--ink)}
.stat .neg b{color:var(--bad)}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.faces.f4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.face{position:relative;min-width:0;display:flex;flex-direction:column;gap:3px;background:transparent;border:0;padding:0;color:var(--ink);text-align:center}
.face .cap{font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face .cap2{font-size:11px;color:var(--dim);line-height:1.15}
.face.no{opacity:.45}
.face.sel .nc{outline:3px solid var(--gold);outline-offset:1px}
.face .badge{position:absolute;top:-5px;right:-4px;z-index:2;background:var(--gold);color:#1a140a;font:900 13px/1 system-ui;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.face .btn.small{font-size:13px;padding:9px 4px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:3px;margin-top:4px}
.face.empty{border:1px dashed var(--line);border-radius:10px;aspect-ratio:693/1071;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.big{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.big .bf{width:44%;flex:none}
.big .bt{flex:1;min-width:0;font-size:14px}
.big .bt .why{color:#ffb4ae;margin-top:6px}
.brow-h{font-size:12px;color:var(--gold);font-weight:800;margin:10px 0 2px;display:flex;align-items:center;gap:4px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:8px}
.stepper span.l{flex:1;display:flex;align-items:center;gap:6px;font-weight:700}
.stepper button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;font-weight:800}
.stepper button:disabled{opacity:.35}
.stepper b{min-width:1.5em;text-align:center;font-size:18px}
.prow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow i.d{width:10px;height:10px;border-radius:50%;flex:none}
.prow b{color:var(--ink)}
.prow .sc{margin-left:auto;font-weight:800;color:var(--gold)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pc{display:inline-flex;align-items:center;gap:3px;padding:1px 6px 1px 4px;border-radius:6px;background:#efe6d2;color:#2b2216;font-weight:700;font-size:12px;border-left:5px solid var(--c);white-space:nowrap}
.track{display:inline-flex;gap:2px;align-items:center}
.track i{width:7px;height:12px;border-radius:2px;background:#6a5a44}
.track i.t{background:transparent;border:1px solid #6a5a44}
#flash{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));background:#2a1220;border:1px solid var(--bad);color:#ffd9de;border-radius:12px;padding:11px 13px;font-size:14px;z-index:20}
#flash.ok{background:#1d2a1c;border-color:var(--good);color:#d8f3dc}
#name input{flex:1;font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(19,16,12,.96);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
#bar button{flex:1;margin:0}
.wg{display:inline-flex;align-items:center;gap:1px;font-weight:800;color:var(--good);white-space:nowrap}
.wg.neg{color:var(--bad)}
.since{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 11px;margin-top:6px;font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.since .sh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.since .sl.new{color:var(--ink)}
.since .more{align-self:flex-start;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:4px 10px;font-size:12px}
.reel{margin-top:6px;border:1px solid var(--line);border-left:5px solid var(--hex);background:var(--panel);border-radius:12px;padding:9px 11px;font-size:15px;line-height:1.38}
.reel.fresh{animation:reelIn .35s ease-out}
.reel small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:2px}
@keyframes reelIn{from{transform:translateY(-4px);opacity:.2}to{transform:none;opacity:1}}
.face.empty.lit{border:2px solid var(--hex);color:var(--ink);font-weight:700}
.upnext{border-color:var(--gold)!important}
/* the round card */
.rcard .rc-h{font-weight:800;font-size:22px;color:var(--gold);line-height:1.15;font-family:"Palatino Linotype",Palatino,Georgia,serif}
.rcard .rc-sub{font-size:13px;margin-top:3px}
.rc-sc{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.rc-p{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:15px;min-width:0;flex-wrap:wrap}
.rc-p i{width:11px;height:11px;border-radius:50%;flex:none}
.rc-p b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rc-p .rc-t{margin-left:auto;display:flex;align-items:baseline;gap:3px;font-weight:900;color:var(--gold)}
.rc-p .rc-t small{font-size:.6em;color:var(--dim);font-weight:600}
.rc-p .rc-d{font-size:12px;color:var(--good);white-space:nowrap}
.rc-p .rc-d.neg{color:var(--bad)}
.rc-sec{margin-top:10px}
.rc-sec h4{margin:0 0 3px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rc-tab{border-collapse:collapse;font-size:14px}
.rc-tab td{padding:1px 10px 1px 0;white-space:nowrap}
.rc-tab em{color:var(--bad);font-style:normal;font-size:12px}
.rc-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:14px;margin:3px 0}
.rc-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.rc-w{text-align:center;margin-top:10px}
/* where the round is */
.phs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 4px}
.phs .phg{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-left:4px}
.phs .phg:first-child{margin-left:0}
.phs .ph{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--dim);white-space:nowrap}
.phs .ph.done{color:#7d705b;border-color:transparent;text-decoration:line-through}
.phs .ph.on{background:var(--gold);border-color:var(--gold);color:#1a140a;font-weight:800}
.phbar{margin-top:6px}
.phbar .says{font-size:12px;color:var(--dim);margin-top:4px}
.rc-page .phs{margin-bottom:10px}
.rc-page .rc-sub{color:var(--dim)}
.rc-note{color:var(--dim);font-size:12px}
.rc-ord{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 8px;margin:0 4px 4px 0}
.rc-ord>b{color:var(--gold)}
.rc-ord small{color:var(--dim)}
.rc-evs{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.rc-evc{width:36%;flex:none}
.rc-evl{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.rc-evh>b{font:700 16px/1.15 "Palatino Linotype",Palatino,Georgia,serif;color:var(--gold)}
.rc-evh .rc-row{font-size:13px}
.evmini{display:flex;gap:10px;align-items:flex-start}
.evmini .bf{width:30%;flex:none}
.evmini .bt{flex:1;min-width:0;font-size:13px;display:flex;flex-direction:column;gap:5px}
.evmini .bt b{color:var(--gold)}
.sp{justify-content:space-between;color:var(--ink)!important}
.sp small{font-weight:600;color:var(--dim);font-size:11px}
.sp small.full{color:#ffb4ae}
.sp>span{white-space:nowrap;margin-right:8px}
.sp small{text-align:right}
.face.empty.slim{aspect-ratio:auto;min-height:48px;padding:6px;text-align:center}
/* Dynasties */
.dyns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.dyns .face{gap:4px}
.npick{display:flex;flex-direction:column;gap:8px}
.npick .opt{flex-direction:column;align-items:stretch}
.npick .board{width:100%;border-radius:8px;display:block;aspect-ratio:3000/1583;background:#2a2219 center/cover no-repeat}
.npick .dl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);margin-top:2px}
.npick .dl b{color:var(--ink)}
.tag-dyn{display:inline-block;background:#2a4f8f;color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:middle}
</style>
</head>
<body>

<header>
  <span id="brand">NATIONS</span><span id="chip"></span>
  <button id="menuBtn" aria-label="Menu">☰ Menu</button>
  <nav id="tabs" class="hide"></nav>
</header>

<div id="main"></div>
<div id="bar" class="hide"></div>
<div id="flash" class="hide"></div>
<div id="sheet" class="hide"></div>

<script src="nations-data.js"></script>
<script src="nations-engine.js"></script>
<script src="nations-bots.js"></script>
<script src="nations-art.js"></script>
<script src="nations-words.js"></script>
<script src="solo-host.js"></script>
<script>
'use strict';
(function checkVersions() {
  const missing = [];
  if (!window.NationsData || !window.NationsData.MANIFEST) missing.push('nations-data.js');
  if (!window.NationsArt || window.NationsArt.VERSION !== 2) missing.push('nations-art.js');
  if (!window.NationsWords || window.NationsWords.VERSION !== 3) missing.push('nations-words.js');
  if (!window.NationsEngine || window.NationsEngine.VERSION !== 1) missing.push('nations-engine.js');
  if (!window.NationsBots || window.NationsBots.VERSION !== 1) missing.push('nations-bots.js');
  if (!window.NationsSolo) missing.push('solo-host.js');
  if (!missing.length) return;
  const show = () => {
    document.body.innerHTML = '<div style="padding:12vw 8vw;text-align:center;font:600 18px/1.5 system-ui;color:#f3ecdc">' +
      '<div style="font-size:26px;color:#e8b94a;margin-bottom:12px">This page is out of date</div>' +
      'Your phone kept an old copy of ' + missing.join(' and ') + '. Reload the page (pull down, or close the tab and open it again).</div>';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  throw new Error('stale assets: ' + missing.join(', '));
})();

const D = window.NationsData, A = window.NationsArt, W = window.NationsWords;
const $ = id => document.getElementById(id);
const esc = A.esc;
A.install();
const C = id => D.card(id);

const Solo = window.NationsSolo;
const HUB_URL = '../../index.html';
/* Phones synthesise a click ~300ms after a touch: everything is inert this
   long after a send, and after the screen changes shape. */
const LOCK_MS = 380;

const S = {
  id: Solo.ME, hex: '#e8b94a',
  pub: null, me: null,
  tab: 'play',     // play | board | nations | log
  panel: null,     // board | deploy | galileo | special
  sel: null,       // the card or action being set up
  armed: null,     // pass, waiting for its second tap
  sideA: false,    // the nation picker's side toggle
  sinceAll: false, detail: null, sheet: null,
  lockUntil: 0, shape: '', wasTurn: false, greeted: false
};
window.__NATIONSPHONE = S;
const locked = () => Date.now() < S.lockUntil;
const lock = () => { S.lockUntil = Date.now() + LOCK_MS; };
const buzz = ms => { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

/* ---------- the table runs in this page (solo-host.js) ---------- */
const send = m => { Solo.send(m); return true; };
/* A move, a page of the round card and the house's answers all arrive as two
   messages (the table, then your half of it): paint once for both. */
let paintQueued = false;
const paintSoon = () => { if (paintQueued) return; paintQueued = S.paintPending = true; setTimeout(() => { paintQueued = S.paintPending = false; paint(); }, 0); };
function handle(m) {
  if (m.t === 'hello-ok') return;
  if (m.t !== 'msg' || !m.msg) return;
  const msg = m.msg;
  if (msg.t === 'flash') { flash(msg.text); return; }
  if (msg.t === 'nations') {
    S.pub = msg; if (!msg.game) S.me = null;
    if (!S.greeted && msg.screen === 'play' && Solo.S.resumed) { S.greeted = true; flash('Welcome back — your game was saved and picks up where you left it.', 'ok'); }
    paintSoon(); return;
  }
  if (msg.t === 'nations-me') { S.me = msg.me; S.undo = msg.undo || null; paintSoon(); }
}
let flashTimer = null;
function flash(text, tone) {
  clearTimeout(flashTimer);
  $('flash').textContent = text;
  $('flash').className = tone || '';
  $('flash').classList.remove('hide');
  buzz(40);
  flashTimer = setTimeout(() => $('flash').classList.add('hide'), Math.max(2600, String(text).length * 45));
}

/* ---------- helpers ---------- */
const game = () => S.pub && S.pub.game;
const mine = () => { const g = game(); return g ? g.players.find(p => p.id === S.id) : null; };
const pl = id => { const g = game(); return g ? g.players.find(p => p.id === id) : null; };
const pname = id => { const p = pl(id); return p ? p.name : '?'; };
const isRemote = () => S.pub && S.pub.remote === S.id;
const nationName = id => (D.NATIONS.find(n => n.id === id) || {}).name || '';
const myPrompt = () => {
  if (!S.me || !S.me.prompts || !S.me.prompts.length) return null;
  const pr = S.me.prompts[0];
  /* The public state and this seat's own half arrive as two messages: only
     draw a question the table itself still lists as open. */
  const g = game();
  if (!g || !g.prompts.some(x => x.n === pr.n && x.seat === S.id)) return 'stale';
  return pr;
};
const act = a => { if (locked()) return; lock(); S.armed = null; send({ t: 'do', a }); };
const R = { gold: 'gold', stone: 'stone', food: 'food', book: 'books', vp: 'VP', stab: 'stability', str: 'strength' };
const ic = (k, px) => A.res(k, px || 18);

/* ================================================================
   Painting
   ================================================================ */
function paint() {
  const pr = myPrompt();
  const h = S.pub && S.pub.hold;
  const holdKey = h ? 'hold' + (h.kind || '') + h.round + ':' + (h.page || 0) + (h.waiting.indexOf(S.id) >= 0 ? 'w' : 'd') + ((h.nexted || []).indexOf(S.id) >= 0 ? 'n' : '') + (h.grace ? 'g' : '') : '';
  const shape = [S.pub && S.pub.screen, pr && pr !== 'stale' ? pr.t + pr.n : '-', holdKey].join('|');
  if (shape !== S.shape) {
    const turnNow = pr && pr !== 'stale' && pr.t === 'turn';
    /* A free action (taking a worker off a card) re-asks the turn with a new
       number: the panel you were in stays open. Anything else starts over. */
    const keep = turnNow && S.wasTurn && S.panel === 'deploy';
    if (!keep) { S.panel = null; S.sel = null; }
    S.armed = null;
    if (turnNow && !S.wasTurn) buzz([60, 60, 60]);
    /* A new question for you brings you back to Play, wherever you were. */
    if (pr && pr !== 'stale' && !keep && !(turnNow && S.wasTurn)) { S.tab = 'play'; S.detail = null; }
    S.wasTurn = !!turnNow;
    const wasHold = S.shape.indexOf('|hold') >= 0;
    const newScreen = S.shape.split('|')[0] !== shape.split('|')[0];
    S.shape = shape; lock();
    if (!!h !== wasHold || (turnNow && !keep) || newScreen) window.scrollTo(0, 0);
  }
  const m = $('main');
  $('bar').classList.add('hide');
  paintHeader(pr);
  paintSheet();
  if (!S.pub) { m.innerHTML = waitCard('Setting the table…', ''); return; }
  if (S.pub.screen === 'lobby') { m.innerHTML = lobbyHtml(); wire(); return; }
  if (S.pub.screen === 'over') { m.innerHTML = S.tab === 'log' ? logTabHtml() : overHtml(); wire(); return; }
  if (!game()) { m.innerHTML = waitCard('Hold tight', ''); return; }
  if (!mine() || !S.me) { m.innerHTML = waitCard('Dealing you in', ''); return; }
  if (S.detail) { m.innerHTML = detailHtml(); wire(); return; }
  /* The round card and the new event come first, whatever tab you were on. */
  if (h) m.innerHTML = holdHtml() + nationHtml() + (h.kind === 'event' ? '' : eventHtml());
  else if (S.tab === 'board') m.innerHTML = phaseHtml() + reelHtml() + boardTabHtml(pr);
  else if (S.tab === 'nations') m.innerHTML = reelHtml() + nationsTabHtml();
  else if (S.tab === 'log') m.innerHTML = logTabHtml();
  else m.innerHTML = phaseHtml() + reelHtml() + askHtml(pr) + undoHtml() + sinceHtml(pr) + eventHtml() + nationHtml();
  wire();
}

/* ---------------- since your last turn ---------------- */
function sinceLines() {
  const g = game();
  if (!g || !g.log || !g.log.length) return null;
  const base = (g.logN || g.log.length) - g.log.length;
  const all = W.lines(g.log, g, base);
  let i = all.length - 1;
  while (i >= 0 && all[i].by === S.id) i--;
  const out = [];
  let reached = false;
  for (; i >= 0; i--) {
    const l = all[i];
    if (l.by === S.id) { if (W.HEAD[l.t]) { reached = true; break; } continue; }
    out.unshift(l);
  }
  return { lines: out, cut: !reached && base > 0, first: !reached && base === 0 };
}
function sinceHtml(pr) {
  const s = sinceLines();
  /* the newest house line is already set large above (reelHtml) */
  const x = reelOn();
  if (s && x) s.lines = s.lines.filter(l => l.i !== x.r.i);
  if (!s || !s.lines.length) return '';
  const MAX = 6;
  const shown = S.sinceAll ? s.lines : s.lines.slice(-MAX);
  const hidden = s.lines.length - shown.length;
  return '<div class="since"><div class="sh">' + (s.first ? 'So far' : 'Since your last turn') + '</div>' +

    (S.sinceAll && s.lines.length > MAX ? '<button class="more" id="sinceLess">Show fewer</button>' : '') + '</div>';

function reelOn() {
  const r = S.pub && S.pub.reel, g = game();
  if (!r || !g || !g.log) return null;
  const base = (g.logN || g.log.length) - g.log.length;
  if (r.i < base) return null;
  const ls = W.lines(g.log, g, base);
  const L = ls.find(l => l.i === r.i);
  if (!L) return null;
  if (ls.some(l => l.i > r.i && l.by === S.id && W.HEAD[l.t])) return null;
  const e = g.log[r.i - base] || {};
  return { r, L, slot: e.t === 'buy' && e.row != null ? { r: e.row, c: e.col, card: e.card } : null };

function askHtml(pr) {
  const g = game();
  if (pr === 'stale') return waitCard('Hold on', 'The table is moving on.');
  if (!pr) {
    const open = g.prompts;
    const dots = '<span class="think"><i></i><i></i><i></i></span>';
    if (!open.length) return waitCard('The round is resolving', g.phase === 'resolution' ? 'Production, the War and the events.' : '');
    if (open.every(x => x.t === 'growth')) return waitCard('Growth' + dots, 'Waiting for ' + esc(Array.from(new Set(open.map(x => pname(x.seat)))).join(', ')) + '.');
    const x = open[0];
    const upNext = g.phase === 'action' && nextUp() === S.id;
    return waitCard(esc(pname(x.seat)) + (x.t === 'turn' ? '’s turn' : ' is choosing') + dots,
      esc(x.t === 'turn' ? (upNext ? 'You are up next. Look at the Board while you wait.' : 'Taking a turn.') : (x.why || '')), upNext ? 'upnext' : '');
  }
  switch (pr.t) {
    case 'growth': return growthHtml(pr);
    case 'nation': return nationPickHtml(pr);
    case 'choice': return choiceHtml(pr);
    case 'mix': return mixHtml(pr);
    case 'turn': return turnHtml(pr);
  }
  return waitCard('Your move', esc(pr.why || ''));
}
/* Who plays after the nation now taking its turn. */
function nextUp() {
  const g = game();
  const ord = g.order;
  const i = ord.indexOf(g.active);
  if (i < 0) return null;
  for (let k = 1; k <= ord.length; k++) { const p = pl(ord[(i + k) % ord.length]); if (p && !p.passed && p.id !== g.active) return p.id; }
  return null;
}

    (can.turmoil ? '<button data-panel="turmoil" class="wide"' + (can.turmoil.ok ? '' : ' disabled') + '><b>Take a Turmoil card</b><small>' +

/* The progress board, by price. Tap a card to see it and buy it. */

    else opts = o.opts.filter(([v]) => !((sel.act === 'lincoln' || sel.act === 'suleiman') && (me.taken[v] || 0) >= (me.track[v] || 0) && !me.freeTop));
    return '<div class="card mine"><div class="title">' + esc(C(sel.card).name) + '</div><div class="sub">' + esc(why) + '</div><div class="opts">' +
      opts.map(([v, l]) => '<button class="opt" data-sp="' + v + '"><span class="lab"><b>' + esc(l) + '</b></span></button>').join('') + '</div><button class="btn ghost small" id="unsel">Back</button></div>';
  }
  return '<div class="card mine"><div class="title">Card actions</div><div class="opts">' + can.specials.map(s => {
    const card = C(s.card);
    const head = s.act === 'chopin' ? 'Buy Chopin from ' + pname(s.owner) + ' — 5 gold' : s.act === 'plcbuy' ? 'Buy ' + card.name + ' from ' + pname(s.owner) + ' — 3 gold to them' : (card ? card.name : s.card);
    return '<button class="opt" data-special="' + esc(s.card) + '"' + (s.ok ? '' : ' disabled') + '><span class="lab"><b>' + esc(head) + '</b><small>' +
      esc(s.ok ? (card ? card.text : '') : s.why) + (s.once ? ' · once a round' : '') + '</small></span></button>';
  }).join('') + '</div>' + back + '</div>';
}

/* ================================================================
   Your nation, the round's event, the other nations
   ================================================================ */
function prodLine(p) {
  const ks = ['gold', 'stone', 'food', 'book'].filter(k => p.prod[k]);
  return ks.length ? ks.map(k => '<span class="wg' + (p.prod[k] < 0 ? ' neg' : '') + '">' + (p.prod[k] > 0 ? '+' : '') + p.prod[k] + ic(k, 15) + '</span>').join(' ') : 'nothing';
}
function nationHtml() {
  const me = mine();
  const g = game();
  if (!me.nation) return '';
  const ev = g.event ? D.event(g.event) : null;
  const res = ['gold', 'stone', 'food', 'book'].map(k => {
    const after = me.res[k] + (me.prod[k] || 0) - (k === 'food' && ev ? ev.famine : 0);
    return '<span class="' + (after < 0 ? 'warn' : '') + '">' + ic(k, 22) + me.res[k] + '</span>';
  }).join('') + '<span>' + A.vp(null, '24px') + me.res.vp + '</span>';
  const tags = [];
  const rk = g.rank;
  if (rk.mostStr.indexOf(S.id) >= 0) tags.push('strongest');
  if (rk.leastStr.indexOf(S.id) >= 0) tags.push('weakest');
  if (rk.mostStab.indexOf(S.id) >= 0) tags.push('most stable');
  if (rk.leastStab.indexOf(S.id) >= 0) tags.push('least stable');
  const track = k => me.track[k] ? ic(k, 14) + '<span class="track">' + Array.from({ length: me.track[k] }, (x, i) => '<i class="' + (i < (me.taken[k] || 0) ? 't' : '') + '"></i>').join('') + '</span>' : '';
  const face = id => '<button class="face" data-detail="' + esc(id) + '">' + A.card(id, { small: true }) + '<span class="cap">' + esc(C(id).name) + '</span></button>';
  const bm = me.bm.map((s, k) => s ? '<button class="face" data-detail="' + esc(s.card) + '">' + A.card(s.card, { w: s.w, hex: S.hex, small: true }) + '<span class="cap">' + esc(C(s.card).name) + '</span></button>' : '<div class="face empty">empty</div>').join('');
  /* Dynasties: the dynasty in play, the one(s) still in hand, Turmoil held. */
  const dynRow = () => (me.dynasty || (me.dynasties && me.dynasties.length)) ?
    head('Dynasties', 0, 0, (me.turmoil ? me.turmoil + ' Turmoil held · −' + 2 * me.turmoil + ' stability till the round ends' : 'take a Turmoil card to play one')) +
    '<div class="faces">' + (me.dynasty ? '<button class="face" data-detail="' + esc(me.dynasty) + '">' + A.dynasty(me.dynasty) + '<span class="cap">in play</span></button>' : '') +
    me.dynasties.map(id => '<button class="face" data-detail="' + esc(id) + '">' + A.dynasty(id, { used: false }) + '<span class="cap2">in hand</span></button>').join('') + '</div>' : '';
  const toks = [];
  if (me.emperor) toks.push('Emperor ' + me.emperor + ' token' + (me.emperor > 1 ? 's' : '') + ' (+' + me.emperor + ' strength)');
  if (me.tok && me.tok.hypatia && me.advisors.indexOf('hypatia') >= 0) toks.push('Hypatia ' + me.tok.hypatia + ' token' + (me.tok.hypatia > 1 ? 's' : ''));
  if (me.tok && me.tok.oldkingdom) toks.push('Old Kingdom ' + me.tok.oldkingdom + ' token' + (me.tok.oldkingdom > 1 ? 's' : ''));
  if (me.joseon) toks.push('Joseon holds ' + me.joseon.n + ' ' + R[me.joseon.res] + ' (back ×2 after the round)');
  /* Every space on the board, the free ones drawn as free: how much room is
     left is what a buy decision turns on. */
  const used = xs => xs.filter(Boolean).length;
  const head = (label, free, of, note) => '<div class="brow-h sp"><span>' + label + '</span><small class="' + (of && !free ? 'full' : '') + '">' +
    (of ? (free ? free + ' of ' + of + ' free' : 'all ' + of + ' used') : '') + (note ? (of ? ' · ' : '') + note : '') + '</small></div>';
  const colFree = me.colonies.length - used(me.colonies);
  const advFree = me.advisors.length - used(me.advisors);
  const wonUsed = used(me.wonders);
  const wonFree = me.wonderCap - wonUsed;
  const sections =
    head('Buildings &amp; military', 0, 0, me.bm.length + ' spaces — a new one goes over an old one') + '<div class="faces">' + bm + '</div>' +
    head('Colonies', colFree, me.colonies.length, colFree ? '' : 'a new one replaces one') +
    '<div class="faces">' + me.colonies.map(c => c ? face(c) : '<div class="face empty slim">free colony space</div>').join('') + '</div>' +
    head('Advisor', advFree, me.advisors.length, advFree ? '' : 'a new one replaces yours') +
    '<div class="faces">' + me.advisors.map(a => a ? face(a) : '<div class="face empty slim">free advisor space</div>').join('') + '</div>' +
    head('Wonders', wonFree, me.wonderCap, me.uc ? '1 being built' : '') +
    '<div class="faces">' + me.wonders.filter(Boolean).map(face).join('') +
    (me.uc ? '<button class="face" data-detail="' + esc(me.uc.card) + '">' + A.card(me.uc.card, { small: true, built: me.uc.built }) + '<span class="cap">' + esc(C(me.uc.card).name) + '</span><span class="cap2">' + (me.uc.natural ? 'exploring ' + me.uc.built + '/' + C(me.uc.card).spy : 'building ' + me.uc.built + '/' + C(me.uc.card).cost.length) + '</span></button>' : '') +
    (wonFree > 0 ? '<div class="face empty slim">' + (wonFree === 1 ? '1 free wonder space' : wonFree + ' free wonder spaces') + '</div>' : '') + '</div>';
  const growLeft = me.freeTop + Object.keys(me.track).reduce((t, k) => t + Math.max(0, (me.track[k] || 0) - (me.taken[k] || 0)), 0);
  return '<h2>' + esc(nationName(me.nation)) + (me.side === 'B' ? ' (B)' : '') + ' <small>' + (g.order.indexOf(S.id) + 1) + ' in turn order' + (me.passed ? ' · passed' : '') + '</small></h2>' +
    '<div class="card"><div class="res">' + res + '</div>' +
    '<div class="stat"><span>' + ic('str', 18) + '<b>' + me.str + '</b></span><span class="' + (me.stab < 0 ? 'neg' : '') + '">' + ic('stab', 18) + '<b>' + me.stab + '</b></span>' +
    '<span>' + A.res('worker', 16, S.hex) + '<b>' + me.idle + '</b> idle of ' + me.workers + '</span>' + (me.raid ? '<span>raid <b>' + me.raid + '</b></span>' : '') +
    (tags.length ? '<span>· ' + tags.join(', ') + '</span>' : '') + '</div>' +
    '<div class="stat">Each round you make ' + prodLine(me) + (ev ? ' · famine ' + ev.famine + ic('food', 14) : '') + '</div>' +
    '<div class="stat">' + track('food') + track('stab') + track('str') + '<span>' + (growLeft ? growLeft + ' more worker' + (growLeft > 1 ? 's' : '') + ' to grow' : 'no workers left to grow') + '</span>' +
    (me.privArch ? '<span>' + A.arch('14px', true) + ' ' + me.privArch + ' private</span>' : '') + '</div>' +
    (me.specialText ? '<div class="stat">' + esc(me.specialText) + '</div>' : '') +
    (toks.length ? '<div class="stat">' + esc(toks.join(' · ')) + '</div>' : '') +
    dynRow() + sections + '</div>';
}
function eventHtml() {
  const g = game();

     turned over when everybody has grown. */

    '<div class="sub">Architects left: ' + g.arch + (g.dyn ? ' · Turmoil cards left: ' + g.turmoil : '') + ' · The War: ' + (w ? esc(C(w.card).name) + ' at strength ' + w.str + ' (by ' + esc(pname(w.by)) + ')' : 'none bought yet') + '</div>' +
    '</div></div></div>';
}
/* ---------------- the Board tab: what the telly showed ---------------- */
function boardTabHtml(pr) {
  const g = game();
  if (!g || g.phase === 'nations') return waitCard('The nations are being chosen', '');
  const can = pr && pr !== 'stale' && pr.t === 'turn' && S.me.can && !S.me.can.skipOnly ? S.me.can : null;
  const at = (r, c) => can ? can.board.find(b => b.r === r && b.c === c) : null;
  const toll = id => (g.tolls || []).find(t => t.card === id);
  /* the card the house just bought: its empty place, in its colour */
  const rl = reelOn(), lit = rl && rl.slot, litBy = lit ? pl(rl.r.by) : null;
  const rows = g.board.map((row, r) => {
    if (r === 3 && !row.some(Boolean)) return '';
    const cells = row.map((id, c) => {
      if (!id && lit && lit.r === r && lit.c === c) return '<div class="face empty lit" style="--hex:' + esc(litBy ? litBy.hex : '#888') + '">' + esc((litBy ? litBy.name : '?') + ' took ' + (C(lit.card) ? C(lit.card).name : 'it')) + '</div>';
      if (!id) return r === 3 ? '' : '<div class="face empty">taken</div>';
      const card = C(id);
      const b = at(r, c);
      const t = toll(id);
      return '<button class="face' + (can && !(b && b.ok) ? ' no' : '') + '" data-boardcard="' + r + '|' + c + '"><span class="badge">' + (b ? b.price : r === 3 ? 4 : D.ROW_PRICE[r]) + '</span>' + A.card(id, { small: true }) +
        '<span class="cap">' + esc(card.name) + '</span><span class="cap2">' + esc(A.TYPE_NAME[card.type]) + (card.age < g.age ? ' · older' : '') +
        (t ? (t.by === S.id ? ' · your token' : ' · +' + t.n + ' to ' + esc(pname(t.by))) : '') + '</span></button>';
    }).join('');
    return '<div class="brow-h">' + (r === 3 ? 'Victoria Falls · 4 ' : D.ROW_PRICE[r] + ' ') + ic('gold', 14) + ' a card</div><div class="faces f4">' + cells + '</div>';
  }).join('');
  const w = g.war;
  const under = w ? g.players.filter(p => p.str < w.str) : [];
  return '<h2>The progress board <small>' + g.deckN + ' ' + esc(D.AGE_NAME[g.age]) + ' cards left in the deck</small></h2>' +
    '<div class="card' + (can ? ' mine' : '') + '"><div class="sub">' + (can ? 'Your turn — tap a card to buy it. You have ' + mine().res.gold + ' gold.' : 'Tap a card to read it.') + '</div>' + rows + '</div>' +
    '<h2>The War</h2><div class="card">' + (w ? '<div><b>' + esc(C(w.card).name) + '</b> at strength <b>' + w.str + '</b>, bought by ' + esc(pname(w.by)) + '</div>' +
      '<div class="sub" style="color:' + (under.length ? '#ffb4ae' : 'var(--dim)') + '">' + (under.length ? 'Weaker right now: ' + esc(under.map(p => p.id === S.id ? 'you' : p.name).join(', ')) : 'Nobody is weaker yet.') + '</div>'
      : '<div class="sub">None bought yet this round.</div>') +
    '<div class="stat">Architects left to hire this round: <b>' + g.arch + '</b>' + (g.dyn ? ' · Turmoil cards left: <b>' + g.turmoil + '</b>' : '') + '</div></div>' +
    eventHtml();
}

    const nat = D.NATIONS.find(n => n.id === p.nation);
    const tags = [];
    if (rk.mostStr.indexOf(p.id) >= 0) tags.push('strongest');
    if (rk.leastStr.indexOf(p.id) >= 0) tags.push('weakest');
    if (rk.mostStab.indexOf(p.id) >= 0) tags.push('most stable');
    if (rk.leastStab.indexOf(p.id) >= 0) tags.push('least stable');
    const face = (id, o) => '<button class="face" data-detail="' + esc(id) + '">' + A.card(id, Object.assign({ small: true }, o || {})) + '<span class="cap">' + esc(C(id).name) + '</span></button>';
    const faces = p.bm.filter(Boolean).map(s => face(s.card, { w: s.w, hex: p.hex }))
      .concat(p.advisors.concat(p.colonies, p.wonders).filter(Boolean).map(id => face(id)));
    if (p.uc) faces.push('<button class="face" data-detail="' + esc(p.uc.card) + '">' + A.card(p.uc.card, { small: true, built: p.uc.built }) + '<span class="cap">' + esc(C(p.uc.card).name) + '</span><span class="cap2">' +
      (p.uc.natural ? 'exploring ' + p.uc.built + '/' + C(p.uc.card).spy : 'building ' + p.uc.built + '/' + C(p.uc.card).cost.length) + '</span></button>');
    if (p.dynasty) faces.unshift('<button class="face" data-detail="' + esc(p.dynasty) + '">' + A.dynasty(p.dynasty) + '<span class="cap">dynasty</span></button>');
    const dy = p.dynasty ? D.dynasty(p.dynasty) : null;
    const prod = ['gold', 'stone', 'food', 'book'].filter(r => p.prod[r]).map(r => '<span class="wg' + (p.prod[r] < 0 ? ' neg' : '') + '">' + (p.prod[r] > 0 ? '+' : '') + p.prod[r] + ic(r, 14) + '</span>').join(' ');
    return '<div class="card' + (p.id === S.id ? ' mine' : '') + '">' +
      '<div style="display:flex;align-items:center;gap:8px"><b style="color:var(--dim)">' + (k + 1) + '</b><i style="width:11px;height:11px;border-radius:50%;flex:none;background:' + esc(p.hex) + '"></i>' +
      '<b>' + esc(p.id === S.id ? p.name + ' (you)' : p.name) + '</b><span class="sc" style="margin-left:auto;font-weight:800;color:var(--gold)">' + p.res.vp + ' VP <small style="color:var(--dim);font-weight:600">· ' + p.score.total + ' in all</small></span></div>' +
      '<div class="sub">' + esc(nat ? nat.name : '') + (p.side === 'B' && !(nat && nat.dyn) ? ' (B)' : '') + (dy ? ' · ' + esc(dy.name) : '') +
      (g.dyn ? ' · ' + p.dynasties.length + ' dynast' + (p.dynasties.length === 1 ? 'y' : 'ies') + ' in hand' : '') + (p.turmoil ? ' · Turmoil ×' + p.turmoil : '') + (p.emperor ? ' · Emperor +' + p.emperor : '') + (p.passed ? ' · passed' : '') + (p.id === g.active ? ' · <b style="color:var(--gold)">on turn</b>' : '') + (tags.length ? ' · ' + esc(tags.join(', ')) : '') + '</div>' +
      '<div class="stat">' + ['gold', 'stone', 'food', 'book'].map(r => '<span>' + ic(r, 16) + '<b>' + p.res[r] + '</b></span>').join('') +
      '<span>' + ic('str', 16) + '<b>' + p.str + '</b></span><span class="' + (p.stab < 0 ? 'neg' : '') + '">' + ic('stab', 16) + '<b>' + p.stab + '</b></span>' +
      '<span>' + A.res('worker', 15, p.hex) + '<b>' + p.idle + '</b>/' + p.workers + '</span></div>' +
      '<div class="stat">makes ' + (prod || 'nothing') + (p.specialText ? ' · ' + esc(p.specialText) : '') + '</div>' +
      (faces.length ? '<div class="faces f4">' + faces.join('') + '</div>' : '') + '</div>';
  }).join('');
}

/* ---------------- the Log tab: the whole game, newest first ---------------- */
function logTabHtml() {
  const g = Solo.S.g;
  if (!g) return waitCard('Nothing yet', '');
  const all = W.lines(g.log, g, 0);
  let round = null;
  const out = [];
  for (let k = all.length - 1; k >= 0; k--) {
    const e = g.log[all[k].i];
    const r = e && e.round;
    if (r != null && r !== round) { round = r; out.push('<div class="lrh">Round ' + r + '</div>'); }
    out.push('<div class="lr">' + W.html(all[k], A) + '</div>');
  }
  return '<h2>What has happened <small>newest first</small></h2><div class="card"><div class="loglist">' + (out.join('') || 'Nothing yet.') + '</div></div>';
}
function detailHtml() {

/* ================================================================
   Taps
   ================================================================ */
function wire() {
  const m = $('main');
  const all = [m, $('bar')];
  const on = (sel, fn) => all.forEach(root => root.querySelectorAll(sel).forEach(el => { el.onclick = () => { if (!locked() && !el.disabled) fn(el); }; }));
  const pr = myPrompt();
  const n = pr && pr !== 'stale' ? pr.n : undefined;
  const again = () => { lock(); paint(); };

  on('#menu', () => { location.href = HUB_URL; });
  on('#cont', () => { lock(); const h = S.pub && S.pub.hold; send({ t: 'cont', round: h ? h.round : undefined }); });
  on('#hnext', () => { lock(); const h = S.pub && S.pub.hold; send({ t: 'hnext', round: h ? h.round : undefined }); });
  on('#undo', () => { lock(); S.undo = null; send({ t: 'undo' }); paint(); });
  on('[data-evbig]', () => { S.detail = 'event'; paint(); window.scrollTo(0, 0); });
  on('#sinceMore', () => { S.sinceAll = true; paint(); });
  on('#sinceLess', () => { S.sinceAll = false; paint(); });
  on('#go', () => { lock(); S.tab = 'play'; send({ t: 'start' }); });
  on('#again', () => { lock(); S.tab = 'play'; send({ t: 'again' }); });
  const nameIn = $('nameIn');
  if (nameIn) nameIn.onchange = () => send({ t: 'opt', key: 'name', value: nameIn.value });
  /* The Board tab: on your turn a tap is the start of a buy, otherwise a read. */
  on('[data-boardcard]', el => {
    const [r, c] = el.dataset.boardcard.split('|').map(Number);
    const pr2 = myPrompt();
    const can = pr2 && pr2 !== 'stale' && pr2.t === 'turn' && S.me.can && !S.me.can.skipOnly ? S.me.can : null;
    if (can && can.board.some(b => b.r === r && b.c === c)) { S.tab = 'play'; S.panel = 'board'; S.sel = { kind: 'buy', r, c }; again(); window.scrollTo(0, 0); return; }
    const id = game().board[r][c];
    if (id) { S.detail = id; paint(); window.scrollTo(0, 0); }
  });
  on('[data-opt]', el => { lock(); send({ t: 'opt', key: el.dataset.opt, value: el.dataset.v }); });
  on('[data-detail]', el => { S.detail = el.dataset.detail; paint(); window.scrollTo(0, 0); });
  on('#closeDetail', () => { S.detail = null; again(); });

  on('[data-grow]', el => act({ t: 'growth', pick: el.dataset.grow, n }));
  on('[data-side]', el => { S.sideA = el.dataset.side === 'A'; again(); });
  on('[data-nation]', el => act({ t: 'nation', nation: el.dataset.nation, side: S.sideA ? 'A' : 'B', n }));
  on('[data-pick]', el => act({ t: 'pick', pick: el.dataset.pick, n }));
  on('[data-mix]', el => { const [r, d] = el.dataset.mix.split('|'); S.sel.pay[r] = Math.max(0, S.sel.pay[r] + (+d)); paint(); });
  on('#mixGo', () => act({ t: 'mix', pay: S.sel.pay, n }));

  /* The turn. */
  on('#skipTurn', () => act({ t: 'skip', n }));
  on('#skipExtra', () => act({ t: 'skip', n }));
  on('#explore', () => act({ t: 'explore', n }));
  on('[data-turm]', el => act({ t: 'turmoil', pick: el.dataset.turm, n }));
  on('[data-colwhere]', el => { const w = el.dataset.colwhere; S.sel.slot = w === 'wonder' ? -2 : null; S.sel.pick = w === 'discard' ? 'discard' : undefined; paint(); });
  on('#pass', () => { if (S.armed !== 'pass') { S.armed = 'pass'; lock(); paint(); return; } act({ t: 'pass', n }); });
  on('[data-panel]', el => { S.panel = el.dataset.panel; S.sel = null; again(); window.scrollTo(0, 0); });
  on('#back', () => { S.panel = null; S.sel = null; again(); });
  on('#hire', () => act({ t: 'hire', n }));
  on('[data-hire]', el => act({ t: 'hire', src: el.dataset.hire, n }));
  on('[data-buycard]', el => { const [r, c] = el.dataset.buycard.split('|').map(Number); S.sel = { kind: 'buy', r, c }; again(); window.scrollTo(0, 0); });
  on('#unsel', () => { S.sel = null; if (S.panel === 'special') S.sel = null; again(); });
  on('[data-slot]', el => { S.sel.slot = +el.dataset.slot; paint(); });
  on('[data-pickr]', el => { S.sel.pick = el.dataset.pickr; paint(); });
  on('[data-gpay]', el => { const [r, d] = el.dataset.gpay.split('|'); S.sel.pay[r] = Math.max(0, S.sel.pay[r] + (+d)); paint(); });
  on('#buyGo', () => {
    const s = S.sel;
    const a = { t: 'buy', r: s.r, c: s.c, slot: s.slot, pick: s.pick, pay: s.pick === 'vp' ? s.pay : undefined, n };
    if (S.panel === 'galileo') { a.t = 'special'; a.card = S.sel.galileo; }
    act(a);
  });
  on('[data-dep]', el => {
    const k = +el.dataset.dep;
    if (S.sel && S.sel.royal) { act({ t: 'special', card: S.sel.royal, slot: k, n }); return; }
    act({ t: 'deploy', slot: k, n });
  });
  on('[data-move]', el => { S.sel = { moveTo: +el.dataset.move }; paint(); });
  on('[data-from]', el => act({ t: 'deploy', slot: S.sel.moveTo, from: +el.dataset.from, n }));
  on('[data-undep]', el => { if (locked()) return; lock(); send({ t: 'do', a: { t: 'undeploy', slot: +el.dataset.undep, n } }); });
  on('[data-special]', el => {
    const s = S.me.can.specials.find(x => x.card === el.dataset.special);
    if (!s) return;
    if (s.act === 'galileo') { S.panel = 'galileo'; S.sel = null; S.galileoCard = s.card; again(); return; }
    if (s.act === 'royal') { S.panel = 'deploy'; S.sel = { royal: s.card }; again(); return; }
    if (s.act === 'alhazen') { S.sel = { act: 'alhazen', card: s.card, a: null }; again(); return; }
    if (SPECIAL_NOW[s.act]) { act({ t: 'special', card: s.card, n }); return; }
    if ((s.act === 'oldkingdom' || s.act === 'maliempire')) {
      const me = mine();
      const have = me.advisors.filter(a => a && !C(a).permanent).length + me.wonders.filter(w => w && C(w).type === 'advisor').length;
      if (have === 1) { act({ t: 'special', card: s.card, n }); return; }
    }
    const me = mine();
    const open = ['food', 'stab', 'str'].filter(k => (me.taken[k] || 0) < (me.track[k] || 0));
    if ((s.act === 'lincoln' || s.act === 'suleiman') && (me.freeTop || open.length === 1)) {
      act({ t: 'special', card: s.card, pick: me.freeTop ? undefined : open[0], n }); return;
    }
    S.sel = { act: s.act, card: s.card }; again();
  });
  on('[data-sp]', el => {
    const s = S.sel;
    if (s.act === 'bolivar') act({ t: 'special', card: s.card, slot: +el.dataset.sp, n });
    else if (s.act === 'joseon') act({ t: 'special', card: s.card, pick: el.dataset.sp, slot: 3, n });
    else act({ t: 'special', card: s.card, pick: el.dataset.sp, n });
  });
  on('[data-swap]', el => {
    const pos = el.dataset.swap.split('|').map(Number);
    if (!S.sel.a) { S.sel.a = pos; paint(); return; }
    act({ t: 'special', card: S.sel.card, a: S.sel.a, b: pos, n });
  });
  /* Galileo's board: the tapped card becomes a buy with no price. */
  if (S.panel === 'galileo' && S.sel && S.sel.kind === 'buy') S.sel.galileo = S.galileoCard;
}

$('menuBtn').onclick = () => { if (locked()) return; S.sheet = S.sheet ? null : 'menu'; lock(); paint(); };
Solo.attach(handle);
paint();
</script>
</body>
</html>
