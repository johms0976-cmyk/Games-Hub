<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#211c17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1960">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>1960: The Making of the President — Solo</title>
<style>
[hidden],.hide{display:none !important}
#menuBtn{margin-left:auto;background:transparent;border:1px solid #6a5c48;color:#d8c9a6;border-radius:10px;padding:5px 11px;font-size:14px;flex:none;font-family:system-ui,sans-serif}
.namein{display:flex;gap:8px;margin-top:6px}
.namein input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px}
#msheet{position:fixed;inset:0;z-index:45;background:rgba(5,8,16,.9);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + var(--inset-bottom, env(safe-area-inset-bottom)))}
#msheet .msheet{width:min(100%,460px);max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px}
#mCode{display:block;width:100%;margin-top:10px;font:16px/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;-webkit-user-select:text;user-select:text}
/* the reveal, full screen on a phone held upright (F1) */
#finale .hf-wrap{background-color:#0c0d10}
#finale .hf-title{font-size:min(6.2vh,9vw)}
#finale .hf-sub{font-size:min(3.1vh,4.4vw)}
#finale .hf-stage{gap:3vw;padding:0 3vw 9vh}
#finale .hf-col{width:30vw}
#finale .hf-name{font-size:min(3vh,4vw)}
#finale .hf-tag{font-size:min(2vh,3vw)}
#finale .hf-tot{font-size:min(4.4vh,7vw)}
#finale .hf-part,#finale .hf-place{font-size:min(2.4vh,3.5vw)}
#finale .hf-winner{font-size:min(10vh,12vw)}
#finale .hf-winner small{font-size:min(3.4vh,4.6vw)}
#finale .hf-skip{font-size:15px;padding:8px 14px}
#finBg{position:fixed;inset:0;z-index:59;pointer-events:none;background:#05080f}
#finBg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
#finBg img.tw{animation:twinkle 2.4s ease-in-out infinite}
html.m60fin #finale .hf-wrap{background:linear-gradient(rgba(5,7,14,.3),rgba(5,7,14,.8)) !important}
</style>
</head>
<body>
<header><span id="dot"></span><span id="who"></span><span id="side"></span><button id="menuBtn">Menu</button></header>
<div id="main"></div>
<div id="bar" class="hide"></div>
<div id="flash" class="hide"></div>
<div id="zoom" class="hide"></div>
<div id="msheet" class="hide"></div>
<div id="finBg" class="hide"><img alt="" id="fbRoom"><img alt="" id="fbLights" class="tw"></div>
<div id="finale"></div>

<script src="m60-build.js"></script>
<script src="sound.js"></script>
<script src="finale.js"></script>
<script src="m60-data.js"></script>
<script src="m60-engine.js"></script>
<script src="m60-bots.js"></script>
<script src="m60-art.js"></script>
<script src="m60-words.js"></script>
<script src="m60-host.js"></script>
<script src="m60-phone.js"></script>
<script>
'use strict';
/* 1960 on one phone: you against the house, no telly.
 *
 * The host and the handset run side by side in this page (LESSONS-CHECKLIST
 * F1): m60-host.js is the very orchestration the hub's telly runs, talking to
 * m60-phone.js — the very handset the hub's phones run — over an in-page bus
 * instead of a socket. The telly is never touched. The game is saved on this
 * phone after every move and picks up where it was left; the house stops
 * while the screen is away; nothing is banked to any season. */
(function checkVersions() {
  const missing = [];
  for (const [g, f] of [['M60Data', 'm60-data.js'], ['M60Engine', 'm60-engine.js'], ['M60Bots', 'm60-bots.js'], ['M60Art', 'm60-art.js'], ['M60Words', 'm60-words.js'], ['M60Host', 'm60-host.js'], ['M60Phone', 'm60-phone.js']])
    if (!window[g] || window[g].VERSION !== 1) missing.push(f);
  if (!missing.length) return;
  const show = () => {
    document.body.innerHTML = '<div id="staleWarning" style="padding:12vw 8vw;text-align:center;font:600 18px/1.5 system-ui;color:#f2ecdc">' +
      '<div style="font-size:26px;color:#f1c75b;margin-bottom:12px">This page is out of date</div>' +
      'Your phone kept an old copy of ' + missing.join(' and ') + '. Pull down to reload, or close the tab and open it again.</div>';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  throw new Error('stale assets: ' + missing.join(', '));
})();

const $ = id => document.getElementById(id);
const D = M60Data, A = M60Art;
const esc = A.esc;
const ME = 'me';
/* Every save carries a version: m60-host.js VERSION rides inside it, and the
   key names it too. */
const SAVE_KEY = 'm60.solo.save.v1', NAME_KEY = 'm60.solo.name', PLAYED_KEY = 'm60.solo.played', ASIDE_KEY = 'm60.solo.save.aside';
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
/* Every write goes through here and says whether it held (PHONE-APP-LESSONS C). */
const set = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const HUB = /\/games\/1960\//.test(location.pathname) ? '../../index.html' : '/';
/* This tab's mark on its saves: a save written by another tab of this game
   stops this one writing (two copies open never corrupt one save). */
const TAB = Math.random().toString(36).slice(2, 10);
const SOLO = { name: get(NAME_KEY) || 'The Senator', finCtl: null, resumed: false, writes: 0, saveFail: false, stopped: false, persistAsked: false,
  firstRun: !get(PLAYED_KEY) && !get(NAME_KEY) && !get(SAVE_KEY), errs: [] };
window.__M60SOLO = SOLO;
/* Installed on the home screen? (?standalone stands in, for tests.) */
const standalone = () => /[?&]standalone/.test(location.search) || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
/* ?insets=top,bottom fakes the safe areas for a layout check. */
(function fakeInsets() {
  const m = /[?&]insets=(\d+),(\d+)/.exec(location.search);
  if (m) { document.documentElement.style.setProperty('--inset-top', m[1] + 'px'); document.documentElement.style.setProperty('--inset-bottom', m[2] + 'px'); }
})();
window.addEventListener('error', e => { SOLO.errs.push(String(e.message || e).slice(0, 200)); if (SOLO.errs.length > 20) SOLO.errs.shift(); });

/* The one door every game save goes through. */
function saveGame(data) {
  if (SOLO.stopped) return;
  if (data) Object.assign(data, { tab: TAB, w: ++SOLO.writes, build: window.M60_BUILD });
  const held = set(SAVE_KEY, data ? JSON.stringify(data) : null);
  if (!held) {
    if (!SOLO.saveFail) { SOLO.saveFail = true; setTimeout(() => phone.flash('This phone isn’t keeping your save — its storage is full or switched off. Menu → Back up keeps a copy you can paste back.'), 0); }
    return;
  }
  SOLO.saveFail = false;
  if (data) {
    set(PLAYED_KEY, '1');
    /* Installed: ask the phone to keep this site's storage (Safari 17+). */
    if (!SOLO.persistAsked && standalone() && navigator.storage && navigator.storage.persist) { SOLO.persistAsked = true; try { navigator.storage.persist().catch(() => {}); } catch (e) {} }
  }
}
/* Another tab of this game wrote the save: this one stops writing, says so, and pauses. */
window.addEventListener('storage', e => {
  if (e.key !== SAVE_KEY || SOLO.stopped) return;
  let s = null;
  try { s = JSON.parse(e.newValue || 'null'); } catch (x) {}
  if (S.screen === 'lobby') { H.publish(); return; }
  if (!s || s.tab === TAB) return;
  SOLO.stopped = true;
  H.input(ME, { t: 'vis', hidden: true });
  $('msheet').innerHTML = '<div class="msheet" id="otherTab"><div class="title">Open in another tab</div><div class="sub">This campaign was carried on in another tab or window. This one has stopped saving, so the two can’t overwrite each other.</div>' +
    '<button class="btn" id="mReload">Reload here</button></div>';
  $('msheet').classList.remove('hide');
  $('mReload').onclick = () => location.reload();
});
/* The player's name goes into third-person lines, so it may not be "you". */
const nameOk = n => n && !/^(you|me|i|myself)$/i.test(n.trim());

/* ---------------- the in-page bus ---------------- */
let phone = null;
const deliver = m => { setTimeout(() => phone && phone.receive(JSON.parse(JSON.stringify(m))), 0); };
const H = M60Host.create({
  solo: true,
  toAll: deliver,
  toSeat: (id, m) => { if (id === ME) deliver(m); },
  flash: (id, text, tone) => { if (id === ME) setTimeout(() => phone.flash(text, tone), 0); },
  humans: () => [{ id: ME, name: SOLO.name, hex: '#f1c75b' }],
  remote: () => ME,
  save: saveGame,
  menu: () => { location.href = HUB; },
  sound: on => { if (window.HubSound) HubSound.setEnabled(on); },
  cue: (name, o) => { if (window.HubSound) HubSound.play(name, o); },
  onStart: () => { if (window.HubSound) { HubSound.setEnabled(H.S.opts.sound); HubSound.unlock(); } },
  onFinale: (fin, data) => playFinale(fin, data),
  skipFinale: () => { if (SOLO.finCtl) SOLO.finCtl.skip(); }
});
SOLO.H = H;
const S = H.S;

document.head.insertAdjacentHTML('beforeend', A.styles() + '<style>' + M60Phone.STYLES + '</style>');
phone = M60Phone.create({
  solo: true, root: $('main'), bar: $('bar'), flashEl: $('flash'), zoomEl: $('zoom'),
  send: m => setTimeout(() => H.input(ME, m), 0),
  scrollTop: () => window.scrollTo(0, 0),
  onMenu: () => { H.flushSave(); location.href = HUB; },
  onMe: me => {
    $('side').textContent = D.SIDE[me.side].name;
    document.documentElement.classList.toggle('side-N', me.side === 'N');
    if ($('dot').dataset.side !== me.side) { $('dot').dataset.side = me.side; $('dot').className = 'pt'; $('dot').innerHTML = A.portrait(me.side); }
  },
  lobbyTop
});
SOLO.phone = phone;
window.__M60PHONE = phone.P;
phone.setMe(ME, SOLO.name, '#f1c75b');
$('who').textContent = SOLO.name;

/* The setup screen: your name, and the campaign you left, if there is one. */
function savedGame() { try { const s = JSON.parse(get(SAVE_KEY) || 'null'); return s && s.createOpts && s.v === M60Host.VERSION ? s : null; } catch (e) { return null; } }
/* A save this build can't resume is never dropped in silence: it is put
   aside (Back up still reaches it) and the setup screen says so. */
function setAside(why) {
  const raw = get(SAVE_KEY);
  if (raw) set(ASIDE_KEY, raw);
  set(SAVE_KEY, null);
  SOLO.lost = why;
}
if (get(SAVE_KEY) && !savedGame()) setAside('Your saved campaign was made by an older build of 1960 and can’t be picked up again here. It is kept aside: Menu → Back up still copies it.');
/* The save code: the whole game as text, a few KB (Back up / Restore). */
const CODE_HEAD = 'M60-SAVE:';
function saveCode() { H.flushSave(); const raw = get(SAVE_KEY) || get(ASIDE_KEY); return raw ? CODE_HEAD + raw : ''; }
function readCode(text) {
  const t = String(text || '').trim();
  if (t.indexOf(CODE_HEAD) !== 0) return null;
  try { const s = JSON.parse(t.slice(CODE_HEAD.length)); return s && s.createOpts && s.v === M60Host.VERSION && Array.isArray(s.moves) ? s : null; } catch (e) { return null; }
}
function lobbyTop() {
  const sv = savedGame();
  let out = '';
  if (SOLO.lost) out += '<div class="card" id="lostCard"><div class="title">Your saved campaign is gone</div><div class="sub">' + esc(SOLO.lost) + '</div></div>';
  if (SOLO.firstRun && !sv) out += '<div class="card mine" id="firstRun"><div class="title">First time here?</div><div class="sub">How to play is picked for you: a real campaign against a gentle house, with a coach who explains each step. Know the rules already? Choose Campaign below.</div></div>';
  out += '<div class="card"><div class="title">Your name</div><div class="sub">The house speaks of you by it: “' + esc(SOLO.name) + ' campaigns in Ohio.”</div>' +
    '<div class="namein"><input id="nameIn" maxlength="14" value="' + esc(SOLO.name) + '" autocomplete="off"><button class="btn ghost" style="width:auto;margin:0;padding:10px 16px" id="nameGo">Save</button></div></div>';
  if (sv) {
    const when = new Date(sv.at);
    const me = (sv.sides || []).find(x => !x.bot);
    const ev = sv.ev || { K: 0, N: 0 };
    out += '<div class="card mine"><div class="title">Resume your campaign</div><div class="sub">Turn ' + sv.turn + ' of 9' + (me ? ' · you are ' + esc(D.SIDE[me.side].name) : '') + ' · leading states: Kennedy ' + ev.K + ', Nixon ' + ev.N + ' votes' +
      ' · last played ' + esc(when.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })) + '</div>' +
      '<button class="btn" id="resume">Resume</button><button class="btn ghost" id="abandon">Throw it away</button></div>';
  }
  return out;
}
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.id === 'nameGo') {
    const v = $('nameIn').value.trim();
    if (!nameOk(v)) { phone.flash('Choose a name the house can say: “' + (v || '…') + ' campaigns in Ohio”.'); return; }
    SOLO.name = v; set(NAME_KEY, v); $('who').textContent = v; phone.setMe(ME, v, '#f1c75b'); H.publish();
  }
  if (t.id === 'resume') {
    const sv = savedGame();
    if (sv && H.resume(sv)) { SOLO.resumed = true; SOLO.lost = null; phone.flash('Welcome back — your campaign picks up where you left it.', 'good'); }
    else { setAside('Your saved campaign did not replay the way it was played, so it was not picked up. It is kept aside: Menu → Back up still copies it.'); H.publish(); }
  }
  if (t.id === 'abandon') {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to throw it away'; return; }
    set(SAVE_KEY, null); H.publish();
  }
});

/* The menu: about, back up / restore, reload, abandon, the hub. */
$('menuBtn').onclick = () => {
  if (SOLO.stopped) return;
  const playing = S.screen !== 'lobby';
  const code = saveCode();
  const other = phone.P.skin === 'paper' ? 'tv' : 'paper';
  $('msheet').innerHTML = '<div class="msheet"><div class="title">1960: The Making of the President</div><div class="sub">You against the house — a computer opponent that sees only what a player would: never your hand, never the cubes left in the bag before they come out. The campaign is saved on this phone after every move, and the house waits while your screen is off. Nothing here goes into the room’s season.</div>' +
    '<div id="mCodeBox" class="hide"><textarea id="mCode" rows="4" spellcheck="false" autocomplete="off"></textarea><div class="sub" id="mCodeNote"></div><button class="btn" id="mCodeGo"></button></div>' +
    (code ? '<button class="btn ghost" id="mBackup">Back up: copy this campaign as text</button>' : '') +
    (!playing ? '<button class="btn ghost" id="mRestore">Restore a campaign from its text</button>' : '') +
    (playing ? '<button class="btn ghost" id="mQuit">Abandon this campaign</button>' : '') +
    '<button class="btn ghost" id="mHub">' + (playing ? 'Back to the Games hub (your campaign is saved)' : 'Back to the Games hub') + '</button>' +
    '<button class="btn ghost" id="mSkin">Look: ' + esc(M60Phone.SKINS[phone.P.skin] || '') + ' — switch to ' + esc(M60Phone.SKINS[other]) + '</button>' +
    '<button class="btn ghost" id="mReload">Reload the game</button>' +
    '<button class="btn" id="mClose">Close</button>' +
    '<div class="sub" id="mBuild" style="text-align:center;margin-top:8px">Build ' + esc(window.M60_BUILD || '?') + (standalone() ? ' · installed' : '') + '</div>' +
    '<div class="sub" style="font-size:11px;margin-top:6px">1960: The Making of the President is designed by Christian Leonhard and Jason Matthews and published by GMT Games. The map and card pictures are theirs; every line of card text here is written fresh. Built to sit beside a copy of the game, not to replace one.</div></div>';
  $('msheet').classList.remove('hide');
  $('mClose').onclick = () => $('msheet').classList.add('hide');
  $('mHub').onclick = () => { H.flushSave(); location.href = HUB; };
  $('mReload').onclick = () => { H.flushSave(); location.reload(); };
  $('mSkin').onclick = () => { phone.setSkin(other); $('menuBtn').onclick(); };
  const box = $('mCodeBox'), ta = $('mCode'), note = $('mCodeNote'), go = $('mCodeGo');
  if ($('mBackup')) $('mBackup').onclick = () => {
    box.classList.remove('hide');
    ta.value = saveCode();
    note.textContent = 'Keep this text somewhere safe (Notes, a message to yourself). Restore it on any phone, or after this one forgets the campaign.';
    go.textContent = 'Copy';
    go.onclick = () => {
      ta.select();
      const done = () => { go.textContent = 'Copied'; };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); } } catch (e) {}
    };
  };
  if ($('mRestore')) $('mRestore').onclick = () => {
    box.classList.remove('hide');
    ta.value = '';
    const sv = savedGame();
    note.textContent = 'Paste the text from Back up.' + (sv ? ' It replaces the campaign saved on this phone (turn ' + sv.turn + ').' : '');
    go.textContent = 'Restore';
    go.onclick = () => {
      const s = readCode(ta.value);
      if (!s) { note.textContent = 'That isn’t a save from this build of 1960. Paste the whole text, starting M60-SAVE:'; return; }
      set(SAVE_KEY, JSON.stringify(s));
      SOLO.lost = null;
      $('msheet').classList.add('hide');
      H.publish();
      phone.flash('Restored: tap Resume to pick it up (turn ' + s.turn + ').', 'good');
    };
  };
  if ($('mQuit')) $('mQuit').onclick = ev => {
    const b = ev.currentTarget;
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again: the saved campaign is thrown away'; return; }
    $('msheet').classList.add('hide');
    if (SOLO.finCtl) { SOLO.finCtl.stop(); SOLO.finCtl = null; }
    finaleBg(false);
    H.input(ME, { t: 'quit' });
  };
};

/* ---------------- the reveal, on the phone ---------------- */
/* Election Night behind the reveal (baked; the plain dark wrap without it). */
function finaleBg(on) {
  const el = $('finBg');
  if (!on || !document.documentElement.classList.contains('m60scene')) { el.classList.add('hide'); document.documentElement.classList.remove('m60fin'); return; }
  $('fbRoom').setAttribute('src', A.sceneUrl(A.SCENES.eday.room));
  $('fbLights').setAttribute('src', A.sceneUrl(A.SCENES.eday.lights));
  el.classList.remove('hide');
  document.documentElement.classList.add('m60fin');
}
function playFinale(fin, data) {
  if (!window.HubFinale) { H.finaleStage(fin.n, 'table'); return; }
  finaleBg(true);
  const figure = p => A.portrait(p.side, 'fpt').replace('<img ', '<img style="height:100%;width:auto;margin:0 auto;image-rendering:pixelated" ');
  SOLO.finCtl = HubFinale.play(Object.assign({}, data, {
    root: $('finale'), avatars: false, sound: window.HubSound && (S.gameOpts || S.opts).sound ? HubSound : null,
    players: data.players.map(p => Object.assign({}, p, { figure: figure(p) })),
    onStage(stage, info) { H.finaleStage(fin.n, stage, info && info.label); },
    onDone() { H.finaleStage(fin.n, 'table'); finaleBg(false); const c = SOLO.finCtl; SOLO.finCtl = null; setTimeout(() => { if (c) c.stop(); }, 0); }
  }));
}

/* The house stops while the phone is away. */
document.addEventListener('visibilitychange', () => {
  if (SOLO.stopped) return;
  const hidden = document.visibilityState === 'hidden';
  H.input(ME, { t: 'vis', hidden });
  if (!hidden) checkUpdate();
});
if (!/[?&]noart/.test(location.search)) A.probe();
window.addEventListener('m60scene', () => phone.paint());
if (window.HubSound) HubSound.armUnlock();

/* Updates (PHONE-APP-LESSONS C): the GitHub copy's service worker never
   swaps files under a game. A new build waits; it is looked for whenever the
   phone comes back, and taken only at the setup screen — or at the next cold
   start, when nothing is running. */
let swReg = null;
function checkUpdate() {
  if (!swReg) return;
  try { swReg.update().catch(() => {}); } catch (e) {}
  takeUpdate();
}
function takeUpdate() {
  const w = swReg && swReg.waiting;
  if (!w || S.screen !== 'lobby' || SOLO.taking) return;
  SOLO.taking = true;
  w.addEventListener('statechange', () => { if (w.state === 'activated') location.reload(); });
  w.postMessage('take-over');
}
if ('serviceWorker' in navigator && window.isSecureContext) {
  try {
    navigator.serviceWorker.register('sw.js').then(reg => {
      swReg = reg;
      reg.addEventListener('updatefound', () => { const n = reg.installing; if (n) n.addEventListener('statechange', () => { if (n.state === 'installed') takeUpdate(); }); });
      takeUpdate();
    }).catch(() => {});
  } catch (e) {}
}
setInterval(() => H.tick(), 1000);
/* A new player's first game is How to play; Campaign is one tap away (B). */
if (SOLO.firstRun) H.setOpt('mode', 'learn');
H.publish();
</script>
</body>
</html>
