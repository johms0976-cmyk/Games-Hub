<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1322">
<title>Catan — Solo</title>
<style>
:root{
  --bg:#0a1322; --panel:#141d33; --panel2:#0f1728; --line:#26304d;
  --ink:#f3efe4; --dim:#9aa7c4; --gold:#e8c267; --good:#4ac08a; --bad:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 10px calc(18px + env(safe-area-inset-bottom))}
.hide{display:none !important}
[hidden]{display:none !important}
header{display:flex;align-items:center;gap:8px;padding:9px 2px 7px;position:sticky;top:0;background:var(--bg);z-index:6}
header .brand{font-weight:900;letter-spacing:.18em;color:var(--gold);font-size:14px;white-space:nowrap}
#dot{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:none}
#who{font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#vpTop{font-size:13px;color:var(--gold);font-weight:800;white-space:nowrap}
#menuBtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:5px 11px;font:inherit;font-size:14px;flex:none}
.namein{display:flex;gap:8px;margin-top:8px}
.namein input{flex:1;min-width:0;font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
#msheet{position:fixed;inset:0;z-index:45;background:rgba(6,10,20,.88);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#msheet .msheet{width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
/* the reveal, full screen on a phone held upright */
#finale .hf-wrap{background-color:#0a1322}
#finale .hf-title{font-size:min(6.2vh,9vw)}
#finale .hf-sub{font-size:min(3.1vh,4.4vw)}
#finale .hf-stage{gap:3vw;padding:0 3vw 9vh}
#finale .hf-col{width:21vw}
#finale .hf-name{font-size:min(3vh,4vw)}
#finale .hf-tag{font-size:min(2vh,3vw)}
#finale .hf-tot{font-size:min(4.4vh,7vw)}
#finale .hf-part,#finale .hf-place{font-size:min(2.4vh,3.5vw)}
#finale .hf-winner{font-size:min(10vh,12vw)}
#finale .hf-winner small{font-size:min(3.4vh,4.6vw)}
#finale .hf-skip{font-size:15px;padding:8px 14px}
</style>
</head>
<body>
<header><span id="dot"></span><span class="brand">CATAN</span><span id="who"></span><span id="vpTop"></span><button id="menuBtn">Menu</button></header>
<div id="main"></div>
<div id="flash" class="hide"></div>
<div id="msheet" class="hide"></div>
<div id="finale"></div>

<script src="avatar.js"></script>
<script src="finale.js"></script>
<script src="catan-data.js"></script>
<script src="catan-board.js"></script>
<script src="catan-engine.js"></script>
<script src="catan-bots.js"></script>
<script src="catan-words.js"></script>
<script src="catan-host.js"></script>
<script src="art/baked/manifest.js"></script>
<script src="catan-art.js"></script>
<script src="catan-phone.js"></script>
<script>
'use strict';
/* Catan on one phone: you against the house, no telly.
 *
 * The phone page and the host run side by side in this page (LESSONS-
 * CHECKLIST F1): catan-host.js is the very orchestration the hub's telly
 * runs, talking to catan-phone.js — the very handset the hub's phones run —
 * over an in-page bus instead of a socket. The game is saved on this phone
 * after every move and picks up where it was left; the house stops while the
 * screen is away; nothing is banked to any season. */
(function checkVersions() {
  const missing = [];
  for (const [g, f, v] of [['CatanData', 'catan-data.js', 1], ['CatanEngine', 'catan-engine.js', 1], ['CatanWords', 'catan-words.js', 1],
    ['CatanHost', 'catan-host.js', 1], ['CatanArt', 'catan-art.js', 1], ['CatanPhone', 'catan-phone.js', 1]])
    if (!window[g] || window[g].VERSION !== v) missing.push(f);
  if (!window.CatanBoard || !window.CatanBoard.build) missing.push('catan-board.js');
  if (!window.CatanBots || !window.CatanBots.reply) missing.push('catan-bots.js');
  if (!missing.length) return;
  const show = () => {
    document.body.innerHTML = '<div id="staleWarning" style="padding:12vw 8vw;text-align:center;font:600 18px/1.5 system-ui;color:#f3efe4">' +
      '<div style="font-size:26px;color:#e8c267;margin-bottom:12px">This page is out of date</div>' +
      'Your phone kept an old copy of ' + missing.join(' and ') + '. Pull down to reload, or close the tab and open it again.</div>';
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  throw new Error('stale assets: ' + missing.join(', '));
})();

const $ = id => document.getElementById(id);
const esc = CatanArt.esc;
const D = CatanData;
const ME = 'me';
const SAVE_KEY = 'catan.solo.save.v1', NAME_KEY = 'catan.solo.name', HEX_KEY = 'catan.solo.hex';
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const HUB = /\/games\/catan\//.test(location.pathname) ? '../../index.html' : '/';
const COLOURS = ['#e5484d', '#3e7bfa', '#f0ede4', '#f08a2c', '#8e4ec6', '#1f9e9e', '#30a46c', '#f5c542'];
const SOLO = { name: get(NAME_KEY) || 'Settler', hex: COLOURS.indexOf(get(HEX_KEY)) >= 0 ? get(HEX_KEY) : '#3e7bfa', finCtl: null };
window.__CATANSOLO = SOLO;
/* The player's name goes into third-person lines ("Settler builds a road"),
   so it may not be "you" (the checklist's Nations lesson), nor a house name. */
const nameOk = n => n && !/^(you|me|i|myself)$/i.test(n.trim()) && !D.HOUSE.some(b => b.name.toLowerCase() === n.trim().toLowerCase());

/* ---------------- the in-page bus ---------------- */
let phone = null;
const deliver = m => { setTimeout(() => phone && phone.receive(JSON.parse(JSON.stringify(m))), 0); };
const H = CatanHost.create({
  solo: true,
  toAll: deliver,
  toSeat: (id, m) => { if (id === ME) deliver(m); },
  flash: (id, text, tone) => { if (id === ME) setTimeout(() => phone.flash(text, tone), 0); },
  humans: () => [{ id: ME, name: SOLO.name, hex: SOLO.hex }],
  remote: () => ME,
  save: data => set(SAVE_KEY, data ? JSON.stringify(data) : null),
  menu: () => { location.href = HUB; },
  onFinale: (fin, data) => playFinale(fin, data),
  skipFinale: () => { if (SOLO.finCtl) SOLO.finCtl.skip(); },
  stopFinale: () => { if (SOLO.finCtl) { SOLO.finCtl.stop(); SOLO.finCtl = null; } }
});
SOLO.H = H;
const S = H.S;

document.head.insertAdjacentHTML('beforeend', '<style>' + CatanPhone.STYLES + '</style>');
phone = CatanPhone.create({
  solo: true, root: $('main'), flashEl: $('flash'),
  send: m => setTimeout(() => H.input(ME, m), 0),
  onMenu: () => { location.href = HUB; },
  onVp: t => { $('vpTop').textContent = t; },
  lobbyTop
});
SOLO.phone = phone;
phone.setMe(ME, SOLO.name, SOLO.hex);
$('who').textContent = SOLO.name;
$('dot').style.background = SOLO.hex;

/* The setup screen: your name and colour, and the game you left, if there is one. */
function savedGame() { try { const s = JSON.parse(get(SAVE_KEY) || 'null'); return s && s.createOpts ? s : null; } catch (e) { return null; } }
function lobbyTop() {
  const sv = savedGame();
  let out = '<div class="card" style="margin-bottom:10px"><div class="title">Your name</div><div class="sub">The house speaks of you by it: “' + esc(SOLO.name) + ' builds a road.”</div>' +
    '<div class="namein"><input id="nameIn" maxlength="14" value="' + esc(SOLO.name) + '" autocomplete="off"><button class="btn ghost" style="width:auto;margin:0;padding:10px 16px" id="nameGo">Save</button></div>' +
    '<div class="swatches">' + COLOURS.map(c => '<button data-hex="' + c + '" class="' + (c === SOLO.hex ? 'on' : '') + '" style="background:' + c + '" aria-label="colour"></button>').join('') + '</div></div>';
  if (sv) {
    const when = new Date(sv.at);
    const me = (sv.names || []).indexOf(SOLO.name);
    out += '<div class="card hot" style="margin-bottom:10px"><div class="title">Resume your game</div><div class="sub">' + (sv.ck ? 'Cities &amp; Knights' : 'Catan') + ' · against ' +
      esc((sv.names || []).filter(n => n !== SOLO.name).join(', ')) + ' · turn ' + sv.turnNo + (me >= 0 && sv.vps ? ' · you have ' + sv.vps[me] + ' of ' + sv.target : '') +
      ' · last played ' + esc(when.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })) + '</div>' +
      '<button class="btn" id="resume">Resume</button><button class="btn ghost small" id="abandonSave" style="margin-top:8px">Throw it away</button></div>';
  }
  return out;
}
document.addEventListener('click', ev => {
  const t = ev.target;
  if (!t || !t.closest) return;
  if (t.id === 'nameGo') {
    const v = $('nameIn').value.trim();
    if (!nameOk(v)) { phone.flash('Choose a name the house can say: “' + (v || '…') + ' builds a road”.'); return; }
    SOLO.name = v; set(NAME_KEY, v); $('who').textContent = v; phone.setMe(ME, v, SOLO.hex); H.publish();
  }
  const sw = t.closest('[data-hex]');
  if (sw && S.screen === 'lobby') {
    SOLO.hex = sw.dataset.hex; set(HEX_KEY, SOLO.hex); $('dot').style.background = SOLO.hex; phone.setMe(ME, SOLO.name, SOLO.hex); H.publish();
  }
  if (t.id === 'resume') {
    const sv = savedGame();
    if (sv && H.resume(sv)) phone.flash('Welcome back — your game picks up where you left it.', 'good');
    else { phone.flash('That saved game could not be read.'); set(SAVE_KEY, null); H.publish(); }
  }
  if (t.id === 'abandonSave') {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to throw it away'; return; }
    set(SAVE_KEY, null); H.publish();
  }
});

/* The menu: about, abandon, the hub. */
$('menuBtn').onclick = () => {
  const playing = S.screen !== 'lobby';
  $('msheet').innerHTML = '<div class="msheet"><div class="title">Catan</div><div class="sub">You against the house — computer settlers who see only what a player would. The game is saved on this phone after every move, and the house waits while your screen is off.</div>' +
    '<div class="sub" style="margin-top:8px">Catan is designed by Klaus Teuber and published by CATAN GmbH / CATAN Studio; the rules are theirs, every line here is written fresh, and the island and pieces are this site’s own Blender art. Built to sit beside a copy of the game, not to replace one.</div>' +
    (playing ? '<button class="btn ghost" id="mQuit">Abandon this game</button>' : '') +
    '<button class="btn ghost" id="mHub">' + (playing ? 'Back to the Games hub (your game is saved)' : 'Back to the Games hub') + '</button>' +
    '<button class="btn" id="mClose">Close</button></div>';
  $('msheet').classList.remove('hide');
  $('mClose').onclick = () => $('msheet').classList.add('hide');
  $('mHub').onclick = () => { H.flushSave(); location.href = HUB; };
  if ($('mQuit')) $('mQuit').onclick = ev => {
    const b = ev.currentTarget;
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again: the saved game is thrown away'; return; }
    $('msheet').classList.add('hide');
    H.input(ME, { t: 'quit' });
  };
};

/* ---------------- the reveal, on the phone ---------------- */
function playFinale(fin, data) {
  if (!window.HubFinale) { H.finaleStage(fin.n, 'table'); return; }
  SOLO.finCtl = HubFinale.play(Object.assign({}, data, {
    root: $('finale'), sound: null,
    onStage(stage, info) { H.finaleStage(fin.n, stage, info && info.label); },
    onDone() { H.finaleStage(fin.n, 'table'); const c = SOLO.finCtl; SOLO.finCtl = null; setTimeout(() => { if (c) c.stop(); }, 0); }
  }));
}

/* The house stops while the phone is away. */
document.addEventListener('visibilitychange', () => H.input(ME, { t: 'vis', hidden: document.visibilityState === 'hidden' }));
if (!/[?&]noart/.test(location.search)) CatanArt.probe();
setInterval(() => H.tick(), 1000);
H.publish();
</script>
</body>
</html>
